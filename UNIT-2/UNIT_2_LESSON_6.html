<html lang="vi">
<head>

<title>UNIT 2 • LESSON 6 • WRITING — Ôn bài cũ • Luyện tập • Củng cố</title>
<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:17px/1.65 "Times New Roman",Times,serif}
header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.subtitle{opacity:.92;font-size:18px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}
.toolbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;font-family:system-ui}
.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:system-ui}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}
.GREEN{background:#dcfce7;color:var(--green)}.AMBER{background:#fef3c7;color:var(--amber)}.RED{background:#fee2e2;color:var(--red)}
.TAG{background:#e0e7ff;color:#3730a3}
.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}
table.vocab{width:100%;border-collapse:collapse;margin:12px 0}
table.vocab th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left}
table.vocab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.vocab tr:nth-child(even) td{background:#f8fafc}
.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}
.know b.t{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:22px;font-family:system-ui}
@media(max-width:760px){.toolbar button{flex:1}}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#102a43,#245b8f);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0006}
.gate-box h2{color:var(--navy);margin:0 0 6px}
.gate-box input{width:100%;padding:12px;border:1px solid #bfcadd;border-radius:10px;font-size:17px;margin:12px 0;font-family:system-ui}
.gate-box .primary{width:100%;font-size:17px}
#pwmsg{color:var(--red);font-weight:700;min-height:24px;font-family:system-ui}
.view{display:none}.view.active{display:block}
.backbar{margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:8px}
.hub-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;text-align:left;font-family:"Times New Roman",Times,serif;box-shadow:0 7px 22px #1e293b0b}
.hub-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.hub-card b.t{font-size:21px;color:var(--navy);display:block;margin-bottom:6px}
.hub-card span.d{color:var(--muted);font-size:15px;display:block}
.hub-card .st{margin-top:10px;display:block}
.twopane{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start;margin:12px 0}
.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pane-l{background:#fbfdff}
@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

@media print{header,.toolbar,.actions{display:none!important}body{background:#fff}.card,.q{box-shadow:none;break-inside:avoid}}</style></head>

 "kb": "awareness (n.) = nhận thức.", "authored": false}, {"n": 38, "uid": 38, "part": "", "hd_fix": false, "prompt": "When shopping and advertising dominate a celebration, the event may become highly ______ rather than educational.", "options": ["commerce", "commercial", "influence", "awareness"], "keyLetter": "B", "keyText": "commercial", "why": "Sau “highly” cần tính từ: commercial (mang tính thương mại).", "distractors": ["commerce là danh từ, sai từ loại.", "awareness là danh từ, không hợp nghĩa.", "influence là danh từ, sai từ loại."], "kb": "commercial (adj.) = thuộc thương mại.", "authored": false}, {"n": 39, "uid": 39, "part": "", "hd_fix": false, "prompt": "“celebrate festivals such as Christmas and Halloween” is closest in meaning to ______.", "options": ["develop awareness of traditions beyond one’s own", "take part in international celebrations", "cultural influences from other societies", "beneficial or harmful effects"], "keyLetter": "B", "keyText": "take part in international celebrations", "why": "celebrate festivals such as Christmas and Halloween ≈ take part in international celebrations.", "distractors": ["C. là nghĩa của câu “foreign cultures”.", "A. là nghĩa của câu “learn about other cultures”.", "D. là nghĩa của câu “positive or negative influence”."], "kb": "such as = ví dụ điển hình.", "authored": false}, {"n": 40, "uid": 40, "part": "", "hd_fix": false, "prompt": "“positive or negative influence” is closest in meaning to ______.", "options": ["develop awareness of traditions beyond one’s own", "pay less attention to traditional local celebrations", "cultural influences from other societies", "beneficial or harmful effects"], "keyLetter": "D", "keyText": "beneficial or harmful effects", "why": "positive or negative influence ≈ beneficial or harmful effects.", "distractors": ["A. là nghĩa của câu “learn about other cultures”.", "B. là nghĩa của câu “ignore local festivals”.", "C. là nghĩa của câu “foreign cultures”."], "kb": "influence ≈ effect.", "authored": false}, {"n": 41, "uid": 41, "part": "", "hd_fix": false, "prompt": "“foreign cultures” is closest in meaning to ______.", "options": ["pay less attention to traditional local celebrations", "develop awareness of traditions beyond one’s own", "cultural influences from other societies", "spend money on products one does not really need"], "keyLetter": "C", "keyText": "cultural influences from other societies", "why": "foreign cultures ≈ cultural influences from other societies.", "distractors": ["A. là nghĩa của câu “ignore local festivals”.", "D. là nghĩa của câu “buy unnecessary things”.", "B. là nghĩa của câu “learn about other cultures”."], "kb": "foreign = nước ngoài.", "authored": false}, {"n": 42, "uid": 42, "part": "", "hd_fix": false, "prompt": "“learn about other cultures” is closest in meaning to ______.", "options": ["pay less attention to traditional local celebrations", "spend money on products one does not really need", "develop awareness of traditions beyond one’s own", "respond to fashionable cultural trends"], "keyLetter": "C", "keyText": "develop awareness of traditions beyond one’s own", "why": "learn about other cultures ≈ develop awareness of traditions beyond one’s own.", "distractors": ["B. là nghĩa của câu “buy unnecessary things”.", "D. là nghĩa của câu “be influenced by trends”.", "A. là nghĩa của câu “ignore local festivals”."], "kb": "beyond one’s own = vượt ra ngoài của mình.", "authored": false}, {"n": 43, "uid": 43, "part": "", "hd_fix": false, "prompt": "“ignore local festivals” is closest in meaning to ______.", "options": ["respond to fashionable cultural trends", "can help young people learn more about other cultures", "pay less attention to traditional local celebrations", "spend money on products one does not really need"], "keyLetter": "C", "keyText": "pay less attention to traditional local celebrations", "why": "ignore local festivals ≈ pay less attention to traditional local celebrations.", "distractors": [ present (V0) sai sau avoid.", "“to present” sai cấu trúc.", "presented (V3) sai dạng."], "kb": "avoid doing sth.", "authored": false}, {"n": 54, "uid": 54, "part": "", "hd_fix": false, "prompt": "Which expression means “giảm áp lực mua sắm”?", "options": ["fit in", "commercial pressure", "shape the outcome", "reduce shopping pressure"], "keyLetter": "D", "keyText": "reduce shopping pressure", "why": "reduce shopping pressure = giảm áp lực mua sắm.", "distractors": ["B. nghĩa “áp lực thương mại” (danh từ).", "A. nghĩa “hoà nhập”.", "C. nghĩa “định hình kết quả”."], "kb": "reduce = giảm bớt.", "authored": false}, {"n": 55, "uid": 55, "part": "", "hd_fix": false, "prompt": "Which expression means “làm sâu sắc sự hiểu biết về”?", "options": ["develop cultural awareness", "respond to trends", "deepen understanding of", "provide a starting point for"], "keyLetter": "C", "keyText": "deepen understanding of", "why": "deepen understanding of = làm sâu sắc sự hiểu biết về.", "distractors": ["A. nghĩa “phát triển nhận thức văn hoá”.", "D. nghĩa “cung cấp điểm khởi đầu”.", "B. nghĩa “phản ứng với xu hướng”."], "kb": "deepen = làm sâu sắc.", "authored": false}]},"p2":{"title":"PHẦN 2 — LUYỆN TẬP","desc":"20 câu: paraphrase, liên kết, điền đoạn văn & sắp xếp","questions":[{"n": 1, "uid": 1, "part": "PARAPHRASE CONTROL", "hd_fix": false, "prompt": "Original: “Celebrating world festivals can help young people learn about other cultures.” Best paraphrase:", "options": ["Young people can learn about other cultures only by attending festivals.", "Taking part in world festivals may broaden young people’s cultural awareness.", "International celebrations guarantee full knowledge of every culture.", "Foreign celebrations should replace other forms of cultural education."], "keyLetter": "B", "keyText": "Taking part in world festivals may broaden young people’s cultural awareness.", "why": "Câu gốc dùng “can help” (mức độ khả năng); B dùng “may broaden”, giữ đúng chủ thể, hành động và mức độ chắc chắn.", "distractors": ["C. đổi can help thành guarantee + “full knowledge of every culture”: tăng mức độ quá đà.", "A. thêm “only” giới hạn sai.", "D. thêm ý “should replace” không có trong câu gốc."], "kb": "Paraphrase: không thêm, không bớt, không bóp méo.", "authored": false}, {"n": 2, "uid": 2, "part": "PARAPHRASE CONTROL", "hd_fix": false, "prompt": "Original: “Some people worry that local festivals may receive less attention.” Best paraphrase:", "options": ["Local festivals have already lost public attention completely.", "People are concerned mainly about the cost of local festival activities.", "Some people are concerned that traditional local celebrations could be overlooked.", "Everyone believes traditional celebrations will eventually disappear."], "keyLetter": "C", "keyText": "Some people are concerned that traditional local celebrations could be overlooked.", "why": "Câu gốc giới hạn chủ thể (some) và giữ khả năng (may); D giữ cả hai: “Some people are concerned” ≈ worry, “could be overlooked” ≈ may receive less attention.", "distractors": ["A. biến lo ngại thành sự việc đã xảy ra (have already lost… completely).", "D. mở rộng chủ thể thành “everyone”.", "B. bịa đặt trọng tâm (cost)."], "kb": "Giữ đúng giới hạn chủ thể (some) và mức độ (may).", "authored": false}, {"n": 3, "uid": 3, "part": "PARAPHRASE CONTROL", "hd_fix": false, "prompt": "Which paraphrase DISTORTS “The effect depends on how the festival is celebrated”?", "options": ["The manner of celebration can shape its influence.", "The festival itself always produces exactly the same effect.", "How people celebrate may influence the outcome.", "The impact can vary according to the way the celebration is organised."], "keyLetter": "B", "keyText": "The festival itself always produces exactly the same effect.", "why": "A, B, D đều giữ quan hệ “tác động thay đổi tuỳ cách tổ chức”; C nói “always produces exactly the same effect” → phủ định trực tiếp ý gốc.", "distractors": ["D. giữ đúng quan hệ (vary according to).", "C. giữ đúng quan hệ (may influence).", "A. giữ đúng quan hệ (can shape)."], "kb": "DISTORT = bóp méo quan hệ/mức độ của câu gốc.", "authored": false}, {"n": 4, "uid": 4, "part": "COHESION – CONNECTORS", "hd_fix": false, "prompt": "Young people may discover unfamiliar customs through international festivals. ______, such events can become starting points for cultural learning.", "options": ["As a result", "Otherwise", "However", "In contrast"], "keyLetter": "A", "keyText": "As a result", "why": "Câu 1 nêu điều kiện (khám phá phong tục lạ); câu 2 nêu kết quả (trở thành điểm khởi đầu) → quan hệ nguyên nhân-kết quả: As a result.", "distractors": ["However là tương phản, không phù hợp.", "In contrast là tương phản, không phù hợp.", "Otherwise (nếu không thì) sai quan hệ."], "kb": "Đọc quan hệ giữa hai câu trước khi chọn từ nối.", "authored": false}, {"n": 5, "uid": 5, "part": "COHESION – CONNECTORS", "hd_fix": false, "prompt": "Some celebrations are highly commercial. ______, families may spend more than they originally planned.", "options": ["Meanwhile", "Similarly", "For example", "As a result"], "keyLetter": "D", "keyText": "As a result", "why": "“Highly commercial” dẫn đến chi tiêu vượt dự định → nguyên nhân-kết quả: As a result.", "distractors": ["For example cần ví dụ cụ thể.", "Meanwhile chỉ đồng thời.", "Similarly cần ý tương tự trước đó."], "kb": "As a result = do đó (kết quả).", "authored": false}, {"n": 6, "uid": 6, "part": "COHESION – CONNECTORS", "hd_fix": false, "prompt": "International festivals can be enjoyable. ______, schools should also help students understand their origins.", "options": ["For instance", "Therefore", "However", "Likewise"], "keyLetter": "C", "keyText": "However", "why": "Hai mệnh đề không phải nguyên nhân-kết quả mà là nhượng bộ/tương phản: vui NHƯNG vẫn cần hiểu nguồn gốc → However.", "distractors": ["Therefore sai vì không có quan hệ kết quả.", "For instance cần ví dụ.", "Likewise cần ý tương tự."], "kb": "However = tuy nhiên (tương phản).", "authored": false}, {"n": 7, "uid": 7, "part": "COHESION – CONNECTORS", "hd_fix": false, "prompt": "Schools can explain the cultural background of an event. ______, students can compare it more thoughtfully with local traditions.", "options": ["As a result", "In contrast", "Although", "Otherwise"], "keyLetter": "A", "keyText": "As a result", "why": "Giải thích background tạo điều kiện để so sánh thoughtful hơn → kết quả trực tiếp: As a result.", "distractors": ["In contrast tạo đối lập không có.", "Otherwise sai quan hệ.", "Although phải mở mệnh đề phụ, không đứng độc lập nối hai câu."], "kb": "As a result = do đó.", "authored": false}, {"n": 8, "uid": 8, "part": "REFERENCE – THIS / THESE / SUCH", "hd_fix": false, "prompt": "“The school added a short presentation about Halloween’s origins. This helped students understand the celebration more clearly.” What does “This” refer to?", "options": ["the school that organised the celebration", "the students who attended the presentation", "adding a presentation about the festival’s origins", "the celebration that was explained to students"], "keyLetter": "C", "keyText": "adding a presentation about the festival’s origins", "why": "“This” không chỉ một danh từ riêng lẻ mà quy chiếu toàn bộ hành động trước: thêm bài trình bày về nguồn gốc Halloween.", "distractors": ["A. chỉ chủ thể (the school), không phải hành động.", "B. chỉ đối tượng nhận, không phải hành động.", "D. chỉ sự kiện được giải thích."], "kb": "“This” thường quy chiếu cả mệnh đề/hành động trước.", "authored": false}, {"n": 9, "uid": 9, "part": "REFERENCE – THIS / THESE / SUCH", "hd_fix": false, "prompt": "“Students compared Halloween with local festivals. This comparison encouraged them to notice both similarities and differences.” “This comparison” refers to ______.", "options": ["the similarities and differences students noticed", "Halloween as an international celebration", "the act of comparing Halloween with local festiva const PASSAGES={"COHESION 1": "<p>World festivals can have educational value for young people. (11) ______. When schools explain the history and meaning of a celebration, students can compare it with traditions in their own country. (12) ______. However, cultural learning is less likely when a festival is presented only as a chance to buy products or copy fashionable images. For this reason, the way a festival is celebrated may matter as much as the festival itself.</p>", "COHESION 2": "<p>One criticism of international festivals is that they can become highly commercial. Young people may feel pressure to buy decorations, gifts or costumes in order to fit in. (13) ______. A school celebration, for example, can use low-cost activities and focus on cultural background rather than shopping. (14) ______. The problem is therefore not necessarily the festival itself, but the priorities surrounding it.</p>", "CLOZE": "<p>International festivals can be valuable when they are celebrated thoughtfully. They can expose young people (17) ______ unfamiliar traditions and encourage them to ask questions about cultural meaning. However, schools should avoid (18) ______ these events as purely commercial occasions. If students are given accurate background information, they are more likely to develop cultural (19) ______ rather than copy visible features without understanding them. (20) ______, local traditions should remain an important part of school life so that cultural exchange does not become cultural replacement.</p>"};

function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
