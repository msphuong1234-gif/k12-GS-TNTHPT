<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:17px/1.65 "Times New Roman",Times,serif}
header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.subtitle{opacity:.92;font-size:18px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}
.toolbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;font-family:system-ui}
.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:system-ui}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}
.GREEN{background:#dcfce7;color:var(--green)}.AMBER{background:#fef3c7;color:var(--amber)}.RED{background:#fee2e2;color:var(--red)}
.TAG{background:#e0e7ff;color:#3730a3}
.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}
table.vocab{width:100%;border-collapse:collapse;margin:12px 0}
table.vocab th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left}
table.vocab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.vocab tr:nth-child(even) td{background:#f8fafc}
.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}
.know b.t{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:22px;font-family:system-ui}
@media(max-width:760px){.toolbar button{flex:1}}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#102a43,#245b8f);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0006}
.gate-box h2{color:var(--navy);margin:0 0 6px}
.gate-box input{width:100%;padding:12px;border:1px solid #bfcadd;border-radius:10px;font-size:17px;margin:12px 0;font-family:system-ui}
.gate-box .primary{width:100%;font-size:17px}
#pwmsg{color:var(--red);font-weight:700;min-height:24px;font-family:system-ui}
.view{display:none}.view.active{display:block}
.backbar{margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:8px}
.hub-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;text-align:left;font-family:"Times New Roman",Times,serif;box-shadow:0 7px 22px #1e293b0b}
.hub-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.hub-card b.t{font-size:21px;color:var(--navy);display:block;margin-bottom:6px}
.hub-card span.d{color:var(--muted);font-size:15px;display:block}
.hub-card .st{margin-top:10px;display:block}
.twopane{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start;margin:12px 0}
.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pane-l{background:#fbfdff}
@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

ore ______.", "options": ["foreign", "local", "thoughtful", "unsure"], "keyLetter": "C", "keyText": "thoughtful", "why": "Chunk của bài: “make participation more thoughtful”.", "distractors": ["foreign không hợp nghĩa.", "unsure trái nghĩa (chưa chắc chắn).", "local không hợp ngữ cảnh."], "kb": "thoughtful = có suy nghĩ, có ý thức.", "authored": false}, {"n": 17, "uid": 17, "part": "", "hd_fix": false, "prompt": "Some people worry that foreign festivals may ______ attention to local traditions.", "options": ["focus", "weaken", "compare", "explain"], "keyLetter": "B", "keyText": "weaken", "why": "Chunk của bài: “weaken attention to local traditions”.", "distractors": ["explain không tạo nghĩa “làm giảm”.", "compare không tạo nghĩa “làm giảm”.", "focus không tạo nghĩa “làm giảm”."], "kb": "weaken = làm yếu đi, làm giảm.", "authored": false}, {"n": 18, "uid": 18, "part": "", "hd_fix": false, "prompt": "Reliable information helps students make ______ choices.", "options": ["informed", "foreign", "historical", "unsure"], "keyLetter": "A", "keyText": "informed", "why": "Chunk của bài: “make informed choices” (đưa ra lựa chọn có hiểu biết).", "distractors": ["foreign không tạo chunk với “make… choices”.", "historical không tạo chunk.", "unsure không tạo chunk."], "kb": "informed = có hiểu biết.", "authored": false}, {"n": 19, "uid": 19, "part": "", "hd_fix": false, "prompt": "Copying a foreign ______ without context may cause misunderstanding.", "options": ["tradition", "background", "choice", "concern"], "keyLetter": "A", "keyText": "tradition", "why": "Chunk của bài: “copy a foreign tradition”.", "distractors": ["concern không đi với “copy a foreign…”.", "choice không đi với “copy a foreign…”.", "background không đi với “copy a foreign…”."], "kb": "tradition = truyền thống.", "authored": false}, {"n": 20, "uid": 20, "part": "", "hd_fix": false, "prompt": "The issue was not considered a serious cause ______ concern.", "options": ["to", "with", "for", "of"], "keyLetter": " ion means “nguyên nhân gây lo ngại”?", "options": ["an informed choice", "a foreign tradition", "cultural context", "a cause for concern"], "keyLetter": "D", "keyText": "a cause for concern", "why": "a cause for concern = nguyên nhân gây lo ngại.", "distractors": ["A. nghĩa “lựa chọn có hiểu biết” nhưng không phải chunk đúng.", "C. nghĩa “bối cảnh văn hoá”, thiếu động từ.", "B. nghĩa “truyền thống nước ngoài”, sai chủ đề."], "kb": "concern = mối lo ngại.", "authored": false}, {"n": 29, "uid": 29, "part": "", "hd_fix": false, "prompt": "Providing cultural background can ______ cultural learning.", "options": ["replace", "support", "weaken", "copy"], "keyLetter": "B", "keyText": "support", "why": "Chunk: support cultural learning (hỗ trợ việc học văn hoá).", "distractors": ["weaken trái nghĩa với đề bài.", "copy không hợp ngữ cảnh.", "replace trái nghĩa với đề bài."], "kb": "support = hỗ trợ.", "authored": false}, {"n": 30, "uid": 30, "part": "", "hd_fix": false, "prompt": "Which expression means “làm giảm sự chú ý dành cho truyền thống địa phương”?", "options": ["compare with local traditions", "weaken attention to local traditions", "make participation more thoughtful", "focus on cultural context"], "keyLetter": "B", "keyText": "weaken attention to local traditions", "why": "weaken attention to local traditions = làm giảm sự chú ý dành cho truyền thống địa phương.", "distractors": ["C. nghĩa “làm cho tham gia có ý thức hơn”.", "A. nghĩa “so sánh với truyền thống địa phương”.", "D. nghĩa “tập trung vào bối cảnh văn hoá”."], "kb": "weaken = làm giảm.", "authored": false}, {"n": 31, "uid": 31, "part": "", "hd_fix": false, "prompt": "Which expression means “giảm sự đơn giản hoá quá mức”?", "options": ["make informed choices", "be unsure at first", "copy a foreign tradition", "reduce oversimplification"], "keyLetter": "D", "keyText": "reduce oversimplification", "why": "reduce oversimplification = giảm sự đơn giản hoá quá mức.", "distractors": ["C. nghĩa “sao chép truyền  we should copy every foreign tradition without understanding it.’ The attitude is best described as ______.", "options": ["completely negative", "unrelated", "positive but qualified", "uncritical enthusiasm"], "keyLetter": "C", "keyText": "positive but qualified", "why": "‘I enjoy’ → tích cực; ‘although… without understanding it’ → giới hạn điều kiện: tích cực nhưng có điều kiện.", "distractors": ["A. “completely negative” trái với “I enjoy”.", "D. “uncritical enthusiasm” bỏ qua “although…”.", "B. “unrelated” không liên quan nội dung."], "kb": "although = mặc dù — dấu hiệu “qualified”.", "authored": false}, {"n": 3, "uid": 3, "part": "ATTITUDE & STANCE", "hd_fix": false, "prompt": "Speaker: ‘Its popularity is increasing, but I don’t see that as a reason to panic.’ What does the speaker mean?", "options": ["The trend is not increasing.", "The festival should be banned immediately.", "Young people should avoid all foreign festivals.", "The trend is not viewed as a serious cause for concern."], "keyLetter": "D", "keyText": "The trend is not viewed as a serious cause for concern.", "why": "‘Popularity is increasing’ được thừa nhận; ‘not… a reason to panic’ → không coi đó là nguyên nhân đáng lo nghiêm trọng.", "distractors": ["B. “banned immediately” trái ý người nói.", "A. trái với “popularity is increasing”.", "C. “avoid all” bịa đặt, tuyệt đối hoá."], "kb": "not a reason to panic = không đáng lo.", "authored": false}, {"n": 4, "uid": 4, "part": "ATTITUDE & STANCE", "hd_fix": false, "prompt": "Speaker: ‘The costumes were fun, but what impressed me most was the cultural explanation.’ What mattered MOST?", "options": ["the costumes", "the ticket price", "the location", "the explanation of cultural background"], "keyLetter": "D", "keyText": "the explanation of cultural background", "why": "Cấu trúc “X was fun, but what impressed me most was Y” đặt Y ở vị trí trọng tâm: cultural explanation.", "distractors": ["A. chỉ là vế nhường bộ.", "B. (ticket price) không được nhắc.", "C. (location) không được nhắc."], "kb": "“what impressed me most” = điều gây ấn tượng nhất.", "authored": false}, {"n": 5, "uid": 5, "part": "PASSAGE COMPLETION – ENTERTAINMENT VS LEARNING", "hd_fix": false, "prompt": "Blank (5)", "options": ["In contrast, schools should avoid comparing international and local traditions.", "This means every imported celebration has the same cultural meaning.", "Others argue that these events can also become opportunities for cultural learning.", "Some people therefore argue that entertainment should replace cultural explanation."], "keyLetter": "C", "keyText": "Others argue that these events can also become opportunities for cultural learning.", "why": "Trước chỗ trống: một số người xem lễ hội chỉ là giải trí; sau chỗ trống: trường giải thích bối cảnh để biến thành học tập — B tạo thế đối lập hợp lý.", "distractors": ["D. đảo ngược (replace cultural explanation).", "B. tuyệt đối hoá (every… same meaning).", "A. trái ý bài (avoid comparing)."], "kb": "Others argue… = góc nhìn đối lập.", "authored": false}, {"n": 6, "uid": 6, "part": "PASSAGE COMPLETION – COMPARE WITH LOCAL TRADITIONS", "hd_fix": false, "prompt": "Blank (6)", "options": ["Such comparison can reduce oversimplification and encourage better questions.", "Such comparison guarantees that every student will reach the same conclusion.", "This approach makes entertainment unnecessary in school events.", "The comparison is useful only when students already know the celebration well."], "keyLetter": "A", "keyText": "Such comparison can reduce oversimplification and encourage better questions.", "why": "Câu trước: so sánh với truyền thống địa phương thay vì sao chép bề ngoài; D diễn giải hệ quả hợp lý: giảm oversimplification, khuyến khích câu hỏi tốt hơn.", "distractors": ["B. tuyệt đối hoá (guarantees… every).", "D. giới hạn sai (only when…).", "C. phủ nhận giải trí (unnecessary)."], "kb": "can + động từ = diễn đạt thận trọng.", "authored": false}, {"n": 7, "uid": 7, "part": "ORDERING TRANSFER", "hd_fix": false, "prompt": "Order by information flow: initial view → new evidence → changed view → conclusion.<br>a. After the school explained the festival’s history, she became more interested.<br>b. At first, Lan thought Halloween was only about costumes and scary decorations.<br>c. She now thinks the celebration can be useful if students learn its background.<br>d. Her class then learned about the festival’s historical and cultural background.", "options": ["c – b – d – a", "b – a – d – c", "b – d – a – c", "d – b – c – a"], "keyLetter": "C", "keyText": "b – d – a – c", "why": "b nêu nhận định ban đầu; d cung cấp thông tin mới (tìm hiểu bối cảnh); a cho thấy quan điểm thay đổi; c dùng “now” chốt kết luận hiện tại.", "distractors": ["D. mở bằng thông tin mới khi quan điểm ban đầu chưa nêu.", "B. đặt quan điểm thay đổi trước thông tin mới.", "A. mở bằng kết luận “now” ngay đầu."], "kb": "Mạch: quan điểm ban đầu → bằng chứng mới → thay đổi → kết luận.", "authored": false}, {"n": 8, "uid": 8, "part": "ORDERING TRANSFER", "hd_fix": false, "prompt": "Order by problem → response → result.<br>a. As a result, parents became more supportive of the event.<br>b. Some parents worried that the school was promoting a foreign festival without context.<br>c. The school added a short cultural explanation and comparison with local traditions.", "options": ["b – c – a", "c – b – a", "a – b – c", "b – a – c"], "keyLetter": "A", "keyText": "b – c – a", "why": "b = vấn đề (phụ huynh lo ngại); c = phản hồi (thêm giải thích và so sánh); a = kết quả (“As a result…”).", "distractors": ["B. đặt phản hồi trước vấn đề.", "C. mở bằng kết quả.", "D. đặt kết quả trước phản hồi."], "kb": "Mạch: vấn đề → phản hồi → kết quả.", "authored": false}, {"n": 9, "uid": 9, "part": "READING TRANSFER – INTERNATIONAL FESTIVALS & LOCAL CULTURE", "hd_fix": false, "prompt": "Why does the writer mention two views in paragraph 1?", "options": ["To prove that international celebrations hav lways protects identity."], "keyLetter": "A", "keyText": "Participation may occur without weakening local identity.", "why": "“does not necessarily weaken” ≈ “may occur without weakening” — giữ đúng mức độ không tuyệt đối.", "distractors": ["D. dùng “always protects” tuyệt đối hoá.", "B. dùng “never changes” tuyệt đối hoá.", "C. trái ý hoàn toàn."], "kb": "“not necessarily” ≠ “never”.", "authored": false}, {"n": 3, "uid": 3, "part": "", "hd_fix": false, "prompt": "‘At first I was doubtful; after learning the history, I became interested.’ Final attitude?", "options": ["interested", "doubtful", "opposed", "indifferent"], "keyLetter": "A", "keyText": "interested", "why": "“At first” chỉ thái độ ban đầu; câu hỏi FINAL attitude → đáp án là “became interested”.", "distractors": ["B. là thái độ ban đầu, không phải cuối.", "C. (opposed) không có căn cứ.", "D. (indifferent) trái với “became interested”."], "kb": "FINAL attitude = ý cuối cùng.", "authored": false}, {"n": 4, "uid": 4, "part": "", "hd_fix": false, "prompt": "Complete: Schools can compare international festivals ______ local traditions.", "options": ["to copying", "at", "with", "for"], "keyLetter": "C", "keyText": "with", "why": "Cấu trúc: compare A with B.", "distractors": ["“compare at” sai.", "“compare for” sai.", "“to copying” sai ngữ pháp."], "kb": "compare A with B.", "authored": false}, {"n": 5, "uid": 5, "part": "", "hd_fix": false, "prompt": "Which is safest?", "options": ["Costumes should never be used.", "Context can help reduce oversimplification.", "Cultural explanation guarantees agreement.", "Every foreign festival harms local customs."], "keyLetter": "B", "keyText": "Context can help reduce oversimplification.", "why": "“Can help” là diễn đạt thận trọng, phù hợp nội dung bài.", "distractors": ["C. dùng “guarantees” tuyệt đối hoá.", "D. dùng “Every… harms” tuyệt đối hoá.", "A. dùng “never” tuyệt đối hoá."], "kb": "Cảnh giác từ tuyệt đối: guarantees/every/never.", "authored": false}]}};
const PASSAGES={"ENTERTAINMENT VS LEARNING": "<p>International festivals are increasingly visible in Vietnamese schools and cities. Some people see them mainly as entertainment. (5) ______. When schools explain the historical and cultural background of a celebration, students can compare it with local traditions instead of simply copying visible features.</p>", "COMPARE WITH LOCAL TRADITIONS": "<p>When schools explain the historical and cultural background of a celebration, students can compare it with local traditions instead of simply copying visible features. (6) ______. This does not remove every concern, but it can make participation more thoughtful.</p>", "INTERNATIONAL FESTIVALS & LOCAL CULTURE": "<p>International festivals have become more visible in many Vietnamese cities, particularly among young people. Their growing popularity can create debate. Some people worry that imported celebrations may weaken attention to local traditions. Others argue that participation in an international festival does not necessarily replace local customs.</p><p>The effect often depends on how the celebration is presented. If an event focuses only on costumes, products and social-media images, students may learn very little about cultural context. By contrast, schools can use the same event to explain historical origins, compare customs and encourage students to ask why particular practices developed.</p><p>This approach does not require students to accept every foreign tradition or reject local identity. Instead, it treats cultural contact as an opportunity to learn, compare and make informed choices.</p>"};

const startEpoch=Date.now();
const letters=['A','B','C','D'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
