<html lang="vi">
<head>

<title>UNIT 2 • LESSON 1 • GETTING STARTED — Ôn bài cũ • Luyện tập • Củng cố</title>
<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:17px/1.65 "Times New Roman",Times,serif}
header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.subtitle{opacity:.92;font-size:18px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}
.toolbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;font-family:system-ui}
.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:system-ui}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}
.GREEN{background:#dcfce7;color:var(--green)}.AMBER{background:#fef3c7;color:var(--amber)}.RED{background:#fee2e2;color:var(--red)}
.TAG{background:#e0e7ff;color:#3730a3}
.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}
table.vocab{width:100%;border-collapse:collapse;margin:12px 0}
table.vocab th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left}
table.vocab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.vocab tr:nth-child(even) td{background:#f8fafc}
.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}
.know b.t{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:22px;font-family:system-ui}
@media(max-width:760px){.toolbar button{flex:1}}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#102a43,#245b8f);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0006}
.gate-box h2{color:var(--navy);margin:0 0 6px}
.gate-box input{width:100%;padding:12px;border:1px solid #bfcadd;border-radius:10px;font-size:17px;margin:12px 0;font-family:system-ui}
.gate-box .primary{width:100%;font-size:17px}
#pwmsg{color:var(--red);font-weight:700;min-height:24px;font-family:system-ui}
.view{display:none}.view.active{display:block}
.backbar{margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:8px}
.hub-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;text-align:left;font-family:"Times New Roman",Times,serif;box-shadow:0 7px 22px #1e293b0b}
.hub-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.hub-card b.t{font-size:21px;color:var(--navy);display:block;margin-bottom:6px}
.hub-card span.d{color:var(--muted);font-size:15px;display:block}
.hub-card .st{margin-top:10px;display:block}
.twopane{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start;margin:12px 0}
.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pane-l{background:#fbfdff}
@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

@media print{header,.toolbar,.actions{display:none!important}body{background:#fff}.card,.q{box-shadow:none;break-inside:avoid}}</style></head>

horizons.", "authored": false}, {"n": 11, "uid": 11, "part": "SECTION IV – PRACTICE 2 – COLLOCATION & LEXICAL CHOICE", "hd_fix": false, "prompt": "The programme aims to ______ intercultural understanding between local and exchange students.", "options": ["manufacture", "rise", "perform", "promote"], "keyLetter": "D", "keyText": "promote", "why": "“promote intercultural understanding” (thúc đẩy sự thấu hiểu liên văn hoá) là collocation chuẩn.", "distractors": ["A. “manufacture” nghĩa “sản xuất”, sai ngữ cảnh", "C. “perform understanding” không phải collocation", "B. “rise” là nội động từ, không nhận tân ngữ"], "kb": "promote intercultural understanding.", "authored": false}, {"n": 12, "uid": 12, "part": "SECTION IV – PRACTICE 2 – COLLOCATION & LEXICAL CHOICE", "hd_fix": false, "prompt": "Families can help ______ traditions down from one generation to the next.", "options": ["take", "pass", "bring", "run"], "keyLetter": "B", "keyText": "pass", "why": "“pass … down from one generation to the next” (truyền lại từ thế hệ này sang thế hệ khác) là cụm cố định.", "distractors": ["C. “bring down” nghĩa “hạ xuống / làm sụp đổ”, sai", "A. “take down” nghĩa “ghi chép / tháo dỡ”, lạc đề", "D. “run down” nghĩa “chạy xuống”, vô nghĩa"], "kb": "pass … down.", "authored": false}, {"n": 13, "uid": 13, "part": "SECTION IV – PRACTICE 2 – COLLOCATION & LEXICAL CHOICE", "hd_fix": false, "prompt": "A successful exchange programme should ______ respect for differences rather than encourage comparison based on stereotypes.", "options": ["lift", "operate", "foster", "do"], "keyLetter": "C", "keyText": "foster", "why": "“foster respect” (nuôi dưỡng sự tôn trọng) là collocation trang trọng đúng ngữ cảnh.", "distractors": ["D. “do respect” không phải collocation", "A. “lift respect” vô nghĩa", "B. “operate respect” không tồn tại"], "kb": "foster respect.", "authored": false}, {"n": 14, "uid": 14, "part": "SECTION IV – PRACTICE 2 – COLLOCATION & LEXICAL CHOICE", "hd_fix": false, "prompt": "Students can ______ a deeper appreciation of another culture through direct interaction.", "options": ["develop", "make", "perform", "raise"], "keyLetter": "A", "keyText": "develop", "why": "“develop a deeper appreciation of” (phát triển sự trân trọng sâu sắc) là collocation chuẩn.", "distractors": ["B. “make appreciation” không phải collocation", "C. “perform appreciation” vô nghĩa", "D. “raise appreciation” sai cụm"], "kb": "develop a deeper appreciation of.", "authored": false}, {"n": 15, "uid": 15, "part": "SECTION V – SHORT CLOZE 1 – CULTURAL FAIR", "hd_fix": false, "prompt": "Blank (15): The event was designed to ______ cultural awareness.", "options": ["lift", "grow", "rise", "raise"], "keyLetter": "D", "keyText": "raise", "why": "“raise cultural awareness” là collocation cố định; “rise” là nội động từ, không nhận tân ngữ.", "distractors": ["C. “rise” là nội động từ, không đứng trước tân ngữ", "A. “lift awareness” không phải collocation", "B. “grow awareness” sai cụm"], "kb": "raise.", "authored": false}, {"n": 16, "uid": 16, "part": "SECTION V – SHORT CLOZE 1 – CULTURAL FAIR", "hd_fix": false, "prompt": "Blank (16): Students were asked to research customs carefully ______ their presentations would be accurate and respectful.", "options": ["despite", "so that", "unless", "although"], "keyLetter": "B", "keyText": "so that", "why": "“so that + S + V” là cấu trúc chỉ mục đích, đúng logic nghiên cứu để trình bày chính xác.", "distractors": ["D. “although” là nhượng bộ, trái logic", "C. “unless” nghĩa “trừ khi”, sai ngữ nghĩa", "A. “despite + N”, không đi với mệnh đề"], "kb": "so that.", "authored": false}, {"n": 17, "uid": 17, "part": "SECTION V – SHORT CLOZE 1 – CULTURAL FAIR", "hd_fix": false, "prompt": "Blank (17): Many visitors said the fair helped them ______ a better understanding of cultures they had previously known little about.", "options": ["gain", "take", "perform", "do"], "keyLetter": "A", "keyText": "gain", "why": "“help + (sb) + gain” (động từ nguyên thể sau “help”); “gain a better understanding” là collocation chuẩn.", "distractors": ["D. “do a better understanding” không phải collocation", "B. “take a better understanding” sai cụm", "C. “perform a better understanding” vô nghĩa"], "kb": "gain.", "authored": false}, {"n": 18, "uid": 18, "part": "SECTION V – SHORT CLOZE 1 – CULTURAL FAIR", "hd_fix": false, "prompt": "Blank (18): The more actively students participated, ______ meaningful the experience became.", "options": ["most", "more", "the most", "the more"], "keyLetter": "D", "keyText": "the more", "why": "Cấu trúc so sánh kép: “The + comparative …, the + comparative …”.", "distractors": ["B. “more” thiếu “the”, sai cấu trúc", "C. “the most” là so sánh nhất, sai dạng", "A. “most” sai dạng so sánh"], "kb": "the more.", "authored": false}, {"n": 19, "uid": 19, "part": "SECTION V – SHORT CLOZE 1 – CULTURAL FAIR", "hd_fix": false, "prompt": "Blank (19): …which could help maintain the cultural ______ they had begun.", "options": ["exchanging", "exchanges", "exchange", "exchanged"], "keyLetter": "C", "keyText": "exchange", "why": "Sau tính từ “cultural” cần danh từ số ít “exchange”.", "distractors": ["A. “exchanging” là V-ing, sai vị trí", "D. “exchanged” là phân từ, sai từ loại", "B. “exchanges” là danh từ số nhiều, sai ngữ pháp"], "kb": "exchange.", "authored": false}, {"n": 20, "uid": 20, "part": "SECTION VI – SHORT CLOZE 2 – FOOD & CULTURAL IDENTITY", "hd_fix": false, "prompt": "Blank (20): …recipes may change to ______ local tastes or available ingredients.", "options": ["cater for with", "cater to", "depend at", "reach to"], "keyLetter": "B", "keyText": "cater to", "why": "“cater to” (thích nghi cho phù hợp) là collocation cố định với “local tastes”.", "distractors": ["D. “reach to” không phải collocation", "C. “depend at” sai giới từ", "A. “cater for with” sai cấu trúc"], "kb": "cater to.", "authored": false}, {"n": 21, "uid": 21, "part": "SECTION VI – SHORT CLOZE 2 – FOOD & CULTURAL IDENTITY", "hd_fix": false, "prompt": "Blank (21): These changes do not necessarily destroy cultural identity. ______, they can create new versions of a dish…", "options": ["Similarly", "Otherwise", "Therefore", "Instead"], "keyLetter": "D", "keyText": "Instead", "why": "“Instead” thể hiện sự đối lập: thay đổi không huỷ hoại bản sắc mà tạo ra phiên bản mới.", "distractors": ["C. “therefore” nghĩa kết quả, trái logic", "A. “similarly” nghĩa tương tự, không hợp", "B. “otherwise” nghĩa “nếu không thì”, sai ngữ nghĩa"], "kb": "Instead.", "authored": false}, {"n": 22, "uid": 22, "part": "SECTION VI – SHORT CLOZE 2 – FOOD & CULTURAL IDENTITY", "hd_fix": false, "prompt": "Blank (22): …cultural identity is better understood as something that can be maintained while also ______.", "options": ["adapting", "adapt", "adapted to", "adaptation"], "keyLetter": "A", "keyText": "adapting", "why": "Sau “while” rút gọn cần V-ing: “while also adapting”.", "distractors": ["B. “adapt” sai dạng sau “while”", "C. “adapted to” sai dạng", "D. “adaptation” là danh từ, sai vị trí"], "kb": "adapting.", "authored": false}, {"n": 23, "uid": 23, "part": "SECTION VI – SHORT CLOZE 2 – FOOD & CULTURAL IDENTITY", "hd_fix": false, "prompt": "Blank (23): …less likely to reduce an entire culture ______ a single food image.", "options": ["to", "with", "for", "at"], "keyLetter": "A", "keyText": "to", "why": "Cấu trúc cố định “reduce A to B” (giản lược A thành B).", "distractors": ["C. “reduce … for” sai cấu trúc", "B. “reduce … with” sai giới từ", "D. “reduce … at” sai giới từ"], "kb": "to.", "authored": false}, {"n": 24, "uid": 24, "part": "SECTION VII – PASSAGE COMPLETION", "hd_fix": false, "prompt": "Which sentence best fits blank (24)?", "options": ["For this reason, schools should separate entertainment completely from cultural explanation.", "Cultural information is most useful only after visitors have left the event.", "Attractive features are usually enough to explain a culture accurately.", "However, meaningful learning requires accurate information about the traditions being presented."], "keyLetter": "D", "keyText": "However, meaningful learning requires accurate information about the traditions being presented.", "why": "Trích dẫn: “Without such context, a festival may unintentionally reduce a complex culture to a few attractive images.” — câu đứng trước phải nói về tầm quan trọng của thông tin chính xác.", "distractors": ["C. trái với ý “without such context” ở câu sau", "B. phi logic về thời điểm", "A. trái với ý kết hợp giải trí và giải thích của đoạn"], "kb": "However, meaningful learning requires accurate information….", "authored": false}, {"n": 25, "uid": 25, "part": "SECTION VII – PASSAGE COMPLETION", "hd_fix": false, "prompt": "Which sentence best fits blank (25)?", "options": ["Such research is useful mainly because it allows students to memorise more country names.", "This approach means performances and interaction are no longer necessary.", "These activities give cultural products a clearer context and reduce oversimplification.", "These activities can attract attention even when students do not investigate cultural meaning."], "keyLetter": "C", "keyText": "These activities give cultural products a clearer context and reduce oversimplification.", "why": "Trích dẫn: “This approach allows students to enjoy the event while also understanding the values and history behind it.” — câu đứng trước phải nói về việc tạo ngữ cảnh rõ ràng hơn.", "distractors": ["D. trái với mục tiêu giảm đơn giản hoá", "A. thu hẹp mục đích nghiên cứu thành học thuộc lòng", "B. trái với ý kết hợp biểu diễn với giải thích"], "kb": "These activities give cultural products a clearer context….", "authored": false}, {"n": 26, "uid": 26, "part": "SECTION VIII – TEXT ORGANISATION – ORDERING", "hd_fix": false, "prompt": "Arrange the lines to make a coherent sequence:<br>a. As a result, many students became curious about the traditions behind the performances.<br>b. The school hosted an international cultural day.<br>c. Each group presented food, music and customs from one country.<br>d. Teachers then asked students to explain the cultural meaning of one item they had presented.", "options": ["d – c – b – a", "b – a – c – d", "b – c – d – a", "c – b – a – d"], "keyLetter": "C", "keyText": "b – c – d – a", "why": "Trình tự logic: tổ chức ngày văn hoá (b) → mỗi nhóm trình bày (c) → giáo viên yêu cầu giải thích ý nghĩa (d) → kết quả: học sinh tò mò (a).", "distractors": ["D. đảo ngược trật tự sự kiện", "B. đặt kết quả (a) trước nguyên nhân", "A. đảo ngược hoàn toàn"], "kb": "b – c – d – a.", "authored": false}, {"n": 27, "uid": 27, "part": "SECTION VIII – TEXT ORGANISATION – ORDERING", "hd_fix": false, "prompt": "Arrange the lines to make a logical exchange:<br>a. That sounds useful. It would make the event more educational.<br>b. Why don't we add short information cards next to each food stall?<br>c. Good idea. Visitors could learn the origin of each dish while trying it.", "options": ["c – b – a", "a – c – b", "b – c – a", "a – b – c"], "keyLetter": "C", "keyText": "b – c – a", "why": "Trình tự hội thoại: đề xuất thêm thẻ thông tin (b) → đồng ý, khách học nguồn gốc món ăn (c) → kết luận: giúp sự kiện có tính giáo dục hơn (a).", "distractors": ["D. đảo thứ tự hội thoại", "A. đặt phản hồi trước lời đề xuất", "B. đặt kết luận (a) giữa đoạn hội thoại"], "kb": "b – c – a.", "authored": false}, {"n": 28, "uid": 28, "part": "SECTION IX – READING TRANSFER", "hd_fix": false, "prompt": "The word ‘visible’ in paragraph 1 is closest in meaning to ______.", "options": ["protected by formal cultural rules", "important in cultural history", "difficult for outsiders to interpret", "easy for visitors to notice"], "keyLetter": "D", "keyText": "easy for visitors to notice", "why": "Trích dẫn: “Food, music and clothing can attract attention quickly because they are visible and enjoyable.” — “visible” nghĩa “dễ nhận thấy”.", "distractors": ["B. không có trong đoạn văn", "C. trái ngữ nghĩa với “visible”", "A. không được đề cập"], "kb": "visible ≈ easy to notice.", "authored": false}, {"n": 29, "uid": 29, "part": "SECTION IX – READING TRANSFER", "hd_fix": false, "prompt": "According to paragraph 1, what is one risk of showing only colourful cultural examples?", "options": ["Visitors may leave with stronger cultural stereotypes.", "Visitors may focus on appearance instead of cultural meaning.", "Visitors may decide that food and music are unimportant.", "Visitors may become less interested in attending future events."], "keyLetter": "A", "keyText": "Visitors may leave with stronger cultural stereotypes.", "why": "Trích dẫn: “If visitors are shown only a few colourful examples, they may leave with stronger stereotypes rather than deeper knowledge.”", "distractors": ["B. chỉ diễn đạt quá trình, không phải rủi ro trực tiếp", "C. trái với đoạn văn", "D. không được đề cập"], "kb": "stronger cultural stereotypes.", "authored": false}, {"n": 30, "uid": 30, "part": "SECTION IX – READING TRANSFER", "hd_fix": false, "prompt": "The phrase ‘These details’ in paragraph 2 refers to ______.", "options": ["figures showing how many people attended the festival", "information connecting cultural practices with their wider context", "examples describing only recipes and traditional dishes", "information about prices, tickets and event organisation"], "keyLetter": "B", "keyText": "information connecting cultural practices with their wider context", "why": "Trích dẫn: “These details show that cultural practices are connected to history, place and social meaning.”", "distractors": ["C. thu hẹp phạm vi: đoạn còn nhắc trang phục", "A. không có số liệu người tham dự", "D. không liên quan ngữ cảnh"], "kb": "information connecting cultural practices with their wider context.", "authored": false}, {"n": 31, "uid": 31, "part": "SECTION IX – READING TRANSFER", "hd_fix": false, "prompt": "Why does the writer mention a recipe changing as families moved between regions?", "options": ["To explain why regional migration makes traditional food less authentic", "To argue that traditional recipes should remain completely unchanged", "To compare the commercial value of dishes in different regions", "To show that cultural practices can develop across time and place"], "keyLetter": "D", "keyText": "To show that cultural practices can develop across time and place", "why": "Trích dẫn: “…learn how the recipe changed as families moved between regions.” — minh hoạ cho ý thực hành văn hoá gắn với lịch sử và địa điểm.", "distractors": ["B. trái với quan điểm đoạn văn", "A. không được đề cập", "C. không liên quan thương mại"], "kb": "To show that cultural practices can develop across time and place.", "authored": false}, {"n": 32, "uid": 32, "part": "SECTION IX – READING TRANSFER", "hd_fix": false, "prompt": "Which can be inferred from paragraph 3?", "options": ["Enjoyment can support learning when enough cultural context is provided.", "Visitors learn most effectively when background information is kept minimal.", "Formal classroom teaching is necessary for genuine cultural understanding.", "Educational value increases only when attractive activities are removed."], "keyLetter": "A", "keyText": "Enjoyment can support learning when enough cultural context is provided.", "why": "Trích dẫn: “Enjoyment is still important because it encourages participation. The challenge is to combine an attractive experience with enough context for visitors to ask better questions.”", "distractors": ["D. trái với ý đoạn 3", "C. đoạn văn không đề cập lớp học chính thức", "B. trái với ý “enough context”"], "kb": "Enjoyment can support learning with enough context.", "authored": false}, {"n": 33, "uid": 33, "part": "SECTION IX – READING TRANSFER", "hd_fix": false, "prompt": "Which best summarises the passage?", "options": ["Multicultural events inevitably create stereotypes about unfamiliar cultures.", "Schools should replace cultural festivals with formal classroom lessons.", "Good festivals combine enjoyable experiences with meaningful cultural context.", "Cultural festivals should focus mainly on food and visible traditions."], "keyLetter": "C", "keyText": "Good festivals combine enjoyable experiences with meaningful cultural context.", "why": "Trích dẫn: “When that balance is achieved, a festival can become a starting point for genuine intercultural understanding.” — toàn bài nhấn mạnh sự cân bằng giữa trải nghiệm thú vị và ngữ cảnh văn hoá.", "distractors": ["D. trái với luận điểm đoạn 1", "A. tuyệt đối hoá (“inevitably”)", "B. trái với ý đoạn 3"], "kb": "Good festivals combine enjoyable experiences with meaningful cultural context.", "authored": false}, {"n": 34, "uid": 34, "part": "SECTION X – PARAPHRASE & DISTRACTOR CONTROL", "hd_fix": false, "prompt": "Original: ‘A festival may unintentionally reduce a complex culture to a few stereotypes.’ Best paraphrase:", "options": ["Only complex cultures are shown at festivals.", "A festival can sometimes oversimplify a culture without intending to do so.", "Festivals always provide complete cultural understanding.", "Every festival deliberately creates cultural stereotypes."], "keyLetter": "B", "keyText": "A festival can sometimes oversimplify a culture without intending to do so.", "why": "“Unintentionally” → “without intending to do so”; “reduce … to a few stereotypes” → “oversimplify”: diễn đạt lại chính xác cả hai ý.", "distractors": ["A. sai chủ thể logic", "C. trái nghĩa hoàn toàn", "D. “deliberately” trái với “unintentionally”"], "kb": "oversimplify without intending to.", "authored": false}, {"n": 35, "uid": 35, "part": "SECTION X – PARAPHRASE & DISTRACTOR CONTROL", "hd_fix": false, "prompt": "Original: ‘Enjoyment is still important because it encourages participation.’ Best paraphrase:", "options": ["Educational value becomes impossible when people enjoy an event.", "Enjoyment guarantees deep cultural understanding.", "Participation is possible only when an event is entertaining.", const PASSAGES={"SHORT CLOZE 1": "<p>Our school recently organised a cultural fair to help students learn about traditions from around the world. Each class represented a different country and prepared displays, food and performances. The event was designed to <b>(15)</b> ______ cultural awareness while giving students a chance to work collaboratively. Students were asked to research customs carefully <b>(16)</b> ______ their presentations would be accurate and respectful. Many visitors said the fair helped them <b>(17)</b> ______ a better understanding of cultures they had previously known little about. The more actively students participated, <b>(18)</b> ______ meaningful the experience became. At the end of the day, several groups agreed to keep in touch with their exchange partners, which could help maintain the cultural <b>(19)</b> ______ they had begun.</p>", "SHORT CLOZE 2": "<p>Food is often one of the first things people notice about another culture. Traditional dishes can express history, geography and family customs. However, cuisine is not fixed. When people migrate or travel, recipes may change to <b>(20)</b> ______ local tastes or available ingredients. These changes do not necessarily destroy cultural identity. <b>(21)</b> ______, they can create new versions of a dish while preserving its connection to a community. For this reason, cultural identity is better understood as something that can be maintained while also <b>(22)</b> ______. People who learn about the background of a dish are also less likely to reduce an entire culture <b>(23)</b> ______ a single food image.</p>", "PASSAGE COMPLETION": "<p>Cultural festivals can do more than entertain visitors. They can introduce people to unfamiliar customs in an accessible way. <b>(24)</b> ______. Without such context, a festival may unintentionally reduce a complex culture to a few attractive images. Schools can reduce this risk by combining performances with research, interviews and short explanations. <b>(25)</b> ______. This approach allows students to enjoy the event while also understanding the values and history behind it.</p>", "READING TRANSFER": "<p>Cultural festivals are often praised for bringing people together, but their educational value depends on how they are designed. Food, music and clothing can attract attention quickly because they are visible and enjoyable. Yet a culture cannot be fully understood through these features alone. If visitors are shown only a few colourful examples, they may leave with stronger stereotypes rather than deeper knowledge.</p><p>More thoughtful events create opportunities for explanation and interaction. A student may taste a traditional dish, for instance, and then learn how the recipe changed as families moved between regions. Another activity may compare the role of traditional clothing in ceremonies and everyday life. These details show that cultural practices are connected to history, place and social meaning.</p><p>This does not mean that every festival must become a formal lesson. Enjoyment is still important because it encourages participation. The challenge is to combine an attractive experience with enough context for visitors to ask better questions. When that balance is achieved, a festival can become a starting point for genuine intercultural understanding.</p>"};

function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
