 while still ______ distinctive local features.", "options": ["removing", "refusing", "measuring", "retaining"], "keyLetter": "D", "keyText": "retaining", "why": "“while still” + V-ing song song với may change; retaining distinctive local features = vẫn giữ lại đặc điểm địa phương.", "distractors": ["removing trái nghĩa (loại bỏ).", "refusing sai nghĩa (từ chối).", "measuring sai nghĩa (đo đạc)."], "kb": "retain = giữ lại.", "authored": false}, {"n": 11, "uid": 11, "part": "", "hd_fix": false, "prompt": "Joining ______ cultural exchange programme can be a valuable experience.", "options": ["Ø", "an", "a", "the"], "keyLetter": "C", "keyText": "a", "why": "Danh từ đếm được số ít lần đầu nhắc đến, bắt đầu bằng phụ âm “cultural” → a.", "distractors": ["an sai vì “cultural” là phụ âm.", "the sai vì chưa xác định.", "Ø sai vì danh từ đếm được số ít cần mạo từ."], "kb": "lần đầu + phụ âm → a.", "authored": false}, {"n": 12, "uid": 12, "part": "", "hd_fix": false, "prompt": "______ programme our school joined last year included students from five countries.", "options": ["The", "Ø", "An", "A"], "keyLetter": "A", "keyText": "The", "why": "Mệnh đề quan hệ “our school joined last year” xác định programme → the.", "distractors": ["A. sai vì đã xác định.", "An sai vì đã xác định.", "Ø sai vì đã xác định."], "kb": "xác định bởi mệnh đề → the.", "authored": false}, {"n": 13, "uid": 13, "part": "", "hd_fix": false, "prompt": "______ cultural diversity can enrich a community.", "options": ["Ø", "An", "The", "A"], "keyLetter": "A", "keyText": "Ø", "why": "Danh từ trừu tượng cultural diversity nói chung → không mạo từ (Ø).", "distractors": ["D. sai vì danh từ trừu tượng nói chung.", "An sai vì danh từ trừu tượng nói chung.", "The sai vì danh từ trừu tượng nói chung."], "kb": "trừu tượng nói chung → Ø.", "authored": false}, {"n": 14, "uid": 14, "part": "", "hd_fix": false, "prompt": "She hopes to study in ______ United States next year.", "options": ["Ø", "a", "an", "the"], "keyLetter": "D", "keyText": "the", "why": "Tên quốc gia số nhiều (States) → the United States.", "distractors": ["a sai với tên quốc gia số nhiều.", "an sai với tên quốc gia số nhiều.", "Ø sai với tên quốc gia số nhiều."], "kb": "tên quốc gia số nhiều → the.", "authored": false}, {"n": 15, "uid": 15, "part": "", "hd_fix": false, "prompt": "They visited ______ Lake Baikal during the trip.", "options": ["the", "an", "a", "Ø"], "keyLetter": "D", "keyText": "Ø", "why": "Tên hồ (Lake + tên riêng) → không mạo từ.", "distractors": ["C. sai với tên hồ riêng.", "An sai với tên hồ riêng.", "The sai với tên hồ riêng."], "kb": "Lake + tên riêng → Ø.", "authored": false}, {"n": 16, "uid": 16, "part": "", "hd_fix": false, "prompt": "We attended ______ international festival in the city centre.", "options": ["Ø", "an", "a", "the"], "keyLetter": "B", "keyText": "an", "why": "Lần đầu nhắc, “international” phát âm nguyên âm /ɪ/ → an.", "distractors": ["a sai vì “international” là nguyên âm.", "the sai vì lần đầu nhắc.", "Ø sai vì danh từ đếm được số ít cần mạo từ."], "kb": "nguyên âm + lần đầu → an.", "authored": false}, {"n": 17, "uid": 17, "part": "", "hd_fix": false, "prompt": "______ festival attracted more than 2,000 visitors.", "options": ["Ø", "A", "An", "The"], "keyLetter": "D", "keyText": "The", "why": "Ngữ cảnh ám chỉ lễ hội đã xác định (với con số 2,000 visitors) → the.", "distractors": ["D. sai vì đã xác định.", "An sai vì đã xác định.", "Ø sai vì đã xác định."], "kb": "ngữ cảnh xác định → the.", "authored": false}, {"n": 18, "uid": 18, "part": "", "hd_fix": false, "prompt": "______ culture can influence how people interpret everyday behaviour.", "options": ["The", "An", "Ø", "A"], "keyLetter": "C", "keyText": "Ø", "why": "Danh từ trừu tượng culture nói chung → Ø.", "distractors": ["D. sai vì danh từ trừu tượng nói chung.", "An sai vì danh từ trừu tượng nói chung.", "The sai vì danh từ trừu tượng nói chung."], "kb": "trừu tượng nói chung → Ø.", "authored": false}, {"n": 19, "uid": 19, "part": "", "hd_fix": false, "prompt": "The exhibition focuses on music from ______ Philippines.", "options": ["the", "a", "Ø", "an"], "keyLetter": "A", "keyText": "the", "why": "Tên quốc gia số nhiều (Philippines) → the Philippines.", "distractors": ["a sai với tên quốc gia số nhiều.", "an sai với tên quốc gia số nhiều.", "Ø sai với tên quốc gia số nhiều."], "kb": "tên quốc gia số nhiều → the.", "authored": false}, {"n": 20, "uid": 20, "part": "", "hd_fix": false, "prompt": "They climbed ______ Mount Fuji during the summer holiday.", "options": ["the", "an", "a", "Ø"], "keyLetter": "D", "keyText": "Ø", "why": "Tên ngọn núi đơn lẻ (Mount + tên riêng) → không mạo từ.", "distractors": ["C. sai với tên núi riêng.", "An sai với tên núi riêng.", "The sai với tên núi riêng."], "kb": "Mount + tên riêng → Ø.", "authored": false}, {"n": 21, "uid": 21, "part": "CLOZE – MIXED LANGUAGE", "hd_fix": false, "prompt": "Blank (21)", "options": ["an", "the", "Ø", "a"], "keyLetter": "A", "keyText": "an", "why": "“international” phát âm nguyên âm /ɪ/, danh từ đếm được số ít lần đầu → an.", "distractors": ["a sai vì nguyên âm.", "the sai vì lần đầu nhắc.", "Ø sai vì danh từ đếm được số ít."], "kb": "an + nguyên âm.", "authored": false}, {"n": 22, "uid": 22, "part": "CLOZE – MIXED LANGUAGE", "hd_fix": false, "prompt": "Blank (22)", "options": ["Similarly", "However", "Therefore", "For example"], "keyLetter": "B", "keyText": "However", "why": "Câu trước nêu khó khăn (culture shock, routines unfamiliar); câu sau bồi đắp lý do giúp thích nghi → nhượng bộ/tương phản: However.", "distractors": ["Therefore sai vì không có quan hệ kết quả.", "For example cần ví dụ cụ thể.", "Similarly cần ý tương tự."], "kb": "However = tuy nhiên.", "authored": false}, {"n": 23, "uid": 23, "part": "CLOZE – MIXED LANGUAGE", "hd_fix": false, "prompt": "Blank (23)", "options": ["asked", "to ask", "ask", "asking"], "keyLetter": "B", "keyText": "to ask", "why": "Cấu trúc: be encouraged + to + V.", "distractors": ["ask (V0) sai sau encouraged.", "asking (V-ing) sai.", "asked (V3) sai."], "kb": "encourage sb to do sth.", "authored": false}, {"n": 24, "uid": 24, "part": "CLOZE – MIXED LANGUAGE", "hd_fix": false, "prompt": "Blank (24)", "options": ["awarely", "awaring", "aware", "awareness"], "keyLetter": "D", "keyText": "awareness", "why": "Sau cultural cần danh từ: cultural awareness.", "distractors": ["aware là tính từ, sai từ loại.", "awaring không phải dạng chuẩn.", "awarely không tồn tại."], "kb": "cultural + N.", "authored": false}, {"n": 25, "uid": 25, "part": "CLOZE – MIXED LANGUAGE", "hd_fix": false, "prompt": "Blank (25)", "options": ["Ø", "the", "most", "a"], "keyLetter": "B", "keyText": "the", "why": "Cấu trúc so sánh đôi: the more… the more… (the more actively they participate, the more they are likely to learn).", "distractors": ["a sai cấu trúc.", "most không đi với “the more…” trong cấu trúc đôi.", "Ø thiếu mạo từ của cấu trúc đôi."], "kb": "The more …, the more …", "authored": false}, {"n": 26, "uid": 26, "part": "CLOZE – GLOBALISATION", "hd_fix": false, "prompt": "Blank (26)", "options": ["to", "at", "with", "for"], "keyLetter": "A", "keyText": "to", "why": "Cấu trúc: expose + O + to + N.", "distractors": ["expose for sai giới từ.", "expose with sai giới từ.", "expose at sai giới từ."], "kb": "expose sb to sth.", "authored": false}, {"n": 27, "uid": 27, "part": "CLOZE – GLOBALISATION", "hd_fix": false, "prompt": "Blank (27)", "options": ["with", "for", "in", "to"], "keyLetter": "C", "keyText": "in", "why": "Cấu trúc: result in + N.", "distractors": ["result to sai giới từ.", "result for sai giới từ.", "result with sai giới từ."], "kb": "result in sth.", "authored": false}, {"n": 28, "uid": 28, "part": "CLOZE – GLOBALISATION", "hd_fix": false, "prompt": "Blank (28)", "options": ["For example", "Otherwise", "However", "Despite"], "keyLetter": "A", "keyText": "For example", "why": "Câu trước khẳng định hybird forms (combine outside influences with traditions); câu sau đưa ví dụ cụ thể (a modern clothing style may include traditional patterns) → For example.", "distractors": ["However sai vì không tương phản.", "Otherwise sai quan hệ.", "Despite sai quan hệ."], "kb": "For example = ví dụ như.", "authored": false}, {"n": 29, "uid": 29, "part": "CLOZE – GLOBALISATION", "hd_fix": false, "prompt": "Blank (29)", "options": ["retained", "to retaining", "retaining", "retain"], "keyLetter": "C", "keyText": "retaining", "why": "Sau “while still” dùng V-ing song song với câu trước: while still retaining distinctive local features.", "distractors": ["retain (V0) sai sau while.", "retained (V3) sai.", "to retaining sai cấu trúc."], "kb": "while + V-ing.", "authored": false}, {"n": 30, "uid": 30, "part": "PASSAGE COMPLETION", "hd_fix": false, "prompt": "Choose the best sentence for blank (30).", "options": ["Cultural knowledge becomes unreliable whenever individual behaviour differs.", "However, cultural behaviour is often more varied than simple rules suggest.", "Cultural rules usually apply in the same way to every individual.", "National cultural rules are usually enough to prevent common stereotypes."], "keyLetter": "B", "keyText": "However, cultural behaviour is often more varied than simple rules suggest.", "why": "Trước chỗ trống định nghĩa cultural knowledge = memorising rules; sau chỗ trống: Individuals may behave differently → câu chuyển bằng However nêu ý behaviour varied: B.", "distractors": ["C. trái ý (rules apply same way).", "A. thêm “unreliable whenever” sai.", "D. thu hẹp thành national rules đủ ngăn stereotypes, trái ý."], "kb": "However: chuyển từ định nghĩa đơn giản → thực tế phức tạp.", "authored": false}, {"n": 31, "uid": 31, "part": "PASSAGE COMPLETION", "hd_fix": false, "prompt": "Choose the best sentence for blank (31).", "options": ["Effective communication requires observation only when cultural knowledge is unavailable.", "Effective communication mainly requires knowledge of national cultural rules.", "Effective communication can rely on cultural rules to predict individual behaviour.", "Effective communication also requires observation, questions and attention to individuals."], "keyLetter": "D", "keyText": "Effective communication also requires observation, questions and attention to individuals.", "why": "Sau chỗ trống là “This combination” → câu trước phải liệt kê kết hợp: observation + questions + attention to individuals: D.", "distractors": ["B. thu hẹp thành knowledge of national rules.", "A. thu hẹp observation thành only when.", "C. thu hẹp thành rely on rules to predict."], "kb": "“This combination” quy chiếu kết hợp vừa nêu.", "authored": false}, {"n": 32, "uid": 32, "part": "", "hd_fix": false, "prompt": "Choose the best order.<br>a. It’s a pleasure to meet you, Ms Lee.<br>b. Nam, I’d like you to meet Ms Lee, our exchange coordinator.<br>c. Pleased to meet you too, Nam.", "options": ["b – c – a", "c – b – a", "b – a – c", "a – b – c"], "keyLetter": "C", "keyText": "b – a – c", "why": "b giới thiệu Nam với Ms Lee; a là Nam chào Ms Lee; c là Ms Lee đáp “Nam” → b–a–c.", "distractors": ["D. mở bằng lời chào khi chưa giới thiệu.", "A. đảo lượt chào và đáp.", "B. mở bằng lời đáp “too”."], "kb": "Bám dãy tên như L7.", "authored": false}, {"n": 33, "uid": 33, "part": "", "hd_fix": false, "prompt": "Choose the best order.<br>a. This gave students a chance to ask more specific questions.<br>b. The school first introduced basic ideas about avoiding cultural stereotypes.<br>c. Students then worked with exchange partners on a shared project.<br>d. As a result, some of their initial assumptions became less rigid.", "options": ["b – c – a – d", "c – b – d – a", "d – c – b – a", "b – a – c – d"], "keyLetter": "A", "keyText": "b – c – a – d", "why": "b dùng first mở đầu tiến trình; c dùng then tiếp nối; a là “This” hệ quả của project (chance to ask questions); d dùng As a result nêu kết quả cuối (assumptions less rigid) → b–c–a–d.", "distractors": ["B. mở bằng “then”.", "D. đặt a trước c, đảo hệ quả và nguyên nhân.", "C. mở bằng kết luận As a result."], "kb": "Mạch: first → then → This → As a result.", "authored": false}, {"n": 34, "uid": 34, "part": "", "hd_fix": false, "prompt": "Choose the best order.<br>a. So we’ll keep the food stalls but add information cards beside each dish.<br>b. International food stalls would attract visitors.<br>c. Good idea, but the event should be educational as well as enjoyable.<br>d. Then each card could explain the dish’s origin and cultural meaning.", "options": ["b – d – c – a", "c – b – a – d", "d – b – c – a", "b – c – a – d"], "keyLetter": "D", "keyText": "b – c – a – d", "why": "b đề xuất food stalls; c đáp “Good idea, but… educational”; a quyết định “So we’ll keep… but add information cards”; d triển khai Then each card… → b–c–a–d.", "distractors": ["B. mở bằng lời đáp “Good idea” khi chưa có đề xuất.", "A. đặt d trước khi info cards được đề xuất ở a.", "C. mở bằng “Then” khi chưa có tiền đề."], "kb": "Mạch: đề xuất → đáp → quyết → triển khai.", "authored": false}, {"n": 35, "uid": 35, "part": "READING TRANSFER 1", "hd_fix": false, "prompt": "What is the main idea of paragraph 1?", "options": ["Cultural facts are useful but not sufficient for effective communication.", "Cultural facts should be avoided when learning about other countries.", "Cultural facts can reliably predict how individuals are likely to behave.", "Cultural facts are generally too unreliable for effective communication."], "keyLetter": "A", "keyText": "Cultural facts are useful but not sufficient for effective communication.", "why": "Trích dẫn: “Facts can be useful, but they are only one part of effective intercultural communication.” → ý chính đoạn 1.", "distractors": ["D. dùng “too unreliable”, sai mức độ.", "B. nói should be avoided, trái ý.", "C. nói reliably predict, trái ý."], "kb": "Main idea = câu tổng quát bao trùm đoạn.", "authored": false}, {"n": 36, "uid": 36, "part": "READING TRANSFER 1", "hd_fix": false, "prompt": "The word “pattern” in paragraph 1 refers to ______.", "options": ["a regular schedule commonly followed by international visitors", "a common form of behaviour expected within a culture", "a repeated exercise commonly used in language learning", "a traditional design commonly used in cultural clothing"], "keyLetter": "B", "keyText": "a common form of behaviour expected within a culture", "why": "Trích dẫn: “A visitor may know that a particular behaviour is common in a country and still meet individuals who do not follow that pattern.” → “pattern” = mẫu hành vi chung kỳ vọng trong một nền văn hoá.", "distractors": ["D. thu hẹp thành hoạ tiết quần áo.", "C. thu hẹp thành bài tập lặp lại.", "A. thu hẹp thành lịch trình."], "kb": "pattern = mẫu hành vi chung.", "authored": false}, {"n": 37, "uid": 37, "part": "READING TRANSFER 1", "hd_fix": false, "prompt": "Why does the writer mention regions, generations, families and social groups?", "options": ["To explain how tourism creates variation among cultural groups", "To compare different types of populations within a society", "To illustrate different sources of variation within a culture", "To suggest that cultural background has little effect on behaviour"], "keyLetter": "C", "keyText": "To illustrate different sources of variation within a culture", "why": "Trích dẫn: “This approach is especially important because cultural practices may vary across regions, generations, families and social groups.” → nhắc đến để minh hoạ variation trong cùng một nền văn hoá.", "distractors": ["D. trái ý (vẫn ảnh hưởng).", "B. thu hẹp thành so sánh nhóm dân.", "A. thêm ý tourism."], "kb": "Purpose: liệt kê để minh hoạ variation.", "authored": false}, {"n": 38, "uid": 38, "part": "READING TRANSFER 1", "hd_fix": false, "prompt": "The phrase “This approach” refers to ______.", "options": ["avoiding general cultural knowledge when individual behaviour differs", "drawing immediate conclusions from familiar patterns of cultural behaviour", "combining cultural knowledge with observation and careful questioning", "applying general cultural knowledge to every individual consistently"], "keyLetter": "C", "keyText": "combining cultural knowledge with observation and careful questioning", "why": "Trích dẫn: “More effective communication combines background knowledge with observation and curiosity. … This approach is especially important…” → “This approach” = kết hợp kiến thức + quan sát + hỏi cẩn trọng.", "distractors": ["D. thu hẹp thành apply knowledge to every individual.", "A. thu hẹp thành avoiding knowledge.", "B. thu hẹp thành drawing immediate conclusions."], "kb": "“This approach” quy chiếu phương pháp vừa nêu.", "authored": false}, {"n": 39, "uid": 39, "part": "READING TRANSFER 1", "hd_fix": false, "prompt": "Which can be inferred?", "options": ["Cultural information should be avoided when interpreting individual behaviour.", "Cultural background has little connection with how individuals actually behave.", "Cultural rules become more reliable when people learn a greater number of them.", "Cultural information provides useful context but cannot predict every individual."], "keyLetter": "D", "keyText": "Cultural information provides useful context but cannot predict every individual.", "why": "Trích dẫn: “It means cultural information should help people form better questions, not automatic conclusions.” → information = context hữu ích, không dự đoán được mọi cá nhân.", "distractors": ["A. trái ý (should be avoided).", "B. trái ý (little connection).", "C. thêm ý more rules = more reliable."], "kb": "Inference có biên từ đoạn 3.", "authored": false}, {"n": 40, "uid": 40, "part": "READING TRANSFER 1", "hd_fix": false, "prompt": "Best title?", "options": ["Why Individual Behaviour Follows Fixed Cultural Rules", "Cultural Identity and Behaviour in a Changing Society", "Why Cultural Knowledge Often Leads to Misunderstanding", "Cultural Competence: Knowledge Without Stereotyping"], "keyLetter": "D", "keyText": "Cultural Competence: Knowledge Without Stereotyping", "why": "Trích dẫn: “The goal is to become more accurate and flexible, not to replace one stereotype with another.” → toàn bài về cultural competence mà không định kiến.", "distractors": ["C. đảo ý (hầu như dẫn đến misunderstanding).", "A. thu hẹp thành behaviour theo fixed rules.", "B. thu hẹp thành identity/change."], "kb": "Title = bao trùm phương pháp + mục tiêu.", "authored": false}, {"n": 41, "uid": 41, "part": "READING TRANSFER 2", "hd_fix": false, "prompt": "The word “distinctive” is closest in meaning to ______.", "options": ["strongly influenced by international cultural trends", "likely to disappear within a relatively short time", "closely associated with mainly commercial activities", "clearly different or characteristic in some way"], "keyLetter": "D", "keyText": "clearly different or characteristic in some way", "why": "Trích dẫn: “These adaptations can create forms that are both globally connected and locally distinctive.” → distinctive = clearly different or characteristic.", "distractors": ["A. thêm ý influenced by trends.", "B. thêm ý disappear soon.", "C. thêm ý commercial."], "kb": "distinctive = đặc trưng.", "authored": false}, {"n": 42, "uid": 42, "part": "READING TRANSFER 2", "hd_fix": false, "prompt": "According to paragraph 2, what may communities do with outside influences?", "options": ["Reject outside influences that differ from existing local customs.", "Copy outside influences without changing their original features.", "Adapt outside influences to make them fit local contexts.", "Remove local features when adopting styles from other cultures."], "keyLetter": "C", "keyText": "Adapt outside influences to make them fit local contexts.", "why": "Trích dẫn: “Local communities frequently modify outside influences. A restaurant may change a recipe to match regional tastes…” → adapt để fit local contexts.", "distractors": ["A. trái ý (reject).", "B. trái ý (copy without changing).", "D. trái ý (remove local features)."], "kb": "Para 2: modify = adapt.", "authored": false}, {"n": 43, "uid": 43, "part": "READING TRANSFER 2", "hd_fix": false, "prompt": "What is the writer’s main purpose in paragraph 3?", "options": ["To explain how economic factors determine patterns of global cultural exchange.", "To suggest that globalisation generally protects traditional cultural practices.", "To encourage more precise questions about the effects of cultural change.", "To argue that cultural change generally harms communities and traditions."], "keyLetter": "C", "keyText": "To encourage more precise questions about the effects of cultural change.", "why": "Trích dẫn: “A more useful question is what is preserved, who benefits from the change, and whether the people connected with a tradition receive recognition.” → mục đích: khuyến khích đặt câu hỏi chính xác hơn về tác động của cultural change.", "distractors": ["D. trái ý (harms).", "B. trái ý (protects).", "A. thêm ý economic factors."], "kb": "Purpose: câu hỏi tốt hơn cho cultural change.", "authored": false}, {"n": 44, "uid": 44, "part": "READING TRANSFER 2", "hd_fix": false, "prompt": "Which statement is NOT supported?", "options": ["Global contact can make cultural products more widely accessible.", "Visible similarity proves that local cultural identity has disappeared.", "Local adaptation can combine global influences with local features.", "Cultural change has occurred through different forms of contact."], "keyLetter": "B", "keyText": "Visible similarity proves that local cultural identity has disappeared.", "why": "Trích dẫn: “…but visible similarity does not necessarily mean cultural identity has disappeared.” → C bác bỏ trực tiếp ý đoạn 1.", "distractors": ["A. có trong bài (“made cultural products easier to access”).", "C. có trong bài (đoạn 2).", "D. có trong bài (“cultures have always changed”)."], "kb": "NOT supported = ý bị bác bỏ trong bài.", "authored": false}, {"n": 45, "uid": 45, "part": "READING TRANSFER 2", "hd_fix": false, "prompt": "Best paraphrase of “visible similarity does not necessarily mean cultural identity has disappeared”?", "options": ["Visible similarities can exist without removing all distinctive cultural features.", "Visible similarities eventually cause communities to lose their local identities.", "Visible similarities show that different cultures have become essentially identical.", "Visible similarities have no influence at all on local cultural identities."], "keyLetter": "A", "keyText": "Visible similarities can exist without removing all distinctive cultural features.", "why": "Câu gốc phủ định “not necessarily mean”; B giữ ý: similarities can exist without removing all distinctive features.", "distractors": ["C. biến similarities thành essentially identical.", "B. biến thành cause lose identities.", "D. biến thành no influence at all."], "kb": "“not necessarily” = không nhất thiết.", "authored": false}, {"n": 46, "uid": 46, "part": "READING TRANSFER 2", "hd_fix": false, "prompt": "What can be inferred?", "options": ["Source recognition has little importance when cultures exchange their traditions.", "Globalisation has broadly similar cultural effects across different communities.", "Globalisation should be assessed through context rather than absolute conclusions.", "Local communities have limited ability to adapt influences from other cultures."], "keyLetter": "C", "keyText": "Globalisation should be assessed through context rather than absolute conclusions.", "why": "Trích dẫn: “Such questions encourage a more careful understanding of globalisation than the simple claim that it either destroys or protects culture.” → đánh giá qua context, không kết luận tuyệt đối.", "distractors": ["B. thêm ý similar effects.", "D. trái ý (limited ability).", "A. trái ý (little importance)."], "kb": "Inference có biên từ đoạn 3.", "authored": false}, {"n": 47, "uid": 47, "part": "", "hd_fix": false, "prompt": "The event celebrates cultural ______.", "options": ["diversity", "diversify", "diversely", "diverse"], "keyLetter": "A", "keyText": "diversity", "why": "Sau tính từ cultural cần danh từ: diversity.", "distractors": ["diverse là tính từ, sai từ loại.", "diversely là trạng từ, sai từ loại.", "diversify là động từ, sai từ loại."], "kb": "cultural + N.", "authored": false}, {"n": 48, "uid": 48, "part": "", "hd_fix": false, "prompt": "We attended ______ international festival last weekend.", "options": ["the", "a", "an", "Ø"], "keyLetter": "C", "keyText": "an", "why": "“international” phát âm nguyên âm /ɪ/, danh từ số ít lần đầu → an.", "distractors": ["a sai vì nguyên âm.", "the sai vì lần đầu nhắc.", "Ø sai vì danh từ đếm được số ít."], "kb": "an + nguyên âm.", "authored": false}, {"n": 49, "uid": 49, "part": "", "hd_fix": false, "prompt": "We attended an international festival last weekend. ______ festival was held in the city centre.", "options": ["The", "An", "A", "Ø"], "keyLetter": "A", "keyText": "The", "why": "Festival vừa được nhắc ở câu trước → đã xác định → The.", "distractors": ["C. sai vì nhắc lần thứ hai.", "An sai vì nhắc lần thứ hai.", "Ø sai vì nhắc lần thứ hai."], "kb": "lần 2 → the.", "authored": false}, {"n": 50, "uid": 50, "part": "", "hd_fix": false, "prompt": "Students are encouraged ______ an open mind.", "options": ["kept", "to keep", "keeping", "keep"], "keyLetter": "B", "keyText": "to keep", "why": "Cấu trúc: be encouraged + to + V.", "distractors": ["keep (V0) sai sau encouraged.", "keeping (V-ing) sai.", "kept (V3) sai."], "kb": "encourage sb to do sth.", "authored": false}, {"n": 51, "uid": 51, "part": "", "hd_fix": false, "prompt": "The programme has ______ popularity among teenagers.", "options": ["performed", "risen", "made", "gained"], "keyLetter": "D", "keyText": "gained", "why": "Chunk: gain popularity (trở nên phổ biến).", "distractors": ["made sai chunk.", "performed sai chunk.", "risen sai chunk (rise = tăng, không đi với popularity làm tân ngữ)."], "kb": "gain popularity.", "authored": false}, {"n": 52, "uid": 52, "part": "", "hd_fix": false, "prompt": "The city is diverse. ______, some communities still have limited contact with one another.", "options": ["However", "Therefore", "Similarly", "For example"], "keyLetter": "A", "keyText": "However", "why": "Câu trước khẳng định đa dạng; câu sau giới hạn trái chiều (still limited contact) → However.", "distractors": ["Therefore sai vì không có quan hệ kết quả.", "For example cần ví dụ cụ thể.", "Similarly cần ý tương tự."], "kb": "However = tuy nhiên.", "authored": false}, {"n": 53, "uid": 53, "part": "", "hd_fix": false, "prompt": "Original: “The practice may help preserve local identity.” Best paraphrase:", "options": ["The practice will protect every local tradition.", "The practice removes local identity.", "The practice could support the protection of local identity.", "Local identity is no longer important."], "keyLetter": "C", "keyText": "The practice could support the protection of local identity.", "why": "“may help preserve” giữ mức độ khả năng; C dùng “could support the protection of”, đúng mức độ và ý nghĩa.", "distractors": ["A. dùng “will protect every”, sai mức độ.", "D. thêm ý no longer important.", "B. đảo nghĩa (removes)."], "kb": "“may” ≠ “will”.", "authored": false}, {"n": 54, "uid": 54, "part": "", "hd_fix": false, "prompt": "“This” in “The school launched an exchange programme. This helped students...” refers to ______.", "options": ["the school only", "students", "help", "the launch/programme initiative"], "keyLetter": "D", "keyText": "the launch/programme initiative", "why": "“This” quy chiếu hành động “launched an exchange programme” → việc launch / sáng kiến chương trình.", "distractors": ["the school only chỉ chủ thể.", "students chỉ đối tượng nhận.", "help là động từ ở câu sau, không phải antecedent."], "kb": "“This” quy chiếu cả mệnh đề/hành động trước.", "authored": false}, {"n": 55, "uid": 55, "part": "", "hd_fix": false, "prompt": "Inference requires ______.", "options": ["outside knowledge first", "absolute certainty", "evidence plus a minimum justified leap", "the longest option"], "keyLetter": "C", "keyText": "evidence plus a minimum justified leap", "why": "Inference = số liệu trong bài + bước nhảy có cơ sở tối thiểu.", "distractors": ["outside knowledge trái quy tắc.", "the longest option không liên quan.", "absolute certainty trái ý inference (chỉ là suy đoán có cản cứ)."], "kb": "Inference = evidence + minimal leap.", "authored": false}, {"n": 56, "uid": 56, "part": "", "hd_fix": false, "prompt": "Which sequence best orders a formal introduction?", "options": ["introduction → greeting/response → reciprocal response", "response → introduction → response", "decision → question → introduction", "example → conclusion → greeting"], "keyLetter": "A", "keyText": "introduction → greeting/response → reciprocal response", "why": "Format giới thiệu trang trọng: introduction (giới thiệu) → greeting/response (chào/đáp) → reciprocal response (chào hồi).", "distractors": ["B. đảo introduction và response đầu tiên.", "C. lạc đề (decision/question).", "D. lạc đề (example/conclusion)."], "kb": "Format chào hỏi trang trọng trong bài.", "authored": false}, {"n": 57, "uid": 57, "part": "", "hd_fix": false, "prompt": "Best relation: “The event was expensive. ______, it attracted many visitors.”", "options": ["However", "Likewise", "For example", "Therefore"], "keyLetter": "A", "keyText": "However", "why": "Câu trước nêu đắt; câu sau nêu vẫn thu hút → nhượng bộ/tương phản: However.", "distractors": ["Therefore sai vì không có quan hệ kết quả.", "For example cần ví dụ cụ thể.", "Likewise cần ý tương tự."], "kb": "However = tuy nhiên.", "authored": false}, {"n": 58, "uid": 58, "part": "", "hd_fix": false, "prompt": "Culture shock can be reduced by ______ local norms.", "options": ["learn about", "learned about", "learning about", "to learning about"], "keyLetter": "C", "keyText": "learning about", "why": "Sau giới từ by dùng V-ing: by learning about.", "distractors": ["learn about (V0) sai sau by.", "learned about (V2) sai.", "to learning about sai cấu trúc."], "kb": "by + V-ing.", "authored": false}, {"n": 59, "uid": 59, "part": "", "hd_fix": false, "prompt": "Which is a scope error?", "options": ["keeping may as may", "keeping some as some", "changing may to could", "changing may to will"], "keyLetter": "D", "keyText": "changing may to will", "why": "Scope error = thay đổi mức độ/phạm vi: may (khả năng) → will (chắc chắn) là lỗi mức độ.", "distractors": ["may → could giữ mức độ khả năng.", "some → some không đổi phạm vi.", "may → may không đổi."], "kb": "Scope error = may → will.", "authored": false}, {"n": 60, "uid": 60, "part": "", "hd_fix": false, "prompt": "The more thoughtfully people engage with other cultures, ______ likely they are to rely on stereotypes.", "options": ["least", "the least", "the less", "less"], "keyLetter": "C", "keyText": "the less", "why": "Cấu trúc so sánh đôi: The more …, the less …", "distractors": ["less thiếu mạo từ the.", "least là so sánh nhất, sai.", "the least là so sánh nhất, sai."], "kb": "The more …, the more/less …", "authored": false}, {"n": 61, "uid": 61, "part": "", "hd_fix": false, "prompt": "Which is the strongest reading rule?", "options": ["Repeated keyword means correct.", "Longest option is safest.", "Evidence before answer.", "Outside knowledge decides."], "keyLetter": "C", "keyText": "Evidence before answer.", "why": "Quy tắc đọc mạnh nhất của bài: Evidence before answer.", "distractors": ["Repeated keyword là bẫy word-for-word.", "Outside knowledge trái quy tắc.", "Longest option không liên quan."], "kb": "Evidence first.", "authored": false}, {"n": 62, "uid": 62, "part": "", "hd_fix": false, "prompt": "Which paraphrase rule is strongest?", "options": ["Add useful background.", "Keep only keywords.", "No add – no drop – no distort.", "Change every word."], "keyLetter": "C", "keyText": "No add – no drop – no distort.", "why": "Quy tắc paraphrase của bài: No add – no drop – no distort.", "distractors": ["Change every word sai vì mất nghĩa.", "Add useful background sai (thêm ý).", "Keep only keywords sai (bỏ ý)."], "kb": "No add – no drop – no distort.", "authored": false}, {"n": 63, "uid": 63, "part": "", "hd_fix": false, "prompt": "Which sentence uses careful cultural language?", "options": ["People in some contexts may follow this practice.", "That culture always does this.", "Everyone from that country behaves the same.", "All visitors experience identical culture shock."], "keyLetter": "A", "keyText": "People in some contexts may follow this practice.", "why": "Careful cultural language = tránh tuyệt đối hoá: “in some contexts… may…”.", "distractors": ["Everyone… behaves the same tuyệt đối hoá.", "always tuyệt đối hoá.", "All… identical tuyệt đối hoá."], "kb": "Ngôn ngữ cẩn trọng = không tuyệt đối hoá.", "authored": false}, {"n": 64, "uid": 64, "part": "", "hd_fix": false, "prompt": "Which is the best response to “Why don’t we add culture booths?”", "options": ["That could work. They could give visitors more context.", "Culture booths are usually made of wood or metal.", "I attended a culture booth at another school last year.", "The exchange coordinator arrived at eight o’clock."], "keyLetter": "A", "keyText": "That could work. They could give visitors more context.", "why": "“Why don’t we…?” là đề xuất → đáp đồng ý + cộng giá trị (could work + give context): B.", "distractors": ["C. lạc đề (kể kinh nghiệm cá nhân).", "B. lạc đề (mô tả chất liệu).", "D. lạc đề (giờ coordinator đến)."], "kb": "“Why don’t we” = đề xuất.", "authored": false}, {"n": 65, "uid": 65, "part": "", "hd_fix": false, "prompt": "Which option best completes: “A trend can become popular. ______, popularity does not prove that every person follows it.”", "options": ["For example", "Similarly", "However", "Therefore"], "keyLetter": "C", "keyText": "However", "why": "Câu trước khẳng định trend phổ biến; câu sau bổ sung giới hạn ngược chiều (popularity does not prove…) → However.", "distractors": ["Therefore sai vì không có quan hệ kết quả.", "For example cần ví dụ cụ thể.", "Similarly cần ý tương tự."], "kb": "However = tuy nhiên.", "authored": false}]} ,"p3":{"title":"PHẦN 3 — CỦNG CỐ","desc":"20 câu trắc nghiệm củng cố","questions":[{"n": 1, "uid": 1, "part": "", "hd_fix": false, "prompt": "The programme has gained widespread ______ among teenagers.", "options": ["popularly", "popularity", "popularise", "popular"], "keyLetter": "B", "keyText": "popularity", "why": "Sau tính từ widespread cần danh từ: popularity.", "distractors": ["popular là tính từ, sai từ loại.", "popularly là trạng từ, sai từ loại.", "popularise là động từ, sai từ loại."], "kb": "gain + popularity.", "authored": false}, {"n": 2, "uid": 2, "part": "", "hd_fix": false, "prompt": "Students should show respect ______ cultural differences.", "options": ["for", "with", "at", "to"], "keyLetter": "A", "keyText": "for", "why": "Chunk: show respect for + N.", "distractors": ["“show respect at” sai.", "“show respect to” sai.", "“show respect with” sai."], "kb": "show respect for sth.", "authored": false}, {"n": 3, "uid": 3, "part": "", "hd_fix": false, "prompt": "Exchange activities can broaden cultural ______.", "options": ["awaring", "awareness", "aware", "awarely"], "keyLetter": "B", "keyText": "awareness", "why": "Sau tính từ cultural cần danh từ: awareness.", "distractors": ["aware là tính từ, sai từ loại.", "awarely không tồn tại.", "awaring không phải dạng chuẩn."], "kb": "cultural + N.", "authored": false}, {"n": 4, "uid": 4, "part": "", "hd_fix": false, "prompt": "Companies often adapt products to ______ local tastes.", "options": ["turn into", "cater to", "run out", "take off"], "keyLetter": "B", "keyText": "cater to", "why": "Chunk: cater to local tastes.", "distractors": ["run out = cạn kiệt, sai nghĩa.", "take off = cất cánh, sai nghĩa.", "turn into = biến thành, sai nghĩa."], "kb": "cater to = đáp ứng.", "authored": false}, {"n": 5, "uid": 5, "part": "", "hd_fix": false, "prompt": "We joined ______ international exchange programme.", "options": ["a", "Ø", "the", "an"], "keyLetter": "D", "keyText": "an", "why": "“international” phát âm nguyên âm /ɪ/ → an.", "distractors": ["a sai vì nguyên âm.", "the sai vì lần đầu nhắc.", "Ø sai vì danh từ đếm được số ít."], "kb": "an + nguyên âm.", "authored": false}, {"n": 6, "uid": 6, "part": "", "hd_fix": false, "prompt": "______ cultural diversity can enrich society.", "options": ["Ø", "A", "The", "An"], "keyLetter": "A", "keyText": "Ø", "why": "Danh từ trừu tượng nói chung → không mạo từ.", "distractors": ["B. sai vì danh từ trừu tượng nói chung.", "An sai vì danh từ trừu tượng nói chung.", "The sai vì danh từ trừu tượng nói chung."], "kb": "trừu tượng nói chung → Ø.", "authored": false}, {"n": 7, "uid": 7, "part": "", "hd_fix": false, "prompt": "She visited ______ Mount Fuji.", "options": ["a", "an", "Ø", "the"], "keyLetter": "C", "keyText": "Ø", "why": "Mount + tên riêng → không mạo từ.", "distractors": ["A. sai với tên núi riêng.", "An sai với tên núi riêng.", "The sai với tên núi riêng."], "kb": "Mount + tên riêng → Ø.", "authored": false}, {"n": 8, "uid": 8, "part": "", "hd_fix": false, "prompt": "Participants are encouraged ______ an open mind.", "options": ["keeping", "keep", "to keep", "kept"], "keyLetter": "C", "keyText": "to keep", "why": "be encouraged + to + V.", "distractors": ["keep (V0) sai.", "keeping (V-ing) sai.", "kept (V3) sai."], "kb": "encourage sb to do sth.", "authored": false}, {"n": 9, "uid": 9, "part": "", "hd_fix": false, "prompt": "Global contact can expose people ______ new cultural forms.", "options": ["with", "at", "to", "for"], "keyLetter": "C", "keyText": "to", "why": "expose + O + to + N.", "distractors": ["expose for sai giới từ.", "expose with sai giới từ.", "expose at sai giới từ."], "kb": "expose sb to sth.", "authored": false}, {"n": 10, "uid": 10, "part": "", "hd_fix": false, "prompt": "Adaptation does not necessarily result ______ identity loss.", "options": ["with", "at", "for", "in"], "keyLetter": "D", "keyText": "in", "why": "result in + N.", "distractors": ["result at sai giới từ.", "result for sai giới từ.", "result with sai giới từ."], "kb": "result in sth.", "authored": false}, {"n": 11, "uid": 11, "part": "", "hd_fix": false, "prompt": "The more carefully we observe, ______ likely we are to stereotype.", "options": ["less", "the least", "the less", "least"], "keyLetter": "C", "keyText": "the less", "why": "So sánh đôi: The more …, the less …", "distractors": ["less thiếu the.", "least là so sánh nhất, sai.", "the least là so sánh nhất, sai."], "kb": "The more …, the less …", "authored": false}, {"n": 12, "uid": 12, "part": "", "hd_fix": false, "prompt": "“Some people may follow this custom.” Which distorts the scope?", "options": ["Everyone follows it.", "Some people could follow it.", "A number of people may follow it.", "Certain people might follow it."], "keyLetter": "A", "keyText": "Everyone follows it.", "why": "Scope gốc: some + may (một số, có thể). B biến thành Everyone + follows (tất cả, chắc chắn) → distortion.", "distractors": ["D. giữ đúng scope (Certain ≈ some, might ≈ may).", "B. giữ đúng scope (could ≈ may).", "C. giữ đúng scope (A number of ≈ some)."], "kb": "Scope: some/may ≠ everyone/always.", "authored": false}, {"n": 13, "uid": 13, "part": "", "hd_fix": false, "prompt": "Best rule for inference:", "options": ["Repeated keyword wins.", "Choose longest option.", "Use outside knowledge.", "Evidence + minimum justified leap."], "keyLetter": "D", "keyText": "Evidence + minimum justified leap.", "why": "Inference = evidence + minimum justified leap.", "distractors": ["outside knowledge trái quy tắc.", "longest option không liên quan.", "repeated keyword là bẫy word-for-word."], "kb": "Evidence first.", "authored": false}, {"n": 14, "uid": 14, "part": "", "hd_fix": false, "prompt": "Cultural facts are useful, ______ they cannot predict every individual.", "options": ["similarly", "therefore", "however", "for example"], "keyLetter": "C", "keyText": "however", "why": "Câu trước khẳng định useful; câu sau giới hạn ngược chiều (cannot predict…) → however.", "distractors": ["therefore sai vì không có quan hệ kết quả.", "similarly cần ý tương tự.", "for example cần ví dụ cụ thể."], "kb": "However = tuy nhiên.", "authored": false}, {"n": 15, "uid": 15, "part": "", "hd_fix": false, "prompt": "“The school launched an exchange project. This improved cooperation.” “This” refers to ______.", "options": ["the launch/project initiative", "school only", "students only", "cooperation"], "keyLetter": "A", "keyText": "the launch/project initiative", "why": "“This” quy chiếu hành động launch / sáng kiến project.", "distractors": ["school only chỉ chủ thể.", "cooperation là kết quả ở câu sau.", "students only chưa được nhắc."], "kb": "“This” quy chiếu cả mệnh đề trước.", "authored": false}, {"n": 16, "uid": 16, "part": "", "hd_fix": false, "prompt": "Which is careful cultural language?", "options": ["Everyone behaves this way.", "This culture always does this.", "People in some contexts may follow this practice.", "All visitors react identically."], "keyLetter": "C", "keyText": "People in some contexts may follow this practice.", "why": "Careful cultural language = “in some contexts… may…”.", "distractors": ["Everyone = tuyệt đối hoá.", "always = tuyệt đối hoá.", "All… identically = tuyệt đối hoá."], "kb": "Ngôn ngữ cẩn trọng = không tuyệt đối hoá.", "authored": false}, {"n": 17, "uid": 17, "part": "", "hd_fix": false, "prompt": "Best paraphrase of “may preserve local identity”:", "options": ["removes local identity", "will protect every tradition", "guarantees no change", "could support local identity"], "keyLetter": "D", "keyText": "could support local identity", "why": "“may” = khả năng; “could support” giữ đúng mức độ.", "distractors": ["“will protect every” tuyệt đối hoá.", "“removes” đảo nghĩa.", "“guarantees” tuyệt đối hoá."], "kb": "“may” ≠ “will/guarantees”.", "authored": false}, {"n": 18, "uid": 18, "part": "", "hd_fix": false, "prompt": "“distinctive” is closest to ______.", "options": ["globally identical", "commercially expensive", "clearly characteristic", "recently popular"], "keyLetter": "C", "keyText": "clearly characteristic", "why": "distinctive = clearly characteristic (đặc trưng rõ nét).", "distractors": ["identical trái nghĩa.", "expensive sai nghĩa.", "recently popular sai nghĩa."], "kb": "distinctive = đặc trưng.", "authored": false}, {"n": 19, "uid": 19, "part": "", "hd_fix": false, "prompt": "Choose the best order: a. This gave students more context. b. The school organised an exchange project. c. Students interviewed partners about everyday life.", "options": ["b-a-c", "a-b-c", "c-a-b", "b-c-a"], "keyLetter": "D", "keyText": "b-c-a", "why": "b đặt project trước; c hoạt động trong project; a là “This” kết quả → b–c–a.", "distractors": ["B. mở bằng “This” khi chưa có tiền đề.", "C. đặt hoạt động trước project.", "A. đặt kết quả trước hoạt động."], "kb": "Mạch: project → activity → result.", "authored": false}, {"n": 20, "uid": 20, "part": "", "hd_fix": false, "prompt": "The event was popular. ______, popularity did not mean everyone understood its cultural background.", "options": ["However", "For example", "Similarly", "Therefore"], "keyLetter": "A", "keyText": "However", "why": "Câu trước khẳng định popular; câu sau bổ sung giới hạn ngược chiều (popularity did not mean…) → However.", "distractors": ["Therefore sai vì không có quan hệ kết quả.", "For example cần ví dụ cụ thể.", "Similarly cần ý tương tự."], "kb": "However = tuy nhiên.", "authored": false}]}};
const PASSAGES={"CLOZE – MIXED LANGUAGE": "<p>Joining (21) ______ international exchange programme can be both exciting and challenging. Students may initially experience culture shock because everyday routines are unfamiliar. (22) ______, regular contact with host families and classmates can help them adapt. Participants are encouraged (23) ______ questions and keep an open mind. Over time, many develop greater cultural (24) ______ and become more willing to revise earlier assumptions. The more actively they participate, (25) ______ more they are likely to learn.</p>", "CLOZE – GLOBALISATION": "<p>Globalisation can expose people (26) ______ food, music and fashion from other parts of the world. These influences may be adopted directly or changed to fit local preferences. Such adaptation does not necessarily result (27) ______ the loss of local identity. In many cases, communities combine outside influences with traditions that are already meaningful to them. (28) ______, a modern clothing style may include traditional patterns. These hybrid forms can demonstrate cultural change while still (29) ______ distinctive local features.</p>", "PASSAGE COMPLETION": "<p>People sometimes assume that cultural knowledge means memorising a list of rules about another country. (30) ______. Individuals within the same cultural group may behave differently because of age, region, family background or personal preference. For this reason, background knowledge should be treated as a starting point rather than a final judgement. (31) ______. This combination reduces the risk of replacing ignorance with a new stereotype.</p>", "READING TRANSFER 1": "<p>Cultural competence is sometimes misunderstood as the ability to remember facts about different countries. Facts can be useful, but they are only one part of effective intercultural communication. A visitor may know that a particular behaviour is common in a country and still meet individuals who do not follow that pattern.</p><p>More effective communication combines background knowledge with observation and curiosity. Rather than assuming that an unfamiliar action has one fixed meaning, a person can ask how it is understood in the specific situation. This approach is especially important because cultural practices may vary across regions, generations, families and social groups.</p><p>Recognising variation does not mean culture is irrelevant. It means cultural information should help people form better questions, not automatic conclusions. The goal is to become more accurate and flexible, not to replace one stereotype with another.</p>", "READING TRANSFER 2": "<p>Greater global contact has made cultural products easier to access. Music travels across digital platforms, food trends move between cities, and fashion ideas are shared internationally. This increased contact can make everyday life look more similar in different places, but visible similarity does not necessarily mean cultural identity has disappeared.</p><p>Local communities frequently modify outside influences. A restaurant may change a recipe to match regional tastes, or a designer may use an international style together with traditional patterns. These adaptations can create forms that are both globally connected and locally distinctive.</p><p>The difficult question is therefore not whether culture changes; cultures have always changed. A more useful question is what is preserved, who benefits from the change, and whether the people connected with a tradition receive recognition. Such questions encourage a more careful understanding of globalisation than the simple claim that it either destroys or protects culture.</p>"};

const startEpoch=Date.now();
const letters=['A','B','C','D'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
