<html lang="vi">
<head>

<title>UNIT 2 • LESSON 7 • CULTURAL ADAPTATION — Ôn bài cũ • Luyện tập • Củng cố</title>
<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:17px/1.65 "Times New Roman",Times,serif}
header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.subtitle{opacity:.92;font-size:18px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}
.toolbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;font-family:system-ui}
.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:system-ui}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}
.GREEN{background:#dcfce7;color:var(--green)}.AMBER{background:#fef3c7;color:var(--amber)}.RED{background:#fee2e2;color:var(--red)}
.TAG{background:#e0e7ff;color:#3730a3}
.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}
table.vocab{width:100%;border-collapse:collapse;margin:12px 0}
table.vocab th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left}
table.vocab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.vocab tr:nth-child(even) td{background:#f8fafc}
.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}
.know b.t{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:22px;font-family:system-ui}
@media(max-width:760px){.toolbar button{flex:1}}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#102a43,#245b8f);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0006}
.gate-box h2{color:var(--navy);margin:0 0 6px}
.gate-box input{width:100%;padding:12px;border:1px solid #bfcadd;border-radius:10px;font-size:17px;margin:12px 0;font-family:system-ui}
.gate-box .primary{width:100%;font-size:17px}
#pwmsg{color:var(--red);font-weight:700;min-height:24px;font-family:system-ui}
.view{display:none}.view.active{display:block}
.backbar{margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:8px}
.hub-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;text-align:left;font-family:"Times New Roman",Times,serif;box-shadow:0 7px 22px #1e293b0b}
.hub-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.hub-card b.t{font-size:21px;color:var(--navy);display:block;margin-bottom:6px}
.hub-card span.d{color:var(--muted);font-size:15px;display:block}
.hub-card .st{margin-top:10px;display:block}
.twopane{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start;margin:12px 0}
.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pane-l{background:#fbfdff}
@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

 rõ hơn dựa trên bối cảnh).", "distractors": ["D. là nghĩa của câu “culture shock is more than a problem”.", "B. là nghĩa của “keep an open mind”.", "C. là nghĩa của “productive adaptation”."], "kb": "interpretation ≈ understanding.", "authored": false}, {"n": 42, "uid": 42, "part": "", "hd_fix": false, "prompt": "“productive adaptation” is closest in meaning to ______.", "options": ["be willing to consider unfamiliar practices", "learning about others while examining one’s own assumptions", "discomfort can also lead to reflection and deeper understanding", "adapt"], "keyLetter": "B", "keyText": "learning about others while examining one’s own assumptions", "why": "“productive adaptation” (thích nghi hiệu quả) = learning about others while examining one’s own assumptions.", "distractors": ["A. là nghĩa của “keep an open mind”.", "D. là nghĩa đơn của “adjust”, thiếu ý productive.", "C. là nghĩa của câu “culture shock is more than a problem”."], "kb": "productive = hiệu quả, có ích.", "authored": false}, {"n": 43, "uid": 43, "part": "", "hd_fix": false, "prompt": "“culture shock is more than a problem to overcome” is closest in meaning to ______.", "options": ["be willing to consider unfamiliar practices", "discomfort can also lead to reflection and deeper understanding", "adapt", "learn local norms without abandoning one’s values"], "keyLetter": "B", "keyText": "discomfort can also lead to reflection and deeper understanding", "why": "“more than a problem” → có giá trị tích cực: discomfort can also lead to reflection and deeper understanding.", "distractors": ["C. là nghĩa đơn của “adjust”.", "D. là nghĩa của chunk “learn local norms”.", "A. là nghĩa của “keep an open mind”."], "kb": "more than a problem = hơn cả một vấn đề.", "authored": false}, {"n": 44, "uid": 44, "part": "", "hd_fix": false, "prompt": "Which expression means “rút khỏi / tránh tương tác”?", "options": ["withdraw from interaction", "ask for context", "keep an open mind", "learn local norms"], "keyLetter": "A", "keyText": "withdraw from interaction", "why": "withdraw from interaction = rút khỏi / tránh tương tác.", "distractors": ["keep an open mind = giữ tư duy cởi mở.", "ask for context = hỏi để hiểu bối cảnh.", "learn local norms = tìm hiểu chuẩn mực địa phương."], "kb": "withdraw from = rút khỏi.", "authored": false}, {"n": 45, "uid": 45, "part": "", "hd_fix": false, "prompt": "Rather than ______ quick judgements, learners should gather context.", "options": ["making", "to make", "make", "made"], "keyLetter": "A", "keyText": "making", "why": "Sau “rather than” dùng V-ing.", "distractors": ["make (V0) sai sau rather than.", "“to make” sai cấu trúc.", "made (V3) sai."], "kb": "rather than + V-ing.", "authored": false}, {"n": 46, "uid": 46, "part": "", "hd_fix": false, "prompt": "Good communication can prevent confusion ______ becoming conflict.", "options": ["from", "to", "with", "for"], "keyLetter": "A", "keyText": "from", "why": "Cấu trúc: prevent + N + from + V-ing.", "distractors": ["“prevent to” sai.", "“prevent for” sai.", "“prevent with” sai."], "kb": "prevent ... from ...", "authored": false}, {"n": 47, "uid": 47, "part": "", "hd_fix": false, "prompt": "The noun form of “assume” is ______.", "options": ["adaptation", "assumption", "awareness", "interpretation"], "keyLetter": "B", "keyText": "assumption", "why": "Danh từ của assume = assumption (giả định).", "distractors": ["adaptation là danh từ của adapt.", "interpretation là danh từ của interpret.", "awareness là danh từ của aware."], "kb": "assume → assumption.", "authored": false}, {"n": 48, "uid": 48, "part": "", "hd_fix": false, "prompt": "Which expression means “biến sự bối rối thành cơ hội học hỏi”?", "options": ["be aware of cultural context", "turn confusion into an opportunity to learn", "make immediate conclusions", "experience culture shock"], "keyLetter": "B", "keyText": "turn confusion into an opportunity to learn", "why": "turn confusion into an opportunity to learn = biến sự bối rối thành cơ hội học hỏi.", "distractors": ["make immediate conclusions = đưa ra kết luận ngay.", "be aware of cultural context = nhận thức bối cảnh văn hoá.", "experience culture shock = trải qua sốc văn hoá."], "kb": "turn ... into ... = biến thành.", "authored": false}, {"n": 49, "uid": 49, "part": "", "hd_fix": false, "prompt": "Which expression means “giữ sự tò mò và thu thập bối cảnh”?", "options": ["withdraw from interaction", "stay curious and gather context", "make quick judgements", "abandon one’s values"], "keyLetter": "B", "keyText": "stay curious and gather context", "why": "stay curious and gather context = giữ sự tò mò và thu thập bối cảnh.", "distractors": ["make quick judgements = đưa ra phán xét nhanh.", "withdraw from interaction = rút khỏi tương tác.", "abandon one’s values = từ bỏ giá trị."], "kb": "curious = tò mò; gather = thu thập.", "authored": false}, {"n": 50, "uid": 50, "part": "", "hd_fix": false, "prompt": "Which expression means “xem xét lại các giả định của bản thân”?", "options": ["examine one’s own assumptions", "experience culture shock", "ask for context", "learn local norms"], "keyLetter": "A", "keyText": "examine one’s own assumptions", "why": "examine one’s own assumptions = xem xét lại các giả định của bản thân.", "distractors": ["learn local norms = tìm hiểu chuẩn mực địa phương.", "ask for context = hỏi để hiểu bối cảnh.", "experience culture shock = trải qua sốc văn hoá."], "kb": "examine = xem xét.", "authored": false}]},"p2":{"title":"PHẦN 2 — LUYỆN TẬP","desc":"24 câu: sắp xếp, đọc hiểu, điền đoạn văn","questions":[{"n": 1, "uid": 1, "part": "", "hd_fix": false, "prompt": "The best order is ______.<br>a. Pleased to meet you, Ms Brown.<br>b. Ms Brown, I’d like to introduce Nam, our club president.<br>c. Pleased to meet you too, Nam.", "options": ["b – c – a", "b – a – c", "c – b – a", "a – b – c"], "keyLetter": "B", "keyText": "b – a – c", "why": "b mở lời giới thiệu Nam với Ms Brown; a là Nam chào Ms Brown (“Ms Brown”); c là Ms Brown đáp lại Nam (“Nam”).", "distractors": ["D. mở bằng lời chào khi chưa có ai giới thiệu.", "A. lặp hai lượt lời của Ms Brown kết với nhau sai logic.", "C. mở bằng lời đáp “Pleased to meet you too” khi chưa có lời chào."], "kb": "Bám dãy tên: ai giới thiệu ai → ai chào ai.", "authored": false}, {"n": 2, "uid": 2, "part": "", "hd_fix": false, "prompt": "The best order is ______.<br>a. Thanks. I’m looking forward to working with everyone.<br>b. Professor Nguyen, may I introduce Mia, our visiting student?<br>c. It’s a pleasure to meet you, Mia.<br>d. The pleasure is mine, Professor Nguyen.", "options": ["c – b – a – d", "b – c – d – a", "b – d – c – a", "a – b – c – d"], "keyLetter": "B", "keyText": "b – c – d – a", "why": "b mở lời giới thiệu Mia với Professor Nguyen; d là Mia đáp “Professor Nguyen”; c là Professor Nguyen chào Mia (“Mia”); a là Mia kết thúc → b–d–c–a.", "distractors": ["A. mở bằng lời của Professor Nguyen khi chưa có giới thiệu.", "C. đặt c trước d, đảo lượt nói của Professor Nguyen.", "D. mở bằng lời kết “Thanks”."], "kb": "Đổi tên: cặp adjacent b–d (Mia–Prof), d–c (Prof–Mia).", "authored": false}, {"n": 3, "uid": 3, "part": "READING 1", "hd_fix": false, "prompt": "The word “This” refers to ______.", "options": ["experiencing another culture while travelling abroad", "viewing unfamiliar behaviour through one’s own cultural rules", "judging local behaviour by workers’ expectations", "understanding service behaviour through tipping customs"], "keyLetter": "B", "keyText": "viewing unfamiliar behaviour through one’s own cultural rules", "why": "Trích dẫn: “Visitors often interpret unfamiliar behaviour using the rules of their own culture. This can lead to quick judgements.” → “This” = việc diễn giải hành vi không quen bằng quy tắc văn hoá của mình.", "distractors": ["C. đảo logic: không phải đánh giá theo workers’ expectations.", "D. thu hẹp thành chỉ về tipping customs.", "A. mở rộng thành trải nghiệm nói chung."], "kb": "“This” quy chiếu cả mệnh đề trước.", "authored": false}, {"n": 4, "uid": 4, "part": "READING 1", "hd_fix": false, "prompt": "Why does the writer use the tipping example?", "options": ["To show that behaviour may be understood differently across cultures", "To show that visitors should follow local tipping customs", "To show that workers depend mainly on tips for income", "To show that one cultural rule is better than another"], "keyLetter": "A", "keyText": "To show that behaviour may be understood differently across cultures", "why": "Trích dẫn: “A traveller from a non-tipping culture, for instance, may see tipping as unnecessary, while a local worker may view it as an expected part of service.” → cùng hành vi, hai cách hiểu khác nhau.", "distractors": ["B. thu hẹp thành khuyên nên theo custom, không nêu purpose.", "C. bịa thêm chi tiết income.", "D. trái ý bài (bài không xếp hạng rule)."], "kb": "Purpose: ví dụ minh hoạ ý chính.", "authored": false}, {"n": 5, "uid": 5, "part": "READING 1", "hd_fix": false, "prompt": "Which can be inferred?", "options": ["Cultural knowledge can help people avoid inaccurate judgements.", "Cultural knowledge mainly helps people overcome language differences.", "Cultural knowledge requires people to copy all local customs.", "Cultural knowledge requires people to replace their own values."], "keyLetter": "A", "keyText": "Cultural knowledge can help people avoid inaccurate judgements.", "why": "Trích dẫn: “Learning the local norm does not require visitors to abandon their own values; it simply helps them interpret behaviour more accurately.” → interpret accurately = tránh đánh giá sai.", "distractors": ["D. trái ý: does not require abandon values.", "C. thêm “copy all” sai.", "B. thêm “language differences” không có trong bài."], "kb": "Inference có biên: chỉ dựa trên câu trong bài.", "authored": false}, {"n": 6, "uid": 6, "part": "READING 1", "hd_fix": false, "prompt": "Which best summarises the paragraph?", "options": ["Cultural understanding requires people to give up their personal values.", "Cultural differences make tipping the main cause of misunderstanding.", "Cultural context helps people understand behaviour without changing their values.", "Cultural differences require travellers to adopt all local practices."], "keyLetter": "C", "keyText": "Cultural context helps people understand behaviour without changing their values.", "why": "Trích dẫn: “Learning the local norm does not require visitors to abandon their own values; it simply helps them interpret behaviour more accurately.” → toàn đoạn: hiểu hành vi qua bối cảnh, không cần đổi giá trị.", "distractors": ["B. thu hẹp về tipping.", "D. thêm “adopt all” sai.", "A. trái ý hoàn toàn."], "kb": "Summary đúng = bỏ ví dụ, giữ ý chính.", "authored": false}, {"n": 7, "uid": 7, "part": "", "hd_fix": false, "prompt": "Original: “Keeping an open mind can make adaptation easier.” Best paraphrase:", "options": ["People must accept every unfamiliar practice in a new culture.", "A willingness to consider unfamiliar practices may help people adjust.", "Open-minded people gradually lose their original cultural identity.", "Adaptation becomes easy as soon as a person travels abroad."], "keyLetter": "B", "keyText": "A willingness to consider unfamiliar practices may help people adjust.", "why": "Câu gốc giữ mức độ khả năng (“can”) và so sánh (easier); B dùng “may help” và không thêm/bớt chi tiết.", "distractors": ["A. biến can thành must + “every”.", "D. biến điều kiện thành “as soon as… travels abroad”.", "C. thêm ý “lose cultural identity”."], "kb": "Paraphrase: giữ mức độ chắc chắn.", "authored": false}, {"n": 8, "uid": 8, "part": "", "hd_fix": false, "prompt": "Original: “Learning local norms does not require visitors to abandon their own values.” Best paraphrase:", "options": ["Local cultural values are usually more appropriate than visitors’ beliefs.", "Visitors should replace their values with the local community’s values.", "Travellers cannot understand unfamiliar practices while keeping their own values.", "People can understand local expectations without giving up their own beliefs."], "keyLetter": "D", "keyText": "People can understand local expectations without giving up their own beliefs.", "why": "Câu gốc phủ định “require… abandon”; D giữ nguyên logic: hiểu expectations mà không từ bỏ beliefs.", "distractors": ["B. đảo nghĩa: should replace values.", "A. so sánh hơn-kém, bài không nói.", "C. phủ định khả năng hiểu trong khi giữ values."], "kb": "Chú ý phủ định trong câu gốc.", "authored": false}, {"n": 9, "uid": 9, "part": "", "hd_fix": false, "prompt": "Which option DISTORTS “culture shock can become a valuable learning experience”?", "options": ["It is guaranteed to be enjoyable from the first moment.", "It may encourage people to learn about unfamiliar practices.", "It can contribute to personal growth.", "It may provide an opportunity for intercultural learning."], "keyLetter": "A", "keyText": "It is guaranteed to be enjoyable from the first moment.", "why": "A, B, D đều giữ ý “valuable learning experience”; C nói “guaranteed to be enjoyable from the first moment” → bóp méo mức độ và bịa thêm cảm giác enjoyable.", "distractors": ["D. giữ đúng mức độ may.", "C. giữ đúng mức độ can.", "B. giữ đúng mức độ may."], "kb": "DISTORT = bóp méo quan hệ/mức độ.", "authored": false}, {"n": 10, "uid": 10, "part": "ADAPTATION", "hd_fix": false, "prompt": "Choose the best sentence for blank (10).", "options": ["The stress disappears when people compare every routine with their home culture.", "One useful response is to stay curious and gather context.", "Newcomers adapt best when they immediately decide which practices are right or wrong.", "One useful response is to avoid asking questions until the routines feel familiar."], "keyLetter": "B", "keyText": "One useful response is to stay curious and gather context.", "why": "Câu trước nêu unfamiliar routines gây stressful; câu sau khuyên hỏi người địa phương thay vì judge → câu nối phải giới thiệu phản ứng tích cực: stay curious and gather context.", "distractors": ["D. khuyên tránh asking questions, trái ý.", "C. khuyên judge right or wrong ngay, trái ý.", "A. thu hẹp thành compare with home culture."], "kb": "Đọc câu trước và sau chỗ trống.", "authored": false}, {"n": 11, "uid": 11, "part": "ADAPTATION", "hd_fix": false, "prompt": "Choose the best sentence for blank (11).", "options": ["Asking for context is useful only when newcomers plan to copy the practice.", "This approach turns confusion into an opportunity to learn.", "This approach makes cultural differences less important than personal preference.", "The questions are mainly intended to prove the local practice is correct."], "keyLetter": "B", "keyText": "This approach turns confusion into an opportunity to learn.", "why": "Chỗ trống nằm giữa việc hỏi locals và kết luận “ob​s​ervation, questions and reflection can make adaptation easier”; D dùng “This approach” nối chuẩn mực và tóm đúng: biến confusion thành cơ hội học.", "distractors": ["A. thu hẹp thành only when… copy.", "C. thêm ý less important than personal preference.", "D. thu hẹp thành prove the practice is correct."], "kb": "“This approach” = phương pháp vừa nêu.", "authored": false}, {"n": 12, "uid": 12, "part": "TWO-SIDED COHESION", "hd_fix": false, "prompt": "Choose the best sentence for blank (12).", "options": ["He stopped comparing the routines only because his classmates agreed with him.", "His teacher encouraged him to observe first and ask questions before deciding what the routines meant.", "He concluded that the routines had no connection to cultural context.", "He therefore decided that every unfamiliar routine was inappropriate."], "keyLetter": "B", "keyText": "His teacher encouraged him to observe first and ask questions before deciding what the routines meant.", "why": "Trước chỗ trống Minh tempted to compare immediately; sau chỗ trống cậu nói chuyện với classmates và phát hiện practical reasons → cần câu chuyển từ “muốn judge” sang “observe + ask trước”: C.", "distractors": ["D. quyết inappropriate, trái diễn biến sau đó.", "A. thu hẹp thành only because classmates agreed.", "C. nói no connection to cultural context, trái ý."], "kb": "Two-sided: khớp cả câu trước và sau.", "authored": false}, {"n": 13, "uid": 13, "part": "TWO-SIDED COHESION", "hd_fix": false, "prompt": "Choose the best sentence for blank (13).", "options": ["He therefore replaced all of his own values with the new routines.", "As a result, he decided that all cultural differences should disappear.", "This did not mean he preferred every practice, but he understood them more accurately.", "The experience showed that asking questions was no longer necessary."], "keyLetter": "C", "keyText": "This did not mean he preferred every practice, but he understood them more accurately.", "why": "Trước chỗ trống Minh phát hiện practical reasons; sau chỗ trống cậu tự tin hơn khi ask for context → câu chuyển: hiểu chính xác hơn mà không bắt buộc thích: A.", "distractors": ["B. đòi xoá bỏ all differences.", "D. nói no longer necessary, trái ý câu sau.", "A. nói replaced all of his own values, trái ý bài."], "kb": "Không đồng ý = vẫn hiểu được.", "authored": false}, {"n": 14, "uid": 14, "part": "CLOZE", "hd_fix": false, "prompt": "Blank (14)", "options": ["to make", "making", "makes", "made"], "keyLetter": "B", "keyText": "making", "why": "Sau “rather than” dùng V-ing: rather than making…", "distractors": ["makes (V1s) sai sau rather than.", "“to make” sai cấu trúc.", "made (V3) sai."], "kb": "rather than + V-ing.", "authored": false}, {"n": 15, "uid": 15, "part": "CLOZE", "hd_fix": false, "prompt": "Blank (15)", "options": ["awarely", "awareness", "aware", "awaring"], "keyLetter": "C", "keyText": "aware", "why": "Sau more cần tính từ: become more aware of.", "distractors": ["awareness là danh từ, sai vị trí.", "awaring không phải dạng chuẩn.", "awarely không tồn tại."], "kb": "become + adj.", "authored": false}, {"n": 16, "uid": 16, "part": "CLOZE", "hd_fix": false, "prompt": "Blank (16)", "options": ["from", "to", "for", "with"], "keyLetter": "A", "keyText": "from", "why": "Cấu trúc: prevent + O + from + V-ing.", "distractors": ["prevent for sai giới từ.", "prevent to sai giới từ.", "prevent with sai giới từ."], "kb": "prevent ... from ...", "authored": false}, {"n": 17, "uid": 17, "part": "CLOZE", "hd_fix": false, "prompt": "Blank (17)", "options": ["As a result", "For example", "Similarly", "Importantly"], "keyLetter": "D", "keyText": "Importantly", "why": "Câu sau đưa định nghĩa mới quan trọng về adaptation (not mean accepting… uncritically) → trạng từ nhấn mạnh: Importantly.", "distractors": ["For example cần ví dụ cụ thể.", "As a result cần quan hệ kết quả.", "Similarly cần ý tương tự trước đó."], "kb": "Importantly = điều quan trọng là.", "authored": false}, {"n": 18, "uid": 18, "part": "READING 2", "hd_fix": false, "prompt": "Why does the writer say the usual description can be “incomplete”?", "options": ["Because culture shock can also lead to useful reflection and learning.", "Because most newcomers adapt successfully without experiencing uncertainty.", "Because culture shock is mainly a short period of physical discomfort.", "Because host cultures have little influence on how visitors interpret events."], "keyLetter": "A", "keyText": "Because culture shock can also lead to useful reflection and learning.", "why": "Trích dẫn: “Culture shock is often described as a problem to overcome, but this description can be incomplete. Discomfort may signal that a person’s usual assumptions no longer explain what is happening… the same uncertainty can lead to more precise questions and a deeper understanding.”", "distractors": ["C. thu hẹp thành physical discomfort, bài không nói.", "B. trái ý: bài nói discomfort là tín hiệu cần thiết.", "D. trái ý: host culture có vai trò lớn."], "kb": "“incomplete” = thiếu mặt tích cực.", "authored": false}, {"n": 19, "uid": 19, "part": "READING 2" const PASSAGES={"READING 1": "<p>Visitors often interpret unfamiliar behaviour using the rules of their own culture. This can lead to quick judgements. A traveller from a non-tipping culture, for instance, may see tipping as unnecessary, while a local worker may view it as an expected part of service. Neither reaction can be understood fully without cultural context. Learning the local norm does not require visitors to abandon their own values; it simply helps them interpret behaviour more accurately.</p>", "ADAPTATION": "<p>Moving to a new culture can be exciting, but unfamiliar routines may initially feel stressful. (10) ______. Instead of immediately judging a practice as strange or wrong, newcomers can ask how local people understand it. (11) ______. Over time, this combination of observation, questions and reflection can make adaptation easier without requiring people to lose their own identity.</p>", "TWO-SIDED COHESION": "<p>At first, Minh found some classroom routines at his exchange school unfamiliar. He was tempted to compare them immediately with practices at home. (12) ______. After speaking to classmates, he discovered that several routines had practical reasons he had not considered. (13) ______. By the end of the month, he had become more confident about asking for context before making a judgement.</p>", "CLOZE": "<p>14. Rather than (14) ______ immediate conclusions, they can observe how local people behave and ask respectful questions. 15. This helps them become more (15) ______ of cultural context. 16. It may also prevent minor misunderstandings (16) ______ developing into larger conflicts. 17. (17) ______, successful adaptation does not mean accepting every practice uncritically; it means understanding before judging.</p>", "READING 2": "<p>Culture shock is often described as a problem to overcome, but this description can be incomplete. Discomfort may signal that a person’s usual assumptions no longer explain what is happening. If newcomers respond only by withdrawing, the discomfort may remain unproductive. If they investigate the context, however, the same uncertainty can lead to more precise questions and a deeper understanding of both the host culture and their own habits. Adaptation, then, is not simply becoming comfortable; it can involve learning to notice assumptions that previously seemed invisible.</p>"};

const startEpoch=Date.now();

function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}

function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';

  }

  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';

function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}

function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}

function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;

  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
