<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:17px/1.65 "Times New Roman",Times,serif}
header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.subtitle{opacity:.92;font-size:18px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}
.toolbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;font-family:system-ui}
.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:system-ui}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}
.GREEN{background:#dcfce7;color:var(--green)}.AMBER{background:#fef3c7;color:var(--amber)}.RED{background:#fee2e2;color:var(--red)}
.TAG{background:#e0e7ff;color:#3730a3}
.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}
table.vocab{width:100%;border-collapse:collapse;margin:12px 0}
table.vocab th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left}
table.vocab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.vocab tr:nth-child(even) td{background:#f8fafc}
.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}
.know b.t{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:22px;font-family:system-ui}
@media(max-width:760px){.toolbar button{flex:1}}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#102a43,#245b8f);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0006}
.gate-box h2{color:var(--navy);margin:0 0 6px}
.gate-box input{width:100%;padding:12px;border:1px solid #bfcadd;border-radius:10px;font-size:17px;margin:12px 0;font-family:system-ui}
.gate-box .primary{width:100%;font-size:17px}
#pwmsg{color:var(--red);font-weight:700;min-height:24px;font-family:system-ui}
.view{display:none}.view.active{display:block}
.backbar{margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:8px}
.hub-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;text-align:left;font-family:"Times New Roman",Times,serif;box-shadow:0 7px 22px #1e293b0b}
.hub-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.hub-card b.t{font-size:21px;color:var(--navy);display:block;margin-bottom:6px}
.hub-card span.d{color:var(--muted);font-size:15px;display:block}
.hub-card .st{margin-top:10px;display:block}
.twopane{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start;margin:12px 0}
.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pane-l{background:#fbfdff}
@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

” (= shallow impressions).", "distractors": ["reliable trái nghĩa với cảnh báo của câu.", "interactive trái nghĩa với cảnh báo của câu.", "universal trái nghĩa với cảnh báo của câu."], "kb": "superficial = hời hợt.", "authored": false}, {"n": 40, "uid": 40, "part": "", "hd_fix": false, "prompt": "Which expression means “kết hợp giải trí với học tập”?", "options": ["focus on one clear theme", "organise international food stalls", "provide first-hand perspectives", "combine entertainment with learning"], "keyLetter": "D", "keyText": "combine entertainment with learning", "why": "combine entertainment with learning = kết hợp giải trí với học tập.", "distractors": ["B. là nghĩa của chunk “organise international food stalls”.", "A. là nghĩa của chunk “focus on one clear theme”.", "C. là nghĩa của chunk “provide first-hand perspectives”."], "kb": "entertainment = giải trí.", "authored": false}, {"n": 41, "uid": 41, "part": "", "hd_fix": false, "prompt": "Before making a display, students should check trustworthy ______.", "options": ["impressions", "audiences", "sources", "themes"], "keyLetter": "C", "keyText": "sources", "why": "Chunk của bài: “trustworthy sources” (các nguồn đáng tin cậy).", "distractors": ["impressions không đi với “check trustworthy”.", "audiences không đi với “check trustworthy”.", "themes không đi với “check trustworthy”."], "kb": "trustworthy = đáng tin cậy.", "authored": false}, {"n": 42, "uid": 42, "part": "", "hd_fix": false, "prompt": "Which paraphrase best matches “watching alone might not encourage much interaction”?", "options": ["interactive tasks reduce participation", "passive viewing may provide limited participation", "visual appeal always guarantees deep learning", "one person represents an entire culture"], "keyLetter": "B", "keyText": "passive viewing may provide limited participation", "why": "watching alone ≈ passive viewing; might not encourage much interaction ≈ may provide limited participation.", "distractors": ["C. dùng “always guarantees” tuyệt đối hoá, trái ý.", "D. là nghĩa của câu khác.", "A. đảo ngược (reduce participation)."], "kb": "might not ≈ may — giữ sắc thái dự đoán.", "authored": false}]},"p2":{"title":"PHẦN 2 — LUYỆN TẬP","desc":"14 câu: sắp xếp hội thoại & điền đoạn văn","questions":[{"n": 1, "uid": 1, "part": "SHORT DIALOGUE ORDERING", "hd_fix": false, "prompt": "Choose the best order.<br>a. Good point. Then each stall could include a short information card.<br>b. Why don’t we organise international food stalls?<br>c. That sounds fun, but visitors should learn something about the dishes too.", "options": ["c – b – a", "b – c – a", "b – a – c", "a – c – b"], "keyLetter": "B", "keyText": "b – c – a", "why": "b đưa đề xuất tổ chức food stalls; c đồng ý có điều kiện (That sounds fun, but…) và nêu yêu cầu học tập; a tiếp nhận (Good point) rồi đưa giải pháp information card.", "distractors": ["A. mở bằng phản hồi “That sounds fun” khi chưa có đề xuất nào.", "C. đặt giải pháp (information card) trước khi vấn đề học tập được nêu.", "D. mở bằng “Good point” khi chưa có ý kiến nào để tiếp nhận."], "kb": "Mạch hội thoại: đề xuất → phản hồi có điều kiện → giải pháp.", "authored": false}, {"n": 2, "uid": 2, "part": "SHORT DIALOGUE ORDERING", "hd_fix": false, "prompt": "Choose the best order.<br>a. Agreed. That would make the activity more interactive.<br>b. We need something that encourages visitors to participate.<br>c. Why don’t we include some traditional games that visitors can try?", "options": ["b – c – a", "c – a – b", "b – a – c", "a – b – c"], "keyLetter": "A", "keyText": "b – c – a", "why": "b nêu nhu cầu (cần hoạt động khiến khách tham gia); c đưa đề xuất trò chơi; a bắt đầu bằng “Agreed” và “That” nên phải đứng sau đề xuất cụ thể.", "distractors": ["B. mở bằng “Agreed” khi chưa có đề xuất nào để đồng ý.", "D. đặt “Agreed” ngay đầu, đại từ “That” không có tiền đề.", "C. đặt “Agreed” trước đề xuất trò chơi."], "kb": "“Agreed/That” luôn đứng sau nội dung được đồng ý.", "authored": false}, {"n": 3, "uid": 3, "part": "SHORT DIALOGUE ORDERING", "hd_fix": false, "prompt": "Choose the best order.<br>a. Then let’s ask each group to check two reliable sources.<br>b. Culture booths could be useful.<br>c. Yes, but we need to make sure the information is accurate.", "options": ["a – b – c", "b – c – a", "b – a – c", "c – b – a"], "keyLetter": "B", "keyText": "b – c – a", "why": "b nêu đề xuất culture booths; c chấp nhận có điều kiện (Yes, but…) và đặt vấn đề độ chính xác; a dùng “Then” đưa hành động xử lý: kiểm tra hai nguồn.", "distractors": ["D. mở bằng “Yes, but…” khi chưa có đề xuất nào.", "C. đặt hành động “Then…” trước khi vấn đề được nêu.", "A. mở bằng “Then” khi chưa có tiền đề."], "kb": "Mạch: đề xuất → chấp nhận có điều kiện → giải pháp.", "authored": false}, {"n": 4, "uid": 4, "part": "SHORT DIALOGUE ORDERING", "hd_fix": false, "prompt": "Choose the best order.<br>a. So we’ll keep the performance short and add a question-and-answer session.<br>b. A music performance could attract a large audience.<br>c. True, but we also want the audience to learn something.", "options": ["c – a – b", "b – c – a", "a – b – c", "b – a – c"], "keyLetter": "B", "keyText": "b – c – a", "why": "b đưa đề xuất music performance; c thừa nhận ưu điểm nhưng thêm mục tiêu học tập; a bắt đầu bằng “So” để chốt quyết định kết hợp.", "distractors": ["A. mở bằng “True, but…” khi chưa có ý kiến nào.", "C. đặt câu chốt “So…” ngay đầu.", "D. đặt câu chốt trước khi hai ý kiến được nêu đủ."], "kb": "“So” đứng cuối để chốt quyết định từ các ý trước.", "authored": false}, {"n": 5, "uid": 5, "part": "EXTENDED DIALOGUE", "hd_fix": false, "prompt": "Choose the best order.<br>a. Then let’s make each booth focus on one clear theme and require reliable sources.<br>b. We have too many ideas for the culture booths.<br>c. That could work, but the information must be accurate.<br>d. Why don’t we reduce the number of topics and choose the most useful ones?<br>e. That would make each booth clearer for visitors.", "options": ["c – b – d – e – a", "b – d – e – c – a", "b – e – d – a – c", "d – b – c – e – a"], "keyLetter": "B", "keyText": "b – d – e – c – a", "why": "b nêu vấn đề (quá nhiều ý tưởng); d đề xuất giảm chủ đề; e nêu kết quả (booth rõ hơn); c thêm điều kiện (phải chính xác); a chốt quyết định cuối.", "distractors": ["D. mở bằng đề xuất khi vấn đề chưa được nêu.", "C. đặt kết quả “That would…” trước đề xuất.", "A. mở bằng “That could work” khi chưa có gì để đánh giá."], "kb": "Mạch dài: vấn đề → đề xuất → kết quả → điều kiện → quyết định.", "authored": false}, {"n": 6, "uid": 6, "part": "EXTENDED DIALOGUE", "hd_fix": false, "prompt": "Choose the best order.<br>a. Agreed. Let’s use student guides and printed rule cards.<br>b. Traditional games would make the event more interactive.<br>c. One concern is that visitors may not know how to play.<br>d. We could include a few simple games from different cultures.<br>e. That should solve the problem and help visitors join in confidently.", "options": ["b – d – c – a – e", "c – b – a – d – e", "d – b – c – e – a", "b – c – d – e – a"], "keyLetter": "A", "keyText": "b – d – c – a – e", "why": "b giới thiệu ý tưởng traditional games; d cụ thể hoá bằng vài trò chơi đơn giản; c nêu lo ngại khách chưa biết chơi; a đưa giải pháp (guides + rule cards); e kết luận giải pháp xử lý được vấn đề.", "distractors": ["B. mở bằng lo ngại khi ý tưởng chưa được nêu.", "C. đặt cụ thể hoá trước ý tưởng chung.", "D. đặt giải pháp trước khi vấn đề được nêu."], "kb": "Mạch: ý tưởng → cụ thể hoá → vấn đề → giải pháp → kết quả.", "authored": false}, {"n": 7, "uid": 7, "part": "MINI PASSAGE COMPLETION – CULTURAL DIVERSITY DAY", "hd_fix": false, "prompt": "Blank (7)", "options": ["The main problem was that visitors already knew too much about the cultures.", "Therefore, we decided to reduce opportunities for visitors to participate.", "However, we realised that watching alone might not encourage much interaction.", "Because performances are popular, no other activity is necessary."], "keyLetter": "C", "keyText": "However, we realised that watching alone might not encourage much interaction.", "why": "Sau “holding only performances”, chỗ trống cần tạo quan hệ tương phản và giải thích vì sao chuyển sang interactive booths: watching alone might not encourage much interaction.", "distractors": ["D. phủ nhận nhu cầu thay đổi (no other activity necessary).", "A. đưa nguyên nhân sai (visitors knew too much).", "B. đảo ngược mục tiêu (reduce opportunities to participate)."], "kb": "However + nhận xét hạn chế → lý do thay đổi.", "authored": false}, {"n": 8, "uid": 8, "part": "MINI PASSAGE COMPLETION – CULTURAL DIVERSITY DAY", "hd_fix": false, "prompt": "Blank (8)", "options": ["The booths were useful only because they made the room look more colourful.", "This change reduced the need for students to explain any cultural background.", "The activities therefore focused mainly on competition between groups.", "This change gave visitors a more active role in the event."], "keyLetter": "D", "keyText": "This change gave visitors a more active role in the event.", "why": "“This change” quy chiếu việc thêm interactive booths; kết quả hợp logic là khách có vai trò chủ động hơn trong sự kiện.", "distractors": ["A. thu hẹp sai mục đích (only… colourful).", "B. phủ nhận nhu cầu giải thích văn hoá.", "C. chuyển sang competition không có căn cứ."], "kb": "“This change” quy chiếu hành động vừa nêu.", "authored": false}, {"n": 9, "uid": 9, "part": "MINI PASSAGE COMPLETION – INTERNATIONAL STUDENTS", "hd_fix": false, "prompt": "Blank (9)", "options": ["For this reason, organisers should avoid asking speakers about personal experience.", "However, personal experience should not be treated as a universal rule for everyone from the same country.", "A single speaker can usually describe every experience within a national culture.", "Personal stories are most useful when the audience treats them as universal rules."], "keyLetter": "B", "keyText": "However, personal experience should not be treated as a universal rule for everyone from the same country.", "why": "Đoạn trước nêu lợi ích first-hand perspectives, câu sau nhắc một người không đại diện cả nền văn hoá; chỗ trống cần giới hạn hợp lý: trải nghiệm cá nhân không nên bị coi là quy tắc phổ quát.", "distractors": ["C. khái quát hoá quá mức (every experience).", "D. đảo ngược (treat as universal rules).", "A. loại bỏ hoàn toàn giá trị personal experience."], "kb": "However + giới hạn hợp lý → cân bằng hai mặt.", "authored": false}, {"n": 10, "uid": 10, "part": "MINI PASSAGE COMPLETION – INTERNATIONAL STUDENTS", "hd_fix": false, "prompt": "Blank (10)", "options": ["As a result, the organisers no longer needed to check the accuracy of information.", "This made the activity more informative while reducing the risk of overgeneralisation.", "The discussion therefore became less connected to cultural learning.", "This also meant that every speaker had to agree with the audience."], "keyLetter": "B", "keyText": "This made the activity more informative while reducing the risk of overgeneralisation.", "why": "“This” quy chiếu biện pháp dùng guiding questions và nhắc nhở; hệ quả hợp lý là hoạt động giàu thông tin hơn đồng thời giảm nguy cơ overgeneralisation.", "distractors": ["D. áp đặt speaker phải đồng ý với audience.", "A. phủ nhận nhu cầu kiểm tra accuracy.", "C. mâu thuẫn với mục tiêu cultural learning."], "kb": "As a result + kết quả đúng mục tiêu.", "authored": false}, {"n": 11, "uid": 11, "part": "HOMEWORK – DIALOGUE ORDERING", "hd_fix": false, "prompt": "Dialogue ordering<br>a. That should make the information more reliable.<br>b. We want to include culture booths.<br>c. Then let’s require each group to use at least two trustworthy sources.<br>d. Good idea, but we should make sure the information is accurate.", "options": ["d – b – a – c", "b – d – c – a", "c – a – b – d", "b – c – d – a"], "keyLetter": "B", "keyText": "b – d – c – a", "why": "b mở chủ đề culture booths; d phản hồi “Good idea, but…” và nêu yêu cầu accuracy; c dùng “Then” đưa biện pháp hai nguồn; a “That should…” đánh giá kết quả.", "distractors": ["A. mở bằng “Good idea” khi chưa có ý tưởng.", "D. đặt biện pháp “Then…” trước yêu cầu.", "C. đặt biện pháp và đánh giá trước khi chủ đề được mở."], "kb": "Mạch: chủ đề → phản hồi có điều kiện → biện pháp → đánh giá.", "authored": false}, {"n": 12, "uid": 12, "part": "HOMEWORK – RESPONSE", "hd_fix": false, "prompt": "A: The event should be enjoyable, but it also needs educational value. B: ______", "options": ["Educational value depends mainly on how large the school hall is.", "I enjoyed the concert last year, so no explanation is needed.", "Then we could combine performances with short explanations and interactive tasks.", "The event could therefore focus only on performances."], "keyLetter": "C", "keyText": "Then we could combine performances with short explanations and interactive tasks.", "why": "A đặt hai tiêu chí song song (enjoyable + educational value); B phải đáp ứng cả hai: kết hợp performances với explanations và interactive tasks.", "distractors": ["D. chỉ chú trọng giải trí (only performances).", "A. lạc đề (school hall).", "B. phủ nhận nhu cầu giải thích."], "kb": "Đáp lại hai tiêu chí thì phải bao quát cả hai.", "authored": false}, {"n": 13, "uid": 13, "part": "HOMEWORK – ORGANISING TEAM", "hd_fix": false, "prompt": "Blank (13)", "options": ["Because the displays were colourful, the team decided to remove all explanations.", "However, attractive displays alone could encourage shallow impressions.", "The organisers therefore asked every group to use the same cultural examples.", "The displays were attractive enough to guarantee deep cultural understanding."], "keyLetter": "B", "keyText": "However, attractive displays alone could encourage shallow impressions.", "why": "Sau “only colourful displays”, chỗ trống phải nêu hạn chế đủ để dẫn tới “They therefore added const PASSAGES={"CULTURAL DIVERSITY DAY": "<p>Our class proposed a Cultural Diversity Day. We first considered holding only performances. (7) ______. We therefore added interactive booths where visitors could ask questions and try simple activities. (8) ______. To avoid stereotypes, each group had to check information with reliable sources. In the end, the plan combined entertainment with learning.</p>", "INTERNATIONAL STUDENTS": "<p>A group suggested inviting international students to speak at the event. The idea could provide first-hand perspectives. (9) ______. For this reason, the organisers decided to prepare guiding questions and remind the audience that one speaker cannot represent an entire culture. (10) ______.</p>", "ORGANISING TEAM": "<p>The organising team wanted the event to represent several cultures. At first, each group planned only colourful displays. (13) ______. They therefore added short explanations, interviews and interactive tasks. (14) ______.</p>"};

const startEpoch=Date.now();
const letters=['A','B','C','D'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
