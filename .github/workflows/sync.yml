name: Sync Specific Folder to K12-GS-VACT Safely

on:
  push:
    branches:
      - main
    paths:
      - 'ON-THI-GIUA-KY-CUOI-KY/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v3

      - name: Pushing to another repository
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GH_PAT }}
          repository: 'msphuong1234-gif/K12-GS-VACT'
          branch: 'main'
          force: true
