<title>UNIT 5 • LESSON 1 — Ôn bài cũ • Luyện tập • Củng cố</title>
<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:17px/1.65 "Times New Roman",Times,serif}
header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.subtitle{opacity:.92;font-size:18px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}
.toolbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;font-family:system-ui}
.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:system-ui}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}
.GREEN{background:#dcfce7;color:var(--green)}.AMBER{background:#fef3c7;color:var(--amber)}.RED{background:#fee2e2;color:var(--red)}
.TAG{background:#e0e7ff;color:#3730a3}
.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}
table.vocab{width:100%;border-collapse:collapse;margin:12px 0}
table.vocab th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left}
table.vocab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.vocab tr:nth-child(even) td{background:#f8fafc}
.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}
.know b.t{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:22px;font-family:system-ui}
@media(max-width:760px){.toolbar button{flex:1}}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#102a43,#245b8f);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0006}
.gate-box h2{color:var(--navy);margin:0 0 6px}
.gate-box input{width:100%;padding:12px;border:1px solid #bfcadd;border-radius:10px;font-size:17px;margin:12px 0;font-family:system-ui}
.gate-box .primary{width:100%;font-size:17px}
#pwmsg{color:var(--red);font-weight:700;min-height:24px;font-family:system-ui}
.view{display:none}.view.active{display:block}
.backbar{margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:8px}
.hub-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;text-align:left;font-family:"Times New Roman",Times,serif;box-shadow:0 7px 22px #1e293b0b}
.hub-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.hub-card b.t{font-size:21px;color:var(--navy);display:block;margin-bottom:6px}
.hub-card span.d{color:var(--muted);font-size:15px;display:block}
.hub-card .st{margin-top:10px;display:block}
.twopane{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start;margin:12px 0}
.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pane-l{background:#fbfdff}
@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

@media print{header,.toolbar,.actions{display:none!important}body{background:#fff}.card,.q{box-shadow:none;break-inside:avoid}}</style></head>

ob title, different conditions : cùng chức danh nhưng điều kiện làm việc có thể khác."], "kb": "same job title, different conditions : cùng chức danh nhưng điều kiện làm việc có thể khác", "authored": false}, {"n": 37, "uid": "37", "part": "PASSAGE COMPLETION – JOB FIT", "hd_fix": false, "prompt": "Choose the best sentence.", "options": ["Similar titles therefore show that responsibilities are less important than working location.", "For this reason, students should focus on the title rather than the actual conditions of work.", "This difference is unusual and applies mainly to accounting jobs in large companies.", "The same principle can apply across many occupations with the same general job title."], "keyLetter": "D", "keyText": "The same principle can apply across many occupations with the same general job title.", "why": "Trích dẫn: “…another may travel regularly to meet clients. (37) ______.” → Cần câu khái quát: nguyên tắc này đúng với nhiều nghề → B.", "distractors": ["“This difference is unusual and applies mainly to accounting jobs in large companies.” không phù hợp nhất. the same principle applies across occupations : nguyên tắc tương tự áp dụng ở nhiều nghề.", "“Similar titles therefore show that responsibilities are less important than working location.” không phù hợp nhất. the same principle applies across occupations : nguyên tắc tương tự áp dụng ở nhiều nghề.", "“For this reason, students should focus on the title rather than the actual conditions of work.” không phù hợp nhất. the same principle applies across occupations : nguyên tắc tương tự áp dụng ở nhiều nghề."], "kb": "the same principle applies across occupations : nguyên tắc tương tự áp dụng ở nhiều nghề", "authored": false}, {"n": 38, "uid": "38", "part": "SENTENCE ORDERING – WORKPLACE LOGIC", "hd_fix": false, "prompt": "Choose the best order.<br>a. As a result, the company asked staff to work overtime for two weeks.<br>b. A shoe factory received a large unexpected order.<br>c. Managers first reorganised the production schedule.<br>d. The extra work was completed before the deadline.", "options": ["d – b – c – a", "b – a – c – d", "c – b – d – a", "b – c – a – d"], "keyLetter": "D", "keyText": "b – c – a – d", "why": "b (nhận đơn hàng lớn bất ngờ) → c (“first”: ưu tiên sắp xếp lại lịch) → a (“As a result”: yêu cầu tăng ca) → d (hoàn thành trước hạn — kết quả).", "distractors": ["C. (c–b–d–a): c (“first”) phải là hành động đầu tiên sau khi nhận đơn (b), không thể đứng trước b.", "B. (b–a–c–d): a (“As a result”) phải theo sau c (sắp xếp lịch), không thể đứng ngay sau b.", "A. (d–b–c–a): d là kết quả cuối cùng, không thể mở đầu."], "kb": "Chú ý các mốc nối: \"then\"/\"therefore\"/\"however\"/\"as a result\"/\"finally\" luôn cần tiền đề đứng trước.", "authored": false}, {"n": 39, "uid": "39", "part": "SENTENCE ORDERING – WORKPLACE LOGIC", "hd_fix": false, "prompt": "Choose the best order.<br>a. She then prepared examples of her previous work with children.<br>b. Mai became interested in applying for a teaching assistant position.<br>c. After reading the advertisement, she checked the required skills carefully.<br>d. Finally, she submitted her application.", "options": ["d – c – b – a", "b – c – a – d", "b – a – d – c", "c – b – d – a"], "keyLetter": "B", "keyText": "b – c – a – d", "why": "b (nảy ý định ứng tuyển) → c (“After reading the advertisement”: đọc kỹ yêu cầu) → a (“then”: chuẩn bị ví dụ) → d (“Finally”: nộp đơn).", "distractors": ["D. (c–b–d–a): c (“After reading the advertisement”) phải sau b — chính quảng cáo tạo ra ý định ở b.", "C. (b–a–d–c): d (“Finally”) không thể đứng trước c; a (“then”) phải đứng trước d.", "A. (d–c–b–a): d (“Finally”) mở đầu là vô lý."], "kb": "Chú ý các mốc nối: \"then\"/\"therefore\"/\"however\"/\"as a result\"/\"finally\" luôn cần tiền đề đứng trước.", "authored": false}, {"n": 40, "uid": "40", "part": "READING TRANSFER – WHAT MAKES A JOB A GOOD FIT?", "hd_fix": false, "prompt": "What is the main idea of the passage?", "options": ["Salary and title are the most reliable indicators of long-term career satisfaction.", "Students should avoid careers that include unpredictable schedules or difficult responsibilities.", "Jobs involving clients are generally less suitable than positions with independent work.", "Job fit depends on several conditions, including demands, skills and working preferences."], "keyLetter": "D", "keyText": "Job fit depends on several conditions, including demands, skills and working preferences.", "why": "Trích dẫn: “Yet research into career satisfaction suggests that job fit depends on a wider combination of conditions.” → Ý chính: job fit phụ thuộc nhiều điều kiện → B.", "distractors": ["A. ngược với bài: bài nói salary không phải yếu tố quyết định.", "C. sai: bài không so sánh client jobs kém hơn việc độc lập.", "B. sai: bài không hề khuyên tránh nghề khó."], "kb": "Main idea: tìm câu bao trùm cả bài.", "authored": false}, {"n": 41, "uid": "41", "part": "READING TRANSFER – WHAT MAKES A JOB A GOOD FIT?", "hd_fix": false, "prompt": "According to paragraph 1, which factor can influence career satisfaction?", "options": ["The length of a company name and the appearance of its offices.", "Whether every employee receives exactly the same salary.", "Working hours, responsibilities and opportunities to learn.", "The number of job titles available within the same profession."], "keyLetter": "C", "keyText": "Working hours, responsibilities and opportunities to learn.", "why": "Trích dẫn: “Working hours, responsibilities, opportunities to learn and relationships with other people can all shape how employees experience a job.” → Đúng nguyên văn đoạn 1 → C.", "distractors": ["A. không hề có trong bài.", "D. không hề có trong bài.", "B. sai ở “exactly the same”: bài không nói vậy."], "kb": "“According to paragraph N” → quét đúng đoạn đó.", "authored": false}, {"n": 42, "uid": "42", "part": "READING TRANSFER – WHAT MAKES A JOB A GOOD FIT?", "hd_fix": false, "prompt": "Why does the writer compare two similarly paid jobs?", "options": ["To argue that interaction with demanding clients makes a job automatically unsuitable.", "To demonstrate that salary has no role at all in a person’s career decision.", "To prove that fixed schedules are always more suitable than night-shift work.", "To show that jobs with similar salaries can involve very different working conditions."], "keyLetter": "D", "keyText": "To show that jobs with similar salaries can involve very different working conditions.", "why": "Trích dẫn: “Consider two positions that appear attractive because they offer similar pay… Neither job is automatically better.” → So sánh để chỉ ra lương giống nhau nhưng điều kiện rất khác → A.", "distractors": ["C. sai ở “always”: bài không tuyệt đối hoá.", "A. sai ở “automatically”: bài không nói vậy.", "B. quá tuyệt đối: bài chỉ nói salary không phải tất cả (“no role at all” sai)."], "kb": "Ví dụ so sánh → tìm mục đích của ví dụ.", "authored": false}, {"n": 43, "uid": "43", "part": "READING TRANSFER – WHAT MAKES A JOB A GOOD FIT?", "hd_fix": false, "prompt": "The word “whereas” in paragraph 2 mainly signals ______.", "options": ["an example supporting the first statement", "a reason explaining why the two jobs pay similarly", "a contrast between two different preferences or situations", "a result that follows from the first situation"], "keyLetter": "C", "keyText": "a contrast between two different preferences or situations", "why": "Trích dẫn: “…may struggle with the first, whereas someone who prefers independent work may find the second exhausting.” → “whereas” nối hai tình huống tương phản → B.", "distractors": ["D. là vai trò của “so/therefore” (kết quả), không phải “whereas”.", "A. là vai trò của “for example” (ví dụ).", "B. là vai trò của “because” (lý do)."], "kb": "whereas = while: tương phản.", "authored": false}, {"n": 44, "uid": "44", "part": "READING TRANSFER – WHAT MAKES A JOB A GOOD FIT?", "hd_fix": false, "prompt": "What can be inferred about technical skills?", "options": ["They are useful only in jobs that involve numbers or financial records.", "They are generally less important than communication in every type of occupation.", "They guarantee that a person will manage all interpersonal demands successfully.", "They may help a person enter a profession but may need to be combined with other skills."], "keyLetter": "D", "keyText": "They may help a person enter a profession but may need to be combined with other skills.", "why": "Trích dẫn: “Technical knowledge may help a person enter a profession, but many roles also require communication, adaptability…” → Suy ra: kỹ năng chuyên môn giúp vào nghề nhưng cần kết hợp thêm → B.", "distractors": ["A. sai ở “only”: bài không giới hạn như vậy.", "B. sai ở “every”: quá tuyệt đối.", "C. quá chắc chắn: bài dùng “may”, không “guarantee”."], "kb": "“may help… but also require” → kết hợp nhiều kỹ năng.", "authored": false}, {"n": 45, "uid": "45", "part": "READING TRANSFER – WHAT MAKES A JOB A GOOD FIT?", "hd_fix": false, "prompt": "The word “they” in the final paragraph refers to ______.", "options": ["vacancy notices used to collect information", "students who are choosing between different careers", "people working in the profession", "working conditions described by other employees"], "keyLetter": "B", "keyText": "students who are choosing between different careers", "why": "Trích dẫn: “Students can read vacancy notices, talk to people in the profession and identify the conditions in which they work best.” → Ba động từ song song cùng chủ ngữ “Students” → “they” = students → A.", "distractors": ["C. sai: “they” song song với chủ ngữ “Students”, không phải “people”.", "A. sai: “notices” là vật, không “work”.", "D. sai: “conditions” là vật, không “work”."], "kb": "they/we + V → tìm chủ ngữ song song gần nhất.", "authored": false}, {"n": 46, "uid": "46", "part": "READING TRANSFER – WHAT MAKES A JOB A GOOD FIT?", "hd_fix": false, "prompt": "Which action does the writer recommend before choosing a career?", "options": ["Choosing the position with the highest salary among the available options.", "Selecting a job from its title and learning about the conditions after applying.", "Avoiding conversations with people already working in the profession.", "Gathering evidence about responsibilities, schedules and actual working conditions."], "keyLetter": "D", "keyText": "Gathering evidence about responsibilities, schedules and actual working conditions.", "why": "Trích dẫn: “For this reason, career decisions should be based on evidence rather than job titles or salary alone.” → Tác giả khuyên thu thập evidence trước khi chọn → B.", "distractors": ["A. ngược với bài: đừng chỉ nhìn salary.", "C. ngược với bài: bài khuyên “talk to people in the profession”.", "B. ngược với bài: phải tìm hiểu trước khi chọn, không phải sau khi nộp đơn."], "kb": "“recommend” → tìm câu “should” trong bài.", "authored": false}, {"n": 47, "uid": "47", "part": "READING TRANSFER – WHAT MAKES A JOB A GOOD FIT?", "hd_fix": false, "prompt": "Which statement is TRUE according to the passage?", "options": ["A well-matched job should contain no difficult or stressful responsibilities.", "A regular working schedule is the most suitable arrangement for every employee.", "Client contact is enjoyable for anyone who has strong technical knowledge.", "Different people may respond differently to the same workplace demands."], "keyLetter": "D", "keyText": "Different people may respond differently to the same workplace demands.", "why": "Trích dẫn: “A person who values a fixed routine may struggle with the first, whereas someone who prefers independent work may find the second exhausting.” → Cùng demands nhưng mỗi người phản ứng khác → A.", "distractors": ["B. sai ở “every”: quá tuyệt đối.", "C. sai ở “anyone”: quá tuyệt đối.", "A. ngược với bài: “not to find a job with no difficulties”."], "kb": "TRUE: đối chiếu từng đáp án với evidence.", "authored": fal const PASSAGES={"TNTHPT-STYLE CLOZE": "<p>Choosing a job involves more than deciding whether a salary is attractive. A person should also consider working hours, responsibilities and the skills the position requires. Some employees have to work night (31) ______, while others may need to travel on business. During busy periods, staff may also work (32) ______ to meet deadlines. These demands can become stressful, especially when workers find it difficult to balance work and personal life. At the same time, many jobs require employees to build positive relationships (33) ______ colleagues or clients. A suitable career is therefore one that matches not only a person’s abilities (34) ______ also his or her interests and preferred working conditions. Before applying, candidates should learn as much as possible (35) ______ the position.</p>", "PASSAGE COMPLETION": "<p>A job title alone tells us very little about what daily working life is like. Two people with similar titles may work in very different conditions. (36) ______. For example, one accountant may spend most of the week analysing financial records in an office, while another may travel regularly to meet clients. (37) ______. Students should therefore investigate responsibilities, working hours and required skills instead of choosing a career only because its title sounds attractive.</p>", "READING TRANSFER": "<p>When students think about future careers, salary is often one of the first factors they consider. Yet research into career satisfaction suggests that job fit depends on a wider combination of conditions. Working hours, responsibilities, opportunities to learn and relationships with other people can all shape how employees experience a job.</p><p>Consider two positions that appear attractive because they offer similar pay. One requires frequent night shifts and unpredictable overtime, while the other has regular hours but involves constant interaction with demanding clients. Neither job is automatically better. A person who values a fixed routine may struggle with the first, whereas someone who prefers independent work may find the second exhausting.</p><p>Skills matter as well. Technical knowledge may help a person enter a profession, but many roles also require communication, adaptability and the ability to work with others. An accountant, for instance, may need strong numerical skills, yet dealing effectively with clients can be equally important.</p><p>For this reason, career decisions should be based on evidence rather than job titles or salary alone. Students can read vacancy notices, talk to people in the profession and identify the conditions in which they work best. The aim is not to find a job with no difficulties, but to understand which demands are manageable and which are likely to create long-term dissatisfaction.</p>", "HOMEWORK": "<p>A local technology company recently changed its internship programme after receiving feedback from students. Previously, interns mainly observed full-time employees, so many felt that the experience was not sufficiently (59) ______. The company now gives each intern a small project and assigns a member of staff to provide guidance. Interns are also encouraged to communicate (60) ______ clients during selected meetings. Although the programme can be demanding, students say that the practical responsibilities help them understand what the job actually (61) ______. The company has also reduced unnecessary overtime, (62) ______ has made the schedule easier to manage. Applicants are advised to learn about the role carefully before deciding (63) ______ it suits their interests and skills.</p>"};

const startEpoch=Date.now();
const letters=['A','B','C','D'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
