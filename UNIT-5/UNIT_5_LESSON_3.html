<title>UNIT 5 • LESSON 3 — Ôn bài cũ • Luyện tập • Củng cố</title>
<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:17px/1.65 "Times New Roman",Times,serif}
header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.subtitle{opacity:.92;font-size:18px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}
.toolbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;font-family:system-ui}
.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:system-ui}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}
.GREEN{background:#dcfce7;color:var(--green)}.AMBER{background:#fef3c7;color:var(--amber)}.RED{background:#fee2e2;color:var(--red)}
.TAG{background:#e0e7ff;color:#3730a3}
.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}
table.vocab{width:100%;border-collapse:collapse;margin:12px 0}
table.vocab th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left}
table.vocab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.vocab tr:nth-child(even) td{background:#f8fafc}
.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}
.know b.t{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:22px;font-family:system-ui}
@media(max-width:760px){.toolbar button{flex:1}}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#102a43,#245b8f);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0006}
.gate-box h2{color:var(--navy);margin:0 0 6px}
.gate-box input{width:100%;padding:12px;border:1px solid #bfcadd;border-radius:10px;font-size:17px;margin:12px 0;font-family:system-ui}
.gate-box .primary{width:100%;font-size:17px}
#pwmsg{color:var(--red);font-weight:700;min-height:24px;font-family:system-ui}
.view{display:none}.view.active{display:block}
.backbar{margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:8px}
.hub-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;text-align:left;font-family:"Times New Roman",Times,serif;box-shadow:0 7px 22px #1e293b0b}
.hub-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.hub-card b.t{font-size:21px;color:var(--navy);display:block;margin-bottom:6px}
.hub-card span.d{color:var(--muted);font-size:15px;display:block}
.hub-card .st{margin-top:10px;display:block}
.twopane{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start;margin:12px 0}
.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pane-l{background:#fbfdff}
@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

rt": "TNTHPT READING TRANSFER 1 – READING A JOB ADVERT CRITICALLY", "hd_fix": false, "prompt": "What distinction is illustrated by the two English-language phrases in paragraph 2?", "options": ["weekday availability compared with weekend availability", "technical ability compared with an interpersonal skill", "paid work compared with unpaid work", "an essential requirement compared with a desirable quality"], "keyLetter": "D", "keyText": "an essential requirement compared with a desirable quality", "why": "Trích dẫn: “the first challenge is to separate essential conditions from desirable qualities. “Must have excellent English” is not equivalent to “English would be useful”.” → Phân biệt yêu cầu bắt buộc vs mong muốn → C.", "distractors": ["C. sai: hai cụm đều về yêu cầu tiếng Anh.", "A. sai: không liên quan.", "B. sai: không phải cặp cụm được nêu."], "kb": "Hai cụm trong ngoặc kép → so sánh trực tiếp.", "authored": false}, {"n": 30, "uid": "30", "part": "TNTHPT READING TRANSFER 1 – READING A JOB ADVERT CRITICALLY", "hd_fix": false, "prompt": "What does “ineligible” most nearly mean?", "options": ["likely to receive the highest salary available", "able to work under flexible conditions", "highly experienced in the work being advertised", "unable to be considered because a requirement is not met"], "keyLetter": "D", "keyText": "unable to be considered because a requirement is not met", "why": "Trích dẫn: “…lack of experience does not automatically make a candidate ineligible.” → “ineligible” = không đủ điều kiện để được xét → A.", "distractors": ["C. trái nghĩa.", "A. không liên quan.", "B. không liên quan."], "kb": "ineligible = không đủ điều kiện.", "authored": false}, {"n": 31, "uid": "31", "part": "TNTHPT READING TRANSFER 1 – READING A JOB ADVERT CRITICALLY", "hd_fix": false, "prompt": "Why does the writer mention flexible hours in paragraph 3?", "options": ["To recommend that every student choose flexible work regardless of other conditions.", "To show that schedules are less important than benefits in a job advertisement.", "To show that one attractive feature does not prove that the whole job fits the applicant.", "To argue that jobs with flexible hours are usually unpaid positions for students."], "keyLetter": "C", "keyText": "To show that one attractive feature does not prove that the whole job fits the applicant.", "why": "Trích dẫn: “A student may focus on one appealing feature—perhaps flexible hours—while overlooking an unpaid status or a schedule that conflicts with school.” → Nêu flexible hours để chỉ ra một điểm hấp dẫn không chứng minh cả công việc phù hợp → A.", "distractors": ["D. sai: bài không nói flexible hours thường unpaid.", "A. sai ở “every”: quá tuyệt đối.", "B. sai: bài không so sánh schedules vs benefits."], "kb": "Ví dụ → tìm điều ví dụ minh hoạ.", "authored": false}, {"n": 32, "uid": "32", "part": "TNTHPT READING TRANSFER 1 – READING A JOB ADVERT CRITICALLY", "hd_fix": false, "prompt": "What can be inferred about keyword matching?", "options": ["It can lead to a wrong answer when other essential constraints are ignored.", "It removes the need to compare a candidate’s full situation with the complete advert.", "It works mainly for salary questions because pay information is usually stated directly.", "It is reliable when the same important word appears in both the question and the advertisement."], "keyLetter": "A", "keyText": "It can lead to a wrong answer when other essential constraints are ignored.", "why": "Trích dẫn: “This is why keyword matching is unreliable: the same word can appear in both the question and an advert without proving suitability.” → Suy ra: keyword matching có thể dẫn tới đáp án sai → B.", "distractors": ["D. ngược với bài: keyword matching là “unreliable”.", "C. sai: bài không giới hạn ở câu lương.", "B. ngược với bài: vẫn phải so sánh toàn diện."], "kb": "“unreliable” → đáp án mang nghĩa phủ định.", "authored": false}, {"n": 33, "uid": "33", "part": "TNTHPT READING TRANSFER 1 – READING A JOB ADVERT CRITICALLY", "hd_fix": false, "prompt": "Which statement is TRUE according to paragraph 4?", "options": ["Applicants should use their general knowledge of a job to fill any missing details in an advert.", "Readers should avoid adding job information that the advertisement does not state or support.", "Roles involving children can be described as rewarding without evidence from the advertisement.", "Technology roles can safely be assumed to offer high salaries even when pay is not mentioned."], "keyLetter": "B", "keyText": "Readers should avoid adding job information that the advertisement does not state or support.", "why": "Trích dẫn: “Careful readers decide from what the text supports, not from what they expect the job to be like.” → Đúng: không thêm thông tin bài không nêu → A.", "distractors": ["D. ngược với bài: “unless salary information is stated”.", "C. ngược với bài: cần evidence.", "A. ngược với bài: “decide from what the text supports”."], "kb": "TRUE theo đoạn: bám sát câu văn.", "authored": false}, {"n": 34, "uid": "34", "part": "TNTHPT READING TRANSFER 1 – READING A JOB ADVERT CRITICALLY", "hd_fix": false, "prompt": "The writer’s attitude is best described as ______.", "options": ["analytical and practical about evidence-based job matching", "angry about the way employers write job advertisements", "enthusiastic about every flexible or well-paid student job", "uncertain about whether advertisements can be interpreted accurately"], "keyLetter": "A", "keyText": "analytical and practical about evidence-based job matching", "why": "Trích dẫn: “Careful readers decide from what the text supports, not from what they expect…” → Thái độ phân tích, thực tế về đọc evidence → B.", "distractors": ["B. sai: bài không tức giận.", "C. sai ở “every”: quá tuyệt đối.", "D. sai: tác giả rất chắc chắn về phương pháp."], "kb": "Thái độ: cách tác giả dùng evidence.", "authored": false}, {"n": 35, "uid": "35", "part": "TNTHPT READING TRANSFER 1 – READING A JOB ADVERT CRITICALLY", "hd_fix": false, "prompt": "Which is the best title?", "options": ["Beyond the Job Title: Reading Advertisements for Evidence", "Why Flexible Hours Matter More Than Job Requirements", "The Highest-Paid Student Jobs and How to Find Them", "Why Previous Experience Is Never Important in Recruitment"], "keyLetter": "A", "keyText": "Beyond the Job Title: Reading Advertisements for Evidence", "why": "Trích dẫn: “Careful readers decide from what the text supports, not from what they expect the job to be like.” → Nhan đề: đọc quảng cáo để tìm evidence → B.", "distractors": ["B. sai: bài không xếp hạng flexible hours.", "C. lạc đề.", "D. sai ở “never”: quá tuyệt đối."], "kb": "Title: khớp câu kết của bài.", "authored": false}, {"n": 36, "uid": "36", "part": "TNTHPT READING TRANSFER 2 – TRAINING, EXPERIENCE AND POTENTIAL", "hd_fix": false, "prompt": "What is the main idea of the passage?", "options": ["Training allows applicants to overcome most missing qualifications after recruitment.", "Transferable skills from school activities are equivalent to paid work experience.", "Beginners are generally suitable for jobs that provide structured training.", "Job suitability depends on actual requirements and relevant evidence, not experience alone."], "keyLetter": "D", "keyText": "Job suitability depends on actual requirements and relevant evidence, not experience alone.", "why": "Trích dẫn: “suitability is neither “I have done this exact job before” nor “I am interested, so I qualify”. It is an evidence-based comparison between what the employer actually requires and what the applicant can genuinely demonstrate.” → Ý chính: phù hợp dựa trên yêu cầu thực + evidence → B.", "distractors": ["C. quá hẹp: chỉ nói training.", "A. ngược với bài: “cannot compensate for every missing condition”.", "B. ngược với bài: “the context is different”."], "kb": "“neither… nor…” → ý chính nằm sau.", "authored": false}, {"n": 37, "uid": "37", "part": "TNTHPT READING TRANSFER 2 – TRAINING, EXPERIENCE AND POTENTIAL", "hd_fix": false, "prompt": "Why do some organisations recruit beginners?", "options": ["They may consider previous experience less useful than formal qualifications.", "They may find beginners more willing to accept demanding working conditions.", "They may want new employees to learn their own procedures through training.", "They may have fewer entry requirements for roles designed for new employees."], "keyLetter": "C", "keyText": "They may want new employees to learn their own procedures through training.", "why": "Trích dẫn: “They may provide structured training because they want employees to learn the organisation’s own procedures from the start.” → Tuyển beginners để đào tạo theo quy trình riêng → A.", "distractors": ["B. sai: bài không nói vậy.", "A. sai: bài không so sánh experience vs qualifications.", "D. không phải lý do bài đưa ra."], "kb": "“because” trong bài = đáp án.", "authored": false}, {"n": 38, "uid": "38", "part": "TNTHPT READING TRANSFER 2 – TRAINING, EXPERIENCE AND POTENTIAL", "hd_fix": false, "prompt": "The phrase “these qualities” refers to ______.", "options": ["vacancies designed specifically for young beginners", "transferable skills such as reliability and communication", "school projects, volunteering and responsibilities at home", "previous experience gained through paid employment"], "keyLetter": "A", "keyText": "vacancies designed specifically for young beginners", "why": "Trích dẫn: “…they may pay closer attention to transferable skills: reliability, communication… Evidence for these qualities can come from…” → “these qualities” = transferable skills → C.", "distractors": ["D. sai: đó là thứ đang thiếu, không phải “these qualities”.", "A. sai: “vacancies” là vật.", "C. sai: đó là NGUỒN evidence, không phải qualities."], "kb": "“these + N” → tìm cụm N ngay trước.", "authored": false}, {"n": 39, "uid": "39", "part": "TNTHPT READING TRANSFER 2 – TRAINING, EXPERIENCE AND POTENTIAL", "hd_fix": false, "prompt": "Which is NOT listed as a possible source of evidence for transferable skills?", "options": ["responsibilities at home", "school projects", "volunteering or clubs", "previous salary records"], "keyLetter": "B", "keyText": "school projects", "why": "Trích dẫn: “Evidence for these qualities can come from school projects, volunteering, clubs or responsibilities at home.” → “previous salary records” không được liệt kê → D.", "distractors": ["B. được liệt kê trong bài.", "A. được liệt kê trong bài.", "C. được liệt kê trong bài."], "kb": "NOT listed: quét danh sách trong bài.", "authored": false}, {"n": 40, "uid": "40", "part": "TNTHPT READING TRANSFER 2 – TRAINING, EXPERIENCE AND POTENTIAL", "hd_fix": false, "prompt": "What does the contrast between “required” and “preferred” show?", "options": ["The wording of an advert can indicate different strengths of requirement.", "The two expressions describe similar expectations in different types of jobs.", "Required experience may be overlooked when other skills are demonstrated.", "Preferred experience normally becomes essential when training is provided."], "keyLetter": "A", "keyText": "The wording of an advert can indicate different strengths of requirement.", "why": "Trích dẫn: ““Experience required” creates a stronger barrier than “experience preferred”…” → Tương phản cho thấy cách diễn đạt thể hiện mức độ yêu cầu khác nhau → A.", "distractors": ["D. sai: bài không nói vậy.", "C. ngược với bài: “required” tạo barrier mạnh hơn.", "B. ngược với bài: hai từ khác mức độ."], "kb": "“creates a stronger barrier than” → mức độ khác nhau.", "authored": false}, {"n": 41, "uid": "41", "part": "TNTHPT READING TRANSFER 2 – TRAINING, EXPERIENCE AND POTENTIAL", "hd_fix": false, "prompt": "What can be inferred from paragraph 3?", "options": ["Legal qualifications may be developed after recruitment when training is offered.", "Training can address some gaps but cannot replace every essential condition.", "Applicants without experience are likely to meet other essential requirements.", "Structured training can make fixed availability less important to employers."], "keyLetter": "B", "keyText": "Training can address some gaps but cannot replace every essential condition.", "why": "Trích dẫn: “…“training provided” signals that some knowledge can be developed after recruitment. However, training cannot compensate for every missing condition.” → Suy ra: đào tạo bù được một phần nhưng không thay thế mọi điều kiện → B.", "distractors": ["D. ngược với bài: fixed time vẫn bắt buộc.", "A. ngược với bài: “legally necessary qualification… does not remove”.", "C. quá chắc chắn: bài không hề nói “likely”."], "kb": "“cannot compensate for every” → giới hạn.", "authored": false}, {"n": 42, "uid": "42", "part": "TNTHPT READING TRANSFER 2 – TRAINING, EXPERIENCE AND POTENTIAL", "hd_fix": false, "prompt": "Why does the writer use quotation marks in the final paragraph?", "options": ["To contrast two oversimplified ways of judging an applicant’s suitability", "To reproduce statements made by employers during recruitment interviews", "To present two formal rules applicants should follow when choosing jobs", "To identify expressions commonly found in professional job advertisements"], "keyLetter": "A", "keyText": "To contrast two oversimplified ways of judging an applicant’s suitability", "why": "Trích dẫn: “…suitability is neither “I have done this exact job before” nor “I am interested, so I qualify”.” → Dấu ngoặc kép đối lập hai cách đánh giá phiến diện → C.", "distractors": ["B. sai: đây là lối nghĩ của applicants, không phải employers.", "D. sai: đây là cách tự đánh giá, không phải cụm trong advert.", "C. sai: không phải quy tắc."], "kb": "Ngoặc kép đối lập → hai cách nghĩ sai.", "authored": false}, {"n": 43, "uid": "43", "part": "TNTHPT READING TRANSFER 2 – TRAINING, EXPERIENCE AND POTENTIAL", "hd_fix": false, "prompt": "Which best summarises the final sentence?", "options": ["Applicants should interpret unclear requirements according to their strongest qualities.", "Applicants may treat personal interest as evidence when formal experience is limited.", "Applicants should compare actual requirements with evidence they can genuinely provide.", "Applicants should focus mainly on experience that comes from similar paid positions."], "keyLetter": "C", "keyText": "Applicants should compare actual requirements with evidence they can genuinely provide.", "why": "Trích dẫn: “It is an evidence-based comparison between what the employer actually requires and what the applicant can genuinely demonstrate.” → Tóm tắt: so sánh yêu cầu thực với evidence chứng minh được → A.", "distractors": ["D. ngược với bài: transferable skills cũng được tính.", "B. ngược với bài: “I am interested, so I qualify” bị bác bỏ.", "A. sai: bài nói so sánh với evidence, không phải diễn giải theo ý mình."], "kb": "Câu cuối = đúc kết → paraphrase nó.", "authored": false}, {"n": 44, "uid": "44", "part": "MIXED CLOZE – FROM ADVERT TO APPLICATION", "hd_fix": false, "prompt": "Choose the best option for question 44.", "options": ["where", "who", "whose", "which place"], "keyLetter": "B", "keyText": "who", "why": "Trích dẫn: “A person (44) ______ lacks one optional quality may still be suitable…” → Mệnh đề quan hệ chỉ người, chủ ngữ → “who” → A.", "distractors": ["“where” không phù hợp nhất. a person who lacks... : người mà thiếu...; who chỉ người. Các phương án khác không được passage/evidence hỗ trợ hoặc làm sai meaning, scope, reference hay cấu trúc.", "“whose” không phù hợp nhất. a person who lacks... : người mà thiếu...; who chỉ người. Các phương án khác không được passage/evidence hỗ trợ hoặc làm sai meaning, scope, reference hay cấu trúc.", "“which place” không phù hợp nhất. a person who lacks... : người mà thiếu...; who chỉ người. Các phương án khác không được passage/evidence hỗ trợ hoặc làm sai meaning, scope, reference hay cấu trúc."], "kb": "a person who lacks...", "authored": false}, {"n" const PASSAGES={"REFERENCE & LOCAL COHESION": "<p>BrightStart is seeking two assistants for its weekend learning club. Applicants should enjoy working with teenagers and be able to explain instructions clearly. Previous teaching experience is useful but not essential because full training is provided. The club runs on Saturday mornings. Successful applicants will first observe experienced staff before they lead activities themselves.</p>", "SENTENCE INSERTION": "<p>Many students look first at the job title when reading an advert. [I] A familiar title, however, may hide very different duties and conditions. [II] One shop assistant may mainly serve customers, while another may spend much of the day organising stock. [III] The schedule, training and required personal qualities can also differ. [IV] Applicants should therefore read the evidence in the whole advert before deciding whether a role suits them.</p>", "PASSAGE COMPLETION": "<p>Job advertisements often separate essential requirements from benefits offered by the employer. Candidates should identify this distinction before applying. (25) ______. By contrast, flexible hours, free meals or a performance bonus are usually benefits rather than entry conditions. (26) ______. A careful reader therefore asks two questions: “What must I bring to the role?” and “What will the role offer me?”</p>", "READING TRANSFER 1": "<p>Students often assume that a job advertisement is mainly designed to describe a position. In reality, it performs at least two functions: it filters applicants and it persuades suitable people to apply. This explains why adverts mix requirements with attractive features such as flexible schedules, training or additional benefits.</p><p>For applicants, the first challenge is to separate essential conditions from desirable qualities. “Must have excellent English” is not equivalent to “English would be useful”. Similarly, “no experience required” does not mean experience has no value; it means lack of experience does not automatically make a candidate ineligible. Small differences in wording can therefore change who should apply.</p><p>The second challenge is to test the whole job against the whole person. A student may focus on one appealing feature—perhaps flexible hours—while overlooking an unpaid status or a schedule that conflicts with school. A strong match requires several conditions to fit at the same time. This is why keyword matching is unreliable: the same word can appear in both the question and an advert without proving suitability.</p><p>Finally, candidates should distinguish evidence from assumptions. A role involving children may seem rewarding, but the advert may not actually promise that experience. Likewise, a technology role may sound highly paid, but unless salary information is stated, that conclusion is external knowledge. Careful readers decide from what the text supports, not from what they expect the job to be like.</p>", "READING TRANSFER 2": "<p>Many young applicants avoid vacancies that sound professional because they assume employers expect a long record of experience. Yet some organisations deliberately recruit beginners. They may provide structured training because they want employees to learn the organisation’s own procedures from the start.</p><p>This does not mean that employers ignore evidence of ability. When formal experience is absent, they may pay closer attention to transferable skills: reliability, communication, organisation, willingness to learn and the ability to work with others. Evidence for these qualities can come from school projects, volunteering, clubs or responsibilities at home. The context is different from paid employment, but the underlying behaviour may still be relevant.</p><p>Applicants therefore need to read requirements precisely. “Experience required” creates a stronger barrier than “experience preferred”, while “training provided” signals that some knowledge can be developed after recruitment. However, training cannot compensate for every missing condition. If a role requires availability at a fixed time or a legally necessary qualification, willingness to learn does not remove that requirement.</p><p>The broader lesson is that suitability is neither “I have done this exact job before” nor “I am interested, so I qualify”. It is an evidence-based comparison between what the employer actually requires and what the applicant can genuinely demonstrate.</p>", "MIXED CLOZE": "<p>Before applying for a job, candidates should identify which requirements are essential and which are merely preferred. A person (44) ______ lacks one optional quality may still be suitable, whereas missing an essential condition can be decisive. Applicants should also check working hours carefully, (45) ______ a role may conflict with school or family responsibilities. If training is provided, beginners may have a realistic chance, (46) ______ they should not assume that training removes every requirement. Strong applications use evidence (47) ______ school, volunteering or previous work to demonstrate relevant skills. The final decision should therefore be based (48) ______ the complete match between applicant and role.</p>"};

const startEpoch=Date.now();
const letters=['A','B','C','D'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
