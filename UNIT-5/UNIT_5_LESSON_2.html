<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:17px/1.65 "Times New Roman",Times,serif}
header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.subtitle{opacity:.92;font-size:18px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}
.toolbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;font-family:system-ui}
.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:system-ui}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}
.GREEN{background:#dcfce7;color:var(--green)}.AMBER{background:#fef3c7;color:var(--amber)}.RED{background:#fee2e2;color:var(--red)}
.TAG{background:#e0e7ff;color:#3730a3}
.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}
table.vocab{width:100%;border-collapse:collapse;margin:12px 0}
table.vocab th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left}
table.vocab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.vocab tr:nth-child(even) td{background:#f8fafc}
.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}
.know b.t{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:22px;font-family:system-ui}
@media(max-width:760px){.toolbar button{flex:1}}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#102a43,#245b8f);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0006}
.gate-box h2{color:var(--navy);margin:0 0 6px}
.gate-box input{width:100%;padding:12px;border:1px solid #bfcadd;border-radius:10px;font-size:17px;margin:12px 0;font-family:system-ui}
.gate-box .primary{width:100%;font-size:17px}
#pwmsg{color:var(--red);font-weight:700;min-height:24px;font-family:system-ui}
.view{display:none}.view.active{display:block}
.backbar{margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:8px}
.hub-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;text-align:left;font-family:"Times New Roman",Times,serif;box-shadow:0 7px 22px #1e293b0b}
.hub-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.hub-card b.t{font-size:21px;color:var(--navy);display:block;margin-bottom:6px}
.hub-card span.d{color:var(--muted);font-size:15px;display:block}
.hub-card .st{margin-top:10px;display:block}
.twopane{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start;margin:12px 0}
.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pane-l{background:#fbfdff}
@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

red : bắt buộc/cần thiết; mạnh hơn preferred/desirable : được ưu tiên/đáng mong muốn. Các lựa chọn khác không phù hợp nhất về từ loại, collocation, quan hệ mệnh đề, ngữ pháp hoặc evidence."], "kb": "essential/required : bắt buộc/cần thiết; mạnh hơn preferred/desirable : được ưu tiên/đáng mong muốn", "authored": false}, {"n": 49, "uid": "49", "part": "PASSAGE COMPLETION – CLAUSE RELATION", "hd_fix": false, "prompt": "Choose the best option for blank (49).", "options": ["Candidates may compare their experience with the qualities listed before preparing an application.", "Applicants may also make the opposite mistake by overlooking a clearly stated essential requirement.", "Employers may describe essential requirements separately from other desirable qualities in an advertisement.", "Applicants may focus on preferred qualities when deciding which strengths to mention in their application."], "keyLetter": "B", "keyText": "Applicants may also make the opposite mistake by overlooking a clearly stated essential requirement.", "why": "Trích dẫn: “…may decide not to apply even though he or she meets all the necessary conditions. (49) ______.” → Cần câu nêu lỗi ngược lại → A.", "distractors": ["“Applicants may focus on preferred qualities when deciding which strengths to mention in their application.” không phù hợp nhất. opposite mistake : sai lầm ngược lại. Các lựa chọn khác không phù hợp nhất về từ loại, collocation, quan hệ mệnh đề, ngữ pháp hoặc evidence.", "“Employers may describe essential requirements separately from other desirable qualities in an advertisement.” không phù hợp nhất. opposite mistake : sai lầm ngược lại. Các lựa chọn khác không phù hợp nhất về từ loại, collocation, quan hệ mệnh đề, ngữ pháp hoặc evidence.", "“Candidates may compare their experience with the qualities listed before preparing an application.” không phù hợp nhất. opposite mistake : sai lầm ngược lại. Các lựa chọn khác không phù hợp nhất về từ loại, collocation, quan hệ mệnh đề, ngữ pháp hoặc evidence."], "kb": "opposite mistake : sai lầm ngược lại", "authored": false}, {"n": 50, "uid": "50", "part": "SENTENCE ORDERING – COHESION", "hd_fix": false, "prompt": "Choose the best option for blank (50).<br>a. She then compared these requirements with her own qualifications.<br>b. Hoa found an advertisement for a laboratory assistant position.<br>c. After deciding that she met the essential criteria, she updated her CV.<br>d. Finally, she submitted the application before the deadline.", "options": ["a – b – d – c", "b – a – c – d", "d – b – a – c", "b – c – a – d"], "keyLetter": "B", "keyText": "b – a – c – d", "why": "b (thấy quảng cáo) → a (“then”: so sánh “these requirements” với năng lực) → c (“After deciding”: đủ tiêu chí → cập nhật CV) → d (“Finally”: nộp đơn).", "distractors": ["A. (a–b–d–c): a (“these requirements”) ám chỉ quảng cáo ở b, không thể đứng trước b.", "D. (b–c–a–d): c (“After deciding that she met the criteria”) chỉ đúng sau khi đã so sánh ở a.", "C. (d–b–a–c): d (“Finally”) mở đầu là vô lý."], "kb": "Chú ý các mốc nối: \"then\"/\"therefore\"/\"however\"/\"as a result\"/\"finally\" luôn cần tiền đề đứng trước.", "authored": false}, {"n": 51, "uid": "51", "part": "SENTENCE ORDERING – COHESION", "hd_fix": false, "prompt": "Choose the best option for blank (51).<br>a. The company therefore introduced a flexible working policy.<br>b. Staff surveys showed that long commuting times were a major concern.<br>c. Six months later, another survey found higher employee satisfaction.<br>d. Managers reviewed several possible ways to address the problem.", "options": ["b – a – d – c", "c – b – d – a", "d – b – c – a", "b – d – a – c"], "keyLetter": "D", "keyText": "b – d – a – c", "why": "b (khảo sát: lo ngại đi lại) → d (xem xét cách giải quyết “the problem”) → a (“therefore”: áp dụng chính sách linh hoạt) → c (“Six months later”: kết quả khảo sát sau).", "distractors": ["C. (d–b–c–a): b (phát hiện vấn đề) phải trước d (tìm giải pháp); c (kết quả 6 tháng sau) không thể đứng giữa.", "A. (b–a–d–c): a (“therefore”) phải theo sau d (xem xét xong mới quyết định), không thể ngay sau b.", "B. (c–b–d–a): c (“Six months later”) là kết quả cuối cùng, không thể mở đầu."], "kb": "Chú ý các mốc nối: \"then\"/\"therefore\"/\"however\"/\"as a result\"/\"finally\" luôn cần tiền đề đứng trước.", "authored": false}, {"n": 52, "uid": "52", "part": "READING TRANSFER – SENTENCE STRUCTURE CARRIES MEANING", "hd_fix": false, "prompt": "What is the main idea?", "options": ["All qualifications in a job advertisement carry the same level of importance.", "Vocabulary is less important than grammar in every type of workplace communication.", "Sentence structure and connectors help readers understand how requirements and ideas are related.", "Job advertisements should use only simple sentences so that requirements are easy to identify."], "keyLetter": "C", "keyText": "Sentence structure and connectors help readers understand how requirements and ideas are related.", "why": "Trích dẫn: “Their sentence structure often reveals how employers rank information.” + “the strongest habit is therefore to ask not only “What do these words mean?” but also “How are these ideas connected?”” → Ý chính: cấu trúc câu và connectors giúp hiểu yêu cầu → B.", "distractors": ["D. sai: bài không hề đề xuất chỉ dùng câu đơn.", "B. sai ở “every”: quá tuyệt đối.", "A. ngược với bài: cấu trúc cho thấy cách “rank information”."], "kb": "Main idea: câu bao trùm + câu kết.", "authored": false}, {"n": 53, "uid": "53", "part": "READING TRANSFER – SENTENCE STRUCTURE CARRIES MEANING", "hd_fix": false, "prompt": "According to paragraph 1, “although” usually signals ______.", "options": ["a condition that must be met", "a contrast between two ideas", "a reason supporting the main clause", "a result following from a previous idea"], "keyLetter": "B", "keyText": "a contrast between two ideas", "why": "Trích dẫn: “a clause beginning with “although” warns readers that the writer is about to contrast two ideas” → “although” báo hiệu tương phản → C.", "distractors": ["D. là vai trò của “so” (kết quả).", "C. là vai trò của “because” (lý do).", "A. là vai trò của “if” (điều kiện)."], "kb": "although = contrast; because = reason.", "authored": false}, {"n": 54, "uid": "54", "part": "READING TRANSFER – SENTENCE STRUCTURE CARRIES MEANING", "hd_fix": false, "prompt": "Why does the writer compare two sentences containing “degree” and “experience”?", "options": ["To suggest that applicants should focus on familiar keywords rather than clause relationships.", "To demonstrate that employers usually use identical wording for different qualifications.", "To show that similar vocabulary can express different requirements when the structure changes.", "To argue that experience should always be essential and a degree should always be preferred."], "keyLetter": "C", "keyText": "To show that similar vocabulary can express different requirements when the structure changes.", "why": "Trích dẫn: “The vocabulary is almost identical; the logical structure changes the requirement.” → So sánh để chỉ ra cùng từ vựng nhưng cấu trúc khác → yêu cầu khác → A.", "distractors": ["D. sai ở “always”: quá tuyệt đối.", "B. ngược với bài: từ vựng “almost identical” nhưng cấu trúc khác.", "A. ngược với bài: bài phê phán việc chỉ nhìn keywords."], "kb": "Ví dụ → tìm điều ví dụ chứng minh.", "authored": false}, {"n": 55, "uid": "55", "part": "READING TRANSFER – SENTENCE STRUCTURE CARRIES MEANING", "hd_fix": false, "prompt": "The word “them” in paragraph 2 refers to ______.", "options": ["the employers who create job advertisements", "the two complete sentences compared in the example", "the applicants who read advertisements quickly", "the familiar keywords or requirements noticed by applicants"], "keyLetter": "D", "keyText": "the familiar keywords or requirements noticed by applicants", "why": "Trích dẫn: “Someone may notice familiar keywords such as “experience” or “degree” but miss the relationship between them.” → “them” = familiar keywords (experience/degree) → C.", "distractors": ["C. sai: “applicants” là người đọc, không phải “them”.", "A. sai: “employers” không được nhắc ở câu này.", "B. sai: hai câu ví dụ đứng sau, không phải tiền đề."], "kb": "them/they → danh từ số nhiều gần nhất hợp nghĩa.", "authored": false}, {"n": 56, "uid": "56", "part": "READING TRANSFER – SENTENCE STRUCTURE CARRIES MEANING", "hd_fix": false, "prompt": "What can be inferred from paragraph 3?", "options": ["Longer and more complex sentences are automatically clearer in application writing.", "Simple sentences should be avoided because they cannot express a complete idea.", "Grammatical complexity is useful only when it shows relationships accurately and clearly.", "Applications become more professional when writers add several connectors to each sentence."], "keyLetter": "C", "keyText": "Grammatical complexity is useful only when it shows relationships accurately and clearly.", "why": "Trích dẫn: “However, complexity is useful only when it remains accurate.” → Suy ra: phức tạp chỉ hữu ích khi thể hiện quan hệ chính xác, rõ ràng → B.", "distractors": ["A. ngược với bài: phức tạp không tự động rõ ràng hơn.", "B. sai: bài không cấm câu đơn.", "D. ngược với bài: “Adding unnecessary clauses… harder to understand”."], "kb": "“useful only when” → điều kiện giới hạn.", "authored": false}, {"n": 57, "uid": "57", "part": "READING TRANSFER – SENTENCE STRUCTURE CARRIES MEANING", "hd_fix": false, "prompt": "Which statement is TRUE?", "options": ["Changing a connector or clause relationship can change the meaning of a requirement.", "Applicants can determine a requirement accurately from keywords without reading the sentence structure.", "The word “preferred” normally expresses a stronger condition than the word “essential”.", "Employers use the same hierarchy of requirements in every advertisement."], "keyLetter": "A", "keyText": "Changing a connector or clause relationship can change the meaning of a requirement.", "why": "Trích dẫn: ““A degree is preferred, but relevant experience is essential” is very different from “A degree is essential, but experience is preferred.”” → Đổi connector/quan hệ mệnh đề làm đổi nghĩa yêu cầu → A.", "distractors": ["B. ngược với bài: phải đọc mối quan hệ, không chỉ keywords.", "C. ngược với bài: “essential… carries more force than… preferred”.", "D. sai ở “every”: quá tuyệt đối."], "kb": "TRUE: đối chiếu nguyên văn.", "authored": false}, {"n": 58, "uid": "58", "part": "READING TRANSFER – SENTENCE STRUCTURE CARRIES MEANING", "hd_fix": false, "prompt": "What is the function of the final paragraph?", "options": ["To argue that grammar should be studied separately from real-world workplace communication.", "To list the qualifications that applicants should include in every application.", "To state a general reading principle that extends beyond the examples in the passage.", "To introduce another vacancy that uses several complex grammatical structures."], "keyLetter": "C", "keyText": "To state a general reading principle that extends beyond the examples in the passage.", "why": "Trích dẫn: “For exam reading and real-world communication alike, the strongest habit is therefore to ask not only “What do these words mean?” but also “How are these ideas connected?”” → Đoạn cuối nêu nguyên tắc đọc chung, vượt ra ngoài ví dụ → B.", "distractors": ["D. sai: đoạn cuối không đưa ví dụ tuyển dụng mới nào.", "A. ngược với bài: bài gắn grammar với real-world communication.", "B. sai: đoạn cuối không liệt kê phẩm chất nào."], "kb": "“For… alike” → nguyên tắc chung.", "authored": false}, {"n": 59, "uid": "59", "part": "READING TRANSFER – SENTENCE STRUCTURE CARRIES MEANING", "hd_fix": false, "prompt": "Best title?", "options": ["Why Employers Prefer Long and Complex Advertisements", "How to Identify a Vacancy Without Reading the Full Advert", "Beyond Keywords: Reading the Connections", "The Only Grammar Rules Needed for Job Applications"], "keyLetter": "C", "keyText": "Beyond Keywords: Reading the Connections", "why": "Trích dẫn: “the strongest habit is therefore to ask not only “What do these words mean?” but also “How are these ideas connected?”” → Nhan đề: vượt qua keywords — đọc các mối liên kết → B.", "distractors": ["A. sai: bài không hề ưa quảng cáo dài dòng.", "D. sai ở “only”: quá tuyệt đối.", "B. ngược với bài: bài kêu gọi đọc kỹ, không phải đọc lướt."], "kb": "Title: khớp thông điệp đoạn cuối.", "authored": false}, {"n": 60, "uid": "60", "part": "MIXED ADVANCED TRANSFER", "hd_fix": false, "prompt": "Choose the best option for blank (60).", "options": ["if", "but", "so", "because"], "keyLetter": "B", "keyText": "but", "why": "Trích dẫn: “…understood technical procedures (60) ______ struggled to communicate with clients.” → Tương phản → “but” → B.", "distractors": ["“because” không phù hợp nhất. but : nhưng; technical procedures ↔ struggle to communicate. Các lựa chọn khác không phù hợp nhất về từ loại, collocation, quan hệ mệnh đề, ngữ pháp hoặc evidence.", "“so” không phù hợp nhất. but : nhưng; technical procedures ↔ struggle to communicate. Các lựa chọn khác không phù hợp nhất về từ loại, collocation, quan hệ mệnh đề, ngữ pháp hoặc evidence.", "“if” không phù hợp nhất. but : nhưng; technical procedures ↔ struggle to communicate. Các lựa chọn khác không phù hợp nhất về từ loại, collocation, quan hệ mệnh đề, ngữ pháp hoặc evidence."], "kb": "but : nhưng; technical procedures ↔ struggle to communicate", "authored": false}, {"n": 61, "uid": "61", "part": "MIXED ADVANCED TRANSFER", "hd_fix": false, "prompt": "Choose the best option for blank (61).", "options": ["who", "whose", "which place", "where"], "keyLetter": "A", "keyText": "who", "why": "Trích dẫn: “New recruits work with mentors (61) ______ provide feedback after each meeting.” → Chỉ người, vị trí chủ ngữ → “who” → D.", "distractors": ["“where” không phù hợp nhất. mentors who provide feedback : người hướng dẫn đưa p const PASSAGES={"LANGUAGE-IN-CONTEXT CLOZE": "<p>A graduate recruitment programme can help young people move from education into employment. Applicants are usually asked to submit a CV and explain why they are interested in the role. Some employers require previous experience, (43) ______ others focus more on potential and willingness to learn. Candidates (44) ______ meet the basic requirements may then be invited to an interview. The process can be competitive, (45) ______ careful preparation is important. Applicants should research the organisation before the interview (46) ______ they can give specific answers rather than general ones. Even if a candidate is not selected, the experience can still be useful (47) ______ it provides practice for future applications.</p>", "PASSAGE COMPLETION": "<p>Job advertisements often contain a large amount of information in a small space. Candidates need to distinguish essential requirements from qualities that are merely preferred. (48) ______. A person who ignores this distinction may decide not to apply even though he or she meets all the necessary conditions. (49) ______. Reading the advertisement carefully therefore helps applicants judge both their suitability and the evidence they should include in an application.</p>", "READING TRANSFER": "<p>Job advertisements are not simply lists of nouns and qualifications. Their sentence structure often reveals how employers rank information. A requirement introduced by “must” or “essential” normally carries more force than one described as “preferred”. Similarly, a clause beginning with “although” warns readers that the writer is about to contrast two ideas, while a clause beginning with “because” supplies a reason.</p><p>These signals matter because applicants often read advertisements quickly. Someone may notice familiar keywords such as “experience” or “degree” but miss the relationship between them. For instance, “A degree is preferred, but relevant experience is essential” is very different from “A degree is essential, but experience is preferred.” The vocabulary is almost identical; the logical structure changes the requirement.</p><p>Sentence structure also matters when candidates write applications. A series of short simple sentences may be grammatically correct but can make relationships between ideas unclear. Compound and complex sentences allow writers to show cause, contrast, condition and result explicitly. However, complexity is useful only when it remains accurate. Adding unnecessary clauses or connectors can make an application harder rather than easier to understand.</p><p>For exam reading and real-world communication alike, the strongest habit is therefore to ask not only “What do these words mean?” but also “How are these ideas connected?”</p>", "MIXED ADVANCED TRANSFER": "<p>A company redesigned its graduate programme after managers noticed that many new employees understood technical procedures (60) ______ struggled to communicate with clients. The revised programme now combines technical training with supervised client meetings. New recruits work with mentors (61) ______ provide feedback after each meeting. The company has also introduced short workshops on workplace communication, (62) ______ employees can practise explaining complex information clearly. Although the programme requires additional staff time, managers have kept it (63) ______ early results suggest that new employees become independent more quickly. The scheme illustrates an important principle: technical ability matters, (64) ______ it is often most effective when combined with communication skills.</p>"};

 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
