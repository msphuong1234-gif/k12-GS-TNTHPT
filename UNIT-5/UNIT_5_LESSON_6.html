<title>UNIT 5 • THE WORLD OF WORK • LESSON 6 — Ôn bài cũ • Luyện tập • Củng cố</title>
<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:17px/1.65 "Times New Roman",Times,serif}
header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.subtitle{opacity:.92;font-size:18px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}
.toolbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;font-family:system-ui}
.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:system-ui}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}
.GREEN{background:#dcfce7;color:var(--green)}.AMBER{background:#fef3c7;color:var(--amber)}.RED{background:#fee2e2;color:var(--red)}
.TAG{background:#e0e7ff;color:#3730a3}
.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}
table.vocab{width:100%;border-collapse:collapse;margin:12px 0}
table.vocab th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left}
table.vocab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.vocab tr:nth-child(even) td{background:#f8fafc}
.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}
.know b.t{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:22px;font-family:system-ui}
@media(max-width:760px){.toolbar button{flex:1}}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#102a43,#245b8f);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0006}
.gate-box h2{color:var(--navy);margin:0 0 6px}
.gate-box input{width:100%;padding:12px;border:1px solid #bfcadd;border-radius:10px;font-size:17px;margin:12px 0;font-family:system-ui}
.gate-box .primary{width:100%;font-size:17px}
#pwmsg{color:var(--red);font-weight:700;min-height:24px;font-family:system-ui}
.view{display:none}.view.active{display:block}
.backbar{margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:8px}
.hub-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;text-align:left;font-family:"Times New Roman",Times,serif;box-shadow:0 7px 22px #1e293b0b}
.hub-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.hub-card b.t{font-size:21px;color:var(--navy);display:block;margin-bottom:6px}
.hub-card span.d{color:var(--muted);font-size:15px;display:block}
.hub-card .st{margin-top:10px;display:block}
.twopane{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start;margin:12px 0}
.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pane-l{background:#fbfdff}
@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

 – WORD FAMILIES", "hd_fix": false, "prompt": "Parents need a ______ babysitter.", "options": ["reliable", "relevant", "reliability", "rely"], "keyLetter": "A", "keyText": "reliable", "why": "Đáp án đúng là “reliable” vì trước danh từ “babysitter” cần tính từ; “reliable” = đáng tin cậy.", "distractors": ["D. “rely” là động từ, sai từ loại.", "C. “reliability” là danh từ, sai từ loại.", "B. “relevant” = liên quan, sai nghĩa."], "kb": "reliable (adj) — rely (v) — reliability (n).", "authored": false}, {"n": 35, "uid": 35, "part": "PART 3 – WORD FAMILIES", "hd_fix": false, "prompt": "Employers value clear ______.", "options": ["communication", "reliability", "communicative", "communicate"], "keyLetter": "A", "keyText": "communication", "why": "Đáp án đúng là “communication” vì sau tính từ “clear” cần danh từ; “communication” = sự giao tiếp.", "distractors": ["D. “communicate” là động từ, sai từ loại.", "C. “communicative” là tính từ, sai từ loại.", "B. “reliability” là danh từ nhưng nghĩa là “sự đáng tin cậy”, sai nghĩa."], "kb": "communication (n) = sự giao tiếp.", "authored": false}, {"n": 36, "uid": 36, "part": "PART 3 – WORD FAMILIES", "hd_fix": false, "prompt": "The noun meaning “sự đáng tin cậy” is ______.", "options": ["reliable", "reliability", "relevance", "rely"], "keyLetter": "B", "keyText": "reliability", "why": "Đáp án đúng là “reliability” vì hậu tố “-ity” tạo danh từ trừu tượng: “reliability” = sự đáng tin cậy.", "distractors": ["A. “reliable” là tính từ, sai từ loại.", "D. “rely” là động từ, sai từ loại.", "C. “relevance” là danh từ nhưng nghĩa là “sự liên quan”, sai nghĩa."], "kb": "reliable (adj) → reliability (n).", "authored": false}, {"n": 37, "uid": 37, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“communicate confidently with customers” is closest in meaning to ______.", "options": ["interact confidently with customers", "weekend availability is a requirement", "experience is an advantage, but applicants without it may sti i nghĩa.", "C. nói về bằng chứng cụ thể — sai nghĩa."], "kb": "selective rather than autobiographical = chọn lọc, không kể lể toàn bộ.", "authored": false}, {"n": 42, "uid": 42, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“specific evidence is stronger than unsupported labels” is closest in meaning to ______.", "options": ["concrete evidence is more convincing than an unproven self-description", "some job procedures may be learned after recruitment", "experience is an advantage, but applicants without it may still be considered", "interact confidently with customers"], "keyLetter": "A", "keyText": "concrete evidence is more convincing than an unproven self-description", "why": "Đáp án đúng giữ nguyên cấu trúc so sánh: “specific/concrete evidence” đồng nghĩa, “stronger/more convincing” đồng nghĩa, “unsupported labels/unproven self-description” đồng nghĩa.", "distractors": ["C. nói về kinh nghiệm được ưu tiên — sai nghĩa.", "B. nói về học quy trình sau tuyển dụng — sai nghĩa.", "D. nói về giao tiếp tự tin — sai nghĩa."], "kb": "Specific evidence > unsupported labels.", "authored": false}, {"n": 43, "uid": 43, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which expression means “mong nhận được phản hồi từ ai”?", "options": ["be available for an interview", "look forward to hearing from somebody", "remain formal and concise", "find one’s CV attached"], "keyLetter": "B", "keyText": "look forward to hearing from somebody", "why": "Đáp án đúng là “look forward to hearing from somebody” — cụm cố định ở cuối thư, nghĩa là mong nhận được phản hồi từ ai.", "distractors": ["D. nghĩa là “đính kèm CV để tham khảo”.", "C. nghĩa là “giữ văn phong trang trọng và súc tích”.", "A. nghĩa là “sẵn sàng tham gia phỏng vấn”."], "kb": "look forward to hearing from somebody = mong nhận được phản hồi từ ai.", "authored": false}, {"n": 44, "uid": 44, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which expression means “có khả năng sử dụng tiếng Anh tốt”?", "options": ["develop teamwork skills", "be willing to learn", "provide relevant information", "have a good command of English"], "keyLetter": "D", "keyText": "have a good command of English", "why": "Đáp án đúng là “have a good command of English” = sử dụng tiếng Anh thành thạo.", "distractors": ["A. nghĩa là “phát triển kỹ năng làm việc nhóm”.", "C. nghĩa là “cung cấp thông tin liên quan”.", "B. nghĩa là “sẵn sàng học hỏi” nhưng thiếu tân ngữ “new procedures”."], "kb": "have a good command of English = sử dụng tiếng Anh thành thạo.", "authored": false}, {"n": 45, "uid": 45, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "The noun form related to “reliable” is ______.", "options": ["organisation", "reliability", "relevance", "rely"], "keyLetter": "B", "keyText": "reliability", "why": "Đáp án đúng là “reliability” — danh từ của “reliable” (hậu tố -ity).", "distractors": ["D. “rely” là động từ, sai từ loại.", "C. “relevance” là danh từ của “relevant”, sai gốc từ.", "A. “organisation” là danh từ của “organise”, sai gốc từ."], "kb": "reliable (adj) → reliability (n).", "authored": false}, {"n": 46, "uid": 46, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "The adjective form related to “relevance” is ______.", "options": ["experienced", "reliability", "relevant", "relevantly"], "keyLetter": "C", "keyText": "relevant", "why": "Đáp án đúng là “relevant” — tính từ của “relevance”.", "distractors": ["D. “relevantly” là trạng từ, sai từ loại.", "B. “reliability” là danh từ của “reliable”, sai gốc từ.", "A. “experienced” là tính từ của “experience”, sai gốc từ."], "kb": "relevance (n) → relevant (adj).", "authored": false}, {"n": 47, "uid": 47, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "“training will be provided” is closest in meaning to ______.", "options": ["some job procedures may be learned after recruitment", "training must be completed before applying", "no training is available", "experience is always compulsory"], "keyLetter": "A", "keyText": "some job procedures may be learned after recruitment", "why": "Đáp án đúng diễn đạt “will be provided” = sẽ được cung cấp (sau khi tuyển): một số quy trình có thể học sau khi được tuyển.", "distractors": ["B. “training must be completed before applying” — đảo ngược thời gian (trước khi nộp đơn), sai.", "C. “no training is available” — trái nghĩa hoàn toàn.", "D. “experience is always compulsory” — thêm ý “luôn bắt buộc” không có trong câu gốc."], "kb": "will be provided → học/nhận sau khi tuyển, không phải trước.", "authored": false}, {"n": 48, "uid": 48, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which source principle is correct?", "options": ["Self-labels are always stronger than evidence.", "Concrete evidence is more convincing than an unsupported self-description.", "An application should include a full autobiography.", "Only unrelated experience should be included."], "keyLetter": "B", "keyText": "Concrete evidence is more convincing than an unsupported self-description.", "why": "Đáp án đúng nêu đúng nguyên tắc thư ứng tuyển: bằng chứng cụ thể thuyết phục hơn tự nhận xét chung chung.", "distractors": ["A. “Self-labels are always stronger” — trái ngược nguyên tắc.", "C. “include a full autobiography” — trái nguyên tắc “selective”.", "D. “Only unrelated experience” — trái nguyên tắc relevance."], "kb": "Evidence > self-labels; selective > autobiographical.", "authored": false}, {"n": 49, "uid": 49, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which expression means “đưa ra bằng chứng từ kinh nghiệm trước”?", "options": ["provide relevant information", "apply for a part-time position", "remain formal and concise", "provide evidence from previous experience"], "keyLetter": "D", "keyText": "provide evidence from previous experience", "why": "Đáp án đúng là “provide evidence from previous experience” vì “provide evidence” = đưa ra bằng chứng và “from previous experience” = từ kinh nghiệm trước.", "distractors": ["A. nghĩa là “cung cấp thông tin liên quan”.", "C. nghĩa là “giữ văn phong trang trọng và súc tích”.", "B. nghĩa là “ứng tuyển vị trí bán thời gian”."], "kb": "provide evidence from previous experience = đưa ra bằng chứng từ kinh nghiệm trước.", "authored": false}]},"p2":{"title":"PHẦN 2 — LUYỆN TẬP","desc":"29 câu: collocation & word form, lọc evidence theo yêu cầu tuyển dụng, kiểm soát paraphrase, chức năng từng phần của thư, passage completion, sentence ordering, cloze.","questions":[{"n": 1, "uid": 1, "part": "I. COLLOCATION & WORD FORM – WORKPLACE LANGUAGE", "hd_fix": false, "prompt": "Applicants should provide ______ information about skills that match the vacancy.", "options": ["relevance", "irrelevance", "relevantly", "relevant"], "keyLetter": "D", "keyText": "relevant", "why": "Đáp án đúng là “relevant” vì sau “provide” cần tính từ + danh từ: “relevant information” = thông tin liên quan.", "distractors": ["A. “relevance” là danh từ, sai từ loại.", "C. “relevantly” là trạng từ, sai từ loại.", "B. “irrelevance” là danh từ phủ định, sai từ loại và nghĩa."], "kb": "provide + tính từ + danh từ: provide relevant information.", "authored": false}, {"n": 2, "uid": 2, "part": "I. COLLOCATION & WORD FORM – WORKPLACE LANGUAGE", "hd_fix": false, "prompt": "Previous customer-service ______ would be an advantage.", "options": ["experiencing", "experiential", "experience", "experienced"], "keyLetter": "C", "keyText": "experience", "why": "Đáp án đúng là “experience” vì cụm danh từ “customer-service experience” = kinh nghiệm dịch vụ khách hàng; sau tính từ ghép cần danh từ.", "distractors": ["D. “experienced” là tính từ, sai từ loại.", "B. “experiential” = thuộc trải nghiệm, sai nghĩa.", "A. “experiencing” là V-ing, không tạo cụm đúng."], "kb": "Sau tính từ ghép cần danh từ: customer-service experience.", "authored": false}, {"n": 3, "uid": 3, "part": "I. COLLOCATION & WORD FORM – WORKPLACE LANGUAGE", "hd_fix": false, "prompt": "The company is looking for a reliable and well-______ candidate.", "options": ["organised", "organise", "organising", "organisation"], "keyLetter": "A", "keyText": "organised", "why": "Đáp án đúng là “organised” vì “well-” + quá khứ phân từ tạo tính từ ghép: “well-organised” = có tổ chức.", "distractors": ["D. “organisation” là danh từ, sai từ loại.", "B. “organise” là động từ nguyên thể, không tạo tính từ ghép.", "C. “organising” là V-ing, sai dạng."], "kb": "well + V-ed → tính từ ghép.", "authored": false}, {"n": 4, "uid": 4, "part": "I. COLLOCATION & WORD FORM – WORKPLACE LANGUAGE", "hd_fix": false, "prompt": "I am confident ______ my ability to communicate with customers in English.", "options": ["in", "at", "about", "for"], "keyLetter": "A", "keyText": "in", "why": "Đáp án đúng là “in” vì cụm cố định “confident in one’s ability to + V” = tự tin vào khả năng làm gì.", "distractors": ["B. “at” không đi với “confident”.", "C. “about” không đi với “confident”.", "D. “for” không đi với “confident”."], "kb": "confident + in.", "authored": false}, {"n": 5, "uid": 5, "part": "I. COLLOCATION & WORD FORM – WORKPLACE LANGUAGE", "hd_fix": false, "prompt": "Her voluntary work helped her ______ practical teamwork skills.", "options": ["development", "developing", "developed", "develop"], "keyLetter": "D", "keyText": "develop", "why": "Đáp án đúng là “develop” vì sau “help + tân ngữ” dùng động từ nguyên thể không “to”: “helped her develop”.", "distractors": ["A. “development” là danh từ, sai từ loại.", "C. “developed” là quá khứ/V-ed, sai dạng sau “helped her”.", "B. “developing” là V-ing, không dùng sau “help + O”."], "kb": "help + O + V (bare infinitive).", "authored": false}, {"n": 6, "uid": 6, "part": "I. COLLOCATION & WORD FORM – WORKPLACE LANGUAGE", "hd_fix": false, "prompt": "A successful applicant must be willing ______ new procedures.", "options": ["learning", "to learn", "learn", "learned"], "keyLetter": "B", "keyText": "to learn", "why": "Đáp án đúng là “to learn” vì cụm “be willing to + V” = sẵn sàng làm gì.", "distractors": ["A. “learning” là V-ing, sai sau “to”.", "C. “learn” thiếu “to”, sai cấu trúc “willing to”.", "D. “learned” là quá khứ, sai dạng."], "kb": "willing + to + V.", "authored": false}, {"n": 7, "uid": 7, "part": "I. COLLOCATION & WORD FORM – WORKPLACE LANGUAGE", "hd_fix": false, "prompt": "The position requires good communication ______.", "options": ["skills", "skillfully", "skilful", "skilled"], "keyLetter": "A", "keyText": "skills", "why": "Đáp án đúng là “skills” vì cụm cố định “communication skills” = kỹ năng giao tiếp; sau danh từ “communication” cần danh từ.", "distractors": ["C. “skilful” là tính từ, sai từ loại.", "B. “skillfully” là trạng từ, sai từ loại.", "D. “skilled” là tính từ, sai từ loại."], "kb": "communication + danh từ số nhiều: communication skills.", "authored": false}, {"n": 8, "uid": 8, "part": "I. COLLOCATION & WORD FORM – WORKPLACE LANGUAGE", "hd_fix": false, "prompt": "I am available ______ an interview next week.", "options": ["to", "for", "at", "with"], "keyLetter": "B", "keyText": "for", "why": "Đáp án đúng là “for” vì cụm “be available for + danh từ” = sẵn sàng cho việc gì.", "distractors": ["A. “to” không đi với “available” theo sau là danh từ.", "D. “with” là giới từ sai trong cụm này.", "C. “at” là giới từ sai trong cụm này."], "kb": "available + for + N.", "authored": false}, {"n": 9, "uid": 9, "part": "I. COLLOCATION & WORD FORM – WORKPLACE LANGUAGE", "hd_fix": false, "prompt": "The applicant has a good command ______ English.", "options": ["of", "on", "at", "for"], "keyLetter": "A", "keyText": "of", "why": "Đáp án đúng là “of” vì cụm “have a good command of” = sử dụng thành thạo.", "distractors": ["B. “on” là giới từ sai trong cụm này.", "C. “at” là giới từ sai trong cụm này.", "D. “for” là giới từ sai trong cụm này."], "kb": "command + of.", "authored": false}, {"n": 10, "uid": 10, "part": "I. COLLOCATION & WORD FORM – WORKPLACE LANGUAGE", "hd_fix": false, "prompt": "Please find my CV ______ for further information.", "options": ["attachment", "attaching", "attached", "attach"], "keyLetter": "C", "keyText": "attached", "why": "Đáp án đúng là “attached” vì cấu trúc “find + tân ngữ + quá khứ phân từ”: “find my CV attached” = thấy CV được đính kèm.", "distractors": ["B. “attaching” là V-ing, sai dạng bổ ngữ.", "A. “attachment” là danh từ, sai từ loại.", "D. “attach” là động từ nguyên thể, sai dạng."], "kb": "find + O + V-ed.", "authored": false}, {"n": 11, "uid": 11, "part": "II. RELEVANCE FILTER – JOB REQUIREMENT → BEST EVIDENCE", "hd_fix": false, "prompt": "A vacancy requires teamwork. Which evidence is strongest?", "options": ["I have completed several school projects successfully on my own.", "I coordinated with four classmates to run a school event.", "I enjoy taking part in school activities with my classmates.", "I think teamwork is important in most jobs."], "keyLetter": "B", "keyText": "I coordinated with four classmates to run a school event.", "why": "Đáp án đúng đưa bằng chứng cụ thể, trực tiếp về teamwork (phối hợp với 4 bạn tổ chức sự kiện trường) — khớp yêu cầu tuyển dụng nhất.", "distractors": ["C. chỉ nói thích tham gia hoạt động — chung chung, không chứng minh kỹ năng.", "A. làm dự án một mình — trái với yêu cầu teamwork.", "D. chỉ nêu quan điểm về teamwork — không phải bằng chứng."], "kb": "Bằng chứng mạnh = cụ thể + khớp trực tiếp yêu cầu.", "authored": false}, {"n": 12, "uid": 12, "part": "II. RELEVANCE FILTER – JOB REQUIREMENT → BEST EVIDENCE", "hd_fix": false, "prompt": "A server vacancy requires accuracy with payments. Which evidence is most relevant?", "options": ["I am available to work at weekends.", "I have helped serve food at several school events.", "I have helped keep accurate records for our class fund.", "I have experience speaking politely to visitors."], "keyLetter": "C", "keyText": "I have helped keep accurate records for our class fund.", "why": "Đáp án đúng khớp trực tiếp yêu cầu “accuracy with payments”: “keep accurate records” (giữ sổ sách chính xác) cho quỹ lớp — bằng chứng cụ thể về tính chính xác với tiền.", "distractors": ["B. phục vụ đồ ăn ở sự kiện — liên quan phục vụ nhưng không chứng minh chính xác với tiền.", "A. sẵn sàng làm cuối tuần — nói về thời gian, không phải độ chính xác.", "D. nói chuyện lịch sự với khách — kỹ năng giao tiếp, không phải chính xác."], "kb": "Evidence phải khớp đúng yêu cầu (accuracy → accurate records).", "authored": false}, {"n": 13, "uid": 13, "part": "II. RELEVANCE FILTER – JOB REQUIREMENT → BEST EVIDENCE", "hd_fix": false, "prompt": "Which sentence gives evidence rather than an unsupported label?", "options": ["I think I am good at dealing with customers.", "I consider myself friendly and easy to talk to.", "I believe I communicate well with different people.", "During a charity event, I greeted visitors and answered their questions."], "keyLetter": "D", "keyText": "During a charity event, I greeted visitors and answered their questions.", "why": "Đáp án đúng kể hành động cụ thể trong quá khứ (chào đón khách, trả lời câu hỏi ở sự kiện từ thiện) — đó là bằng chứng, không phải tự nhận xét.", "distractors": ["C. “I believe I communicate well” — tự nhận xét, không có bằng chứng.", "B. “I consider myself friendly” — tự gán nhãn tính cách.", "A. “I think I am good at” — tự nhận xét, không có bằng chứng."], "kb": "Evidence = hành động cụ thể; label = tính từ tự gán.", "authored": false}, {"n": 14, "uid": 14, "part": "III. PARAPHRASE CONTROL – NO ADD / NO DROP / NO DISTORT", "hd_fix": false, "prompt": "Vacancy: “Applicants should be able to communicate confidently with customers.” Best paraphrase?", "options": ["Candidates should communicate confidently with both colleagues and customers.", "Candidates need to interact confidently with customers.", "Candidates should be willing to speak to customers when necessary.", "Candidates must have previous customer-service experience."], "keyLetter": "B", "keyText": "Candidates need to interact confidently with customers.", "why": "Đáp án đúng giữ nguyên scope: “interact” đồng nghĩa “communicate”, giữ nguyên “confidently with customers” — chỉ đổi từ, không thêm/bớt ý.", "distractors": ["C. thêm “when necessary” — điều kiện không có trong câu gốc.", "A. thêm “colleagues” — mở rộng đối tượng.", "D. thêm yêu cầu “previous experience” — thêm ý mới."], "kb": "Paraphrase đúng: đổi từ, giữ nguyên scope.", "authored": false}, {"n": 15, "uid": 15, "part": "III. PARAPHRASE CONTROL – NO ADD / NO DROP / NO DISTORT", "hd_fix": false, "prompt": "“Previous experience is preferred but not essential.” Best paraphrase?", "options": ["Applicants with experience are more likely to be accepted than those without it.", "Previous experience is unnecessary and gives applicants no advantage.", "Previous experience is an advantage, but applicants without it may still be considered.", "Applicants are expected to have experience before they can apply."], "keyLetter": "C", "keyText": "Previous experience is an advantage, but applicants without it may still be considered.", "why": "Đáp án đúng diễn đạt chính xác “preferred” (= có lợi thế) và “not essential” (= không bắt buộc, vẫn được xem xét).", "distractors": ["A. “more likely to be accepted” — thêm dự đoán về khả năng trúng tuyển.", "B. “unnecessary and gives no advantage” — trái nghĩa với “preferred”.", "D. “expected to have experience before they can apply” — biến thành yêu cầu bắt buộc."], "kb": "preferred ≠ compulsory; not essential ≠ no advantage.", "authored": false}, {"n": 16, "uid": 16, "part": "III. PARAPHRASE CONTROL – NO ADD / NO DROP / NO DISTORT", "hd_fix": false, "prompt": "“Training will be provided.” Safest inference?", "options": ["Some job procedures may be learned after recruitment.", "Training guarantees that successful recruits can progress quickly.", "Applicants will be fully trained for every aspect of the job before starting work.", "Applicants do not need to meet any other requirements before applying."], "keyLetter": "A", "keyText": "Some job procedures may be learned after recruitment.", "why": "Đáp án đúng là suy luận an toàn nhất: “will be provided” chỉ nói đào tạo sẽ có → một số quy trình có thể học sau khi tuyển.", "distractors": ["C. “fully trained for every aspect before starting” — thêm “mọi khía cạnh” và “trước khi bắt đầu”, vượt quá thông tin gốc.", "D. “do not need to meet any other requirements” — thêm ý không có.", "B. “guarantees … progress quickly” — thêm “đảm bảo thăng tiến”, vượt quá thông tin gốc."], "kb": "Inference an toàn = không vượt quá thông tin gốc.", "authored": false}, {"n": 17, "uid": 17, "part": "III. PARAPHRASE CONTROL – NO ADD / NO DROP / NO DISTORT", "hd_fix": false, "prompt": "“Applicants must be available at weekends.” Which version preserves scope?", "options": ["Applicants need to be free on weekdays as well as weekends.", "Weekend work is preferred but not essential for applicants.", "Being available at weekends is a requirement for applicants.", "Applicants may decide after recruitment whether to work at weekends."], "keyLetter": "C", "keyText": "Being available at weekends is a requirement for applicants.", "why": "Đáp án đúng giữ nguyên “must” (= bắt buộc → “is a requirement”) và phạm vi “at weekends” — chỉ đổi cấu trúc câu.", "distractors": ["B. “preferred but not essential” — hạ mức từ bắt buộc xuống ưu tiên, sai.", "A. thêm “weekdays” — mở rộng phạm vi.", "D. “may decide after recruitment” — biến thành tùy chọn sau tuyển, sai."], "kb": "must → is a requirement; không đổi scope.", "authored": false}, {"n": 18, "uid": 18, "part": "IV. SENTENCE FUNCTION – WHAT DOES EACH PART DO?", "hd_fix": false, "prompt": "“I am writing to apply for the part-time shop assistant position advertised last week.” functions mainly to ______.", "options": ["explain why the applicant suits the position", "describe relevant experience for the role", "state the purpose of writing and identify the vacancy", "state availability for the next stage"], "keyLetter": "C", "keyText": "state the purpose of writing and identify the vacancy", "why": "Đáp án đúng vì câu mở đầu nêu mục đích viết (apply) và xác định vị trí (shop assistant position advertised last week).", "distractors": ["B. câu này chưa mô tả kinh nghiệm nào.", "A. câu này chưa giải thích vì sao phù hợp.", "D. câu này chưa nói về thời gian phỏng vấn."], "kb": "Opening = purpose + vacancy.", "authored": false}, {"n": 19, "uid": 19, "part": "IV. SENTENCE FUNCTION – WHAT DOES EACH PART DO?", "hd_fix": false, "prompt": "“While volunteering at a school fair, I answered visitors' questions and handled simple payments.” functions mainly to ______.", "options": ["provide relevant evidence from previous experience", "state the reason for writing", "describe availability for an interview", "identify a qualification required by the employer"], "keyLetter": "A", "keyText": "provide relevant evidence from previous experience", "why": "Đáp án đúng vì câu kể hành động cụ thể trong quá khứ (trả lời câu hỏi, thu tiền ở hội chợ trường) — bằng chứng kinh nghiệm liên quan.", "distractors": ["B. câu này không nêu lý do viết thư.", "C. câu này không nói về phỏng vấn.", "D. câu này không chỉ ra yêu cầu của nhà tuyển dụng."], "kb": "Body = evidence cụ thể từ kinh nghiệm.", "authored": false}, {"n": 20, "uid": 20, "part": "IV. SENTENCE FUNCTION – WHAT DOES EACH PART DO?", "hd_fix": false, "prompt": "“I would be available for an interview after 4 p.m. on weekdays.” functions mainly to ______.", "options": ["explain why the applicant wants the job", "state availability for an interview", "provide evidence of relevant experience", "identify the position being applied for"], "keyLetter": "B", "keyText": "state availability for an interview", "why": "Đáp án đúng vì câu nêu rõ thời gian sẵn sàng phỏng vấn — chức năng kết thư về availability.", "distractors": ["A. câu này không giải thích động cơ xin việc.", "C. câu này không đưa bằng chứng kinh nghiệm.", "D. câu này không xác định vị trí ứng tuyển."], "kb": "Closing = availability + interest.", "authored": false}, {"n": 21, "uid": 21, "part": "V. PASSAGE COMPLETION – TWO-SIDED FIT", "hd_fix": false, "prompt": "Choose the best answer for question 26.", "options": ["A strong application should describe previous activities in the order in which they happened.", "The writer may introduce personal background before explaining why the position is attractive.", "Applicants should include several achievements so employers can form a complete personal picture.", "The writer should select information that directly matches the requirements of the vacancy."], "keyLetter": "D", "keyText": "The writer should select information that directly matches the requirements of the vacancy.", "why": "Trích dẫn: “A strong application letter should be selective rather than autobiographical.” Đáp án đúng diễn đạt “selective”: chọn lọc thông tin khớp trực tiếp yêu cầu của vacancy.", "distractors": ["B. “introduce personal background” — đi ngược “selective rather than autobiographical”.", "C. “include several achievements” để có “complete personal picture” — cũng là kể lể, trái ý đoạn văn.", "A. “describe previous activities in the order” — kể theo trình tự thời gian, không phải chọn lọc."], "kb": "selective = chỉ chọn thông tin khớp yêu cầu.", "authored": false}, {"n": 22, "uid": 22, "part": "V. PASSAGE COMPLETION – TWO-SIDED FIT", "hd_fix": false, "prompt": "Choose the best answer for question 27.", "options": ["A general statement about strengths can summarise the applicant's overall suitability.", "A brief description of personal interests can make the application sound more individual.", "A short, specific example can show how the relevant skill was actually used.", "Several different examples can be listed even when they are only loosely related to the role."], "keyLetter": "C", "keyText": "A short, specific example can show how the relevant skill was actually used.", "why": "Trích dẫn: “This is stronger than simply claiming to be “friendly” or “hard-working”.” Đáp án đúng nối ví dụ cụ thể với nhận xét này: ví dụ ngắn, cụ thể cho thấy kỹ năng đã được dùng thực tế.", "distractors": ["B. “personal interests” — lạc đề khỏi ví dụ về kỹ năng.", "A. “general statement about strengths” — chính là kiểu “claiming” bị chê ở câu sau.", "D. “several different examples … loosely related” — trái với nguyên tắc “selective”."], "kb": "Ví dụ cụ thể > nhận xét chung chung.", "authored": false}, {"n": 23, "uid": 23, "part": "V. PASSAGE COMPLETION – TWO-SIDED FIT", "hd_fix": false, "prompt": "Choose the best answer for question 28.", "options": ["A formal tone is most effective when the applicant avoids expressing personal interest in the role.", "Strong promises about future performance can make a short application more persuasive.", "A concise letter should omit examples and focus only on general qualifications.", "Informal language and exaggerated claims can weaken the professional impression of the letter."], "keyLetter": "D", "keyText": "Informal language and exaggerated claims can weaken the professional impression of the letter.", "why": "Trích dẫn: “The letter should also remain formal and concise.” Đáp án đúng giải thích hệ quả khi không giữ văn phong trang trọng, súc tích: ngôn ngữ xuồng xã và phóng đại làm yếu ấn tượng chuyên nghiệp.", "distractors": ["C. “omit examples” — trái với đoạn trước đề cao ví dụ cụ thể.", "A. “avoids expressing personal interest” — thêm ý không có; formal không có nghĩa là tránh thể hiện quan tâm.", "B. “strong promises … more persuasive” — trái với “concise”, dễ thành phóng đại."], "kb": "formal and concise — tránh informal và phóng đại.", "authored": false}, {"n": 24, "uid": 24, "part": "VI. SENTENCE ORDERING – BUILD THE LETTER LOGIC", "hd_fix": false, "prompt": "29.<br>a. During this role, I greeted visitors, answered questions and worked closely with other volunteers.<br>b. I am writing to apply for the weekend event assistant position advertised on your website.<br>c. I would be available for an interview next week and look forward to hearing from you.<br>d. Last summer, I volunteered at two school events.<br>e. I believe this experience has developed the communication and teamwork skills required for the position.", "options": ["c – b – d – a – e", "b – a – d – c – e", "d – b – e – a – c", "b – d – a – e – c"], "keyLetter": "D", "keyText": "b – d – a – e – c", "why": "Thư xin việc đi theo mạch: mở thư nêu mục đích (b) → giới thiệu kinh nghiệm (d) → chi tiết vai trò — 'this role' buộc a đứng sau d → chứng minh kỹ năng từ 'this experience' (e) → kết thư hẹn phỏng vấn (c) → b – d – a – e – c.", "distractors": ["C. sai: d mở đầu nhưng thư phải mở bằng mục đích viết (b).", "B. sai: a đứng trước d trong khi 'this role' chưa được giới thiệu.", "A. sai: c là câu kết thư lại đứng đầu."], "kb": "Mạch thư: Opening → Body 1 (kinh nghiệm) → Body 2 (kỹ năng) → Closing; đại từ ('this role') buộc câu đứng sau câu giới thiệu.", "authored": false}, {"n": 25, "uid": 25, "part": "VII. CLOZE – FORMAL APPLICATION LANGUAGE", "hd_fix": false, "prompt": "Choose the best answer for question 31.", "options": ["at", "with", "for", "to"], "keyLetter": "C", "keyText": "for", "why": "Trích dẫn: “I am writing to apply (31) ______ the part-time position” — “apply for + vị trí” = ứng tuyển vị trí.", "distractors": ["D. “to” không đi với “apply” theo sau là vị trí.", "A. “at” là giới từ sai trong cụm này.", "B. “with” là giới từ sai trong cụm này."], "kb": "apply + for + vị trí.", "authored": false}, {"n": 26, "uid": 26, "part": "VII. CLOZE – FORMAL APPLICATION LANGUAGE", "hd_fix": false, "prompt": "Choose the best answer for question 32.", "options": ["worked", "work", "to work", "working"], "keyLetter": "D", "keyText": "working", "why": "Trích dẫn: “I have experience (32) ______ with visitors” — sau “experience” dùng V-ing: “experience working” = kinh nghiệm làm việc.", "distractors": ["B. “work” là nguyên thể, sai sau “experience”.", "C. “to work” sai dạng sau “experience”.", "A. “worked” là quá khứ, sai dạng."], "kb": "experience + V-ing.", "authored": false}, {"n": 27, "uid": 27, "part": "VII. CLOZE – FORMAL APPLICATION LANGUAGE", "hd_fix": false, "prompt": "Choose the best answer for question 33.", "options": ["relevance", "relevant", "relevantly", "relating"], "keyLetter": "B", "keyText": "relevant", "why": "Trích dẫn: “my communication skills are highly (33) ______ to the role” — sau trạng từ “highly” cần tính từ; “relevant to” = liên quan tới.", "distractors": ["A. “relevance” là danh từ, sai từ loại.", "C. “relevantly” là trạng từ, sai từ loại.", "D. “relating” là V-ing, sai dạng."], "kb": "highly + tính từ; relevant + to.", "authored": false}, {"n": 28, "uid": 28, "part": "VII. CLOZE – FORMAL APPLICATION LANGUAGE", "hd_fix": false, "prompt": "Choose the best answer for question 34.", "options": ["learning", "learned", "to learn", "learn"], "keyLetter": "C", "keyText": "to learn", "why": "Trích dẫn: “I am organised and willing (34) ______ new procedures” — “be willing to + V” = sẵn sàng làm gì.", "distractors": ["A. “learning” là V-ing, sai sau “to”.", "D. “learn” thiếu “to”, sai cấu trúc.", "B. “learned” là quá khứ, sai dạng."], "kb": "willing + to + V.", "authored": false}, {"n": 29, "uid": 29, "part": "VII. CLOZE – FORMAL APPLICATION LANGUAGE", "hd_fix": false, "prompt": "Choose the best answer for question 35.", "options": ["heard", "to hear", "hearing", "hear"], "keyLetter": "C", "keyText": "hearing", "why": "Trích dẫn: “look forward to (35) ______ from you” — “look forward to + V-ing” (“to” ở đây là giới từ).", "distractors": ["D. “hear” là nguyên thể, sai sau giới từ “to”.", "B. “to hear” sai dạng sau “look forward to”.", "A. “heard” là quá khứ, sai dạng."], "kb": "look forward + to + V-ing.", "authored": false}]} ,"p3":{"title":"PHẦN 3 — CỦNG CỐ","desc":"20 câu trắc nghiệm củng cố kiến thức trọng tâm: collocation, word form, nguyên tắc viết thư ứng tuyển.","questions":[{"n": 1, "uid": 1, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "provide ______ information", "options": ["relevance", "relevantly", "relevant", "irrelevance"], "keyLetter": "C", "keyText": "relevant", "why": "Đáp án đúng là “relevant” vì sau “provide” cần tính từ + danh từ: “relevant information”.", "distractors": ["A. “relevance” là danh từ, sai từ loại.", "B. “relevantly” là trạng từ, sai từ loại.", "D. “irrelevance” là danh từ phủ định, sai từ loại và nghĩa."], "kb": "provide + tính từ + danh từ.", "authored": false}, {"n": 2, "uid": 2, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "customer-service ______", "options": ["communicate", "experience", "relevant", "organise"], "keyLetter": "B", "keyText": "experience", "why": "Đáp án đúng là “experience” vì cụm “customer-service experience” = kinh nghiệm dịch vụ khách hàng.", "distractors": ["D. “organise” là động từ, sai từ loại.", "C. “relevant” là tính từ, sai từ loại và nghĩa.", "A. “communicate” là động từ, sai từ loại."], "kb": "customer-service + danh từ: experience.", "authored": false}, {"n": 3, "uid": 3, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "well-______ candidate", "options": ["organise", "organisation", "organised", "organising"], "keyLetter": "C", "keyText": "organised", "why": "Đáp án đúng là “organised” vì “well-” + quá khứ phân từ tạo tính từ ghép: “well-organised”.", "distractors": ["B. “organisation” là danh từ, sai từ loại.", "A. “organise” là động từ nguyên thể, sai dạng.", "D. “organising” là V-ing, sai dạng."], "kb": "well + V-ed = tính từ ghép.", "authored": false}, {"n": 4, "uid": 4, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "confident ______ my ability", "options": ["about", "in", "for", "at"], "keyLetter": "B", "keyText": "in", "why": "Đáp án đúng là “in” vì cụm “confident in one’s ability”.", "distractors": ["D. “at” là giới từ sai trong cụm này.", "A. “about” là giới từ sai trong cụm này.", "C. “for” là giới từ sai trong cụm này."], "kb": "confident + in.", "authored": false}, {"n": 5, "uid": 5, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "develop teamwork ______", "options": ["interviews", "roles", "procedures", "skills"], "keyLetter": "D", "keyText": "skills", "why": "Đáp án đúng là “skills” vì cụm “teamwork skills” = kỹ năng làm việc nhóm.", "distractors": ["C. “procedures” = quy trình, sai nghĩa.", "B. “roles” = vai trò, sai nghĩa.", "A. “interviews” = buổi phỏng vấn, sai nghĩa."], "kb": "teamwork skills = kỹ năng làm việc nhóm.", "authored": false}, {"n": 6, "uid": 6, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "willing ______ learn", "options": ["to", "on", "with", "for"], "keyLetter": "A", "keyText": "to", "why": "Đáp án đúng là “to” vì “be willing to + V” = sẵn sàng làm gì.", "distractors": ["D. “for” không đi với “willing” theo sau là động từ.", "C. “with” là giới từ sai trong cụm này.", "B. “on” là giới từ sai trong cụm này."], "kb": "willing + to + V.", "authored": false}, {"n": 7, "uid": 7, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "available ______ an interview", "options": ["to", "at", "with", "for"], "keyLetter": "D", "keyText": "for", "why": "Đáp án đúng là “for” vì “be available for + danh từ” = sẵn sàng cho việc gì.", "distractors": ["A. “to” không đi với “available” theo sau là danh từ.", "C. “with” là giới từ sai trong cụm này.", "B. “at” là giới từ sai trong cụm này."], "kb": "available + for + N.", "authored": false}, {"n": 8, "uid": 8, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "a good command ______ English", "options": ["at", "of", "on", "for"], "keyLetter": "B", "keyText": "of", "why": "Đáp án đúng là “of” vì “have a good command of” = sử dụng thành thạo.", "distractors": ["C. “on” là giới từ sai trong cụm này.", "A. “at” là giới từ sai trong cụm này.", "D. “for” là giới từ sai trong cụm này."], "kb": "command + of.", "authored": false}, {"n": 9, "uid": 9, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "Evidence should ______ the vacancy requirement.", "options": ["replace", "ignore", "match", "distort"], "keyLetter": "C", "keyText": "match", "why": "Đáp án đúng là “match” vì bằng chứng phải khớp (match) với yêu cầu của vacancy.", "distractors": ["B. “ignore” = phớt lờ, trái nghĩa.", "D. “distort” = bóp méo, trái nguyên tắc.", "A. “replace” = thay thế, sai nghĩa."], "kb": "Evidence must match the requirement.", "authored": false}, {"n": 10, "uid": 10, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "preferred but not essential means ______", "options": ["irrelevant", "guaranteed", "compulsory", "advantageous but not required"], "keyLetter": "D", "keyText": "advantageous but not required", "why": "Đáp án đúng diễn đạt “preferred” (= có lợi thế) và “not essential” (= không bắt buộc).", "distractors": ["C. “compulsory” = bắt buộc, trái nghĩa “not essential”.", "A. “irrelevant” = không liên quan, sai nghĩa.", "B. “guaranteed” = được đảm bảo, thêm ý không có."], "kb": "preferred but not essential = có lợi thế nhưng không bắt buộc.", "authored": false}, {"n": 11, "uid": 11, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "Training will be provided safely implies ______", "options": ["experience has no value", "promotion is guaranteed", "some procedures may be learned after recruitment", "all requirements disappear"], "keyLetter": "C", "keyText": "some procedures may be learned after recruitment", "why": "Đáp án đúng diễn đạt “will be provided” = sẽ được cung cấp sau khi tuyển.", "distractors": ["D. “all requirements disappear” — thêm ý quá mức.", "B. “promotion is guaranteed” — thêm ý không có.", "A. “experience has no value” — trái nghĩa với “preferred”."], "kb": "will be provided → sau khi tuyển, không phải trước.", "authored": false}, {"n": 12, "uid": 12, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "must be available at weekends means ______", "options": ["weekends are optional", "decide later", "weekdays are compulsory", "weekend availability is required"], "keyLetter": "D", "keyText": "weekend availability is required", "why": "Đáp án đúng giữ nguyên “must” (= bắt buộc → “is required”).", "distractors": ["A. “weekends are optional” — trái nghĩa “must”.", "C. “weekdays are compulsory” — đổi đối tượng.", "B. “decide later” — biến thành tùy chọn."], "kb": "must = is required.", "authored": false}, {"n": 13, "uid": 13, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "Opening of an application letter should ______", "options": ["demand an interview", "identify vacancy and purpose", "list every hobby", "repeat the CV"], "keyLetter": "B", "keyText": "identify vacancy and purpose", "why": "Đáp án đúng vì mở thư phải nêu mục đích viết và xác định vị trí ứng tuyển.", "distractors": ["C. “list every hobby” — kể lể, trái “selective”.", "A. “demand an interview” — đòi hỏi, thiếu chuyên nghiệp.", "D. “repeat the CV” — lặp lại, không cần thiết."], "kb": "Opening: purpose + vacancy.", "authored": false}, {"n": 14, "uid": 14, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "A body paragraph should use ______", "options": ["unsupported labels", "exaggeration", "specific relevant evidence", "unrelated autobiography"], "keyLetter": "C", "keyText": "specific relevant evidence", "why": "Đáp án đúng vì thân thư dùng bằng chứng cụ thể, liên quan — thuyết phục hơn tự nhận xét chung chung.", "distractors": ["A. “unsupported labels” — chính điều cần tránh.", "D. “unrelated autobiography” — trái “selective”.", "B. “exaggeration” — phóng đại, thiếu chuyên nghiệp."], "kb": "Body: specific relevant evidence.", "authored": false}, {"n": 15, "uid": 15, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "Closing can state ______", "options": ["interview availability", "salary demands only", "unrelated interests", "full life history"], "keyLetter": "A", "keyText": "interview availability", "why": "Đáp án đúng vì kết thư nêu thời gian sẵn sàng phỏng vấn và sự quan tâm — trang trọng, không đòi hỏi.", "distractors": ["C. “unrelated interests” — không liên quan.", "D. “full life history” — kể lể toàn bộ.", "B. “salary demands only” — chỉ đòi lương, thiếu chuyên nghiệp."], "kb": "Closing: availability + interest.", "authored": false}, {"n": 16, "uid": 16, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "A strong letter should be ______", "options": ["exaggerated", "autobiographical", "informal", "selective and relevant"], "keyLetter": "D", "keyText": "selective and relevant", "why": "Đáp án đúng vì thư mạnh phải chọn lọc và liên quan, không kể lể toàn bộ.", "distractors": ["B. “autobiographical” — trái “selective”.", "C. “informal” — trái “formal”.", "A. “exaggerated” — phóng đại, thiếu chuyên nghiệp."], "kb": "Strong letter = selective and relevant.", "authored": false}, {"n": 17, "uid": 17, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "specific evidence is ______", "options": ["informal", "weaker than self-labels", "stronger than unsupported labels", "unnecessary"], "keyLetter": "C", "keyText": "stronger than unsupported labels", "why": "Đáp án đúng vì bằng chứng cụ thể thuyết phục hơn nhãn tự gán chung chung.", "distractors": ["B. “weaker than self-labels” — trái nguyên tắc.", "D. “unnecessary” — sai, evidence rất cần trong thư.", "A. “informal” — sai từ loại và nghĩa."], "kb": "Specific evidence > unsupported labels.", "authored": false}, {"n": 18, "uid": 18, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "look forward ______ hearing from you", "options": ["for", "to", "with", "on"], "keyLetter": "B", "keyText": "to", "why": "Đáp án đúng là “to” vì “look forward to + V-ing”.", "distractors": ["A. “for” là giới từ sai trong cụm này.", "C. “with” là giới từ sai trong cụm này.", "D. “on” là giới từ sai trong cụm này."], "kb": "look forward + to + V-ing.", "authored": false}, {"n": 19, "uid": 19, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "highly relevant ______ the role", "options": ["to", "on", "for", "with"], "keyLetter": "A", "keyText": "to", "why": "Đáp án đúng là “to” vì “relevant to” = liên quan tới.", "distractors": ["C. “for” không đi với “relevant”.", "D. “with” không đi với “relevant”.", "B. “on” không đi với “relevant”."], "kb": "relevant + to.", "authored": false}, {"n": 20, "uid": 20, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "apply ______ the position", "options": ["at", "to", "with", "for"], "keyLetter": "D", "keyText": "for", "why": "Đáp án đúng là “for” vì “apply for + vị trí” = ứng tuyển.", "distractors": ["B. “to” là giới từ sai trong cụm này.", "A. “at” là giới từ sai trong cụm này.", "C. “with” là giới từ sai trong cụm này."], "kb": "apply + for + vị trí.", "authored": false}]}};
const PASSAGES={"PASSAGE COMPLETION": "<p>A strong application letter should be selective rather than autobiographical. (26) ______. For example, if a vacancy requires customer-service skills, an applicant should mention experience involving communication with people. (27) ______. This is stronger than simply claiming to be “friendly” or “hard-working”. The letter should also remain formal and concise. (28) ______. A professional closing then signals availability and interest without demanding a response.</p>", "CLOZE": "<p>Dear Sir or Madam,<br>I am writing to apply (31) ______ the part-time position advertised on your website. I have experience (32) ______ with visitors at school events and believe that my communication skills are highly (33) ______ to the role. In addition, I am organised and willing (34) ______ new procedures. I would be available for an interview next week and look forward to (35) ______ from you.<br>Yours faithfully,</p>"};

const startEpoch=Date.now();
const letters=['A','B','C','D'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
