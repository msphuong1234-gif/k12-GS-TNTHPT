<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}

.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}

.prompt{font-weight:700}

.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}

.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}

.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}

.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}

.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}

ion/percentage OF + danh từ.", "authored": false}, {"n": 24, "uid": 24, "part": "PART 2 – CHỌN ĐỘNG TỪ / GIỚI TỪ / DANH TỪ / TÍNH TỪ CHO ĐÚNG CỤM", "hd_fix": false, "prompt": "Writers should report the data ______.", "options": ["increasingly", "projected", "steadily", "accurately"], "keyLetter": "D", "keyText": "accurately", "why": "Sau động từ report cần trạng từ chỉ cách thức đúng nghĩa, nên chọn accurately.", "distractors": ["steadily là trạng từ nhưng sai nghĩa (đều đặn).", "increasingly sai nghĩa trong ngữ cảnh báo cáo số liệu.", "projected là tính từ, sai loại từ."], "kb": "report + trạng từ; chọn trạng từ đúng nghĩa ngữ cảnh.", "authored": false}, {"n": 25, "uid": 25, "part": "PART 2 – CHỌN ĐỘNG TỪ / GIỚI TỪ / DANH TỪ / TÍNH TỪ CHO ĐÚNG CỤM", "hd_fix": false, "prompt": "A data description should avoid ______ unsupported causes.", "options": ["to add", "adding", "added", "add"], "keyLetter": "B", "keyText": "adding", "why": "avoid + V-ing — cấu trúc cố định, nên chọn adding.", "distractors": ["add (bare infinitive) không dùng được sau avoid.", "to add sai vì avoid không đi với to-V.", "added sai loại từ."], "kb": "avoid + V-ing (ghi nhớ như enjoy, finish, mind).", "authored": false}, {"n": 26, "uid": 26, "part": "PART 2 – CHỌN ĐỘNG TỪ / GIỚI TỪ / DANH TỪ / TÍNH TỪ CHO ĐÚNG CỤM", "hd_fix": false, "prompt": "Accurate reporting contributes ______ a more reliable interpretation.", "options": ["for", "with", "to", "on"], "keyLetter": "C", "keyText": "to", "why": "contribute to + N = góp phần vào — giới từ to cố định.", "distractors": ["for không đi với contribute.", "with là giới từ sai trong cụm này.", "on là giới từ sai trong cụm này."], "kb": "contribute TO + danh từ (không phải for/with/on).", "authored": false}, {"n": 27, "uid": 27, "part": "PART 3 – WORD FAMILIES", "hd_fix": false, "prompt": "The city has an ______ population.", "options": ["increase", "increasing", "steadiness", "increasingly"], "keyLetter": "B", "keyText": "increasing", "why": "Sau mạo từ hưng sai nghĩa (sự ổn định)."], "kb": "project (v) → projection (n) = sự dự báo.", "authored": false}, {"n": 31, "uid": 31, "part": "PART 3 – WORD FAMILIES", "hd_fix": false, "prompt": "The ______ figure is 75%.", "options": ["projected", "project", "increasingly", "projection"], "keyLetter": "A", "keyText": "projected", "why": "Trước danh từ figure cần tính từ; projected (dạng V-ed) làm tính từ → “con số được dự báo”.", "distractors": ["project là động từ/danh từ, không làm tính từ.", "projection là danh từ, không đứng trước danh từ khác trong cụm này.", "increasingly là trạng từ, sai loại từ."], "kb": "V-ed có thể làm tính từ (the projected figure = con số được dự báo).", "authored": false}, {"n": 32, "uid": 32, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“remain stable” is closest in meaning to ______.", "options": ["show a consistent downward movement", "be expected to", "remain almost unchanged", "show a consistent upward movement"], "keyLetter": "C", "keyText": "remain almost unchanged", "why": "stable = ổn định, unchanged = không đổi — cùng diễn tả “gần như không thay đổi”.", "distractors": ["“show a consistent downward movement” ngược nghĩa (đi xuống).", "“be expected to” sai nghĩa (được kỳ vọng).", "“show a consistent upward movement” ngược nghĩa (đi lên)."], "kb": "remain stable = remain (almost) unchanged.", "authored": false}, {"n": 33, "uid": 33, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“rise steadily” is closest in meaning to ______.", "options": ["show a consistent downward movement", "be expected to", "show a consistent upward movement", "trends or data alone do not explain causes"], "keyLetter": "C", "keyText": "show a consistent upward movement", "why": "rise = tăng (upward movement), steadily = đều đặn (consistent) — tương đương “cho thấy sự tăng đều đặn”.", "distractors": ["“be expected to” sai nghĩa.", "“trends or data alone do not explain causes” sai chủ đề.", "“show a consistent downward movement” ngược nghĩa."], "kb": "steadily = consistently; rise = upward movement.", "authored": false}, {"n": 34, "uid": 34, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“fall steadily” is closest in meaning to ______.", "options": ["trends or data alone do not explain causes", "show a consistent downward movement", "estimates, not confirmed outcomes", "be expected to"], "keyLetter": "B", "keyText": "show a consistent downward movement", "why": "fall = giảm (downward movement), steadily = đều đặn (consistent).", "distractors": ["“trends or data alone do not explain causes” sai chủ đề.", "“estimates, not confirmed outcomes” sai nghĩa.", "“be expected to” sai nghĩa."], "kb": "fall = downward movement; steadily = consistent.", "authored": false}, {"n": 35, "uid": 35, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“be projected to” is closest in meaning to ______.", "options": ["trends or data alone do not explain causes", "remain almost unchanged", "be expected to", "estimates, not confirmed outcomes"], "keyLetter": "C", "keyText": "be expected to", "why": "projected = được dự báo, expected = được kỳ vọng — cùng diễn tả điều được dự đoán sẽ xảy ra.", "distractors": ["“estimates, not confirmed outcomes” là nghĩa của “projections” (danh từ), không phải của cụm động từ này.", "“remain almost unchanged” sai nghĩa.", "“trends or data alone do not explain causes” sai chủ đề."], "kb": "be projected to = be expected to (dự kiến sẽ…).", "authored": false}, {"n": 36, "uid": 36, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“trends do not by themselves explain causes” is closest in meaning to ______.", "options": ["estimates, not confirmed outcomes", "remain almost unchanged", "trends or data alone do not explain causes", "show a consistent upward movement"], "keyLetter": "C", "keyText": "trends or data alone do not explain causes", "why": "by themselves = alone (một mình, tự thân) — hai cách diễn đạt tương đương: xu hướng tự thân không giải thích được nguyên nhân.", "distractors": ["“remain almost unchanged” sai chủ đề.", "“show a consistent upward movement” sai chủ đề.", "“estimates, not confirmed outcomes” sai nghĩa."], "kb": "by themselves = alone (một mình, tự thân).", "authored": false}, {"n": 37, "uid": 37, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“future values are projections” is closest in meaning to ______.", "options": ["remain almost unchanged", "show a consistent upward movement", "show a consistent downward movement", "estimates, not confirmed outcomes"], "keyLetter": "D", "keyText": "estimates, not confirmed outcomes", "why": "projections = các giá trị dự báo = estimates (ước tính), chưa phải kết quả đã xác nhận.", "distractors": ["“show a consistent upward movement” sai chủ đề.", "“show a consistent downward movement” sai chủ đề.", "“remain almost unchanged” sai nghĩa."], "kb": "projection = estimate (ước tính) ≠ confirmed outcome.", "authored": false}, {"n": 38, "uid": 38, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which expression means “giữ ổn định / không thay đổi”?", "options": ["rise steadily", "move in opposite directions", "decline gradually", "remain stable / remain unchanged"], "keyLetter": "D", "keyText": "remain stable / remain unchanged", "why": "remain = vẫn giữ, stable/unchanged = ổn định/không đổi — khớp với nghĩa tiếng Việt “giữ ổn định/không thay đổi”.", "distractors": ["“rise steadily” nghĩa là “tăng đều”.", "“decline gradually” nghĩa là “giảm dần”.", "“move in opposite directions” nghĩa là “thay đổi theo hai hướng ngược nhau”."], "kb": "remain + stable/unchanged = giữ ổn định.", "authored": false}, {"n": 39, "uid": 39, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which expression means “tránh thêm các nguyên nhân không được dữ liệu hỗ trợ”?", "options": ["report the data accurately", "avoid adding unsupported causes", "reach a number", "move in opposite directions"], "keyLetter": "B", "keyText": "avoid adding unsupported causes", "why": "avoid adding = tránh thêm, unsupported causes = các nguyên nhân không được dữ liệu hỗ trợ — khớp nghĩa tiếng Việt.", "distractors": ["“report the data accurately” nghĩa là “báo cáo số liệu chính xác”.", "“reach a number” nghĩa là “đạt tới một con số”.", "“move in opposite directions” nghĩa là “thay đổi theo hai hướng ngược nhau”."], "kb": "avoid + V-ing; unsupported = không được hỗ trợ.", "authored": false}, {"n": 40, "uid": 40, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "The noun meaning “sự ổn định” is ______.", "options": ["steady", "steadily", "projection", "steadiness"], "keyLetter": "D", "keyText": "steadiness", "why": "Hậu tố -ness tạo danh từ trừu tượng từ tính từ steady, nên “sự ổn định” là steadiness.", "distractors": ["steady là tính từ.", "steadily là trạng từ.", "projection là danh từ nhưng sai nghĩa (sự dự báo)."], "kb": "steady (adj) → steadiness (n) = sự ổn định.", "authored": false}, {"n": 41, "uid": 41, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Use ______ to show the amount of change: rise ______ 10%.", "options": ["by", "to", "at", "with"], "keyLetter": "A", "keyText": "by", "why": "Hỏi “tăng BAO NHIÊU” (mức chênh lệch 10%) nên dùng by.", "distractors": ["to chỉ giá trị cuối, không phải mức chênh lệch.", "at đi với stand, không dùng với rise.", "with là giới từ sai trong cụm này."], "kb": "Hỏi “tăng BAO NHIÊU” → by.", "authored": false}, {"n": 42, "uid": 42, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Use ______ to show the final value: rise ______ 70%.", "options": ["with", "by", "to", "at"], "keyLetter": "C", "keyText": "to", "why": "Hỏi giá trị cuối (lên tới 70%) nên dùng to.", "distractors": ["by chỉ mức chênh lệch, không phải giá trị cuối.", "at đi với stand, không dùng với rise.", "with là giới từ sai trong cụm này."], "kb": "Hỏi “lên tới BAO NHIÊU” (giá trị cuối) → to.", "authored": false}, {"n": 43, "uid": 43, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "“rise steadily” is closest in meaning to ______.", "options": ["show a consistent upward movement", "show a consistent downward movement", "remain almost unchanged", "estimate a future value"], "keyLetter": "A", "keyText": "show a consistent upward movement", "why": "rise = upward movement, steadily = consistent — tương đương “cho thấy sự tăng đều đặn”.", "distractors": ["“show a consistent downward movement” ngược nghĩa (đi xuống).", "“remain almost unchanged” sai nghĩa (không đổi).", "“estimate a future value” sai nghĩa (ước tính giá trị tương lai)."], "kb": "steadily = consistent; rise = upward movement.", "authored": false}, {"n": 44, "uid": 44, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which source idea is correct?", "options": ["Projected figures are confirmed outcomes.", "Trends or data alone do not explain causes.", "Every trend proves its cause.", "Data descriptions should add likely causes."], "keyLetter": "B", "keyText": "Trends or data alone do not explain causes.", "why": "Trích dẫn: \"These changes should be described as trends rather than explained by causes (27) ______ are not shown in the graph.\" — số liệu chỉ nên được mô tả như xu hướng, không tự giải thích nguyên nhân.", "distractors": ["“Every trend proves its cause” ngược hoàn toàn với quan điểm của bài.", "“Projected figures are confirmed outcomes” sai vì projections chỉ là ước tính.", "“Data descriptions should add likely causes” sai vì bài yêu cầu tránh thêm nguyên nhân không được hỗ trợ."], "kb": "Xu hướng/số liệu tự thân không giải thích nguyên nhân.", "authored": false}]},"p2":{"title":"PHẦN 2 — LUYỆN TẬP","desc":"15 câu theo phong cách TNTHPT: cloze mô tả biểu đồ, sắp xếp đoạn văn, hoàn thành đoạn văn, bài tập về nhà","questions":[{"n": 23, "uid": 23, "part": "II. TNTHPT-STYLE CLOZE – GRAPH DESCRIPTION", "hd_fix": false, "prompt": "Câu 23", "options": ["increased", "increasing", "increase", "increasingly"], "keyLetter": "C", "keyText": "increase", "why": "Trích dẫn: \"The urban share shows a gradual (23) ______, while the rural share declines.\" — sau tính từ gradual cần danh từ, nên increase (danh từ) = “sự tăng dần” là đáp án đúng.", "distractors": ["increasing là V-ing, không đứng sau tính từ gradual.", "increased là tính từ/quá khứ, sai loại từ sau tính từ.", "increasingly là trạng từ, sai loại từ."], "kb": "Tính từ + danh từ: a gradual increase.", "authored": false}, {"n": 24, "uid": 24, "part": "II. TNTHPT-STYLE CLOZE – GRAPH DESCRIPTION", "hd_fix": false, "prompt": "Câu 24", "options": ["fall", "to fall", "falling to be", "fell"], "keyLetter": "B", "keyText": "to fall", "why": "Trích dẫn: \"This figure remains relatively high before it begins (24) ______.\" — begin + to-V (to-infinitive), nên “begins to fall” là đáp án đúng.", "distractors": ["fall (bare infinitive) không dùng được sau begins.", "fell (quá khứ) sai cấu trúc sau begin.", "“falling to be” thừa “to be”, vô nghĩa."], "kb": "begin/start + to-V.", "authored": false}, {"n": 25, "uid": 25, "part": "II. TNTHPT-STYLE CLOZE – GRAPH DESCRIPTION", "hd_fix": false, "prompt": "Câu 25", "options": ["because of", "despite", "so", "although"], "keyLetter": "C", "keyText": "so", "why": "Trích dẫn: \"By contrast, the proportion living in cities rises, (25) ______ the gap between the two groups becomes smaller.\" — vế sau là kết quả của vế trước nên dùng so (vì vậy).", "distractors": ["although chỉ sự nhượng bộ, ngược logic nhân–quả ở đây.", "despite là giới từ, không thể đi với một mệnh đề.", "because of là giới từ, không thể đi với một mệnh đề (muốn + mệnh đề phải dùng because)."], "kb": "so + mệnh đề = kết quả; despite/because of + cụm danh từ.", "authored": false}, {"n": 26, "uid": 26, "part": "II. TNTHPT-STYLE CLOZE – GRAPH DESCRIPTION", "hd_fix": false, "prompt": "Câu 26", "options": ["exceeded", "exceeds", "exceeding", "to exceed"], "keyLetter": "D", "keyText": "to exceed", "why": "Trích dẫn: \"In the final part of the period, the urban share is projected (26) ______ the rural share.\" — be projected to + V nguyên thể; exceed = vượt qua.", "distractors": ["exceeding là V-ing, sai cấu trúc sau projected.", "exceeded là quá khứ/tính từ, sai cấu trúc.", "exceeds là động từ chia ngôi thứ 3, không đứng sau projected."], "kb": "be projected to + V nguyên thể.", "authored": false}, {"n": 27, "uid": 27, "part": "II. TNTHPT-STYLE CLOZE – GRAPH DESCRIPTION", "hd_fix": false, "prompt": "Câu 27", "options": ["whose", "where", "whom", "that"], "keyLetter": "D", "keyText": "that", "why": "Trích dẫn: \"These changes should be described as trends rather than explained by causes (27) ______ are not shown in the graph.\" — mệnh đề quan hệ xác định, antecedent là vật (causes) và làm chủ ngữ của “are not shown”, nên dùng that.", "distractors": ["where chỉ nơi chốn, sai trong ngữ cảnh này.", "whose chỉ sở hữu, sai trong ngữ cảnh này.", "whom chỉ người làm tân ngữ, sai trong ngữ cảnh này."], "kb": "Mệnh đề quan hệ: vật + that + V (that làm chủ ngữ).", "authored": false}, {"n": 28, "uid": 28, "part": "III. ORDERING – GRAPH DESCRIPTION LOGIC", "hd_fix": false, "prompt": "a. By contrast, the urban share increased throughout most of the period.<br>b. Overall, the two population groups followed opposite trends.<br>c. The line graph compares the proportions of urban and rural residents over six decades.<br>d. The rural share was initially dominant but declined gradually.", "options": ["d – a – c – b", "b – c – a – d", "c – b – d – a", "c – d – a – b"], "keyLetter": "C", "keyText": "c – b – d – a", "why": "Đoạn mô tả biểu đồ theo trật tự: giới thiệu biểu đồ (c) → nhận xét chung/overview (b) → chi tiết xu hướng giảm (d) → đối lập xu hướng tăng (a, mở đầu bằng “By contrast”).", "distractors": ["“b – c – a – d” sai vì bắt đầu bằng overview (b) trước khi giới thiệu biểu đồ (c).", "“c – d – a – b” sai vì đặt overview (b) ở cuối, sau phần chi tiết.", "“d – a – c – b” sai vì mở đầu bằng chi tiết (d), thiếu phần giới thiệu trước."], "kb": "introduction → overview → details; cụm “By contrast” luôn đứng sau ý nó đối lập.", "authored": false}, {"n": 29, "uid": 29, "part": "III. ORDERING – GRAPH DESCRIPTION LOGIC", "hd_fix": false, "prompt": "a. After 1990, however, the urban proportion began to rise more clearly.<br>b. In 1960, only a relatively small share of the population lived in urban areas.<br>c. By 2020, the figure had reached its highest point on the graph.<br>d. It changed only slightly during the following decades.", "options": ["c – b – d – a", "b – d – a – c", "b – a – d – c", "d – b – c – a"], "keyLetter": "B", "keyText": "b – d – a – c", "why": "Trật tự thời gian: 1960 tỷ lệ thấp (b) → các thập kỷ sau thay đổi ít (d) → sau 1990 tăng rõ (a, “however”) → 2020 đạt đỉnh (c).", "distractors": ["“d – b – c – a” sai vì mở đầu bằng “It changed only slightly” (d) khi chủ thể còn chưa được nêu.", "“b – a – d – c” sai vì đặt “however” (a) trước khi có xu hướng ban đầu để đối lập.", "“c – b – d – a” sai vì bắt đầu từ 2020 (c), đảo ngược trình tự thời gian."], "kb": "Sắp xếp theo mốc thời gian; chú ý từ nối (however) và đại từ (It) cần antecedent đứng trước.", "authored": false}, {"n": 30, "uid": 30, "part": "IV. PASSAGE COMPLETION – INFORMATION FLOW", "hd_fix": false, "prompt": "Choose the best sentence.", "options": ["An overview should then state the most important overall pattern shown by the graph.", "The writer should next explain all social causes that may have produced the figures.", "Personal opinions should be introduced early so the description has a clear position.", "Every numerical value should be included in the overview before trends are discussed."], "keyLetter": "A", "keyText": "An overview should then state the most important overall pattern shown by the graph.", "why": "Trích dẫn: \"The writer first identifies the variables, time period and unit.\" — sau bước nhận diện biến số, bước tiếp theo là nêu overview (nhận xét tổng quan nhất) trước khi đi vào chi tiết.", "distractors": ["Bài yêu cầu tránh giải thích nguyên nhân (“described as trends rather than explained by causes”), nên không chọn giải thích mọi nguyên nhân xã hội.", "Overview mang tính chọn lọc (“selective rather than exhaustive”), không liệt kê mọi con số.", "Đưa ý kiến cá nhân vào mô tả số liệu là sai quy tắc của dạng bài."], "kb": "Trình tự: introduction (biến số, thời gian, đơn vị) → overview → body (xu hướng).", "authored": false}, {"n": 31, "uid": 31, "part": "IV. PASSAGE COMPLETION – INFORMATION FLOW", "hd_fix": false, "prompt": "Choose the best sentence.", "options": ["Trend verbs should be avoided because they can make comparisons between values less precise.", "The most accurate body paragraph is usually the one containing the largest number of figures.", "A graph description should explain policy causes whenever two lines move in opposite directions.", "Comparisons and reference words help show how the main data points relate to one another."], "keyLetter": "D", "keyText": "Comparisons and reference words help show how the main data points relate to one another.", "why": "Trích dẫn: \"The body paragraphs then group related data into meaningful trends instead of listing every point mechanically.\" — nhóm số liệu thành xu hướng đòi hỏi cho thấy mối liên hệ giữa các điểm dữ liệu; comparisons và reference words làm đúng việc đó.", "distractors": ["Đoạn văn không đánh giá bằng số lượng con số (“selective rather than exhaustive”).", "Trend verbs chính là công cụ mô tả xu hướng, không nên tránh.", "Bài cấm giải thích nguyên nhân (“avoid adding unsupported causes”)."], "kb": "Body = nhóm xu hướng + so sánh + từ thay thế (reference words).", "authored": false}, {"n": 36, "uid": 36, "part": "V. HOMEWORK – TNTHPT TRANSFER", "hd_fix": false, "prompt": "Câu 36", "options": ["steady", "steadied", "steadiness", "steadily"], "keyLetter": "D", "keyText": "steadily", "why": "Trích dẫn: \"The figure was relatively stable during the first five years, but then began to rise (36) ______.\" — sau động từ rise cần trạng từ, nên steadily là đáp án đúng.", "distractors": ["steady là tính từ, không bổ nghĩa cho động từ.", "steadiness là danh từ, sai loại từ.", "steadied là quá khứ, sai cấu trúc sau rise."], "kb": "rise + trạng từ (steadily, gradually, sharply).", "authored": false}, {"n": 37, "uid": 37, "part": "V. HOMEWORK – TNTHPT TRANSFER", "hd_fix": false, "prompt": "Câu 37", "options": ["despite", "because of", "so", "although"], "keyLetter": "C", "keyText": "so", "why": "Trích dẫn: \"The report also showed a decline in private-car use, (37) ______ the two trends moved in opposite directions.\" — vế sau là kết quả/logic từ hai xu hướng ngược chiều nên dùng so.", "distractors": ["although chỉ sự nhượng bộ, ngược logic ở đây.", "despite là giới từ, không thể đi với một mệnh đề.", "because of là giới từ, không thể đi với một mệnh đề (muốn + mệnh đề phải dùng because)."], "kb": "so + mệnh đề (kết quả); despite/because of + cụm danh từ.", "authored": false}, {"n": 38, "uid": 38, "part": "V. HOMEWORK – TNTHPT TRANSFER", "hd_fix": false, "prompt": "Câu 38", "options": ["where person", "whose", "who", "why"], "keyLetter": "D", "keyText": "why", "why": "Trích dẫn: \"they do not by themselves explain the reasons (38) ______ the changes occurred.\" — reasons đi với mệnh đề quan hệ why (cụm the reason why).", "distractors": ["who chỉ người, sai trong ngữ cảnh này.", "“where person” thừa từ person và sai nghĩa.", "whose chỉ sở hữu, sai trong ngữ cảnh này."], "kb": "the reason(s) + why + mệnh đề.", "authored": false}, {"n": 39, "uid": 39, "part": "V. HOMEWORK – TNTHPT TRANSFER", "hd_fix": false, "prompt": "Câu 39", "options": ["to added", "added", "adding", "add"], "keyLetter": "C", "keyText": "adding", "why": "Trích dẫn: \"A careful summary should therefore report the data accurately and avoid (39) ______ unsupported causes.\" — avoid + V-ing nên adding là đáp án đúng.", "distractors": ["add (bare infinitive) không dùng được sau avoid.", "added sai loại từ sau avoid.", "“to added” sai cấu trúc hoàn toàn."], "kb": "avoid + V-ing.", "authored": false}, {"n": 40, "uid": 40, "part": "V. HOMEWORK – TNTHPT TRANSFER", "hd_fix": false, "prompt": "Câu 40", "options": ["to", "for", "at", "with"], "keyLetter": "A", "keyText": "to", "why": "Trích dẫn: \"This distinction contributes (40) ______ more reliable interpretation.\" — contribute to + N; giới từ to cố định.", "distractors": ["for không đi với contribute.", "at là giới từ sai trong cụm này.", "with là giới từ sai trong cụm này."], "kb": "contribute TO + danh từ.", "authored": false}, {"n": 41, "uid": 41, "part": "III. ORDERING – GRAPH DESCRIPTION LOGIC", "hd_fix": false, "prompt": "41. <br>a. The figure then rose steadily for the rest of the period.<br>b. Overall, public-transport use increased.<br>c. It remained almost unchanged during the first five years.<br>d. The chart shows the share of commuters using public transport.", "options": ["c – a – d – b", "d – c – b – a", "b – d – a – c", "d – b – c – a"], "keyLetter": "D", "keyText": "d – b – c – a", "why": "Mạch chuẩn mô tả biểu đồ: d giới thiệu chart → b overview (Overall) → c chi tiết giai đoạn đầu (ổn định) → a “then” nối tiếp giai đoạn sau (tăng đều).", "distractors": ["C. sai: overview (b) không thể đứng trước câu giới thiệu (d).", "B. sai: “then” trong (a) không thể đứng cuối sau câu tổng kết (b).", "A. sai: câu giới thiệu (d) không thể nằm giữa đoạn."], "kb": "Mô tả biểu đồ: introduction → overview → details theo trình tự thời gian.", "authored": false}]} ,"p3":{"title":"PHẦN 3 — CỦNG CỐ","desc":"20 câu trắc nghiệm củng cố kiến thức trọng tâm của bài: cụm từ mô tả biểu đồ & quy tắc viết","questions":[{"n": 1, "uid": 1, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "rise steadily : ______", "options": ["tăng đột ngột", "tăng đều", "giảm dần", "không đổi"], "keyLetter": "B", "keyText": "tăng đều", "why": "rise = tăng, steadily = đều đặn — nghĩa đúng là “tăng đều”.", "distractors": ["“giảm dần” là nghĩa của fall gradually.", "“không đổi” là nghĩa của remain stable.", "“tăng đột ngột” là nghĩa của rise sharply."], "kb": "steadily = đều đặn (≠ sharply = đột ngột).", "authored": false}, {"n": 2, "uid": 2, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "fall gradually : ______", "options": ["dự kiến tăng", "tăng nhẹ", "giảm dần", "đạt mức"], "keyLetter": "C", "keyText": "giảm dần", "why": "fall = giảm, gradually = dần dần — nghĩa đúng là “giảm dần”.", "distractors": ["“tăng nhẹ” là nghĩa của rise slightly.", "“đạt mức” là nghĩa của reach/stand at.", "“dự kiến tăng” là nghĩa của be projected to rise."], "kb": "gradually = dần dần.", "authored": false}, {"n": 3, "uid": 3, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "remain ______", "options": ["stable", "projection", "steadily", "increase"], "keyLetter": "A", "keyText": "stable", "why": "remain là linking verb, sau nó cần tính từ — stable.", "distractors": ["steadily là trạng từ, không đứng sau remain.", "projection là danh từ, sai nghĩa trong cụm này.", "increase là động từ/danh từ, sai loại từ."], "kb": "remain + tính từ.", "authored": false}, {"n": 4, "uid": 4, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "move ______ opposite directions", "options": ["by", "at", "in", "to"], "keyLetter": "C", "keyText": "in", "why": "move in opposite directions là cụm cố định.", "distractors": ["to chỉ hướng tới một điểm đến.", "at chỉ vị trí/mức.", "by chỉ mức chênh lệch."], "kb": "move IN opposite directions (học thuộc).", "authored": false}, {"n": 5, "uid": 5, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "rise ______ 70%", "options": ["to", "by", "for", "at"], "keyLetter": "A", "keyText": "to", "why": "to + con số chỉ giá trị cuối cùng đạt được (lên tới 70%).", "distractors": ["by chỉ mức chênh lệch, không phải giá trị cuối.", "at đi với stand, không dùng với rise.", "for là giới từ sai trong cụm này."], "kb": "to = giá trị cuối.", "authored": false}, {"n": 6, "uid": 6, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "rise ______ 10 percentage points", "options": ["at", "by", "to", "with"], "keyLetter": "B", "keyText": "by", "why": "by + mức chênh lệch chỉ số lượng tăng thêm (10 điểm phần trăm).", "distractors": ["to chỉ giá trị cuối, không phải mức chênh lệch.", "at đi với stand, không dùng với rise.", "with là giới từ sai trong cụm này."], "kb": "by = mức chênh lệch.", "authored": false}, {"n": 7, "uid": 7, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "be projected ______ increase", "options": ["for", "with", "at", "to"], "keyLetter": "D", "keyText": "to", "why": "be projected to + V nguyên thể — cấu trúc to-infinitive.", "distractors": ["for không đi sau projected trong cấu trúc này.", "with là giới từ sai trong cấu trúc này.", "at là giới từ sai trong cấu trúc này."], "kb": "be projected/expected to + V.", "authored": false}, {"n": 8, "uid": 8, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "stand ______ 40%", "options": ["at", "for", "by", "to"], "keyLetter": "A", "keyText": "at", "why": "stand at + số = ở mức — cụm cố định.", "distractors": ["to dùng với rise/fall, không dùng với stand.", "by chỉ mức chênh lệch.", "for là giới từ sai trong cụm này."], "kb": "stand AT + số.", "authored": false}, {"n": 9, "uid": 9, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "the urban ______", "options": ["share", "project", "steady", "cause"], "keyLetter": "A", "keyText": "share", "why": "the urban share = tỷ trọng dân số đô thị — cụm danh từ của bài.", "distractors": ["cause sai nghĩa (nguyên nhân).", "project sai nghĩa trong cụm này.", "steady là tính từ, không tạo thành cụm đúng."], "kb": "the urban/rural share.", "authored": false}, {"n": 10, "uid": 10, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "avoid ______ unsupported causes", "options": ["adding", "add", "added", "to added"], "keyLetter": "A", "keyText": "adding", "why": "avoid + V-ing — cấu trúc cố định nên chọn adding.", "distractors": ["add (bare infinitive) không dùng được sau avoid.", "added sai loại từ sau avoid.", "“to added” sai cấu trúc hoàn toàn."], "kb": "avoid + V-ing.", "authored": false}, {"n": 11, "uid": 11, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "report the data ______", "options": ["increase", "accurately", "projected", "stable"], "keyLetter": "B", "keyText": "accurately", "why": "Sau động từ report cần trạng từ đúng nghĩa — accurately (một cách chính xác).", "distractors": ["stable là tính từ, sai loại từ.", "projected là tính từ, sai nghĩa.", "increase là động từ/danh từ, sai loại từ."], "kb": "report + trạng từ (accurately).", "authored": false}, {"n": 12, "uid": 12, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "contribute ______ a reliable interpretation", "options": ["to", "at", "with", "for"], "keyLetter": "A", "keyText": "to", "why": "contribute to + N — giới từ to cố định.", "distractors": ["for không đi với contribute.", "with là giới từ sai trong cụm này.", "at là giới từ sai trong cụm này."], "kb": "contribute TO + danh từ.", "authored": false}, {"n": 13, "uid": 13, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "future values are ______", "options": ["opinions", "causes", "projections", "certainties"], "keyLetter": "C", "keyText": "projections", "why": "Giá trị tương lai trong biểu đồ dự báo là projections (các ước tính).", "distractors": ["causes sai chủ đề.", "opinions sai — đây không phải ý kiến.", "certainties ngược nghĩa — giá trị dự báo chưa chắc chắn."], "kb": "future values = projections (ước tính, chưa xác nhận).", "authored": false}, {"n": 14, "uid": 14, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "trends alone do not explain ______", "options": ["percentages", "causes", "units", "figures"], "keyLetter": "B", "keyText": "causes", "why": "Xu hướng tự thân không giải thích được nguyên nhân — causes.", "distractors": ["figures sai vì xu hướng chính là rút ra từ số liệu.", "percentages sai chủ đề.", "units sai chủ đề."], "kb": "trends ≠ causes: mô tả xu hướng, không suy nguyên nhân.", "authored": false}, {"n": 15, "uid": 15, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "the proportion ______ urban residents", "options": ["with", "of", "to", "for"], "keyLetter": "B", "keyText": "of", "why": "the proportion of + N — cụm cố định.", "distractors": ["for là giới từ sai trong cụm này.", "to là giới từ sai trong cụm này.", "with là giới từ sai trong cụm này."], "kb": "proportion/percentage OF + danh từ.", "authored": false}, {"n": 16, "uid": 16, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "the two figures move ______", "options": ["percentage", "in opposite directions", "stable", "projection"], "keyLetter": "B", "keyText": "in opposite directions", "why": "Hai đường số liệu đi ngược chiều nhau — in opposite directions.", "distractors": ["stable là tính từ, không tạo thành cụm đúng.", "projection sai nghĩa (sự dự báo).", "percentage sai nghĩa (phần trăm)."], "kb": "move in opposite directions.", "authored": false}, {"n": 17, "uid": 17, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "show a consistent upward movement = ______", "options": ["remain stable", "fall steadily", "rise steadily", "decline gradually"], "keyLetter": "C", "keyText": "rise steadily", "why": "upward movement = rise, consistent = steadily — tương đương “rise steadily”.", "distractors": ["fall steadily ngược nghĩa.", "remain stable sai nghĩa.", "decline gradually ngược nghĩa."], "kb": "consistent = steadily; upward = rise.", "authored": false}, {"n": 18, "uid": 18, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "remain almost unchanged = ______", "options": ["remain stable", "increase rapidly", "fall sharply", "project"], "keyLetter": "A", "keyText": "remain stable", "why": "unchanged = stable (không đổi = ổn định) — tương đương “remain stable”.", "distractors": ["increase rapidly ngược nghĩa.", "fall sharply ngược nghĩa.", "project sai loại từ và sai nghĩa."], "kb": "unchanged = stable.", "authored": false}, {"n": 19, "uid": 19, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "estimates, not confirmed outcomes = ______", "options": ["projections", "causes", "units", "historical figures"], "keyLetter": "A", "keyText": "projections", "why": "projections = các ước tính, chưa phải kết quả đã xác nhận.", "distractors": ["historical figures ngược nghĩa — số liệu quá khứ đã được xác nhận.", "causes sai chủ đề.", "units sai nghĩa."], "kb": "projection = estimate ≠ confirmed outcome.", "authored": false}, {"n": 20, "uid": 20, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "A graph description should avoid ______", "options": ["trend verbs", "reference words", "unsupported causes", "comparison"], "keyLetter": "C", "keyText": "unsupported causes", "why": "Mô tả biểu đồ chỉ báo cáo số liệu, phải tránh thêm nguyên nhân không được dữ liệu hỗ trợ.", "distractors": ["comparison nên dùng — so sánh các xu hướng.", "reference words nên dùng — từ thay thế tránh lặp.", "trend verbs nên dùng — động từ mô tả xu hướng."], "kb": "Describe trends, don't explain causes.", "authored": false}]}};
const PASSAGES={"TNTHPT-STYLE CLOZE": "<p>The line graph compares the proportions of people living in urban and rural areas over time. Overall, the two figures move in opposite directions. The urban share shows a gradual (23) ______, while the rural share declines. At the beginning of the period, most residents live in rural areas. This figure remains relatively high before it begins (24) ______. By contrast, the proportion living in cities rises, (25) ______ the gap between the two groups becomes smaller. In the final part of the period, the urban share is projected (26) ______ the rural share. These changes should be described as trends rather than explained by causes (27) ______ are not shown in the graph.</p>", "PASSAGE COMPLETION": "<p>A good line-graph description is selective rather than exhaustive. The writer first identifies the variables, time period and unit. (30) ______. The body paragraphs then group related data into meaningful trends instead of listing every point mechanically. (31) ______. Finally, future values must be marked as projections if the graph presents them as estimates.</p>", "HOMEWORK": "<p>A city report tracked the percentage of commuters using public transport over a twenty-year period. The figure was relatively stable during the first five years, but then began to rise (36) ______. By the end of the period, the share had almost doubled. The report also showed a decline in private-car use, (37) ______ the two trends moved in opposite directions. These figures describe changes in travel behaviour; they do not by themselves explain the reasons (38) ______ the changes occurred. A careful summary should therefore report the data accurately and avoid (39) ______ unsupported causes. This distinction contributes (40) ______ more reliable interpretation.</p>"};

const startEpoch=Date.now();
const letters=['A','B','C','D'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
