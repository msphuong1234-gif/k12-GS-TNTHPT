<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}

header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}

.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}

.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}

.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}

.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}

.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}

.view{display:none}.view.active{display:block}

@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

th” không dùng trong nghĩa “được hỗ trợ bởi”."], "kb": "be supported BY + sth — được hỗ trợ bởi…", "authored": false}, {"n": 30, "uid": 30, "part": "III. WORD FORMS", "hd_fix": false, "prompt": "The country is highly ______.", "options": ["efficient", "urbanise", "urbanisation", "urbanised"], "keyLetter": "D", "keyText": "urbanised", "why": "Sau trạng từ “highly” cần tính từ: “urbanised” (được đô thị hóa).", "distractors": ["“urbanise” là động từ, không đứng sau “highly”.", "“urbanisation” là danh từ, sai từ loại.", "“efficient” là tính từ nhưng sai nghĩa (hiệu quả, không phải đô thị hóa)."], "kb": "highly + tính từ: highly urbanised.", "authored": false}, {"n": 31, "uid": 31, "part": "III. WORD FORMS", "hd_fix": false, "prompt": "The project improved service ______.", "options": ["congestion", "efficiently", "efficiency", "efficient"], "keyLetter": "C", "keyText": "efficiency", "why": "Sau “service” cần danh từ làm tân ngữ của “improved”: “efficiency” (hiệu quả).", "distractors": ["“efficient” là tính từ, không làm tân ngữ.", "“efficiently” là trạng từ, sai từ loại.", "“congestion” là danh từ nhưng sai nghĩa (ùn tắc)."], "kb": "improve + danh từ: improve service efficiency.", "authored": false}, {"n": 32, "uid": 32, "part": "III. WORD FORMS", "hd_fix": false, "prompt": "The system operates more ______.", "options": ["efficient", "congested", "efficiency", "efficiently"], "keyLetter": "D", "keyText": "efficiently", "why": "“more” + trạng từ bổ nghĩa cho động từ “operates”: “efficiently”.", "distractors": ["“efficient” là tính từ, không bổ nghĩa động từ.", "“efficiency” là danh từ, sai từ loại.", "“congested” là tính từ quá khứ phân từ nhưng sai nghĩa."], "kb": "more + trạng từ: operates more efficiently.", "authored": false}, {"n": 33, "uid": 33, "part": "III. WORD FORMS", "hd_fix": false, "prompt": "The road is badly ______ during rush hour.", "options": ["congested", "efficient", "congestion", "congest"], "keyLetter": "A", "keyText": "congested", "why": "“badly” + quá khứ phân từ làm tính từ: “congested” (bị kẹt xe).", "distractors": ["“congest” là động từ nguyên thể, không đứng sau “badly” theo nghĩa này.", "“congestion” là danh từ, sai từ loại.", "“efficient” sai nghĩa hoàn toàn."], "kb": "be badly congested — bị kẹt xe nghiêm trọng.", "authored": false}, {"n": 34, "uid": 34, "part": "III. WORD FORMS", "hd_fix": false, "prompt": "Traffic ______ remains a serious problem.", "options": ["congestion", "congested", "congest", "efficiency"], "keyLetter": "A", "keyText": "congestion", "why": "“Traffic … remains a serious problem” cần danh từ làm chủ ngữ: “congestion”.", "distractors": ["“congest” là động từ, không làm chủ ngữ.", "“congested” là tính từ, sai từ loại.", "“efficiency” là danh từ nhưng sai nghĩa."], "kb": "traffic congestion — danh từ làm chủ ngữ.", "authored": false}, {"n": 35, "uid": 35, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "“almost 90%” is closest in meaning to ______.", "options": ["the two population shares were nearly the same", "among the most highly urbanised countries", "more than 77%", "nearly / close to / just under 90%"], "keyLetter": "D", "keyText": "nearly / close to / just under 90%", "why": "“almost 90%” ≈ “nearly / close to / just under 90%” — cùng diễn đạt “gần 90%, chưa tới 90%”.", "distractors": ["“among the most highly urbanised countries” nói về mức độ đô thị hóa của quốc gia, không phải con số %.", "“the two population shares were nearly the same” là so sánh hai nhóm dân số, không phải “gần 90%”.", "“more than 77%” là ngưỡng phần trăm khác."], "kb": "almost = nearly = just under (gần mà chưa tới).", "authored": false}, {"n": 36, "uid": 36, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "“over 77%” is closest in meaning to ______.", "options": ["more than 77%", "the two population shares were nearly the same", "present proportion of people living in urban areas", "among the most highly urbanised countries"], "keyLetter": "A", "keyText": "more than 77%", "why": "“over 77%” = “more than 77%” — “over” trước số liệu nghĩa là “hơn”.", "distractors": ["“the two population shares were nearly the same” là so sánh hai nhóm, không diễn đạt “hơn 77%”.", "“present proportion of people living in urban areas” là định nghĩa tỷ trọng, thiếu ý “hơn”.", "“among the most highly urbanised countries” là xếp hạng quốc gia, không phải %."], "kb": "over + số = more than + số.", "authored": false}, {"n": 37, "uid": 37, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "“one of the most urbanised countries” is closest in meaning to ______.", "options": ["present proportion of people living in urban areas", "among the most highly urbanised countries", "the two population shares were nearly the same", "how quickly the urban share is changing"], "keyLetter": "B", "keyText": "among the most highly urbanised countries", "why": "“one of the most urbanised countries” ≈ “among the most highly urbanised countries” — cùng nghĩa “thuộc nhóm các nước đô thị hóa nhất”.", "distractors": ["“present proportion of people living in urban areas” là định nghĩa tỷ trọng, không phải xếp hạng.", "“how quickly the urban share is changing” là định nghĩa “rate”, không phải “level”.", "“the two population shares were nearly the same” là so sánh hai nhóm dân số."], "kb": "one of the most + adj = among the most + adj.", "authored": false}, {"n": 38, "uid": 38, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "“urban and rural populations were almost equal” is closest in meaning to ______.", "options": ["the rural population was much greater than the urban one", "the urban population was slightly larger than the rural one", "the two population shares were nearly the same", "both populations were growing at the same speed"], "keyLetter": "C", "keyText": "the two population shares were nearly the same", "why": "\"almost equal\" = gần như bằng nhau → \"the two population shares were nearly the same\".", "distractors": ["B. \"slightly larger\" (hơi lớn hơn) ≠ \"almost equal\" (gần như bằng nhau) — sai mức độ.", "A. \"much greater\" (lớn hơn nhiều) ngược với \"almost equal\".", "D. nhầm \"equal\" (bằng nhau về quy mô) với \"growing at the same speed\" (tăng cùng tốc độ) — sai khía cạnh so sánh."], "kb": "almost equal ≈ nearly the same (gần như bằng nhau).", "authored": false}, {"n": 39, "uid": 39, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "“urbanisation level” is closest in meaning to ______.", "options": ["a lower urban share may still accompany a faster current rate of change", "present proportion of people living in urban areas", "how quickly the urban share is changing", "a carefully investigated complaint can provide useful evidence"], "keyLetter": "B", "keyText": "present proportion of people living in urban areas", "why": "“urbanisation level” là mức độ đô thị hóa hiện tại ≈ “present proportion of people living in urban areas” (tỷ trọng dân số sống ở đô thị hiện nay).", "distractors": ["“a lower urban share may still accompany a faster current rate of change” là một luận điểm cụ thể, không phải định nghĩa “level”.", "“a carefully investigated complaint can provide useful evidence” thuộc chủ đề khiếu nại, lạc đề.", "“how quickly the urban share is changing” là định nghĩa của “rate”, không phải “level”."], "kb": "level = mức/tỷ trọng hiện tại; rate = tốc độ thay đổi.", "authored": false}, {"n": 40, "uid": 40, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "“urbanisation rate” is closest in meaning to ______.", "options": ["a carefully investigated complaint can provide useful evidence", "nearly / close to / just under 90%", "a lower urban share may still accompany a faster current rate of change", "how quickly the urban share is changing"], "keyLetter": "D", "keyText": "how quickly the urban share is changing", "why": "“urbanisation rate” là tốc độ đô thị hóa ≈ “how quickly the urban share is changing”.", "distractors": ["“a carefully investigated complaint can provide useful evidence” thuộc chủ đề khác.", "“nearly / close to / just under 90%” là con số phần trăm, không phải định nghĩa.", "“a lower urban share may still accompany a faster current rate of change” là một luận điểm, không phải định nghĩa “rate”."], "kb": "rate = how quickly… changes.", "authored": false}, {"n": 41, "uid": 41, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "“a lower urban share can still be associated with faster current change” is closest in meaning to ______.", "options": ["a lower urban share may still accompany a faster current rate of change", "a lower urban share must mean slower current change", "a higher urban share always means slower change", "urban share and the rate of change are completely unrelated"], "keyLetter": "A", "keyText": "a lower urban share may still accompany a faster current rate of change", "why": "\"a lower urban share\" + \"can still be associated with\" (vẫn có thể đi kèm với) + \"faster current change\" → C diễn đạt lại đúng cả ba thành phần.", "distractors": ["C. đảo ngược quan hệ (\"higher... slower\") và thêm \"always\" tuyệt đối — sai.", "B. \"must mean slower\" ngược với \"may still... faster\".", "D. \"completely unrelated\" mâu thuẫn với \"associated with\"."], "kb": "be associated with = có liên quan/đi kèm với; đọc kỹ từ chỉ mức độ và chiều quan hệ.", "authored": false}, {"n": 42, "uid": 42, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "“a specific complaint can provide useful evidence when carefully investigated” is closest in meaning to ______.", "options": ["a carefully investigated complaint can provide useful evidence", "nearly / close to / just under 90%", "more than 77%", "among the most highly urbanised countries"], "keyLetter": "A", "keyText": "a carefully investigated complaint can provide useful evidence", "why": "Câu đúng giữ nguyên logic gốc: khiếu nại cụ thể (specific) + được điều tra cẩn thận (carefully investigated) → bằng chứng hữu ích (useful evidence).", "distractors": ["“Every complaint proves the cause immediately” tuyệt đối hóa bằng “every” và “immediately” — phóng đại.", "“Complaints should replace investigation” đảo ngược vai trò: điều tra bị thay thế thay vì được thực hiện.", "“A specific complaint is never useful evidence” phủ định hoàn toàn bằng “never” — ngược nghĩa."], "kb": "Paraphrase đúng không phóng đại, không đảo nghĩa.", "authored": false}, {"n": 43, "uid": 43, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "Which expression means “gây áp lực lớn lên cơ sở hạ tầng đô thị”?", "options": ["place a serious strain on urban infrastructure", "reduce traffic congestion", "review a route", "contribute to trust"], "keyLetter": "A", "keyText": "place a serious strain on urban infrastructure", "why": "“gây áp lực lớn lên cơ sở hạ tầng đô thị” = “place a serious strain on urban infrastructure”.", "distractors": ["“reduce traffic congestion” nghĩa là “giảm ùn tắc giao thông” — khác nghĩa.", "“review a route” nghĩa là “xem xét tuyến đường” — khác nghĩa.", "“contribute to trust” nghĩa là “góp phần tạo niềm tin” — khác nghĩa."], "kb": "place a (serious) strain on + sth — gây áp lực lên…", "authored": false}, {"n": 44, "uid": 44, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "Which expression means “ghi nhận một mối lo / vấn đề”?", "options": ["look into a cause", "make a complaint", "acknowledge a concern / problem", "review a junction"], "keyLetter": "C", "keyText": "acknowledge a concern / problem", "why": "“ghi nhận một mối lo / vấn đề” = “acknowledge a concern / problem”.", "distractors": ["“make a complaint” là “đưa ra lời phàn nàn” — hành động của người dân, khác nghĩa.", "“look into a cause” là “điều tra nguyên nhân” — bước sau, khác nghĩa.", "“review a junction” là “xem xét nút giao” — khác nghĩa."], "kb": "acknowledge a concern — ghi nhận (chưa phải giải quyết ngay).", "authored": false}, {"n": 45, "uid": 45, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "The noun meaning “hiệu suất / hiệu quả” is ______.", "options": ["efficiency", "efficiently", "efficient", "congestion"], "keyLetter": "A", "keyText": "efficiency", "why": "“hiệu suất / hiệu quả” (danh từ) = “efficiency”.", "distractors": ["“efficient” là tính từ (hiệu quả), sai từ loại.", "“efficiently” là trạng từ, sai từ loại.", "“congestion” nghĩa là “sự ùn tắc”, sai nghĩa."], "kb": "efficiency (n) — hiệu quả; efficient (adj); efficiently (adv).", "authored": false}, {"n": 46, "uid": 46, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "The noun meaning “sự ùn tắc” is ______.", "options": ["congestion", "congested", "congest", "efficiency"], "keyLetter": "A", "keyText": "congestion", "why": "“sự ùn tắc” (danh từ) = “congestion”.", "distractors": ["“congest” là động từ (gây ùn tắc), sai từ loại.", "“congested” là tính từ/quá khứ phân từ (bị kẹt), sai từ loại.", "“efficiency” nghĩa là “hiệu quả”, sai nghĩa."], "kb": "congestion (n) — sự ùn tắc.", "authored": false}, {"n": 47, "uid": 47, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "“almost 90%” is closest in meaning to ______.", "options": ["exactly 90%", "just under / nearly 90%", "more than 90%", "well below 80%"], "keyLetter": "B", "keyText": "just under / nearly 90%", "why": "“almost 90%” ≈ “just under / nearly 90%” — “gần 90%, chưa tới 90%”.", "distractors": ["“more than 90%” nghĩa là “hơn 90%” — ngược với “chưa tới”.", "“exactly 90%” nghĩa là “đúng 90%” — mất ý “gần”.", "“well below 80%” nghĩa là “thấp hơn hẳn 80%” — sai số liệu."], "kb": "almost/nearly/just under + số: gần mà chưa tới.", "authored": false}, {"n": 48, "uid": 48, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "“urbanisation rate” refers to ______.", "options": ["the total national population", "how quickly the urban share is changing", "the current proportion living in cities", "the number of complaints"], "keyLetter": "B", "keyText": "how quickly the urban share is changing", "why": "“urbanisation rate” chỉ tốc độ thay đổi ≈ “how quickly the urban share is changing”.", "distractors": ["“the current proportion living in cities” là định nghĩa của “level/share”, không phải “rate”.", "“the total national population” là tổng dân số quốc gia — sai nghĩa.", "“the number of complaints” là số khiếu nại — lạc đề."], "kb": "rate = tốc độ; level/share = mức/tỷ trọng.", "authored": false}, {"n": 49, "uid": 49, "part": "IV. PARAPHRASE & COMPARISON LANGUAGE", "hd_fix": false, "prompt": "Which source paraphrase is correct?", "options": ["Every complaint proves the cause immediately.", "A specific complaint is never useful evidence.", "A carefully investigated complaint can provide useful evidence.", "Complaints should replace investigation."], "keyLetter": "C", "keyText": "A carefully investigated complaint can provide useful evidence.", "why": "Đây là paraphrase đúng duy nhất: giữ nguyên điều kiện (specific + carefully investigated) và kết quả (useful evidence), không thêm bớt.", "distractors": ["“Every complaint proves the cause immediately” tuyệt đối hóa bằng “every” và “immediately”.", "“Complaints should replace investigation” đảo ngược: khiếu nại thay thế điều tra thay vì cần điều tra.", "“A specific complaint is never useful evidence” phủ định hoàn toàn bằng “never”."], "kb": "Paraphrase đúng = giữ logic gốc, không tuyệt đối hóa.", "authored": false}]},"p2":{"title":"PHẦN 2 — LUYỆN TẬP","desc":"43 câu: III. FUNCTIONAL RESPONSE – CHOOSE BY SITUATION (4) • IV. DIALOGUE ORDERING – ADJACENCY BEFORE KEYWORDS (2) • V. URBAN PROBLEM COLLOCATIONS (6) • VII. COMPARISON LANGUAGE – DEGREE, SCOPE, EVIDENCE (4) • VIII. REFERENCE & PARAPHRASE (4) • IX. TNTHPT READING – URBANISATION: RATE IS NOT THE WHOLE STORY (10) • X. PASSAGE COMPLETION – TWO-SIDED COHESION (2) • XI. SENTENCE ORDERING – PROBLEM → RESPONSE → OUTCOME (2) • XII. LANGUAGE-IN-CONTEXT CLOZE (5) • XIII. HOMEWORK – NEW-CONTEXT TRANSFER (5)","questions":[{"n": 1, "uid": 1, "part": "III. FUNCTIONAL RESPONSE – CHOOSE BY SITUATION", "hd_fix": false, "prompt": "A: I’m sorry to have to say this, but the music from your flat is very loud at night. B: ______", "options": ["The music usually finishes before midnight, so it may not last long.", "Have you considered closing the windows when the music is playing?", "The building can be noisy at night, especially at weekends.", "I’m really sorry. I’ll turn it down and make sure it stays quieter."], "keyLetter": "D", "keyText": "I’m really sorry. I’ll turn it down and make sure it stays quieter.", "why": "Trước lời phàn nàn về tiếng ồn ban đêm, câu trả lời phù hợp là xin lỗi và đưa ra hành động khắc phục cụ thể (sẽ vặn nhỏ nhạc).", "distractors": ["“The building can be noisy at night…” chỉ nhận xét chung, không xin lỗi cũng không hành động.", "“Have you considered closing the windows…?” đổ trách nhiệm sang người phàn nàn.", "“The music usually finishes before midnight…” biện minh cho tiếng ồn, không giải quyết."], "kb": "Phàn nàn → xin lỗi + hành động cụ thể.", "authored": false}, {"n": 2, "uid": 2, "part": "III. FUNCTIONAL RESPONSE – CHOOSE BY SITUATION", "hd_fix": false, "prompt": "A: Excuse me. I want to complain about buses arriving late every morning. B: ______", "options": ["The route was changed recently, so some passengers are still getting used to it.", "I’m sorry about that. We’ll report the repeated delays to the transport office.", "Heavy traffic often affects buses on this route during the morning peak.", "You can check the timetable online before leaving home each morning."], "keyLetter": "B", "keyText": "I’m sorry about that. We’ll report the repeated delays to the transport office.", "why": "Trước khiếu nại xe buýt trễ giờ, phản hồi có trách nhiệm là xin lỗi và cam kết báo cáo tình trạng chậm trễ lặp lại.", "distractors": ["“Heavy traffic often affects buses…” chỉ giải thích chung chung, không tiếp nhận khiếu nại.", "“You can check the timetable online…” đẩy việc sang hành khách.", "“The route was changed recently…” biện minh, không đưa ra hành động."], "kb": "Khiếu nại dịch vụ → acknowledge + cam kết xử lý.", "authored": false}, {"n": 3, "uid": 3, "part": "III. FUNCTIONAL RESPONSE – CHOOSE BY SITUATION", "hd_fix": false, "prompt": "Which opening is most suitable for a polite complaint at a community meeting?", "options": ["You need to fix the traffic problem immediately because everyone is affected.", "Could we discuss the traffic situation near the school when there is time?", "I’m sorry to have to say this, but the traffic jams have become extremely serious.", "Traffic around the school seems to be getting busier, doesn’t it?"], "keyLetter": "C", "keyText": "I’m sorry to have to say this, but the traffic jams have become extremely serious.", "why": "Mở đầu lời phàn nàn lịch sự dùng công thức “I’m sorry to have to say this, but…” rồi nêu vấn đề.", "distractors": ["“Could we discuss… when there is time?” trì hoãn, không nêu lời phàn nàn.", "“Traffic… doesn’t it?” chỉ gợi chuyện, chưa phải lời phàn nàn.", "“You need to fix… immediately” ra lệnh, thiếu lịch sự."], "kb": "Công thức mở đầu phàn nàn lịch sự: I’m sorry to have to say this, but…", "authored": false}, {"n": 4, "uid": 4, "part": "III. FUNCTIONAL RESPONSE – CHOOSE BY SITUATION", "hd_fix": false, "prompt": "Which response shows responsibility rather than dismissal?", "options": ["You may need to contact a different office because this is not our responsibility.", "I understand the problem. We’ll look into the cause and possible solutions.", "I understand your concern, but there is probably nothing we can do about it.", "Traffic problems occur in every city, so residents simply have to accept them."], "keyLetter": "B", "keyText": "I understand the problem. We’ll look into the cause and possible solutions.", "why": "Câu trả lời thể hiện trách nhiệm phải tiếp nhận vấn đề và nêu hành động (“look into the cause and possible solutions”).", "distractors": ["“I understand your concern, but… nothing we can do” từ bỏ trách nhiệm.", "“You may need to contact a different office…” đùn đẩy sang nơi khác.", "“…residents simply have to accept them” bắt người dân chấp nhận — né tránh."], "kb": "Trách nhiệm = acknowledge + action; né tránh = dismissal.", "authored": false}, {"n": 5, "uid": 5, "part": "IV. DIALOGUE ORDERING – ADJACENCY BEFORE KEYWORDS", "hd_fix": false, "prompt": "5. Choose the best order.<br>a. I understand. We’ll ask the traffic team to review the junction.<br>b. I’m sorry to have to say this, but the traffic near our school is getting worse.<br>c. Thank you. The morning congestion makes it difficult for students to arrive on time.", "options": ["b – a – c", "c – a – b", "a – b – c", "b – c – a"], "keyLetter": "A", "keyText": "b – a – c", "why": "b mở đầu lời phàn nàn → a đáp lại (“I understand… we’ll review”) → c cảm ơn + bổ sung chi tiết.", "distractors": ["C. sai: a (“I understand”) không thể đứng trước khi có lời phàn nàn.", "D. sai: c (“Thank you”) không thể đứng trước câu đáp lại của đối phương.", "B. sai: không thể cảm ơn (c) trước khi nêu vấn đề."], "kb": "Hội thoại: nêu vấn đề → đáp lại → cảm ơn/kết thúc.", "authored": false}, {"n": 6, "uid": 6, "part": "IV. DIALOGUE ORDERING – ADJACENCY BEFORE KEYWORDS", "hd_fix": false, "prompt": "6. Choose the best order.<br>a. I’m sorry about that. I promise we’ll contact the bus operator.<br>b. Several buses have been more than twenty minutes late this week.<br>c. Excuse me. I want to complain about the bus service in our neighbourhood.<br>d. Thank you. I hope the service improves soon.", "options": ["b – c – d – a", "c – b – a – d", "c – a – b – d", "a – c – b – d"], "keyLetter": "B", "keyText": "c – b – a – d", "why": "c mở đầu khiếu nại → b nêu chi tiết (buses late) → a xin lỗi + hứa hẹn (“I’m sorry about that” chỉ b) → d cảm ơn kết thúc.", "distractors": ["A. sai: b (chi tiết) không thể đứng trước câu mở đầu khiếu nại (c).", "C. sai: a (“I’m sorry about that”) cần có sự việc được nêu trước (b).", "D. sai: không thể xin lỗi (a) trước khi khách nêu khiếu nại."], "kb": "“I’m sorry about that” luôn cần một sự việc được nhắc trước đó.", "authored": false}, {"n": 8, "uid": 8, "part": "V. URBAN PROBLEM COLLOCATIONS", "hd_fix": false, "prompt": "Affordable housing is becoming increasingly difficult to ______.", "options": ["meet", "search", "look", "find"], "keyLetter": "D", "keyText": "find", "why": "“difficult to find” — “find” (tìm được) là động từ hợp nghĩa “khó tìm được nhà ở giá phải chăng”.", "distractors": ["“search” cần giới từ “for” mới đủ nghĩa (search for).", "“look” cần “for” mới đủ nghĩa (look for).", "“meet” nghĩa là “đáp ứng”, không hợp nghĩa “tìm”."], "kb": "difficult + to-V: difficult to find.", "authored": false}, {"n": 9, "uid": 9, "part": "V. URBAN PROBLEM COLLOCATIONS", "hd_fix": false, "prompt": "Heavy traffic can place a serious ______ on urban infrastructure.", "options": ["straining", "strain", "strained", "stressful"], "keyLetter": "B", "keyText": "strain", "why": "“place a serious strain on” — “strain” (áp lực) là danh từ đi sau “a serious”.", "distractors": ["“stressful” là tính từ, không đứng sau “a serious”.", "“straining” là V-ing, sai từ loại ở vị trí này.", "“strained” là tính từ/quá khứ phân từ, không hợp cụm “a serious …”."], "kb": "place a strain on + sth — gây áp lực lên…", "authored": false}, {"n": 10, "uid": 10, "part": "V. URBAN PROBLEM COLLOCATIONS", "hd_fix": false, "prompt": "Cities need to ______ with rising demand for public services.", "options": ["face up", "deal to", "cope", "manage with to"], "keyLetter": "C", "keyText": "cope", "why": "“cope” là động từ duy nhất trong 4 lựa chọn tạo được cụm đúng “cope with rising demand”.", "distractors": ["“deal to” sai giới từ — phải là “deal with”.", "“manage with to” sai cấu trúc — “manage” không đi với “with to”.", "“face up” thiếu “to” — phải là “face up to”."], "kb": "cope with — đương đầu với (đi với giới từ “with”).", "authored": false}, {"n": 11, "uid": 11, "part": "V. URBAN PROBLEM COLLOCATIONS", "hd_fix": false, "prompt": "An efficient transport system can help reduce traffic ______.", "options": ["congesting", "congested", "congest", "congestion"], "keyLetter": "D", "keyText": "congestion", "why": "Sau “reduce traffic” cần danh từ: “congestion” (sự ùn tắc).", "distractors": ["“congested” là tính từ, sai từ loại sau “traffic”.", "“congest” là động từ, không đứng sau “traffic” theo nghĩa này.", "“congesting” là V-ing, sai từ loại."], "kb": "reduce traffic congestion — giảm ùn tắc giao thông.", "authored": false}, {"n": 12, "uid": 12, "part": "V. URBAN PROBLEM COLLOCATIONS", "hd_fix": false, "prompt": "Urban planners must respond ______ the needs of a growing population.", "options": ["to", "at", "for", "with"], "keyLetter": "A", "keyText": "to", "why": "“respond to the needs of a growing population” — cụm cố định “respond to the needs of…”.", "distractors": ["“respond for” không phải cụm chuẩn.", "“respond with” nghĩa là “đáp lại bằng”, không hợp nghĩa.", "“respond at” không đi với “needs”."], "kb": "respond TO the needs of… — đáp ứng nhu cầu của…", "authored": false}, {"n": 13, "uid": 13, "part": "VII. COMPARISON LANGUAGE – DEGREE, SCOPE, EVIDENCE", "hd_fix": false, "prompt": "Which sentence preserves the source’s degree accurately?", "options": ["Exactly 90% of Australia’s population is urban.", "More than 100% is urban.", "Australia has no rural population.", "Almost 90% of Australia’s population is urban."], "keyLetter": "D", "keyText": "Almost 90% of Australia’s population is urban.", "why": "“Almost 90% of Australia’s population is urban” giữ đúng mức độ “gần 90%” như nguồn; các lựa chọn khác đổi mức độ.", "distractors": ["“Exactly 90%” biến “gần” thành “chính xác” — đổi degree.", "“More than 100%” vô lý về mặt số liệu.", "“Australia has no rural population” phóng đại thành 100% đô thị."], "kb": "Giữ nguyên degree: almost ≠ exactly.", "authored": false}, {"n": 14, "uid": 14, "part": "VII. COMPARISON LANGUAGE – DEGREE, SCOPE, EVIDENCE", "hd_fix": false, "prompt": "Which sentence best compares Malaysia and Australia?", "options": ["Malaysia is not urbanised.", "Australia’s current urban share is higher than Malaysia’s.", "Malaysia’s current share is almost 90%.", "Both figures are exactly the same."], "keyLetter": "B", "keyText": "Australia’s current urban share is higher than Malaysia’s.", "why": "Nguồn cho Malaysia “over 77%” và Australia “almost 90%” → urban share hiện tại của Australia cao hơn Malaysia.", "distractors": ["“Malaysia’s current share is almost 90%” gán nhầm số liệu của Australia cho Malaysia.", "“Both figures are exactly the same” sai số liệu (77% ≠ 90%).", "“Malaysia is not urbanised” phủ định hoàn toàn — ngược nguồn."], "kb": "So sánh đúng phải khớp số liệu từng nước.", "authored": false}, {"n": 15, "uid": 15, "part": "VII. COMPARISON LANGUAGE – DEGREE, SCOPE, EVIDENCE", "hd_fix": false, "prompt": "“Over 77 per cent” is closest to ______.", "options": ["more than 77 per cent", "less than 77 per cent", "around 17 per cent", "exactly 77 per cent"], "keyLetter": "A", "keyText": "more than 77 per cent", "why": "“Over 77 per cent” = “more than 77 per cent” — “over” trước số liệu nghĩa là “hơn”.", "distractors": ["“exactly 77 per cent” nghĩa là “đúng 77%” — mất ý “hơn”.", "“less than 77 per cent” nghĩa là “ít hơn” — ngược nghĩa.", "“around 17 per cent” sai hẳn con số."], "kb": "over + số = more than + số.", "authored": false}, {"n": 16, "uid": 16, "part": "VII. COMPARISON LANGUAGE – DEGREE, SCOPE, EVIDENCE", "hd_fix": false, "prompt": "Which option changes the scope of “one of the most urbanised countries”?", "options": ["one of the world’s highly urbanised countries", "the most urbanised country in the world", "a very highly urbanised country", "among the most urbanised countries"], "keyLetter": "B", "keyText": "the most urbanised country in the world", "why": "“the most urbanised country in the world” (nhất thế giới) đã đổi phạm vi của “one of the most…” (một trong những… nhất).", "distractors": ["“among the most urbanised countries” giữ nguyên phạm vi “một trong những”.", "“one of the world’s highly urbanised countries” vẫn là “một trong những”.", "“a very highly urbanised country” chỉ nói “rất cao”, không đổi scope."], "kb": "“one of the most” ≠ “the most” — đổi scope là đổi nghĩa.", "authored": false}, {"n": 17, "uid": 17, "part": "VIII. REFERENCE & PARAPHRASE", "hd_fix": false, "prompt": "The word “its” refers to ______.", "options": ["the early 1970s", "Malaysia’s", "the urban share’s", "Australia’s"], "keyLetter": "B", "keyText": "Malaysia’s", "why": "Trích dẫn: “By the early 1990s, its urban and rural populations were almost equal.” — “its” đứng ngay sau câu nói về Malaysia nên chỉ Malaysia.", "distractors": ["“the early 1970s” là mốc thời gian, không thể sở hữu “populations”.", "“Australia’s” — Australia không xuất hiện trong đoạn này.", "“the urban share’s” — “urban share” không sở hữu “populations”."], "kb": "Đại từ sở hữu “its” → danh từ số ít đứng trước gần nhất.", "authored": false}, {"n": 18, "uid": 18, "part": "VIII. REFERENCE & PARAPHRASE", "hd_fix": false, "prompt": "“Since then” refers to the period ______.", "options": ["before the 1970s", "before urbanisation started", "after the early 1990s", "only in 2014"], "keyLetter": "C", "keyText": "after the early 1990s", "why": "Trích dẫn: “By the early 1990s, its urban and rural populations were almost equal. Since then, the urban share has continued to increase gradually.” — “then” là mốc “the early 1990s”.", "distractors": ["“before the 1970s” nằm trước mốc “then”, không phải “since then”.", "“only in 2014” không xuất hiện trong đoạn.", "“before urbanisation started” ngược với “since” (kể từ)."], "kb": "“Since then” = kể từ mốc thời gian vừa nêu.", "authored": false}, {"n": 19, "uid": 19, "part": "VIII. REFERENCE & PARAPHRASE", "hd_fix": false, "prompt": "“This long-term change” refers to ______.", "options": ["the disappearance of cities", "a fall to 26%", "the continuing increase in the urban share", "Australia’s population"], "keyLetter": "C", "keyText": "the continuing increase in the urban share", "why": "Trích dẫn: “Since then, the urban share has continued to increase gradually. This long-term change has made the country highly urbanised.” — “this” tóm tắt sự tăng dần của urban share.", "distractors": ["“the disappearance of cities” ngược nghĩa với “increase”.", "“a fall to 26%” không có trong đoạn.", "“Australia’s population” — Australia không xuất hiện trong đoạn."], "kb": "“This + danh từ” tóm tắt cả mệnh đề đứng trước.", "authored": false}, {"n": 20, "uid": 20, "part": "VIII. REFERENCE & PARAPHRASE", "hd_fix": false, "prompt": "Best paraphrase of “the urban and rural populations were almost equal”:", "options": ["Both groups disappeared.", "The urban population was exactly twice the rural population.", "The two population shares were nearly the same.", "There was no urban population."], "keyLetter": "C", "keyText": "The two population shares were nearly the same.", "why": "Trích dẫn: “its urban and rural populations were almost equal” — paraphrase: “were almost equal” → “were nearly the same”.", "distractors": ["“Both groups disappeared” nghĩa là “biến mất” — ngược nghĩa.", "“exactly twice” nghĩa là “gấp đôi” — sai số liệu.", "“no urban population” nghĩa là “không có dân đô thị” — sai."], "kb": "almost equal = nearly the same.", "authored": false}, {"n": 21, "uid": 21, "part": "IX. TNTHPT READING – URBANISATION: RATE IS NOT THE WHOLE STORY", "hd_fix": false, "prompt": "What is the main idea of the passage?", "options": ["Countries with similar urban shares usually face similar development pressures.", "Urbanisation comparisons should distinguish current level from rate of change.", "Urbanisation can be compared accurately through current percentages alone.", "Infrastructure provides a more useful measure of urbanisation than population."], "keyLetter": "B", "keyText": "Urbanisation comparisons should distinguish current level from rate of change.", "why": "Trích dẫn: “Urban statistics therefore need to be read with attention to both level and rate.” — ý chính: so sánh đô thị hóa phải phân biệt level (mức hiện tại) và rate (tốc độ thay đổi).", "distractors": ["“through current percentages alone” bị bài phản bác (“a single percentage… does not tell the whole story”).", "“similar shares → similar pressures” ngược ý bài (“very different rates of change…”).", "“infrastructure as a measure” — bài không đề xuất hạ tầng làm thước đo."], "kb": "Main idea = luận điểm của đoạn kết.", "authored": false}, {"n": 22, "uid": 22, "part": "IX. TNTHPT READING – URBANISATION: RATE IS NOT THE WHOLE STORY", "hd_fix": false, "prompt": "According to paragraph 1, countries becoming more urbanised may differ in ______.", "options": ["their reasons for including urban areas in national statistics", "their ability to collect information about population distribution", "their definitions of urban population and national development", "their starting points, rates of change and infrastructure pressures"], "keyLetter": "D", "keyText": "their starting points, rates of change and infrastructure pressures", "why": "Trích dẫn: “Two countries may both become more urbanised while experiencing very different rates of change, starting points and pressures on infrastructure.”", "distractors": ["“definitions of urban population” không được nêu trong đoạn 1.", "“ability to collect information” không được nêu.", "“reasons for including urban areas in statistics” không được nêu."], "kb": "Detail question → tìm đúng câu chứa thông tin trong bài.", "authored": false}, {"n": 23, "uid": 23, "part": "IX. TNTHPT READING – URBANISATION: RATE IS NOT THE WHOLE STORY", "hd_fix": false, "prompt": "Why does the writer mention Australia?", "options": ["To show that high urbanisation always results from rapid recent growth.", "To illustrate a country that reached high urbanisation at an earlier stage.", "To demonstrate that countries generally follow similar urbanisation paths.", "To contrast Malaysia with a country whose urban share is now declining."], "keyLetter": "B", "keyText": "To illustrate a country that reached high urbanisation at an earlier stage.", "why": "Trích dẫn: “It had already become highly urbanised much earlier, so later growth occurred from a much higher starting point.” — Australia là ví dụ nước đạt mức đô thị hóa cao từ giai đoạn sớm hơn.", "distractors": ["“always results from rapid recent growth” ngược với “much earlier”.", "“urban share is now declining” không được nêu trong bài.", "“similar urbanisation paths” ngược với “a different historical path”."], "kb": "Ví dụ trong bài đọc luôn phục vụ luận điểm chính.", "authored": false}, {"n": 24, "uid": 24, "part": "IX. TNTHPT READING – URBANISATION: RATE IS NOT THE WHOLE STORY", "hd_fix": false, "prompt": "The word “it” in paragraph 3 refers to ______.", "options": ["the comparison", "the population", "the proportion", "one country"], "keyLetter": "D", "keyText": "one country", "why": "Trích dẫn: “…it does not automatically mean that it is currently urbanising faster.” — “it” thứ hai chỉ “one country” đang đô thị hóa nhanh hơn.", "distractors": ["“the population” quá chung, không phải chủ thể “urbanising faster”.", "“the proportion” là tỷ trọng, không “urbanise”.", "“the comparison” là sự so sánh, không phải chủ thể hành động."], "kb": "“it” = danh từ số ít mà mệnh đề đang nói tới.", "authored": false}, {"n": 25, "uid": 25, "part": "IX. TNTHPT READING – URBANISATION: RATE IS NOT THE WHOLE STORY", "hd_fix": false, "prompt": "What can be inferred from paragraph 3?", "options": ["Countries with high urban shares generally continue changing most rapidly.", "A lower urban share can still be associated with faster current change.", "A high urban share normally indicates sufficient supporting infrastructure.", "Countries with lower urban shares usually experience slower urban growth."], "keyLetter": "B", "keyText": "A lower urban share can still be associated with faster current change.", "why": "Trích dẫn: “A country with a lower urban share may, in fact, be changing more rapidly.” — suy ra: urban share thấp vẫn có thể đi với tốc độ thay đổi nhanh hơn ở hiện tại.", "distractors": ["“high shares → change most rapidly” ngược với câu trong bài.", "“lower shares → slower growth” ngược với “more rapidly”.", "“high share → sufficient infrastructure” — bài không đưa ra kết luận này."], "kb": "Inference = diễn đạt lại logic của câu trong bài.", "authored": false}, {"n": 26, "uid": 26, "part": "IX. TNTHPT READING – URBANISATION: RATE IS NOT THE WHOLE STORY", "hd_fix": false, "prompt": "The word “level” in the final paragraph is closest in meaning to ______.", "options": ["future direction", "present proportion", "historical trend", "speed of change"], "keyLetter": "B", "keyText": "present proportion", "why": "Trích dẫn: “The level describes the present distribution of population” — “level” ≈ “present proportion” (tỷ trọng hiện tại).", "distractors": ["“speed of change” là nghĩa của “rate”, không phải “level”.", "“historical trend” nói về quá khứ, trong khi “level” là hiện tại.", "“future direction” nói về tương lai — sai."], "kb": "level = mức/tỷ trọng hiện tại.", "authored": false}, {"n": 27, "uid": 27, "part": "IX. TNTHPT READING – URBANISATION: RATE IS NOT THE WHOLE STORY", "hd_fix": false, "prompt": "Which statement is TRUE according to the passage?", "options": ["Historical starting points have little relevance to urbanisation patterns.", "Urbanisation level and rate describe different aspects of development.", "Countries with similar urban levels generally experience similar rates.", "Urbanisation rate is more useful than level in international comparisons."], "keyLetter": "B", "keyText": "Urbanisation level and rate describe different aspects of development.", "why": "Trích dẫn: “The level describes the present distribution of population, whereas the rate describes how quickly that distribution is changing.” — level và rate mô tả hai khía cạnh khác nhau của phát triển đô thị.", "distractors": ["“rate is more useful than level” — bài không xếp hạng cái nào hữu ích hơn.", "“similar levels → similar rates” bị bài phản bác (“very different rates of change”).", "“starting points have little relevance” ngược với đoạn 2 (“starting points”)."], "kb": "TRUE question → đối chiếu từng chữ với bài.", "authored": false}, {"n": 28, "uid": 28, "part": "IX. TNTHPT READING – URBANISATION: RATE IS NOT THE WHOLE STORY", "hd_fix": false, "prompt": "What is the function of the final paragraph?", "options": ["To question the usefulness of urban population percentages.", "To introduce another example of rapid urbanisation.", "To clarify how level and rate should be interpreted separately.", "To explain the main causes of urban population growth."], "keyLetter": "C", "keyText": "To clarify how level and rate should be interpreted separately.", "why": "Trích dẫn: “Urban statistics therefore need to be read with attention to both level and rate. The level describes… whereas the rate describes… Confusing the two can lead to inaccurate conclusions…” — đoạn cuối làm rõ cách hiểu level và rate một cách riêng biệt.", "distractors": ["“another example of rapid urbanisation” — đoạn cuối không đưa ví dụ mới.", "“main causes of urban population growth” — không nêu nguyên nhân.", "“question the usefulness of percentages” — bài không phủ nhận số liệu, chỉ lưu ý cách đọc."], "kb": "Function question → hỏi “đoạn này dùng để làm gì”.", "authored": false}, {"n": 29, "uid": 29, "part": "IX. TNTHPT READING – URBANISATION: RATE IS NOT THE WHOLE STORY", "hd_fix": false, "prompt": "Which best describes the writer’s attitude?", "options": ["Supportive of rapid urbanisation in developing countries", "Critical of countries with high levels of urbanisation", "Uncertain about the usefulness of urbanisation statistics", "Analytical and cautious about interpreting urban statistics"], "keyLetter": "D", "keyText": "Analytical and cautious about interpreting urban statistics", "why": "Trích dẫn: “Confusing the two can lead to inaccurate conclusions about urban development.” — giọng văn phân tích và thận trọng khi diễn giải số liệu đô thị.", "distractors": ["“critical of countries with high urbanisation” — bài không chỉ trích nước nào.", "“supportive of rapid urbanisation” — bài không bày tỏ ủng hộ.", "“uncertain about the usefulness” — bài khẳng định số liệu “is useful”, chỉ cần đọc cẩn thận."], "kb": "Attitude = thái độ xuyên suốt bài, không phải một câu.", "authored": false}, {"n": 30, "uid": 30, "part": "IX. TNTHPT READING – URBANISATION: RATE IS NOT THE WHOLE STORY", "hd_fix": false, "prompt": "Which title best fits the passage?", "options": ["Urbanisation: Reading the Level and the Rate", "Malaysia and Australia: Two Identical Paths to Urbanisation", "Why Urban Population Percentages Should No Longer Be Used", "Why Rapid Urban Growth Always Creates Infrastructure Problems"], "keyLetter": "A", "keyText": "Urbanisation: Reading the Level and the Rate", "why": "Trích dẫn: “Urban statistics therefore need to be read with attention to both level and rate.” — nhan đề phải bao quát cả “level” và “rate”.", "distractors": ["“Why Rapid Urban Growth Always Creates Infrastructure Problems” tuyệt đối hóa bằng “always” và lệch chủ đề.", "“Two Identical Paths” sai vì bài nhấn mạnh “different historical path”.", "“Should No Longer Be Used” phủ định số liệu — ngược ý bài."], "kb": "Title = bao quát luận điểm chính, không tuyệt đối hóa.", "authored": false}, {"n": 31, "uid": 31, "part": "X. PASSAGE COMPLETION – TWO-SIDED COHESION", "hd_fix": false, "prompt": "Choose the best sentence.", "options": ["Therefore, complaints are useful only when every resident agrees about the same solution.", "However, a complaint alone does not identify which response is practical or appropriate.", "For example, most urban complaints can be solved by increasing the size of the population.", "In contrast, authorities should avoid investigating complaints until problems become severe."], "keyLetter": "B", "keyText": "However, a complaint alone does not identify which response is practical or appropriate.", "why": "Trích dẫn: “These complaints are important because they show how urban change affects daily life. (31) ______. A useful response therefore begins by identifying the specific problem and its impact.” — câu “However, a complaint alone does not identify which response is practical or appropriate” nối hai mặt: khiếu nại quan trọng NHƯNG chưa đủ → cần xác định vấn đề cụ thể.", "distractors": ["“increasing the size of the population” phi logic, không liên quan khiếu nại.", "“avoid investigating complaints until problems become severe” ngược với “a useful response”.", "“only when every resident agrees” thêm điều kiện không có trong bài."], "kb": "Cohesion hai chiều: câu điền phải nối câu trước và mở câu sau.", "authored": false}, {"n": 32, "uid": 32, "part": "X. PASSAGE COMPLETION – TWO-SIDED COHESION", "hd_fix": false, "prompt": "Choose the best sentence.", "options": ["Urban planners can respond effectively without collecting evidence about the reported problem.", "Officials should promise an immediate solution even when the cause has not yet been identified.", "Residents should change the topic once an authority has acknowledged that a problem exists.", "The responsible authority can then investigate the issue, propose action or explain any limits."], "keyLetter": "D", "keyText": "The responsible authority can then investigate the issue, propose action or explain any limits.", "why": "Trích dẫn: “A useful response therefore begins by identifying the specific problem and its impact. (32) ______. Even when an immediate solution is impossible, explaining the limitation clearly is more constructive than simply dismissing the complaint.” — câu đúng liệt kê bước tiếp theo (investigate → propose action → explain limits), khớp với “explaining the limitation” ở câu sau.", "distractors": ["“promise an immediate solution” ngược với “an immediate solution is impossible”.", "“change the topic” là né tránh, ngược với “constructive”.", "“without collecting evidence” ngược với “identifying the specific problem”."], "kb": "Câu điền phải hợp logic với cả câu trước và câu sau.", "authored": false}, {"n": 33, "uid": 33, "part": "XI. SENTENCE ORDERING – PROBLEM → RESPONSE → OUTCOME", "hd_fix": false, "prompt": "33.<br>a. The transport authority then adjusted the timetable during the busiest period.<br>b. Residents repeatedly complained about long waits for buses during rush hour.<br>c. After several weeks, average waiting times fell.<br>d. Officials reviewed passenger numbers and identified two overcrowded routes.", "options": ["d – b – c – a", "b – d – a – c", "c – b – d – a", "b – a – d – c"], "keyLetter": "B", "keyText": "b – d – a – c", "why": "b nêu vấn đề (complaints) → d điều tra (reviewed) → a “then” điều chỉnh (then nối sau d) → c kết quả sau vài tuần (“After several weeks” chốt cuối).", "distractors": ["A. sai: d (điều tra) không thể đứng trước khiếu nại (b).", "D. sai: “then” trong (a) không thể đứng ngay sau khiếu nại khi chưa có điều tra (d).", "C. sai: kết quả (c) không thể mở đầu đoạn."], "kb": "Mạch problem → investigation → action (“then”) → outcome (“After…”).", "authored": false}, {"n": 34, "uid": 34, "part": "XI. SENTENCE ORDERING – PROBLEM → RESPONSE → OUTCOME", "hd_fix": false, "prompt": "34.<br>a. The council explained that construction would take several months.<br>b. Residents complained that a major road project was creating heavy congestion.<br>c. It also introduced temporary traffic-control measures around schools.<br>d. The council acknowledged the problem but said the project could not be stopped immediately.", "options": ["b – a – c – d", "c – b – d – a", "b – d – a – c", "d – b – c – a"], "keyLetter": "C", "keyText": "b – d – a – c", "why": "b nêu khiếu nại → d thừa nhận vấn đề → a giải thích thời gian thi công → c “also” bổ sung biện pháp (“also” cần một hành động đã nêu trước).", "distractors": ["D. sai: d (thừa nhận) không thể đứng trước khiếu nại (b).", "A. sai: “also” trong (c) không thể đứng trước d — cần hành động của council đã nêu trước.", "B. sai: “also” không thể mở đầu đoạn."], "kb": "“Also” luôn cần một ý/hành động tương đồng đứng trước.", "authored": false}, {"n": 35, "uid": 35, "part": "XII. LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Choose the best option for blank (35).", "options": ["found to", "finds", "finding to", "to find"], "keyLetter": "D", "keyText": "to find", "why": "“find it difficult to find” — cấu trúc “find it + tính từ + to-V” (thấy khó làm gì).", "distractors": ["“finding to” sai dạng sau giới từ “to”.", "“finds” sai thì và không hợp cấu trúc “it … to-V”.", "“found to” sai dạng nguyên thể sau “to”."], "kb": "find it difficult + to-V.", "authored": false}, {"n": 36, "uid": 36, "part": "XII. LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Choose the best option for blank (36).", "options": ["for", "at", "with", "to"], "keyLetter": "D", "keyText": "to", "why": "“respond to complaints” — “respond” đi với giới từ “to” khi nghĩa là phản hồi.", "distractors": ["“respond for” không phải cụm chuẩn.", "“respond with” nghĩa là “đáp lại bằng”, không hợp nghĩa.", "“respond at” không đi với “complaints”."], "kb": "respond TO + complaints.", "authored": false}, {"n": 37, "uid": 37, "part": "XII. LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Choose the best option for blank (37).", "options": ["that", "whose", "where", "whom"], "keyLetter": "A", "keyText": "that", "why": "Mệnh đề quan hệ xác định bổ nghĩa cho “one” (đại diện một lời phàn nàn — vật/khái niệm): dùng “that”; không có giới từ hay sở hữu nên không dùng where/whose/whom.", "distractors": ["“where” chỉ dùng cho nơi chốn.", "“whose” chỉ dùng cho quan hệ sở hữu.", "“whom” chỉ dùng cho tân ngữ chỉ người."], "kb": "Đại từ quan hệ cho vật/khái niệm: that/which.", "authored": false}, {"n": 38, "uid": 38, "part": "XII. LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Choose the best option for blank (38).", "options": ["however", "at the same time", "even so", "nevertheless"], "keyLetter": "A", "keyText": "however", "why": "“however” nối hai mệnh đề tương phản: nên giải thích hành động CÓ THỂ làm, TUY NHIÊN tránh hứa điều không làm được.", "distractors": ["“at the same time” nhấn mạnh “đồng thời”, không diễn đạt tương phản.", "“nevertheless” cũng tương phản nên chấp nhận được — “however” là đáp án theo nguồn.", "“even so” cũng tương phản nên chấp nhận được — “however” là đáp án theo nguồn."], "kb": "however = tuy nhiên (liên từ tương phản).", "authored": false}, {"n": 39, "uid": 39, "part": "XII. LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Choose the best option for blank (39).", "options": ["to", "for", "at", "with"], "keyLetter": "A", "keyText": "to", "why": "“contribute to greater trust” — “contribute” đi với giới từ “to”.", "distractors": ["“contribute for” không phải cụm chuẩn.", "“contribute at” sai giới từ.", "“contribute with” không tồn tại trong nghĩa này."], "kb": "contribute TO + sth — góp phần vào…", "authored": false}, {"n": 44, "uid": 44, "part": "XIII. HOMEWORK – NEW-CONTEXT TRANSFER", "hd_fix": false, "prompt": "Choose the best option for blank (44).", "options": ["where", "whose", "which", "who"], "keyLetter": "C", "keyText": "which", "why": "“which” thay cho cả mệnh đề đứng trước (“use had risen steadily”) — mệnh đề quan hệ không xác định.", "distractors": ["“who” chỉ dùng cho người.", "“where” chỉ dùng cho nơi chốn.", "“whose” chỉ dùng cho quan hệ sở hữu."], "kb": "which = cả mệnh đề đứng trước (mệnh đề không xác định).", "authored": false}, {"n": 45, "uid": 45, "part": "XIII. HOMEWORK – NEW-CONTEXT TRANSFER", "hd_fix": false, "prompt": "Choose the best option for blank (45) const PASSAGES={"REFERENCE & PARAPHRASE": "<p>Malaysia’s urbanisation rate rose rapidly after the early 1970s. By the early 1990s, its urban and rural populations were almost equal. Since then, the urban share has continued to increase gradually. This long-term change has made the country highly urbanised.</p>", "TNTHPT READING": "<p>Urbanisation is often described through a single percentage: the share of people living in urban areas. That figure is useful, but it does not tell the whole story. Two countries may both become more urbanised while experiencing very different rates of change, starting points and pressures on infrastructure.</p><p>Malaysia illustrates how quickly the balance between urban and rural populations can shift. Its urban share was relatively low when rapid urbanisation began, but it increased substantially over the following decades. Australia followed a different historical path. It had already become highly urbanised much earlier, so later growth occurred from a much higher starting point.</p><p>These differences matter when comparisons are made. Saying that one country is “more urbanised” refers to the proportion of its population living in urban areas; it does not automatically mean that it is currently urbanising faster. A country with a lower urban share may, in fact, be changing more rapidly.</p><p>Urban statistics therefore need to be read with attention to both level and rate. The level describes the present distribution of population, whereas the rate describes how quickly that distribution is changing. Confusing the two can lead to inaccurate conclusions about urban development.</p>", "PASSAGE COMPLETION": "<p>City residents often complain about congestion, noise or overloaded public services. These complaints are important because they show how urban change affects daily life. (31) ______. A useful response therefore begins by identifying the specific problem and its impact. (32) ______. Even when an immediate solution is impossible, explaining the limitation clearly is more constructive than simply dismissing the complaint.</p>", "LANGUAGE-IN-CONTEXT CLOZE": "<p>Rapid urbanisation can create opportunities, but it can also place pressure on services. When population growth is faster than infrastructure development, residents may find it difficult (35) ______ affordable housing or reliable transport. Local authorities therefore need to respond (36) ______ complaints carefully. A complaint that identifies a specific problem is easier to investigate than one (37) ______ makes only a general criticism. Officials should acknowledge the concern and explain what action can be taken; (38) ______, they should avoid making promises that cannot be kept. Clear communication can contribute (39) ______ greater trust between residents and local authorities.</p>", "HOMEWORK": "<p>A growing district introduced a new bus route after residents complained about overcrowded services. At first, officials were unsure whether the route would attract enough passengers. Within three months, however, use had risen steadily, (44) ______ encouraged the authority to add more buses at peak times. The change did not remove congestion completely; (45) ______, it reduced pressure on two of the busiest routes. Officials also created an online form so that residents could report problems more (46) ______. This information helps planners respond (47) ______ local needs and avoid decisions based only on general impressions. The programme shows that complaints can provide useful evidence when they are specific and (48) ______ by careful investigation.</p>"};

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
