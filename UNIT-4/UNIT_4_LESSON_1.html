rger", "successful urban development cannot depend only on constructing new buildings", "manage development so that it is sustainable and includes different groups", "expand or lengthen transport links"], "keyLetter": "D", "keyText": "expand or lengthen transport links", "why": "“extend” = mở rộng/kéo dài; “expand or lengthen” giữ nguyên nghĩa đó với cùng tân ngữ “transport links”.", "distractors": ["B. “successful urban development…” là paraphrase của một câu dài khác.", "C. “manage development…” là paraphrase của một câu dài khác.", "A. “become larger” là paraphrase của “expand” (động từ chung) — thiếu tân ngữ “transport links” nên không tương đương."], "kb": "extend ≈ expand/lengthen: mở rộng, kéo dài.", "authored": false}, {"n": 42, "uid": 42, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“urban growth succeeds” is closest in meaning to ______.", "options": ["manage development so that it is sustainable and includes different groups", "different elements are effectively planned and connected", "significantly", "useful and easy to access"], "keyLetter": "B", "keyText": "different elements are effectively planned and connected", "why": "Trong ngữ cảnh bài, “thành công” của tăng trưởng đô thị được định nghĩa là các yếu tố được quy hoạch và kết nối hiệu quả.", "distractors": ["A. “manage development…” là paraphrase của “manage growth in a sustainable and inclusive way”.", "C. “significantly” là paraphrase của “considerably”.", "D. “useful and easy to access” là paraphrase của “convenient”."], "kb": "urban growth succeeds: tăng trưởng đô thị thành công.", "authored": false}, {"n": 43, "uid": 43, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“successful urban growth requires more than new buildings” is closest in meaning to ______.", "options": ["significantly", "successful urban development cannot depend only on constructing new buildings", "become larger", "basic systems and public facilities"], "keyLetter": "B", "keyText": "successful urban development cannot depend only on constructing new buildings", "why": "“requires more than” = “cannot depend only on”; “new buildings” = “constructing new buildings” — hai câu giữ nguyên cấu trúc phủ định và quan hệ so sánh.", "distractors": ["A. “significantly” là paraphrase của “considerably”.", "C. “become larger” là paraphrase của “expand”.", "D. “basic systems and public facilities” là nghĩa của “infrastructure”."], "kb": "requires more than = cannot depend only on.", "authored": false}, {"n": 44, "uid": 44, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“manage growth in a sustainable and inclusive way” is closest in meaning to ______.", "options": ["useful and easy to access", "become larger", "expand or lengthen transport links", "manage development so that it is sustainable and includes different groups"], "keyLetter": "D", "keyText": "manage development so that it is sustainable and includes different groups", "why": "“growth” ↔ “development”, “sustainable” ↔ “sustainable”, “inclusive” ↔ “includes different groups” — từng thành phần đều được diễn đạt lại tương đương.", "distractors": ["B. “become larger” là paraphrase của “expand”.", "A. “useful and easy to access” là paraphrase của “convenient”.", "C. “expand or lengthen transport links” là paraphrase của “extend transport links”."], "kb": "inclusive ≈ includes different groups: bao trùm.", "authored": false}, {"n": 45, "uid": 45, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which expression means “theo kịp tốc độ tăng dân số”?", "options": ["place pressure on transport systems", "improve urban infrastructure", "keep pace with population growth", "anticipate future demand"], "keyLetter": "C", "keyText": "keep pace with population growth", "why": "“keep pace with population growth” dịch sát nghĩa là “theo kịp tốc độ tăng dân số” — đây là chunk đã học của bài.", "distractors": ["D. “anticipate future demand” nghĩa là “dự đoán trước nhu cầu tương lai”.", "B. “improve urban infrastructure” nghĩa là “cải thiện cơ sở hạ tầng đô thị”.", "A. “place pressure on transport systems” nghĩa là “gây áp lực lên hệ thống giao thông”."], "kb": "keep pace with population growth: theo kịp tốc độ tăng dân số.", "authored": false}, {"n": 46, "uid": 46, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which expression means “cân bằng tăng trưởng kinh tế với chất lượng cuộc sống”?", "options": ["gain easier access to services", "construct high-rise buildings", "balance economic growth with quality of life", "meet local residents’ needs"], "keyLetter": "C", "keyText": "balance economic growth with quality of life", "why": "“balance economic growth with quality of life” dịch sát nghĩa là “cân bằng tăng trưởng kinh tế với chất lượng cuộc sống”.", "distractors": ["D. “meet local residents’ needs” nghĩa là “đáp ứng nhu cầu cư dân địa phương”.", "A. “gain easier access to services” nghĩa là “tiếp cận dịch vụ dễ dàng hơn”.", "B. “construct high-rise buildings” nghĩa là “xây dựng tòa nhà cao tầng”."], "kb": "balance economic growth with quality of life.", "authored": false}, {"n": 47, "uid": 47, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "The adverb form in the family convenience → convenient → ______ is correct.", "options": ["conveniently", "urbanisation", "sustainably", "convenience"], "keyLetter": "A", "keyText": "conveniently", "why": "Hậu tố “-ly” tạo trạng từ từ tính từ: convenient → conveniently; chỗ trống yêu cầu dạng trạng từ.", "distractors": ["D. “convenience” là danh từ gốc, không phải dạng trạng từ.", "C. “sustainably” là trạng từ nhưng thuộc họ từ khác (sustain).", "B. “urbanisation” là danh từ thuộc họ từ khác."], "kb": "convenient (adj.) → conveniently (adv.).", "authored": false}, {"n": 48, "uid": 48, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "“considerably” is closest in meaning to ______.", "options": ["significantly", "conveniently", "sustainably", "gradually"], "keyLetter": "A", "keyText": "significantly", "why": "“considerably” và “significantly” đều chỉ mức độ lớn, đáng kể — cặp đồng nghĩa đã học.", "distractors": ["D. “gradually” (dần dần) chỉ tốc độ chậm, không phải mức độ lớn.", "B. “conveniently” (một cách thuận tiện) — sai nghĩa.", "C. “sustainably” (một cách bền vững) — sai nghĩa."], "kb": "considerably ≈ significantly: đáng kể.", "authored": false}, {"n": 49, "uid": 49, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "“infrastructure” is closest in meaning to ______.", "options": ["employment opportunities only", "private housing costs only", "high-rise buildings only", "basic systems and public facilities"], "keyLetter": "D", "keyText": "basic systems and public facilities", "why": "“infrastructure” trong chủ đề đô thị hóa là các hệ thống cơ bản và công trình công cộng.", "distractors": ["B. “private housing costs only” thu hẹp thành chi phí nhà ở tư nhân.", "A. “employment opportunities only” thu hẹp thành cơ hội việc làm.", "C. “high-rise buildings only” thu hẹp thành nhà cao tầng."], "kb": "infrastructure: cơ sở hạ tầng.", "authored": false}, {"n": 50, "uid": 50, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which expression means “gây áp lực lên hệ thống giao thông”?", "options": ["keep pace with population growth", "place pressure on transport systems", "improve urban infrastructure", "anticipate future demand"], "keyLetter": "B", "keyText": "place pressure on transport systems", "why": "“place pressure on transport systems” dịch sát nghĩa là “gây áp lực lên hệ thống giao thông”.", "distractors": ["A. “keep pace with population growth” nghĩa là “theo kịp tốc độ tăng dân số”.", "D. “anticipate future demand” nghĩa là “dự đoán trước nhu cầu tương lai”.", "C. “improve urban infrastructure” nghĩa là “cải thiện cơ sở hạ tầng đô thị”."], "kb": "place pressure on transport systems.", "authored": false}, {"n": 51, "uid": 51, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "“extend transport links” is closest in meaning to ______.", "options": ["replace all roads with housing", "limit access to transport", "expand or lengthen transport links", "reduce public transport links"], "keyLetter": "C", "keyText": "expand or lengthen transport links", "why": "“extend” = mở rộng; “expand or lengthen” giữ nguyên nghĩa đó với cùng tân ngữ “transport links”.", "distractors": ["D. “reduce public transport links” — “reduce” ngược nghĩa với “extend”.", "A. “replace all roads with housing” thêm ý không có trong gốc.", "B. “limit access to transport” — “limit” ngược nghĩa với “extend”."], "kb": "extend ≈ expand/lengthen: mở rộng, kéo dài.", "authored": false}]},"p2":{"title":"PHẦN 2 — LUYỆN TẬP","desc":"43 câu: collocation, meaning in context, short cloze, reference & cohesion, passage completion, ordering, reading transfer, TNTHPT-style cloze, homework.","questions":[{"n": 1, "uid": 1, "part": "II. COLLOCATION CONTROL", "hd_fix": false, "prompt": "The city has experienced rapid ______ over the past two decades.", "options": ["urban", "urbanised", "urbanisation", "urbanise"], "keyLetter": "C", "keyText": "urbanisation", "why": "Sau tính từ “rapid” cần danh từ làm tân ngữ của “experienced”; “urbanisation” (sự đô thị hóa) là danh từ duy nhất hợp nghĩa.", "distractors": ["D. “urbanise” là động từ — sai từ loại.", "A. “urban” là tính từ — sai từ loại.", "B. “urbanised” là dạng quá khứ/tính từ — sai từ loại."], "kb": "rapid urbanisation: đô thị hóa nhanh.", "authored": false}, {"n": 2, "uid": 2, "part": "II. COLLOCATION CONTROL", "hd_fix": false, "prompt": "Several former rice fields have been ______ into residential areas.", "options": ["turned from", "converted", "transferred for", "changed with"], "keyLetter": "B", "keyText": "converted", "why": "Cấu trúc “be converted into” (được chuyển thành); “converted” là quá khứ phân từ duy nhất tạo cụm đúng với “into residential areas”.", "distractors": ["D. “changed with” — sai giới từ, không tồn tại cụm này trong nghĩa chuyển đổi.", "C. “transferred for” — sai nghĩa (chuyển giao) và sai giới từ.", "A. “turned from” — “from” ngược hướng với “into residential areas”."], "kb": "be converted into: được chuyển thành.", "authored": false}, {"n": 3, "uid": 3, "part": "II. COLLOCATION CONTROL", "hd_fix": false, "prompt": "New parks provide more space for leisure ______.", "options": ["activities", "works", "occupations", "actions"], "keyLetter": "A", "keyText": "activities", "why": "“leisure activities” (hoạt động giải trí) là collocation cố định; “space for leisure activities” hợp nghĩa hoàn chỉnh.", "distractors": ["D. “leisure actions” không phải collocation.", "B. “leisure works” không tồn tại.", "C. “leisure occupations” không tồn tại."], "kb": "leisure activities: hoạt động giải trí.", "authored": false}, {"n": 4, "uid": 4, "part": "II. COLLOCATION CONTROL", "hd_fix": false, "prompt": "Traffic congestion becomes particularly serious during ______ hour.", "options": ["peakly", "busy", "rush", "crowded"], "keyLetter": "C", "keyText": "rush", "why": "“rush hour” (giờ cao điểm) là cụm cố định; không tồn tại “busy hour” hay “crowded hour” trong nghĩa này.", "distractors": ["B. “busy hour” không phải cụm cố định.", "D. “crowded hour” không tồn tại.", "A. “peakly” không phải từ tiếng Anh chuẩn."], "kb": "rush hour: giờ cao điểm.", "authored": false}, {"n": 5, "uid": 5, "part": "II. COLLOCATION CONTROL", "hd_fix": false, "prompt": "The new bus route is intended to meet the needs of local ______.", "options": ["residences", "residents", "residential", "residing"], "keyLetter": "B", "keyText": "residents", "why": "Sau tính từ “local” cần danh từ chỉ người; “residents” (cư dân) là danh từ số nhiều duy nhất hợp nghĩa.", "distractors": ["A. “residences” là “nơi cư trú” (địa điểm), không phải người.", "C. “residential” là tính từ, không thể làm tân ngữ.", "D. “residing” là dạng V-ing — sai từ loại."], "kb": "local residents: cư dân địa phương.", "authored": false}, {"n": 6, "uid": 6, "part": "II. COLLOCATION CONTROL", "hd_fix": false, "prompt": "Many young people move to cities in search of better employment ______.", "options": ["opportunity", "employers", "opportunities", "employees"], "keyLetter": "C", "keyText": "opportunities", "why": "Cụm cố định “employment opportunities” (cơ hội việc làm) luôn ở dạng số nhiều trong ngữ cảnh này; “better employment opportunities” là collocation chuẩn.", "distractors": ["A. “opportunity” dạng số ít phá vỡ collocation cố định.", "D. “employees” (nhân viên) — sai nghĩa.", "B. “employers” (chủ lao động) — sai nghĩa."], "kb": "employment opportunities: cơ hội việc làm (luôn số nhiều).", "authored": true}, {"n": 7, "uid": 7, "part": "II. COLLOCATION CONTROL", "hd_fix": false, "prompt": "The construction of high-rise buildings has changed the city ______.", "options": ["border", "edge", "outline map", "skyline"], "keyLetter": "D", "keyText": "skyline", "why": "“city skyline” (đường chân trời của thành phố) là collocation cố định chỉ hình ảnh các tòa nhà; nhà cao tầng mới làm thay đổi skyline.", "distractors": ["A. “city border” là ranh giới hành chính — tòa nhà không làm thay đổi ranh giới.", "B. “city edge” là vùng rìa thành phố — sai nghĩa.", "C. “outline map” (bản đồ phác thảo) — không hợp ngữ cảnh."], "kb": "city skyline: đường chân trời thành phố.", "authored": false}, {"n": 8, "uid": 8, "part": "II. COLLOCATION CONTROL", "hd_fix": false, "prompt": "Urban planners need to balance economic growth ______ quality of life.", "options": ["with", "for", "at", "to"], "keyLetter": "A", "keyText": "with", "why": "Cấu trúc cố định “balance A with B” (cân bằng A với B) — giới từ bắt buộc là “with”.", "distractors": ["D. Sai giới từ của cụm cố định.", "B. Sai giới từ của cụm cố định.", "C. Sai giới từ của cụm cố định."], "kb": "balance A with B: cân bằng A với B.", "authored": false}, {"n": 15, "uid": 15, "part": "IV. MEANING IN CONTEXT – CLOSEST MEANING", "hd_fix": false, "prompt": "The neighbourhood has changed considerably since Mark’s last visit. “Considerably” is closest in meaning to ______.", "options": ["significantly", "temporarily", "unexpectedly", "slightly"], "keyLetter": "A", "keyText": "significantly", "why": "Trong câu “changed considerably”, trạng từ chỉ mức độ thay đổi lớn; “significantly” (đáng kể) là từ đồng nghĩa duy nhất.", "distractors": ["B. “temporarily” (tạm thời) chỉ thời gian, không phải mức độ.", "D. “slightly” (hơi) — ngược nghĩa.", "C. “unexpectedly” (bất ngờ) chỉ tính bất ngờ, không phải mức độ."], "kb": "considerably ≈ significantly: đáng kể.", "authored": false}, {"n": 16, "uid": 16, "part": "IV. MEANING IN CONTEXT – CLOSEST MEANING", "hd_fix": false, "prompt": "The city has expanded rapidly into surrounding areas. “Expanded” is closest in meaning to ______.", "options": ["become older", "become quieter", "become smaller", "become larger"], "keyLetter": "D", "keyText": "become larger", "why": "“expanded into surrounding areas” (mở rộng ra vùng xung quanh) = “become larger” (trở nên lớn hơn).", "distractors": ["B. “become quieter” — không liên quan đến kích thước.", "A. “become older” — chỉ tuổi tác, sai nghĩa.", "C. “become smaller” — ngược nghĩa."], "kb": "expand ≈ become larger: mở rộng.", "authored": false}, {"n": 17, "uid": 17, "part": "IV. MEANING IN CONTEXT – CLOSEST MEANING", "hd_fix": false, "prompt": "The new facilities are convenient for local residents. “Convenient” is closest in meaning to ______.", "options": ["familiar but limited in use", "useful and easy to access", "crowded and difficult to use", "costly and difficult to access"], "keyLetter": "B", "keyText": "useful and easy to access", "why": "“convenient for local residents” — tiện lợi nghĩa là hữu ích và dễ tiếp cận đối với cư dân.", "distractors": ["D. “costly and difficult to access” — ngược nghĩa.", "C. “crowded and difficult to use” — ngược nghĩa.", "A. “familiar but limited in use” thêm ý “hạn chế” không có trong gốc."], "kb": "convenient ≈ useful and easy to access: thuận tiện.", "authored": false}, {"n": 18, "uid": 18, "part": "IV. MEANING IN CONTEXT – CLOSEST MEANING", "hd_fix": false, "prompt": "The authorities aim to improve urban infrastructure. “Infrastructure” most nearly refers to ______.", "options": ["basic systems and public facilities", "personal interests and leisure activities", "private belongings and household items", "local customs and cultural traditions"], "keyLetter": "A", "keyText": "basic systems and public facilities", "why": "“urban infrastructure” (cơ sở hạ tầng đô thị) là các hệ thống cơ bản và công trình công cộng phục vụ thành phố.", "distractors": ["B. “personal interests and leisure activities” thuộc về cá nhân, không phải hạ tầng.", "D. “local customs and cultural traditions” thuộc văn hóa, không phải hạ tầng.", "C. “private belongings and household items” là đồ dùng cá nhân, không phải hạ tầng."], "kb": "infrastructure: cơ sở hạ tầng.", "authored": false}, {"n": 19, "uid": 19, "part": "V. LANGUAGE IN CONTEXT – SHORT CLOZE", "hd_fix": false, "prompt": "New transport links make daily life more ______ for residents.", "options": ["conveniently", "inconvenience", "convenient", "convenience"], "keyLetter": "C", "keyText": "convenient", "why": "Cấu trúc “make + O + adj” (làm cho cái gì trở nên thế nào); sau “make daily life” cần tính từ — “convenient” (thuận tiện) là tính từ duy nhất hợp nghĩa.", "distractors": ["D. “convenience” là danh từ — sai từ loại.", "A. “conveniently” là trạng từ — sai từ loại.", "B. “inconvenience” là danh từ và ngược nghĩa."], "kb": "make + O + adjective: làm cho ai/cái gì trở nên…", "authored": true}, {"n": 20, "uid": 20, "part": "V. LANGUAGE IN CONTEXT – SHORT CLOZE", "hd_fix": false, "prompt": "Rapid growth can result ______ heavy pressure on transport systems.", "options": ["in", "to", "from", "with"], "keyLetter": "A", "keyText": "in", "why": "Cụm cố định “result in” (dẫn đến/gây ra) — khi “result” là động từ chỉ kết quả, giới từ bắt buộc là “in”.", "distractors": ["B. Không tồn tại cụm “result to” trong nghĩa kết quả.", "C. Không tồn tại cụm “result from” trong nghĩa kết quả (result from = do… gây ra, ngược hướng).", "D. Không tồn tại cụm “result with”."], "kb": "result in + N: dẫn đến/gây ra điều gì.", "authored": true}, {"n": 21, "uid": 21, "part": "V. LANGUAGE IN CONTEXT – SHORT CLOZE", "hd_fix": false, "prompt": "Cities need to grow in a way ______ balances development and residents’ needs.", "options": ["who", "that", "where", "whose"], "keyLetter": "B", "keyText": "that", "why": "Antecedent “a way” là danh từ chỉ cách thức (vật); mệnh đề sau cần đại từ quan hệ làm chủ ngữ của “balances” — “that” là lựa chọn đúng.", "distractors": ["A. “who” chỉ người, không dùng cho “a way”.", "C. “where” chỉ nơi chốn, không thể làm chủ ngữ.", "D. “whose” chỉ sở hữu, không thể làm chủ ngữ."], "kb": "a way that + V: một cách mà…", "authored": true}, {"n": 22, "uid": 22, "part": "V. LANGUAGE IN CONTEXT – SHORT CLOZE", "hd_fix": false, "prompt": "Development should bring benefits ______ creating new problems for residents.", "options": ["without", "although", "because", "despite"], "keyLetter": "A", "keyText": "without", "why": "Ý cần diễn đạt: mang lại lợi ích mà không tạo ra vấn đề mới; “without + V-ing” (mà không làm gì) là cấu trúc duy nhất vừa đúng ngữ pháp vừa đúng nghĩa.", "distractors": ["C. “because” chỉ nguyên nhân — ngược logic của câu.", "B. “although” chỉ nhượng bộ — sai nghĩa.", "D. “despite creating” đúng ngữ pháp nhưng mang nghĩa nhượng bộ (mặc dù tạo ra), không phải ý “mà không tạo ra”."], "kb": "without + V-ing: mà không làm gì.", "authored": true}, {"n": 23, "uid": 23, "part": "VI. REFERENCE & COHESION", "hd_fix": false, "prompt": "The word “there” refers to ______.", "options": ["the suburban district", "the former farmland", "the new businesses", "the apartment blocks"], "keyLetter": "A", "keyText": "the suburban district", "why": "Trích dẫn: “Over time, new apartment blocks, roads and shopping areas were built there.” — “there” thay thế cho địa điểm vừa được nêu ở câu trước là “a suburban district”, không phải các công trình mới xây.", "distractors": ["B. “the former farmland” là quá khứ của khu vực, không phải nơi đang xây công trình.", "D. “the apartment blocks” chính là thứ được xây “there”, không thể là nơi chốn.", "C. “the new businesses” xuất hiện ở câu sau, không phải antecedent."], "kb": "there → nơi chốn vừa được nêu trước đó.", "authored": false}, {"n": 24, "uid": 24, "part": "VI. REFERENCE & COHESION", "hd_fix": false, "prompt": "The phrase “These developments” refers to ______.", "options": ["the new buildings, roads and shops", "the growth in local employment", "the area’s former farmland", "the arrival of new residents"], "keyLetter": "A", "keyText": "the new buildings, roads and shops", "why": "Trích dẫn: “new apartment blocks, roads and shopping areas were built there. These developments attracted more residents and businesses.” — “These developments” (số nhiều) quy chiếu toàn bộ các công trình vừa liệt kê.", "distractors": ["B. “the growth in local employment” là kết quả ở câu sau, không phải “developments”.", "D. “the arrival of new residents” cũng là kết quả ở câu sau.", "C. “the area’s former farmland” là quá khứ — ngược với “new”."], "kb": "These + N (số nhiều) → quy chiếu cụm danh từ số nhiều gần nhất.", "authored": false}, {"n": 25, "uid": 25, "part": "VI. REFERENCE & COHESION", "hd_fix": false, "prompt": "The word “This” refers to ______.", "options": ["the growing demand for transport", "the district’s former use as farmland", "the provision of public services", "the attraction of residents and businesses"], "keyLetter": "D", "keyText": "the attraction of residents and businesses", "why": "Trích dẫn: “These developments attracted more residents and businesses. This created new employment opportunities…” — “This” quy chiếu cả sự việc ở câu trước: việc thu hút thêm cư dân và doanh nghiệp đã tạo ra cơ hội việc làm.", "distractors": ["A. “the growing demand for transport” xuất hiện sau “but it also increased”, không phải điều tạo ra việc làm.", "B. “the district’s former use as farmland” là quá khứ xa, không liên quan.", "C. “the provision of public services” là hệ quả nêu sau, không phải nguyên nhân tạo việc làm."], "kb": "This + V: thường quy chiếu cả sự việc ở câu trước.", "authored": false}, {"n": 26, "uid": 26, "part": "VII. PASSAGE COMPLETION – TWO-SIDED FIT", "hd_fix": false, "prompt": "Choose the best sentence.", "options": ["Urban growth reduces pressure on transport even without new infrastructure.", "Cities can meet the demand mainly by encouraging residents to move away.", "Meeting that demand requires careful long-term planning and investment.", "Housing demand usually falls when a city attracts more workers and students."], "keyLetter": "C", "keyText": "Meeting that demand requires careful long-term planning and investment.", "why": "Trích dẫn: “This growth can create strong demand for housing and transport. (26) ______. If development happens faster than infrastructure can be improved, residents may face congestion, overcrowding or pressure on essential services.” — câu B nối mạch “demand → meeting that demand” (that demand = strong demand for housing and transport) và chuẩn bị cho ý quy hoạch ở câu cuối đoạn.", "distractors": ["B. “encouraging residents to move away” — trái với mạch phát triển của đoạn.", "D. “demand usually falls when a city attracts more workers” — trái logic (thu hút thêm người thì nhu cầu tăng).", "A. “reduces pressure even without new infrastructure” — trái với câu sau (áp lực tăng khi hạ tầng không theo kịp)."], "kb": "Nối câu: tìm từ lặp ý (that demand) + mạch nghĩa hai phía.", "authored": false}, {"n": 27, "uid": 27, "part": "VII. PASSAGE COMPLETION – TWO-SIDED FIT", "hd_fix": false, "prompt": "Choose the best sentence.", "options": ["Overcrowding is mainly a temporary issue that requires no long-term response.", "These pressures normally disappear once a city begins to attract more residents.", "Planning ahead can reduce some pressures and protect residents’ quality of life.", "Authorities should focus on road building because other services are less important."], "keyLetter": "C", "keyText": "Planning ahead can reduce some pressures and protect residents’ quality of life.", "why": "Trích dẫn: “If development happens faster than infrastructure can be improved, residents may face congestion, overcrowding or pressure on essential services. (27) ______. Effective urban planning therefore requires authorities to anticipate growth rather than respond only after problems become severe.” — câu B đưa giải pháp cho các “pressures” và dẫn vào kết luận “therefore”.", "distractors": ["B. “pressures normally disappear” — trái với câu trước (áp lực là có thật).", "D. “other services are less important” — trái quan điểm cân bằng của đoạn.", "A. “requires no long-term response” — trái với câu kết “anticipate growth”."], "kb": "Câu chốt đoạn thường tóm ý: plan ahead → anticipate growth.", "authored": false}, {"n": 28, "uid": 28, "part": "VIII. ORDERING – URBAN CHANGE LOGIC", "hd_fix": false, "prompt": "Choose the best order.<br>a. As a result, travelling to the city centre became faster for many residents.<br>b. The local authority identified poor transport links as a major problem.<br>c. It then introduced a new bus route connecting the district with key employment areas.<br>d. A resident survey had shown that long commuting times affected daily life.", "options": ["c – d – b – a", "d – b – c – a", "d – c – a – b", "b – a – d – c"], "keyLetter": "B", "keyText": "d – b – c – a", "why": "Mạch logic: d (khảo sát cho thấy đi lại lâu) → b (xác định vấn đề: kết nối kém) → c (hành động: mở tuyến buýt mới) → a (kết quả: đi lại nhanh hơn). “As a result” ở câu a bắt buộc đứng cuối.", "distractors": ["D. “as a result” (a) không thể đứng trước nguyên nhân (d).", "A. Hành động (c) không thể xảy ra trước khi xác định vấn đề (b).", "C. Mở tuyến buýt (c) trước khi xác định vấn đề (b) là vô lý."], "kb": "survey → problem → action → result.", "authored": false}, {"n": 29, "uid": 29, "part": "VIII. ORDERING – URBAN CHANGE LOGIC", "hd_fix": false, "prompt": "Choose the best order.<br>a. I agree, but the city should also protect some open spaces.<br>b. Our neighbourhood has become much more convenient since the new shops opened.<br>c. That is true. Development is useful, but it needs to be balanced.<br>d. Yes, and the new road has made travelling easier too.", "options": ["b – d – a – c", "d – c – b – a", "a – b – c – d", "b – a – d – c"], "keyLetter": "A", "keyText": "b – d – a – c", "why": "Mạch hội thoại: b (nhận xét tích cực: tiện lợi hơn) → d (đồng tình + bổ sung: đường mới) → a (chuyển ý với “but”: cũng nên giữ không gian mở) → c (tổng kết: cần cân bằng).", "distractors": ["C. “I agree” (a) không thể mở đầu khi chưa có ý kiến nào để đồng tình.", "D. “but” (a) chen giữa hai ý đồng tình (b, d) làm đứt mạch.", "B. “That is true” (c) không thể đứng trước ý kiến mà nó đồng tình (b)."], "kb": "observation → addition → qualification → conclusion.", "authored": false}, {"n": 30, "uid": 30, "part": "IX. READING TRANSFER – WHEN A SUBURB BECOMES URBAN", "hd_fix": false, "prompt": "What is the main idea of paragraph 1?", "options": ["Economic growth and housing demand gradually transformed Greenfield.", "The local authority reduced transport links as demand for housing increased.", "Greenfield remained physically unchanged despite growth in the wider city.", "Residents left Greenfield because the area could no longer provide housing."], "keyLetter": "A", "keyText": "Economic growth and housing demand gradually transformed Greenfield.", "why": "Trích dẫn: “As the city’s economy grew, however, demand for housing increased. Developers began constructing apartment buildings, while the local authority widened roads and extended bus services.” — đoạn 1 kể quá trình kinh tế tăng trưởng và nhu cầu nhà ở đã biến đổi Greenfield.", "distractors": ["C. “remained physically unchanged” — trái hẳn đoạn (đã xây chung cư, mở đường).", "B. “reduced transport links” — trái (đã “widened roads and extended bus services”).", "D. “residents left” — bài không hề nói cư dân rời đi."], "kb": "Main idea = ý bao trùm cả đoạn, không phải chi tiết lẻ.", "authored": false}, {"n": 31, "uid": 31, "part": "IX. READING TRANSFER – WHEN A SUBURB BECOMES URBAN", "hd_fix": false, "prompt": "The word “extended” in paragraph 1 is closest in meaning to ______.", "options": ["reduced in coverage", "cancelled completely", "separated into parts", "expanded or lengthened"], "keyLetter": "D", "keyText": "expanded or lengthened", "why": "Trích dẫn: “the local authority widened roads and extended bus services.” — “extend” đi song song với “widen” (mở rộng), nghĩa là mở rộng/kéo dài dịch vụ xe buýt.", "distractors": ["A. “reduced in coverage” — ngược nghĩa.", "C. “separated into parts” là nghĩa của “separate”, không phải “extend”.", "B. “cancelled completely” — ngược nghĩa."], "kb": "extend ≈ expand/lengthen: mở rộng, kéo dài.", "authored": false}, {"n": 32, "uid": 32, "part": "IX. READING TRANSFER – WHEN A SUBURB BECOMES URBAN", "hd_fix": false, "prompt": "Which benefit is mentioned in paragraph 2?", "options": ["The restoration of open land between neighbourhoods", "A permanent reduction in demand for new housing", "Better access to services, healthcare and employment", "Complete removal of traffic congestion from the area"], "keyLetter": "C", "keyText": "Better access to services, healthcare and employment", "why": "Trích dẫn: “residents gained easier access to schools, healthcare and employment.” — đây chính là lợi ích được nêu: tiếp cận dịch vụ, y tế, việc làm dễ dàng hơn.", "distractors": ["D. “complete removal of traffic congestion” — bài nói giao thông tăng nhanh hơn sức chứa đường, trái ngược.", "B. “permanent reduction in demand for new housing” — bài không hề nói.", "A. “restoration of open land” — bài nói cư dân tiếc vì mất không gian mở, trái ngược."], "kb": "Detail: tìm câu chứa đúng thông tin; cảnh giác từ tuyệt đối (complete/permanent).", "authored": false}, {"n": 33, "uid": 33, "part": "IX. READING TRANSFER – WHEN A SUBURB BECOMES URBAN", "hd_fix": false, "prompt": "What problem developed as the area changed?", "options": ["Employment opportunities decreased as property development expanded.", "Most local shops and services closed after development began.", "Public transport was removed because roads became more heavily used.", "Traffic increased faster than the available road capacity."], "keyLetter": "D", "keyText": "Traffic increased faster than the available road capacity.", "why": "Trích dẫn: “Traffic increased faster than road capacity” — giao thông tăng nhanh hơn sức chứa của đường.", "distractors": ["B. “shops and services closed” — trái (đã “opened”).", "A. “employment decreased” — trái (“created jobs”).", "C. “public transport was removed” — trái (“extended bus services”)."], "kb": "faster than road capacity → áp lực giao thông.", "authored": false}, {"n": 34, "uid": 34, "part": "IX. READING TRANSFER – WHEN A SUBURB BECOMES URBAN", "hd_fix": false, "prompt": "The phrase “the area” in paragraph 2 refers to ______.", "options": ["Greenfield as the developing suburb", "the available road capacity", "the local healthcare system", "the wider city economy"], "keyLetter": "A", "keyText": "Greenfield as the developing suburb", "why": "Trích dẫn: “some long-term residents felt that the area was losing open spaces…” — “the area” là nơi các cư dân lâu năm sinh sống, tức Greenfield, khu ngoại ô đang phát triển được nói từ đầu bài.", "distractors": ["D. “the wider city economy” là nguyên nhân tăng trưởng, không phải nơi “mất không gian mở”.", "C. “the local healthcare system” — không liên quan.", "B. “the available road capacity” là vấn đề giao thông, không phải “area”."], "kb": "the area → địa danh chính của bài (Greenfield).", "authored": false}, {"n": 35, "uid": 35, "part": "IX. READING TRANSFER – WHEN A SUBURB BECOMES URBAN", "hd_fix": false, "prompt": "What can be inferred about some long-term residents?", "options": ["They believed road conditions had improved as traffic increased.", "They wanted low-rise housing to be completely replaced by apartments.", "They opposed all new services introduced into the neighbourhood.", "They valued open spaces that existed before rapid development."], "keyLetter": "D", "keyText": "They valued open spaces that existed before rapid development.", "why": "Trích dẫn: “some long-term residents felt that the area was losing open spaces that had once been part of everyday life.” — tiếc vì “mất” không gian mở từng gắn với đời sống → họ coi trọng những không gian đó.", "distractors": ["C. “opposed all new services” — “all” quá tuyệt đối, bài không nói.", "B. “wanted low-rise housing completely replaced” — trái ý (họ tiếc không gian mở).", "A. “believed road conditions had improved” — bài nói giao thông tệ hơn."], "kb": "Inference: suy ra trong biên evidence, tránh từ tuyệt đối (all/completely).", "authored": false}, {"n": 36, "uid": 36, "part": "IX. READING TRANSFER – WHEN A SUBURB BECOMES URBAN", "hd_fix": false, "prompt": "According to paragraph 3, successful urban growth depends on ______.", "options": ["constructing housing as quickly as possible in every district", "more than simply increasing the number of new buildings", "preventing neighbourhoods from changing once residents move in", "reducing public services so development becomes less expensive"], "keyLetter": "B", "keyText": "more than simply increasing the number of new buildings", "why": "Trích dẫn: “Greenfield’s experience shows why urban development cannot be judged simply by counting new buildings.” — thành công đô thị không chỉ đo bằng số tòa nhà mới.", "distractors": ["A. “constructing housing as quickly as possible” — trái (bài phê phán tốc độ thiếu kiểm soát).", "D. “reducing public services” — trái (bài đòi hỏi dịch vụ công).", "C. “preventing neighbourhoods from changing” — trái (bài nói vấn đề là “how change is managed”, không phải ngăn thay đổi)."], "kb": "not simply by counting new buildings: không chỉ đếm tòa nhà.", "authored": false}, {"n": 37, "uid": 37, "part": "IX. READING TRANSFER – WHEN A SUBURB BECOMES URBAN", "hd_fix": false, "prompt": "Which statement is NOT supported by the passage?", "options": ["Property development can create employment opportunities for residents.", "Rapid physical change may place pressure on transport systems.", "Residents’ needs should be considered when development is evaluated.", "Urban development always improves every part of residents’ lives."], "keyLetter": "D", "keyText": "Urban development always improves every part of residents’ lives.", "why": "Trích dẫn: “Growth may improve access to opportunities, but its success also depends on transport, public services, environmental quality and residents’ needs.” — từ “but” cho thấy phát triển KHÔNG cải thiện mọi mặt; “always… every part” quá tuyệt đối và trái bài.", "distractors": ["A. “Property development also created jobs” — có trong bài.", "B. “Traffic increased faster than road capacity” — có trong bài.", "C. “residents’ needs” nằm trong danh sách yếu tố thành công — có trong bài."], "kb": "NOT supported: đáp án đúng thường chứa từ tuyệt đối (always/every) trái bài.", "authored": false}, {"n": 38, "uid": 38, "part": "IX. READING TRANSFER – WHEN A SUBURB BECOMES URBAN", "hd_fix": false, "prompt": "What is the writer’s main purpose?", "options": ["To argue that suburban communities should prevent all future physical expansion", "To describe only the history of roads and bus services in Greenfield", "To explain both benefits and challenges involved in managing urban development", "To promote apartment development as the best solution to housing demand"], "keyLetter": "C", "keyText": "To explain both benefits and challenges involved in managing urban development", "why": "Trích dẫn: “The challenge is not whether cities should change, but how that change is managed.” — toàn bài trình bày cả lợi ích (đoạn 2) lẫn khó khăn và cách quản lý phát triển đô thị.", "distractors": ["A. “prevent all future physical expansion” — trái (bài không kêu gọi ngăn thay đổi).", "D. “promote apartment development as the best solution” — quá hẹp.", "B. “describe only the history of roads and bus services” — quá hẹp, bỏ qua luận điểm chính."], "kb": "Purpose: nhìn câu kết + cấu trúc cả bài (lợi ích → khó khăn → bài học).", "authored": false}, {"n": 39, "uid": 39, "part": "IX. READING TRANSFER – WHEN A SUBURB BECOMES URBAN", "hd_fix": false, "prompt": "Best title?", "options": ["Greenfield: Why Urban Change Should Be Prevented", "Public Transport as the Only Measure of Urban Success", "Managing Urban Growth: More Than New Buildings", "How High-Rise Buildings Replaced Every Suburban Home"], "keyLetter": "C", "keyText": "Managing Urban Growth: More Than New Buildings", "why": "Trích dẫn: “The challenge is not whether cities should change, but how that change is managed.” và “cannot be judged simply by counting new buildings” — tiêu đề D bao quát đúng luận điểm: quản lý tăng trưởng đô thị không chỉ là xây thêm tòa nhà.", "distractors": ["A. “Should Be Prevented” — đảo ngược thông điệp bài.", "B. “Only Measure” — “only” quá hẹp.", "D. “Replaced Every Suburban Home” — “every” phóng đại, bài không nói."], "kb": "Title: bao quát luận điểm chính, tránh từ tuyệt đối.", "authored": false}, {"n": 40, "uid": 40, "part": "X. TNTHPT-STYLE CLOZE – URBAN DEVELOPMENT", "hd_fix": false, "prompt": "", "options": ["rapid", "rapidity", "rapidly", "more rapid"], "keyLetter": "C", "keyText": "rapidly", "why": "Chỗ trống bổ nghĩa cho động từ “occurs” (xảy ra) → cần trạng từ; “rapidly” (một cách nhanh chóng) là trạng từ duy nhất. Câu đầu đoạn “have changed rapidly” củng cố mạch nghĩa.", "distractors": ["A. “rapid” là tính từ — không bổ nghĩa cho động từ.", "B. “rapidity” là danh từ — sai từ loại.", "D. “more rapid” là cụm tính từ so sánh — sai từ loại."], "kb": "V + adv: occurs rapidly.", "authored": false}, {"n": 41, "uid": 41, "part": "X. TNTHPT-STYLE CLOZE – URBAN DEVELOPMENT", "hd_fix": false, "prompt": "", "options": ["estimate", "anticipate", "project", "postpone"], "keyLetter": "B", "keyText": "anticipate", "why": "\"anticipate future demand\" (dự đoán trước nhu cầu tương lai) là collocation chuẩn; \"need to\" + động từ nguyên thể; ngữ cảnh quy hoạch chủ động (đầu tư trước vào hạ tầng) → anticipate.", "distractors": ["D. \"postpone\" (trì hoãn) không kết hợp với \"demand\" — không thể \"trì hoãn nhu cầu\"; sai nghĩa trong ngữ cảnh.", "A. \"estimate\" (ước tính) thiên về tính toán số liệu cụ thể, không phải chunk của bài.", "C. \"project\" (dự kiến) thường đi với số liệu/mục tiêu cụ thể, không tự nhiên với \"demand\" ở đây."], "kb": "anticipate future demand: dự đoán trước nhu cầu tương lai.", "authored": false}, {"n": 42, "uid": 42, "part": "X. TNTHPT-STYLE CLOZE – URBAN DEVELOPMENT", "hd_fix": false, "prompt": "", "options": ["whose", "who", "which", "where"], "keyLetter": "B", "keyText": "who", "why": "Antecedent “local communities” ở đây chỉ con người/cộng đồng dân cư; mệnh đề sau cần đại từ quan hệ làm chủ ngữ của “may experience” → “who”.", "distractors": ["C. “which” chỉ vật — không dùng khi antecedent là người.", "D. “where” chỉ nơi chốn — không thể làm chủ ngữ.", "A. “whose” chỉ sở hữu — không thể làm chủ ngữ."], "kb": "communities, who + V: cộng đồng, những người…", "authored": false}, {"n": 43, "uid": 43, "part": "X. TNTHPT-STYLE CLOZE – URBAN DEVELOPMENT", "hd_fix": false, "prompt": "", "options": ["management", "manage", "managed", "managing"], "keyLetter": "C", "keyText": "managed", "why": "“it is (43) ______” — cấu trúc bị động “be + V3”; chủ ngữ “it” (urbanisation) được quản lý → “managed” (quá khứ phân từ) là dạng duy nhất đúng.", "distractors": ["D. “managing” (V-ing) không dùng sau “is” trong nghĩa bị động.", "A. “management” là danh từ — sai từ loại.", "B. “manage” nguyên thể — sai cấu trúc bị động."], "kb": "be + V3 (bị động): is managed.", "authored": false}, {"n": 44, "uid": 44, "part": "X. TNTHPT-STYLE CLOZE – URBAN DEVELOPMENT", "hd_fix": false, "prompt": "", "options": ["while", "because", "unless", "therefore"], "keyLetter": "A", "keyText": "while", "why": "Hai mệnh đề song song: thành phố “trở nên tiện lợi và hiệu quả” ĐỒNG THỜI “vẫn bảo vệ các giá trị” — “while” (trong khi/đồng thời) diễn tả hai việc diễn ra cùng lúc.", "distractors": ["B. “because” chỉ nguyên nhân — sai quan hệ nghĩa.", "C. “unless” là điều kiện phủ định — sai nghĩa.", "D. “therefore” chỉ kết luận — mệnh đề sau không phải hệ quả."], "kb": "while + V-ing/clause: trong khi, đồng thời.", "authored": false}, {"n": 45, "uid": 45, "part": "XI. HOMEWORK – MIXED TRANSFER", "hd_fix": false, "prompt": "", "options": ["who", "which", "where", "what"], "keyLetter": "B", "keyText": "which", "why": "Chỗ trống đứng sau dấu phẩy, quy chiếu CẢ mệnh đề trước (“may make it easier…”) chứ không chỉ một danh từ → mệnh đề quan hệ không xác định với “which” làm chủ ngữ của “can increase”.", "distractors": ["A. “who” chỉ người — sai.", "C. “where” chỉ nơi chốn — sai.", "D. “what” không dùng làm đại từ quan hệ sau dấu phẩy trong cấu trúc này."], "kb": "…, which + V: “điều này…” quy chiếu cả ý trước.", "authored": false}, {"n": 46, "uid": 46, "part": "XI. HOMEWORK – MIXED TRANSFER", "hd_fix": false, "prompt": "", "options": ["with", "to", "of", "for"], "keyLetter": "D", "keyText": "for", "why": "“demand for housing” (nhu cầu về nhà ở) — danh từ “demand” đi với giới từ “for” khi nêu đối tượng của nhu cầu.", "distractors": ["C. Không có cụm “demand of housing”.", "B. Không có cụm “demand to housing”.", "A. Không có cụm “demand with housing”."], "kb": "demand for + N: nhu cầu về…", "authored": false}, {"n": 47, "uid": 47, "part": "XI. HOMEWORK – MIXED TRANSFER", "hd_fix": false, "prompt": "", "options": ["despite", "whether", "because", "although"], "keyLetter": "B", "keyText": "whether", "why": "Sau “consider” cần mệnh đề danh từ diễn tả sự cân nhắc “liệu… hay không”; “whether development benefits different groups” là cấu trúc duy nhất đúng.", "distractors": ["C. “because” chỉ nguyên nhân — sai nghĩa.", "D. “although” chỉ nhượng bộ — sai nghĩa.", "A. “despite” sau nó cần danh từ/V-ing, không đi mệnh đề đầy đủ."], "kb": "consider whether + clause: cân nhắc liệu… hay không.", "authored": false}, {"n": 48, "uid": 48, "part": "XI. HOMEWORK – MIXED TRANSFER", "hd_fix": false, "prompt": "", "options": ["give rise", "take place", "make way", "keep pace"], "keyLetter": "D", "keyText": "keep pace", "why": "“are able to (48) ______ with population growth” — cụm “keep pace with” (theo kịp) là collocation duy nhất đi với “with population growth”.", "distractors": ["B. “take place” — không tồn tại “take place with”.", "C. “make way” — không tồn tại “make way with” trong nghĩa này.", "A. “give rise” đi với “to”, không đi với “with”."], "kb": "keep pace with population growth: theo kịp tốc độ tăng dân số.", "authored": false}, {"n": 49, "uid": 49, "part": "XI. HOMEWORK – MIXED TRANSFER", "hd_fix": false, "prompt": "", "options": ["sustain", "sustainably", "sustainable", "sustainability"], "keyLetter": "C", "keyText": "sustainable", "why": "Sau mạo từ “a” và trước danh từ “way” cần tính từ; “sustainable” (bền vững) đi cặp với “inclusive” tạo cụm “in a sustainable and inclusive way”.", "distractors": ["A. “sustain” là động từ — sai từ loại.", "B. “sustainably” là trạng từ — sai từ loại.", "D. “sustainability” là danh từ — sai từ loại."], "kb": "in a sustainable and inclusive way: theo cách bền vững và bao trùm.", "authored": false}]} ,"p3":{"title":"PHẦN 3 — CỦNG CỐ","desc":"16 câu quiz củng cố kiến thức trọng tâm của bài (near transfer).","questions":[{ const PASSAGES={"REFERENCE & COHESION": "<p>A suburban district once consisted mainly of farmland and low-rise houses. Over time, new apartment blocks, roads and shopping areas were built there. These developments attracted more residents and businesses. This created new employment opportunities, but it also increased demand for transport and other public services.</p>", "PASSAGE COMPLETION": "<p>Cities often expand because people move to urban areas for work, education and services. This growth can create strong demand for housing and transport. (26) ______. If development happens faster than infrastructure can be improved, residents may face congestion, overcrowding or pressure on essential services. (27) ______. Effective urban planning therefore requires authorities to anticipate growth rather than respond only after problems become severe.</p>", "READING TRANSFER": "<p>For many years, Greenfield was a quiet area on the edge of a large city. Most residents lived in low-rise houses, and open land separated one neighbourhood from another. As the city’s economy grew, however, demand for housing increased. Developers began constructing apartment buildings, while the local authority widened roads and extended bus services.</p><p>The changes brought clear advantages. New shops and services opened, and residents gained easier access to schools, healthcare and employment. Property development also created jobs. Yet the speed of change produced difficulties. Traffic increased faster than road capacity, and some long-term residents felt that the area was losing open spaces that had once been part of everyday life.</p><p>Greenfield’s experience shows why urban development cannot be judged simply by counting new buildings. Growth may improve access to opportunities, but its success also depends on transport, public services, environmental quality and residents’ needs. The challenge is not whether cities should change, but how that change is managed.</p>", "TNTHPT-STYLE CLOZE": "<p>Many Vietnamese cities have changed rapidly as their populations and economies have grown. In some areas, former farmland has been replaced by housing, roads and commercial facilities. Such development can make services more accessible and create new employment opportunities. However, when urban growth occurs too (40) ______, infrastructure may struggle to keep pace. Heavy traffic, rising housing costs and pressure on public services can affect residents’ quality of life. Authorities therefore need to (41) ______ future demand and invest in transport, housing and public spaces. It is also important to involve local communities, (42) ______ may experience the effects of development directly. Urbanisation itself is not necessarily a problem; the key issue is how effectively it is (43) ______. With careful planning, cities can become more convenient and productive (44) ______ still protecting important social and environmental values.</p>", "HOMEWORK": "<p>Urban growth often changes not only the physical appearance of a place but also the way residents live. A new transport system, for example, may make it easier for people to reach jobs and services, (45) ______ can increase the attractiveness of an area. As more people move in, however, demand (46) ______ housing may rise quickly. If the supply of affordable homes does not keep pace, lower-income residents may find it increasingly difficult to remain in the area. Urban planners therefore need to consider (47) ______ development benefits different groups of people. They must also ensure that roads, schools and healthcare facilities are able to (48) ______ with population growth. A successful city is not simply one that becomes larger; it is one that manages growth in a (49) ______ and inclusive way.</p>"};

const startEpoch=Date.now();
const letters=['A','B','C','D'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
