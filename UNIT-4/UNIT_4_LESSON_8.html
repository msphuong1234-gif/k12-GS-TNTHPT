<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:17px/1.65 "Times New Roman",Times,serif}
header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.subtitle{opacity:.92;font-size:18px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}
.toolbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;font-family:system-ui}
.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:system-ui}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}
.GREEN{background:#dcfce7;color:var(--green)}.AMBER{background:#fef3c7;color:var(--amber)}.RED{background:#fee2e2;color:var(--red)}
.TAG{background:#e0e7ff;color:#3730a3}
.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}
table.vocab{width:100%;border-collapse:collapse;margin:12px 0}
table.vocab th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left}
table.vocab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.vocab tr:nth-child(even) td{background:#f8fafc}
.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}
.know b.t{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:22px;font-family:system-ui}
@media(max-width:760px){.toolbar button{flex:1}}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#102a43,#245b8f);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0006}
.gate-box h2{color:var(--navy);margin:0 0 6px}
.gate-box input{width:100%;padding:12px;border:1px solid #bfcadd;border-radius:10px;font-size:17px;margin:12px 0;font-family:system-ui}
.gate-box .primary{width:100%;font-size:17px}
#pwmsg{color:var(--red);font-weight:700;min-height:24px;font-family:system-ui}
.view{display:none}.view.active{display:block}
.backbar{margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:8px}
.hub-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;text-align:left;font-family:"Times New Roman",Times,serif;box-shadow:0 7px 22px #1e293b0b}
.hub-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.hub-card b.t{font-size:21px;color:var(--navy);display:block;margin-bottom:6px}
.hub-card span.d{color:var(--muted);font-size:15px;display:block}
.hub-card .st{margin-top:10px;display:block}
.twopane{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start;margin:12px 0}
.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pane-l{background:#fbfdff}
@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

f the most : một trong những...; không phải the single most : duy nhất cao nhất", "authored": false}, {"n": 45, "uid": "45", "part": "PARAPHRASE, DEGREE & SCOPE", "hd_fix": false, "prompt": "“Urbanisation may improve access to services.” Which option best preserves the original degree of certainty?", "options": ["Urbanisation is likely to improve access to services.", "Urbanisation can potentially improve access to services.", "Urbanisation will generally improve access to services.", "Urbanisation is expected to improve access to services."], "keyLetter": "B", "keyText": "Urbanisation can potentially improve access to services.", "why": "may improve = can potentially improve : có thể cải thiện.", "distractors": ["“Urbanisation will generally improve access to services.” không phù hợp nhất. may improve = can potentially improve : có thể cải thiện.", "“Urbanisation is expected to improve access to services.” không phù hợp nhất. may improve = can potentially improve : có thể cải thiện.", "“Urbanisation is likely to improve access to services.” không phù hợp nhất. may improve = can potentially improve : có thể cải thiện."], "kb": "may improve = can potentially improve : có thể cải thiện", "authored": false}, {"n": 46, "uid": "46", "part": "MIXED LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Choose the best option for blank (46).", "options": ["seeking", "seek", "sought to", "search at"], "keyLetter": "B", "keyText": "seek", "why": "Trích dẫn: “Many young adults have moved there to (46) ______ better jobs…” → “to” chỉ mục đích đi với động từ nguyên thể → “to seek better jobs” → B.", "distractors": ["A. “seeking” sai: sau “to” chỉ mục đích cần động từ nguyên thể, không phải V-ing.", "C. “sought to” sai: “to sought to” trùng lặp cấu trúc.", "D. “search at” sai: “to search at better jobs” sai collocation và ngữ pháp."], "kb": "to + V (nguyên thể) chỉ mục đích.", "authored": false}, {"n": 47, "uid": "47", "part": "MIXED LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Choose the best option for blank (47).", "options": ["at", "for", "on", "to"], "keyLetter": "C", "keyText": "on", "why": "Trích dẫn: “…population growth has also placed pressure (47) ______ housing and transport.” → Cụm cố định “place/put pressure on + N” → D.", "distractors": ["D. “to” sai: “pressure to housing” không đúng — cụm đúng là “pressure on”.", "B. “for” sai collocation: không có “pressure for + N”.", "A. “at” sai collocation: không có “pressure at + N”."], "kb": "place/put pressure on + N.", "authored": false}, {"n": 48, "uid": "48", "part": "MIXED LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Choose the best option for blank (48).", "options": ["most and most", "more and more", "the more", "more than"], "keyLetter": "B", "keyText": "more and more", "why": "Trích dẫn: “Rents have become (48) ______ expensive…” → Diễn tả mức độ tăng dần: “more and more + adj” (càng ngày càng…) → A.", "distractors": ["C. “the more” sai: “the more” phải đi thành cặp “the more…, the more…”.", "A. “most and most” sai: không tồn tại cấu trúc này trong tiếng Anh.", "D. “more than” sai nghĩa: so sánh hơn cần đối tượng so sánh, không đi một mình."], "kb": "more and more + adj/adv: càng ngày càng…", "authored": false}, {"n": 49, "uid": "49", "part": "MIXED LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Choose the best option for blank (49).", "options": ["which", "where", "that", "who"], "keyLetter": "A", "keyText": "which", "why": "Trích dẫn: “The council has introduced several bus routes, (49) ______ has improved access…” → Đại từ quan hệ thay cho cả mệnh đề đứng trước (sau dấu phẩy) → “which” → C.", "distractors": ["C. “that” sai: không dùng “that” sau dấu phẩy trong mệnh đề không xác định.", "B. “where” sai: chỉ nơi chốn, không thay được cả mệnh đề.", "D. “who” sai: chỉ người, trong khi tiền đề là cả mệnh đề."], "kb": "“which” thay cho cả mệnh đề đứng trước (sau dấu phẩy).", "authored": false}, {"n": 50, "uid": "50", "part": "MIXED LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Choose the best option for blank (50).", "options": ["much", "most", "more", "many"], "keyLetter": "C", "keyText": "more", "why": "Trích dẫn: “the faster the population grows, the (50) ______ difficult it becomes…” → Cấu trúc “the + so sánh hơn…, the + so sánh hơn…” → “more” → B.", "distractors": ["B. “most” sai: “the most difficult” là so sánh nhất, phá vỡ cặp “the… the…”.", "A. “much” sai: “the much difficult” sai ngữ pháp.", "D. “many” sai: “many” không bổ nghĩa cho tính từ “difficult”."], "kb": "The + so sánh hơn…, the + so sánh hơn…", "authored": false}, {"n": 51, "uid": "51", "part": "MIXED LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Choose the best option for blank (51).", "options": ["whom", "that", "whose", "where"], "keyLetter": "B", "keyText": "that", "why": "Trích dẫn: “…decisions (51) ______ affect large numbers of residents.” → Mệnh đề quan hệ xác định, tiền đề “decisions” là vật → “that” → D.", "distractors": ["D. “where” sai: chỉ nơi chốn, không thay cho “decisions”.", "C. “whose” sai: chỉ sở hữu.", "A. “whom” sai: chỉ người ở vị trí tân ngữ."], "kb": "“that/which” cho mệnh đề quan hệ xác định chỉ vật.", "authored": false}, {"n": 52, "uid": "52", "part": "PASSAGE COMPLETION – TWO-SIDED FIT", "hd_fix": false, "prompt": "Choose the best option for blank (52).", "options": ["Urbanisation has little connection with the demand placed on housing or public-service systems.", "However, rapid growth can also place serious pressure on housing, transport and public services.", "For example, rural communities never require infrastructure when residents move toward cities.", "Therefore, every expanding city experiences exactly the same pattern of population and employment."], "keyLetter": "B", "keyText": "However, rapid growth can also place serious pressure on housing, transport and public services.", "why": "Trích dẫn: “Urban growth can bring new jobs and better access to services. (52) ______. When housing supply does not keep pace…” → Cần câu chuyển hai mặt (mặt tích cực → áp lực) → B (“However, rapid growth can also place serious pressure…”).", "distractors": ["D. sai ở “every/exactly the same”: tuyệt đối hoá — các thành phố không giống hệt nhau.", "C. sai ở “never” và lạc đề: bài không nói về rural communities.", "A. ngược mạch bài: bài đang nói demand/pressure tăng, không phải “little connection”."], "kb": "However + mặt trái: nối hai mặt của cùng vấn đề.", "authored": false}, {"n": 53, "uid": "53", "part": "PASSAGE COMPLETION – TWO-SIDED FIT", "hd_fix": false, "prompt": "Choose the best option for blank (53).", "options": ["In contrast, residents who move farther away generally stop travelling to jobs and essential services.", "As a result, rising housing demand normally causes rents near employment centres to fall sharply.", "This proves that cities should avoid population growth rather than coordinate housing and transport.", "Longer journeys can then increase pressure on transport networks and household travel costs."], "keyLetter": "D", "keyText": "Longer journeys can then increase pressure on transport networks and household travel costs.", "why": "Trích dẫn: “…residents may be pushed farther from employment centres. (53) ______. For this reason, successful urban planning requires coordination…” → Cần câu cầu nối: hành trình dài hơn → áp lực giao thông → D.", "distractors": ["B. sai nghĩa: housing demand tăng thì rents tăng, không “fall sharply”.", "A. ngược thực tế bài: đi xa hơn thì vẫn phải di chuyển, không “stop travelling”.", "C. sai hướng: bài kêu gọi coordinate, không phải avoid growth."], "kb": "Câu cầu nối phải khớp cả câu trước và câu sau.", "authored": false}, {"n": 54, "uid": "54", "part": "SENTENCE ORDERING – URBAN DEVELOPMENT LOGIC", "hd_fix": false, "prompt": "Choose the best option for blank (54).<br>a. The local authority then increased bus frequency during peak hours.<br>b. Residents had complained about overcrowding on two major routes.<br>c. Passenger surveys showed that demand was highest before 8 a.m.<br>d. Within a month, average waiting times had fallen.", "options": ["b – c – a – d", "b – a – c – d", "c – b – d – a", "d – b – c – a"], "keyLetter": "A", "keyText": "b – c – a – d", "why": "Mạch logic: b (vấn đề: phàn nàn quá tải) → c (bằng chứng: khảo sát cho thấy nhu cầu cao) → a (“then”: chính quyền tăng chuyến) → d (kết quả: thời gian chờ giảm).", "distractors": ["C. (c–b–d–a): d là kết quả cuối cùng (“Within a month… had fallen”), không thể đứng trước a (hành động).", "B. (b–a–c–d): a (“then”) phải theo sau bằng chứng c, không thể đứng ngay sau b.", "D. (d–b–c–a): d mở đầu bằng kết quả trong khi chưa có gì xảy ra trước đó."], "kb": "Chú ý các mốc nối: \"then\"/\"therefore\"/\"however\"/\"as a result\"/\"finally\" luôn cần tiền đề đứng trước.", "authored": false}, {"n": 55, "uid": "55", "part": "SENTENCE ORDERING – URBAN DEVELOPMENT LOGIC", "hd_fix": true, "prompt": "Choose the best option for blank (55).<br>a. As housing demand increased, rents began to rise.<br>b. A technology park attracted thousands of new workers to the district.<br>c. Developers responded by constructing new apartment blocks.<br>d. The district’s population therefore grew rapidly.", "options": ["b – d – a – c", "c – b – d – a", "d – b – c – a", "b – a – d – c"], "keyLetter": "A", "keyText": "b – d – a – c", "why": "Mạch nhân quả: b (khu công nghệ thu hút lao động) → d (“therefore”: dân số tăng) → a (nhu cầu nhà ở tăng, giá thuê lên) → c (“responded”: chủ đầu tư xây thêm).", "distractors": ["C. (d–b–c–a): d mở đầu bằng “therefore” nhưng không có nguyên nhân nào trước đó; c (“responded”) lại đứng trước a (điều cần phản ứng).", "D. (b–a–d–c): d (“therefore”) không thể theo sau a — giá thuê tăng không phải nguyên nhân của dân số tăng.", "B. (c–b–d–a): c (“responded”) mở đầu khi chưa có gì để phản ứng."], "kb": "Chú ý các mốc nối: \"then\"/\"therefore\"/\"however\"/\"as a result\"/\"finally\" luôn cần tiền đề đứng trước.", "authored": false}, {"n": 56, "uid": "56", "part": "TNTHPT MIXED READING – GROWTH WITHOUT COORDINATION", "hd_fix": false, "prompt": "What is the main idea?", "options": ["Transport is the only urban system that needs coordination during rapid growth.", "Urbanisation can be understood fully as movement from villages into cities.", "Cities should reduce job creation whenever new development increases housing demand.", "Urban growth needs coordinated, evidence-based management across connected systems."], "keyLetter": "D", "keyText": "Urban growth needs coordinated, evidence-based management across connected systems.", "why": "Trích dẫn: “Growth becomes more sustainable when decisions are based on evidence and when planners consider how one part of the urban system affects the others.” + “None of these systems operates independently.” → Ý chính là quản lý có phối hợp, dựa trên bằng chứng, trên các hệ thống liên kết → B.", "distractors": ["B. sai: đây chỉ là cách hiểu đơn giản mà đoạn 1 bác bỏ (“sometimes treated as a simple movement… In practice, however…”).", "C. sai: bài không hề đề xuất giảm tạo việc làm.", "A. sai ở “only”: bài khẳng định “None of these systems operates independently”."], "kb": "Main idea = ý bao trùm cả bài; cảnh giác với từ tuyệt đối (only).", "authored": false}, {"n": 57, "uid": "57", "part": "TNTHPT MIXED READING – GROWTH WITHOUT COORDINATION", "hd_fix": false, "prompt": "Why can new employment centres increase transport pressure?", "options": ["Workers may live farther away when nearby housing supply does not keep pace.", "Employment centres reduce travel because workers automatically move into nearby offices.", "Transport pressure falls whenever a district attracts large numbers of new workers.", "New jobs normally lower housing demand in the districts where employment is created."], "keyLetter": "A", "keyText": "Workers may live farther away when nearby housing supply does not keep pace.", "why": "Trích dẫn: “As rents rise, employees may move farther away, increasing commuting distances and adding pressure to transport networks.” → Công nhân ở xa hơn vì nhà ở không theo kịp → áp lực giao thông tăng → D.", "distractors": ["B. ngược với bài: bài nói commuting distances tăng, không giảm.", "D. ngược với bài: nhà ở không theo kịp (“faster than nearby housing is built”).", "C. ngược với bài: áp lực tăng (“adding pressure to transport networks”)."], "kb": "“increase pressure” trong bài = “adding pressure to transport networks”.", "authored": false}, {"n": 58, "uid": "58", "part": "TNTHPT MIXED READING – GROWTH WITHOUT COORDINATION", "hd_fix": false, "prompt": "The word “another” in paragraph 2 refers to ______.", "options": ["another problem created while solving an earlier one", "another city experiencing rapid urban development", "another school affected by population growth", "another worker moving farther from employment"], "keyLetter": "A", "keyText": "another problem created while solving an earlier one", "why": "Trích dẫn: “A policy that solves one problem can therefore create another if planners examine sectors separately.” → “another” thế cho “another problem” (vấn đề mới nảy sinh khi giải quyết vấn đề cũ) → A.", "distractors": ["D. sai: “another” đi sau “create” — chỉ problem, không chỉ worker.", "B. sai: không có city nào được nhắc làm tiền đề cho “another”.", "C. sai: school không xuất hiện ở đoạn 2."], "kb": "another/one + N → tìm danh từ được nhắc ngay trước đó.", "authored": false}, {"n": 59, "uid": "59", "part": "TNTHPT MIXED READING – GROWTH WITHOUT COORDINATION", "hd_fix": false, "prompt": "What can be inferred from paragraph 3?", "options": ["Urban systems influence one another, so changes in one area can affect others.", "The location of hospitals determines every decision families make about where to live.", "Housing policy has little effect on where or how people travel within a city.", "Each urban sector works independently and is best planned without reference to others."], "keyLetter": "A", "keyText": "Urban systems influence one another, so changes in one area can affect others.", "why": "Trích dẫn: “None of these systems operates independently.” + “Housing policy influences travel patterns; transport affects access to jobs…” → Suy ra: các hệ thống đô thị tác động lẫn nhau → C.", "distractors": ["C. ngược với bài: “Housing policy influences travel patterns”.", "B. sai ở “every”: bài chỉ nói “can shape”, không tuyệt đối hoá.", "D. ngược với bài: “None of these systems operates independently”."], "kb": "Inference = evidence + một bước suy luận; “every/only” thường là bẫy.", "authored": false}, {"n": 60, "uid": "60", "part": "TNTHPT MIXED READING – GROWTH WITHOUT COORDINATION", "hd_fix": false, "prompt": "Which statement is TRUE?", "options": ["Every urban policy produces benefits without creating any new pressures or costs.", "A solution in one urban sector may create consequences in another sector.", "Infrastructure normally expands faster than population in rapidly growing urban areas.", "Evidence is unnecessary when authorities are deciding how to manage urban growth."], "keyLetter": "B", "keyText": "A solution in one urban sector may create consequences in another sector.", "why": "Trích dẫn: “A policy that solves one problem can therefore create another if planners examine sectors separately.” → Đúng nguyên văn: giải pháp ở một lĩnh vực có thể gây hệ quả ở lĩnh vực khác → B.", "distractors": ["A. sai: bài nói policy có thể “create another” problem — vẫn có chi phí mới.", "C. ngược với bài: infrastructure “does not expand at a similar pace”.", "D. ngược với bài: “decisions are based on evidence”."], "kb": "Câu TRUE phải khớp nguyên văn evidence trong bài.", "authored": false}, {"n": 61, "uid": "61", "part": "TNTHPT MIXED READING – GROWTH WITHOUT COORDINATION", "hd_fix": false, "prompt": "What is the function of the final paragraph?", "options": ["To list exact population figures that demonstrate how quickly the city has grown.", "To introduce the topic of commuting for the first time in the discussion.", "To argue that urbanisation is negative regardless of how planning decisions are made.", "To reframe the issue around how effectively a city manages connected urban change."], "keyLetter": "D", "keyText": "To reframe the issue around how effectively a city manages connected urban change.", "why": "Trích dẫn: “The most useful question is therefore not whether urbanisation is good or bad in itself, but whether a city can manage change in a way that keeps opportunities accessible.” → Đoạn cuối đặt lại vấn đề: thành phố quản lý thay đổi liên kết hiệu quả ra sao → D.", "distractors": ["B. sai: commuting đã được nêu ở đoạn 2, không phải lần đầu.", "C. sai: đoạn cuối nói “not whether urbanisation is good or bad in itself”.", "A. sai: bài không đưa số liệu dân số cụ thể nào."], "kb": "Đoạn cuối thường reframe/đúc kết lại vấn đề của cả bài.", "authored": false}, {"n": 62, "uid": "62", "part": "TNTHPT MIXED READING – GROWTH WITHOUT COORDINATION", "hd_fix": false, "prompt": "The word “accessible” is closest in meaning to ______.", "options": ["reasonably available or reachable to the people who need it", "expensive enough to limit demand among lower-income residents", "hidden from people who are unfamiliar with the urban system", "temporary because services may change as the population grows"], "keyLetter": "A", "keyText": "reasonably available or reachable to the people who need it", "why": "Trích dẫn: “…whether a city can manage change in a way that keeps opportunities accessible.” → “accessible” ở đây = cơ hội được giữ cho mọi người tiếp cận được → A (reasonably available or reachable).", "distractors": ["B. trái nghĩa: accessible là tiếp cận được, không phải đắt đỏ.", "C. trái nghĩa hoàn toàn: hidden ≠ accessible.", "D. không liên quan: temporary không phải nghĩa của accessible."], "kb": "accessible = có thể tiếp cận được (available/reachable).", "authored": false}, {"n": 63, "uid": "63", "part": "TNTHPT MIXED READING – GROWTH WITHOUT COORDINATION", "hd_fix": false, "prompt": "Which best describes the writer’s attitude?", "options": ["unconcerned with evidence when evaluating the consequences of planning", "balanced and analytical about both opportunities and management challenges", "strongly opposed to urban growth under nearly all economic conditions", "uncritically enthusiastic about every effect of urban development"], "keyLetter": "B", "keyText": "balanced and analytical about both opportunities and management challenges", "why": "Trích dẫn: “The most useful question is therefore not whether urbanisation is good or bad in itself…” → Tác giả không đứng hẳn một phe mà phân tích cả cơ hội lẫn thách thức quản lý → C (balanced and analytical).", "distractors": ["C. sai: bài không phản đối tăng trưởng — chỉ bàn cách quản lý.", "D. sai: bài nêu cả thách thức, không tung hô một chiều.", "A. ngược với bài: tác giả nhấn mạnh “based on evidence”."], "kb": "“not whether good or bad” → thái độ balanced/analytical.", "authored": false}, {"n": 64, "uid": "64", "part": "TNTHPT MIXED READING – GROWTH WITHOUT COORDINATION", "hd_fix": false, "prompt": "Best title?", "options": ["Why Expanding Cities Should Stop Creating New Jobs", "Why Rural Communities Avoid the Problems of Urban Growth", "Housing as the Only Important Issue in Urban Development", "Managing the Connections Behind Urban Growth"], "keyLetter": "D", "keyText": "Managing the Connections Behind Urban Growth", "why": "Trích dẫn: “This is why coordinated planning matters.” + “None of these systems operates independently.” → Nhan đề bao trùm: quản lý các mối liên kết đằng sau tăng trưởng đô thị → B.", "distractors": ["A. sai: bài không hề đề xuất dừng tạo việc làm.", "C. sai ở “only”: bài nói nhiều hệ thống liên kết, không chỉ housing.", "B. lạc đề: bài nói về urban growth, không phải rural communities."], "kb": "Title phải bao trùm ý chính, không chọn một chi tiết.", "authored": false}]} ,"p3":{"title":"PHẦN 3 — CỦNG CỐ","des const PASSAGES={"MIXED LANGUAGE-IN-CONTEXT CLOZE": "<p>Over the past twenty years, Riverside has changed from a small town into a rapidly expanding urban centre. Many young adults have moved there to (46) ______ better jobs, while new businesses have created additional employment. However, population growth has also placed pressure (47) ______ housing and transport. Rents have become (48) ______ expensive, and some families can no longer afford to live near the centre. The council has introduced several bus routes, (49) ______ has improved access to outer districts. Yet the faster the population grows, the (50) ______ difficult it becomes to provide services quickly enough. Planners therefore need reliable evidence before making decisions (51) ______ affect large numbers of residents.</p>", "PASSAGE COMPLETION": "<p>Urban growth can bring new jobs and better access to services. (52) ______. When housing supply does not keep pace with demand, rents may rise and lower-income residents may be pushed farther from employment centres. (53) ______. For this reason, successful urban planning requires coordination between housing, transport and public services rather than isolated solutions.</p>", "MIXED READING": "<p>Urbanisation is sometimes treated as a simple movement of people from rural to urban areas. In practice, however, the process is more complex because population growth changes the demand for housing, transport, schools, healthcare and public space at the same time.</p><p>A city may create thousands of jobs and still become less convenient for some residents if infrastructure does not expand at a similar pace. For example, new employment centres can attract workers faster than nearby housing is built. As rents rise, employees may move farther away, increasing commuting distances and adding pressure to transport networks. A policy that solves one problem can therefore create another if planners examine sectors separately.</p><p>This is why coordinated planning matters. Housing policy influences travel patterns; transport affects access to jobs; and the location of schools or hospitals can shape where families choose to live. None of these systems operates independently.</p><p>The most useful question is therefore not whether urbanisation is good or bad in itself, but whether a city can manage change in a way that keeps opportunities accessible. Growth becomes more sustainable when decisions are based on evidence and when planners consider how one part of the urban system affects the others.</p>"};

function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
