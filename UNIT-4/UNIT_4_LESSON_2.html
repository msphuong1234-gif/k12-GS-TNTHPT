RIEVAL", "hd_fix": false, "prompt": "Which expression means “đáp ứng nhu cầu ngày càng tăng về nhà ở giá phải chăng”?", "options": ["meet the growing demand for affordable housing", "deal with population growth", "put pressure on infrastructure", "seek employment"], "keyLetter": "A", "keyText": "meet the growing demand for affordable housing", "why": "meet the growing demand = đáp ứng nhu cầu ngày càng tăng; affordable housing = nhà ở giá phải chăng.", "distractors": ["D. seek employment = tìm kiếm việc làm — sai nghĩa.", "C. put pressure on infrastructure = gây áp lực lên hạ tầng (thiếu 'existing') — sai cụm.", "B. deal with population growth = xử lý tăng dân số (thiếu 'consequences') — sai cụm."], "kb": "meet the growing demand for affordable housing — thuộc cả cụm dài.", "authored": false}, {"n": 40, "uid": 40, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "The noun meaning “khả năng chi trả” is ______.", "options": ["affordability", "afford", "expansion", "affordable"], "keyLetter": "A", "keyText": "affordability", "why": "Danh từ của afford chỉ 'khả năng chi trả' là affordability.", "distractors": ["D. affordable là tính từ (giá phải chăng) — sai từ loại.", "B. afford là động từ — sai từ loại.", "C. expansion = sự mở rộng — sai nghĩa."], "kb": "afford (V) → affordable (adj) → affordability (N).", "authored": false}, {"n": 41, "uid": 41, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "The noun meaning “tình trạng thất nghiệp” is ______.", "options": ["employment", "unemployment", "unemployed", "employ"], "keyLetter": "B", "keyText": "unemployment", "why": "'tình trạng thất nghiệp' là danh từ → unemployment.", "distractors": ["A. employment = việc làm — ngược nghĩa.", "C. unemployed là tính từ — sai từ loại.", "D. employ là động từ — sai từ loại."], "kb": "un- + employment = unemployment (trạng thái thất nghiệp).", "authored": false}, {"n": 42, "uid": 42, "part": "PART : ["B. urban expansion = sự mở rộng đô thị — sai nghĩa.", "D. housing costs = chi phí nhà ở — sai nghĩa.", "C. unemployment rate = tỷ lệ thất nghiệp — sai nghĩa."], "kb": "access to jobs / essential services — thuộc cả cụm.", "authored": false}]},"p2":{"title":"PHẦN 2 — LUYỆN TẬP","desc":"54 câu: vocabulary, collocation, Present Perfect, double comparatives, cloze và reading (hiển thị 2 cột).","questions":[{"n": 1, "uid": 1, "part": "III. VOCABULARY – URBAN LIFE", "hd_fix": false, "prompt": "Many young adults cannot ______ a house in major cities because prices have risen sharply.", "options": ["afford", "affordable", "affording", "affordability"], "keyLetter": "A", "keyText": "afford", "why": "Sau động từ khuyết thiếu cannot dùng bare infinitive → afford ('không đủ khả năng mua nhà').", "distractors": ["B. affordable là tính từ — không đứng sau cannot.", "D. affordability là danh từ — không đứng sau cannot.", "C. affording là V-ing — không dùng sau modal."], "kb": "modal (can/cannot/must…) + V nguyên thể, không to, không -ing.", "authored": false}, {"n": 2, "uid": 2, "part": "III. VOCABULARY – URBAN LIFE", "hd_fix": false, "prompt": "Rapid population growth can create a serious ______ shortage.", "options": ["house", "housed", "household", "housing"], "keyLetter": "D", "keyText": "housing", "why": "housing là danh từ bổ nghĩa cho shortage → housing shortage = tình trạng thiếu nhà ở.", "distractors": ["A. house là danh từ đếm được — không tạo cụm 'house shortage'.", "B. housed là dạng V3/tính từ — sai từ loại.", "C. household = hộ gia đình — sai nghĩa."], "kb": "housing (N) + shortage = thiếu nhà ở.", "authored": false}, {"n": 3, "uid": 3, "part": "III. VOCABULARY – URBAN LIFE", "hd_fix": false, "prompt": "The city has ______ beyond its original boundaries.", "options": ["expandingly", "expansion", "expanded", "expansive"], "keyLetter": "C", "keyText": "expanded", "why": "has + V3 tạo Present Perfect diễn tả thay đổi kéo dài đến hiện tại → expanded.", "distractors": ["B. expansion là danh từ — sai sau has.", "D. expansive là tính từ — sai sau has.", "A. expandingly không phải từ tiếng Anh chuẩn."], "kb": "has/have + V3: thay đổi từ quá khứ kéo dài đến hiện tại.", "authored": false}, {"n": 4, "uid": 4, "part": "III. VOCABULARY – URBAN LIFE", "hd_fix": false, "prompt": "Many rural residents move to urban areas to ______ better employment opportunities.", "options": ["search to", "seek", "find for", "look after"], "keyLetter": "B", "keyText": "seek", "why": "seek + danh từ = tìm kiếm; 'seek better employment opportunities' là collocation chuẩn.", "distractors": ["A. 'search to' sai cấu trúc — search đi với for, không đi với to.", "D. look after = chăm sóc — sai nghĩa.", "C. 'find for' sai — find là ngoại động từ, không cần for."], "kb": "seek + N (seek opportunities) = tìm kiếm …", "authored": false}, {"n": 5, "uid": 5, "part": "III. VOCABULARY – URBAN LIFE", "hd_fix": false, "prompt": "A weak labour market may lead to higher ______.", "options": ["unemployed", "employ", "employmentless", "unemployment"], "keyLetter": "D", "keyText": "unemployment", "why": "Sau higher cần danh từ → unemployment (tình trạng thất nghiệp).", "distractors": ["A. unemployed là tính từ — sai từ loại.", "B. employ là động từ — sai từ loại.", "C. employmentless không phải từ tiếng Anh chuẩn."], "kb": "higher + unemployment (N) = thất nghiệp cao hơn.", "authored": false}, {"n": 6, "uid": 6, "part": "III. VOCABULARY – URBAN LIFE", "hd_fix": false, "prompt": "The government plans to increase the supply of ______ housing for lower-income families.", "options": ["affordably", "afford", "affordability", "affordable"], "keyLetter": "D", "keyText": "affordable", "why": "Trước danh từ housing cần tính từ → affordable (nhà ở giá phải chăng).", "distractors": ["B. afford là động từ — sai từ loại.", "A. affordably là trạng từ — sai từ loại.", "C. affordability là danh từ — sai từ loại."], "kb": "affordable (adj) + housing = nhà ở giá phải chăng.", "authored": false}, {"n": 7, "uid": 7, "part": "III. VOCABULARY – URBAN LIFE", "hd_fix": false, "prompt": "Urban ______ can put pressure on transport networks and public services.", "options": ["expansion", "expandedly", "expansive", "expand"], "keyLetter": "A", "keyText": "expansion", "why": "Sau tính từ urban cần danh từ → expansion (sự mở rộng đô thị).", "distractors": ["D. expand là động từ — sai từ loại.", "C. expansive là tính từ — sai từ loại.", "B. expandedly không phải từ tiếng Anh chuẩn."], "kb": "urban (adj) + expansion (N).", "authored": false}, {"n": 8, "uid": 8, "part": "III. VOCABULARY – URBAN LIFE", "hd_fix": false, "prompt": "Graduates often move to larger cities in ______ of specialised jobs.", "options": ["searched", "search", "seek", "seeking"], "keyLetter": "B", "keyText": "search", "why": "'in search of specialised jobs' là cụm cố định = để tìm kiếm việc làm chuyên môn.", "distractors": ["C. seek — cụm cố định là in search of, không có in seek of.", "D. seeking — sai dạng từ trong cụm cố định.", "A. searched — sai dạng từ trong cụm cố định."], "kb": "in search of + N = để tìm kiếm … (cụm cố định).", "authored": false}, {"n": 9, "uid": 9, "part": "IV. COLLOCATION & LEXICAL PRECISION", "hd_fix": false, "prompt": "Housing prices have ______ steadily over the last decade.", "options": ["arisen", "raised", "lifted", "risen"], "keyLetter": "D", "keyText": "risen", "why": "Chủ ngữ 'prices' tự tăng nên dùng nội động từ rise → have risen; raise là ngoại động từ cần tân ngữ.", "distractors": ["B. raised — raise cần tân ngữ (raise prices), không dùng nội động từ ở đây.", "A. arisen — arise = nảy sinh/xuất hiện, sai nghĩa với giá cả.", "C. lifted — không kết hợp tự nhiên với prices trong ngữ cảnh này."], "kb": "rise (nội động từ) ≠ raise (ngoại động từ, cần tân ngữ).", "authored": false}, {"n": 10, "uid": 10, "part": "IV. COLLOCATION & LEXICAL PRECISION", "hd_fix": false, "prompt": "Rapid urbanisation may ______ pressure on existing infrastructure.", "options": ["put", "take", "do", "make"], "keyLetter": "A", "keyText": "put", "why": "'put pressure on existing infrastructure' là collocation cố định = gây áp lực lên hạ tầng hiện có.", "distractors": ["D. make pressure — không phải collocation tiếng Anh.", "C. do pressure — không phải collocation tiếng Anh.", "B. take pressure — không phải collocation tiếng Anh."], "kb": "put pressure on + N = gây áp lực lên …", "authored": false}, {"n": 11, "uid": 11, "part": "IV. COLLOCATION & LEXICAL PRECISION", "hd_fix": false, "prompt": "The city needs to ______ the growing demand for affordable housing.", "options": ["catch", "take", "receive", "meet"], "keyLetter": "D", "keyText": "meet", "why": "'meet the growing demand for affordable housing' là collocation cố định = đáp ứng nhu cầu ngày càng tăng.", "distractors": ["A. catch the demand — không phải collocation.", "B. take the demand — không phải collocation.", "C. receive the demand — không phải collocation."], "kb": "meet + demand = đáp ứng nhu cầu.", "authored": false}, {"n": 12, "uid": 12, "part": "IV. COLLOCATION & LEXICAL PRECISION", "hd_fix": false, "prompt": "The unemployment ______ fell after several new companies opened factories nearby.", "options": ["figure", "level", "rate", "amount"], "keyLetter": "C", "keyText": "rate", "why": "\"unemployment rate\" là collocation chuẩn trong chương trình = tỷ lệ thất nghiệp.", "distractors": ["B. \"level\" — \"unemployment level\" thường dùng ở số nhiều (\"levels\"); \"rate\" mới là collocation chuẩn mực nhất ở đây.", "A. \"figure\" — thường dùng số nhiều (\"unemployment figures\" = số liệu); dạng số ít không tự nhiên.", "D. \"amount\" — sai: không có collocation \"unemployment amount\"."], "kb": "unemployment rate = tỷ lệ thất nghiệp (collocation cố định).", "authored": false}, {"n": 13, "uid": 13, "part": "IV. COLLOCATION & LEXICAL PRECISION", "hd_fix": false, "prompt": "Urban authorities must ______ with the consequences of rapid population growth.", "options": ["face", "solve", "cope", "avoid"], "keyLetter": "C", "keyText": "cope", "why": "\"cope with the consequences\" là collocation cố định = đối phó với hậu quả.", "distractors": ["A. \"face\" — sai: \"face\" đi trực tiếp với tân ngữ (\"face the consequences\"), không có \"with\".", "B. \"solve\" — sai: \"solve\" + tân ngữ trực tiếp (\"solve the problem\"), không có \"with\".", "D. \"avoid\" — sai: \"avoid\" + V-ing/danh từ (\"avoid the consequences\"), không có \"with\"."], "kb": "cope with + N: đối phó với …", "authored": false}, {"n": 15, "uid": 15, "part": "V. PRESENT PERFECT – CORE DECISION RULES", "hd_fix": false, "prompt": "This is the first time I ______ such a crowded underground station.", "options": ["have seen", "see", "had seen", "saw"], "keyLetter": "A", "keyText": "have seen", "why": "Cấu trúc cố định: This is the first time + S + have/has + V3 → have seen.", "distractors": ["D. saw — Past Simple không dùng sau 'this is the first time'.", "C. had seen — Past Perfect sai ngữ cảnh (không có mốc quá khứ trước đó).", "B. see — hiện tại đơn sai cấu trúc."], "kb": "This is the first/second time + S + have/has + V3.", "authored": false}, {"n": 16, "uid": 16, "part": "V. PRESENT PERFECT – CORE DECISION RULES", "hd_fix": false, "prompt": "The city ______ considerably since the new metro line opened.", "options": ["changed", "had changed", "has changed", "changes"], "keyLetter": "C", "keyText": "has changed", "why": "'since the new metro line opened' (since + mốc bắt đầu) → Present Perfect: has changed.", "distractors": ["A. changed — thiếu have, sai thì với since.", "B. had changed — Past Perfect sai (không có hành động quá khứ khác để so).", "D. changes — hiện tại đơn sai với since."], "kb": "since + mốc thời gian → Present Perfect.", "authored": false}, {"n": 17, "uid": 17, "part": "V. PRESENT PERFECT – CORE DECISION RULES", "hd_fix": false, "prompt": "This is the most expensive apartment we ______ in this district.", "options": ["had ever viewed", "ever viewed", "are ever viewing", "have ever viewed"], "keyLetter": "D", "keyText": "have ever viewed", "why": "Cấu trúc: the most + N + S + have/has ever + V3 → have ever viewed.", "distractors": ["B. ever viewed — thiếu have, sai cấu trúc.", "A. had ever viewed — Past Perfect sai ngữ cảnh.", "C. are ever viewing — sai thì và sai cấu trúc."], "kb": "the most/the best + N + S + have ever + V3.", "authored": false}, {"n": 19, "uid": 19, "part": "V. PRESENT PERFECT – CORE DECISION RULES", "hd_fix": false, "prompt": "It is the second time the council ______ the urban development plan.", "options": ["revised", "revises", "has revised", "had revised"], "keyLetter": "C", "keyText": "has revised", "why": "Cấu trúc cố định: It is the second time + S + has/have + V3 → has revised.", "distractors": ["A. revised — Past Simple sai sau 'it is the second time'.", "D. had revised — Past Perfect sai ngữ cảnh.", "B. revises — hiện tại đơn sai cấu trúc."], "kb": "It is the Nth time + S + has/have + V3.", "authored": false}, {"n": 20, "uid": 20, "part": "V. PRESENT PERFECT – CORE DECISION RULES", "hd_fix": false, "prompt": "The population has increased ______ 2020.", "options": ["during", "for", "since", "from"], "keyLetter": "C", "keyText": "since", "why": "since + mốc bắt đầu (năm 2020) = kể từ năm 2020.", "distractors": ["B. for + khoảng thời gian, không đi với năm cụ thể.", "A. during + danh từ chỉ giai đoạn, không phù hợp ở đây.", "D. from thường đi cặp với to, không đứng một mình."], "kb": "since + mốc (since 2020) ≠ for + khoảng thời gian.", "authored": false}, {"n": 21, "uid": 21, "part": "V. PRESENT PERFECT – CORE DECISION RULES", "hd_fix": false, "prompt": "The population has increased steadily ______ the last six years.", "options": ["at", "from", "for", "since"], "keyLetter": "C", "keyText": "for", "why": "for + khoảng thời gian (the last six years) = trong sáu năm qua.", "distractors": ["D. since + mốc thời gian, không đi với 'the last six years'.", "A. at + thời điểm cụ thể — sai.", "B. from cần đi với to — sai."], "kb": "for + khoảng thời gian (for six years / for the last six years).", "authored": false}, {"n": 22, "uid": 22, "part": "V. PRESENT PERFECT – CORE DECISION RULES", "hd_fix": false, "prompt": "This is the best public transport system I ______.", "options": ["ever use", "have ever used", "am ever using", "had ever use"], "keyLetter": "B", "keyText": "have ever used", "why": "Cấu trúc: the best + N + S + have ever + V3 → have ever used.", "distractors": ["A. ever use — thiếu have, sai cấu trúc.", "D. had ever use — sai thì và sai dạng (use phải là V3).", "C. am ever using — sai thì và sai cấu trúc."], "kb": "the best + N + S + have ever + V3.", "authored": false}, {"n": 23, "uid": 23, "part": "VI. PRESENT PERFECT vs PAST SIMPLE – TIME BOUNDARY", "hd_fix": false, "prompt": "The city ______ a new metro line in 2024.", "options": ["opens", "opened", "has opened", "has been opening"], "keyLetter": "B", "keyText": "opened", "why": "'in 2024' là mốc thời gian quá khứ đã kết thúc → Past Simple: opened.", "distractors": ["C. has opened — Present Perfect không đi với mốc quá khứ xác định như in 2024.", "D. has been opening — sai thì, sai nghĩa.", "A. opens — hiện tại đơn sai với mốc quá khứ."], "kb": "in + năm quá khứ (in 2024) → Past Simple.", "authored": false}, {"n": 24, "uid": 24, "part": "VI. PRESENT PERFECT vs PAST SIMPLE – TIME BOUNDARY", "hd_fix": false, "prompt": "The city ______ three new metro lines since 2024.", "options": ["open", "has opened", "opened", "had opened"], "keyLetter": "B", "keyText": "has opened", "why": "'since 2024' là khoảng thời gian kéo dài từ quá khứ đến hiện tại → Present Perfect: has opened.", "distractors": ["C. opened — Past Simple sai với since.", "D. had opened — Past Perfect sai ngữ cảnh.", "A. open — hiện tại đơn sai với since."], "kb": "since + mốc → Present Perfect (hành động kéo dài đến hiện tại).", "authored": false}, {"n": 25, "uid": 25, "part": "VI. PRESENT PERFECT vs PAST SIMPLE – TIME BOUNDARY", "hd_fix": false, "prompt": "Housing prices ______ by 12% last year.", "options": ["have been risen", "have risen", "rose", "rise"], "keyLetter": "C", "keyText": "rose", "why": "'last year' là thời gian quá khứ đã kết thúc → Past Simple: rose.", "distractors": ["B. have risen — Present Perfect sai với last year.", "A. have been risen — sai cấu trúc (risen không dùng bị động ở đây).", "D. rise — hiện tại đơn sai với last year."], "kb": "last year / yesterday / ago → Past Simple.", "authored": false}, {"n": 26, "uid": 26, "part": "VI. PRESENT PERFECT vs PAST SIMPLE – TIME BOUNDARY", "hd_fix": false, "prompt": "Housing costs ______ sharply over the past five years.", "options": ["have risen", "has increased", "have rising", "have rose"], "keyLetter": "A", "keyText": "have risen", "why": "Dấu hiệu \"over the past five years\" (khoảng thời gian kéo dài đến hiện tại) → Present Perfect (have + V3): have risen.", "distractors": ["B. \"has increased\" — sai hòa hợp chủ-vị: \"costs\" số nhiều → dùng \"have\".", "D. \"have rose\" — sai dạng phân từ: \"rose\" là quá khứ đơn, sau \"have\" cần \"risen\".", "C. \"have rising\" — sai: sau \"have\" không dùng V-ing."], "kb": "\"over the past + khoảng thời gian\" → Present Perfect (have + V3).", "authored": false}, {"n": 27, "uid": 27, "part": "VI. PRESENT PERFECT vs PAST SIMPLE – TIME BOUNDARY", "hd_fix": false, "prompt": "I ______ to this neighbourhood two years ago.", "options": ["had move", "have moved", "moved", "move"], "keyLetter": "C", "keyText": "moved", "why": "'two years ago' là mốc quá khứ → Past Simple: moved.", "distractors": ["B. have moved — Present Perfect sai với ago.", "D. move — hiện tại đơn sai với ago.", "A. had move — sai dạng (move phải là V3: had moved) và sai ngữ cảnh."], "kb": "… ago → Past Simple.", "authored": false}, {"n": 28, "uid": 28, "part": "VI. PRESENT PERFECT vs PAST SIMPLE – TIME BOUNDARY", "hd_fix": false, "prompt": "I ______ here for two years.", "options": ["had living", "have lived", "lived two years ago", "am live"], "keyLetter": "B", "keyText": "have lived", "why": "'for two years' là khoảng thời gian kéo dài đến hiện tại → Present Perfect: have lived.", "distractors": ["C. lived two years ago — thêm 'ago' làm sai nghĩa câu (câu gốc không có ago).", "D. am live — sai cấu trúc hoàn toàn.", "A. had living — sai dạng và sai thì."], "kb": "for + khoảng thời gian (kéo dài đến hiện tại) → Present Perfect.", "authored": false}, {"n": 29, "uid": 29, "part": "VIII. DOUBLE COMPARATIVES – CHANGE OVER TIME", "hd_fix": false, "prompt": "The city ______ a new metro line in 2024.", "options": ["opened", "introduces", "has launched", "will complete"], "keyLetter": "A", "keyText": "opened", "why": "Mốc thời gian \"in 2024\" đã kết thúc → Past Simple: opened.", "distractors": ["C. \"has launched\" — sai: Present Perfect không đi với mốc thời gian quá khứ đã kết thúc (\"in 2024\").", "D. \"will complete\" — sai thì: tương lai đơn với mốc thời gian đã qua.", "B. \"introduces\" — sai thì: hiện tại đơn với mốc quá khứ."], "kb": "Mốc thời gian quá khứ đã kết thúc (in 2024, yesterday, last year) → Past Simple.", "authored": false}, {"n": 30, "uid": 30, "part": "VIII. DOUBLE COMPARATIVES – CHANGE OVER TIME", "hd_fix": false, "prompt": "The ______ the population becomes, the ______ the demand for housing is.", "options": ["larger / greater", "more large / more great", "largest / greatest", "large / great"], "keyLetter": "A", "keyText": "larger / greater", "why": "Double comparative: The + so sánh hơn …, the + so sánh hơn … (càng … càng …) → larger / greater.", "distractors": ["D. large / great là dạng gốc — sai cấu trúc so sánh kép.", "C. largest / greatest là so sánh nhất — sai cấu trúc.", "B. more large / more great — large/great là tính từ ngắn, không dùng more."], "kb": "The + so sánh hơn …, the + so sánh hơn … = càng … càng …", "authored": false}, {"n": 31, "uid": 31, "part": "VIII. DOUBLE COMPARATIVES – CHANGE OVER TIME", "hd_fix": false, "prompt": "The more reliable public transport is, the ______ people may depend on private cars.", "options": ["fewer of", "little", "least", "less"], "keyLetter": "D", "keyText": "less", "why": "Vế sau của so sánh kép cần so sánh hơn: 'ít phụ thuộc hơn' = less (so sánh hơn của little).", "distractors": ["C. least là so sánh nhất — sai cấu trúc so sánh kép.", "A. fewer of — fewer đi với danh từ đếm được, không đi với of + mệnh đề.", "B. little là dạng gốc — sai, cần dạng so sánh hơn."], "kb": "little → less → least; so sánh kép dùng less.", "authored": false}, {"n": 32, "uid": 32, "part": "VIII. DOUBLE COMPARATIVES – CHANGE OVER TIME", "hd_fix": false, "prompt": "The ______ housing prices rise, the harder it becomes for low-income families to buy a home.", "options": ["much", "more", "many", "most"], "keyLetter": "B", "keyText": "more", "why": "Double comparative cần The + so sánh hơn ở cả hai vế → more (giá càng tăng).", "distractors": ["D. most là so sánh nhất — sai cấu trúc.", "A. much không phải dạng so sánh hơn.", "C. many đi với danh từ đếm được — 'prices rise' không cần many."], "kb": "The more …, the harder … = càng … càng …", "authored": false}, {"n": 33, "uid": 33, "part": "VIII. DOUBLE COMPARATIVES – CHANGE OVER TIME", "hd_fix": false, "prompt": "As the urban area expands, commuting distances may become ______.", "options": ["longest and longest", "longer and longer", "the longer", "more long and more long"], "keyLetter": "B", "keyText": "longer and longer", "why": "Diễn tả thay đổi liên tục: comparative + and + comparative → longer and longer (ngày càng dài hơn).", "distractors": ["D. more long and more long — long là tính từ ngắn, không dùng more.", "C. the longer — thiếu vế đối, sai mẫu câu.", "A. longest and longest — so sánh nhất không dùng trong mẫu 'ngày càng'."], "kb": "adj-er + and + adj-er / more and more + adj = ngày càng …", "authored": false}, {"n": 34, "uid": 34, "part": "IX. DOUBLE COMPARATIVES – MEANING & LOGIC", "hd_fix": false, "prompt": "“The more crowded the city becomes, the more difficult commuting may be.” This means ______.", "options": ["As city crowding increases, commuting may become much easier.", "As city crowding increases, commuting may become more difficult.", "Changes in city crowding have no connection with commuting.", "Greater city crowding means that commuting must completely stop."], "keyLetter": "B", "keyText": "As city crowding increases, commuting may become more difficult.", "why": "'The more crowded …, the more difficult …' = mức độ đông đúc tăng thì việc đi lại có thể khó hơn — chỉ A giữ đúng quan hệ này.", "distractors": ["A. 'much easier' — ngược nghĩa với câu gốc.", "C. 'no connection' — phủ nhận quan hệ mà câu gốc khẳng định.", "D. 'must completely stop' — tuyệt đối hóa, câu gốc chỉ nói 'may be'."], "kb": "Đọc so sánh kép: xác định chiều quan hệ (cùng tăng hay ngược chiều).", "authored": false}, {"n": 35, "uid": 35, "part": "IX. DOUBLE COMPARATIVES – MEANING & LOGIC", "hd_fix": false, "prompt": "Which sentence correctly uses the structure for continuous change?", "options": ["Urban housing is becoming the more and more expensive.", "Urban housing is becoming the most and most expensive.", "Urban housing is becoming more expensive and more expensive.", "Urban housing is becoming more and more expensive."], "keyLetter": "D", "keyText": "Urban housing is becoming more and more expensive.", "why": "'more and more expensive' = ngày càng đắt; more and more + tính từ dài, không dùng 'the'.", "distractors": ["B. 'the most and most' — sai hoàn toàn về cấu trúc.", "A. 'the more and more' — thừa 'the'.", "C. 'more expensive and more expensive' — sai mẫu (đúng: more and more expensive)."], "kb": "more and more + adj/adv dài = ngày càng … (không có 'the').", "authored": false}, {"n": 36, "uid": 36, "part": "IX. DOUBLE COMPARATIVES – MEANING & LOGIC", "hd_fix": false, "prompt": "Which sentence expresses a relationship between TWO changing factors?", "options": ["The better the transport system is, the more attractive the area becomes.", "The transport system has become much better in recent years.", "The area is becoming more and more attractive over time.", "The transport system is becoming better and better over time."], "keyLetter": "A", "keyText": "The better the transport system is, the more attractive the area becomes.", "why": "Chỉ C có cấu trúc The + so sánh hơn …, the + so sánh hơn … nối hai yếu tố cùng thay đổi.", "distractors": ["C. chỉ có một yếu tố thay đổi (more and more attractive).", "D. chỉ có một yếu tố thay đổi (better and better).", "B. là câu Present Perfect, không phải cấu trúc so sánh kép."], "kb": "So sánh kép = HAI yếu tố thay đổi liên hệ nhau.", "authored": false}, {"n": 37, "uid": 37, "part": "X. LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Blank (42)", "options": ["expandedly", "expansive", "expansion", "expand"], "keyLetter": "D", "keyText": "expand", "why": "Trích dẫn: 'As cities ______' — vị trí cần một động từ (các thành phố mở rộng) → expand.", "distractors": ["C. expansion là danh từ — sai từ loại.", "B. expansive là tính từ — sai từ loại.", "A. expandedly không phải từ tiếng Anh chuẩn."], "kb": "Sau chủ ngữ cần động từ: cities expand.", "authored": false}, {"n": 38, "uid": 38, "part": "X. LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Blank (43)", "options": ["the more", "most and most", "more expensive and", "more and more"], "keyLetter": "D", "keyText": "more and more", "why": "Trích dẫn: 'housing has become ______ expensive' — cần 'more and more' để tạo 'more and more expensive' (ngày càng đắt).", "distractors": ["A. the more — thiếu vế đối 'the …' thứ hai, sai cấu trúc.", "B. most and most — sai hoàn toàn về cấu trúc.", "C. 'more expensive and' — đảo sai thứ tự từ."], "kb": "become + more and more + adj = trở nên ngày càng …", "authored": false}, {"n": 39, "uid": 39, "part": "X. LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Blank (44)", "options": ["affordability", "affordable", "afford", "affording"], "keyLetter": "C", "keyText": "afford", "why": "Trích dẫn: 'they may be able to ______ larger homes' — sau 'be able to' cần động từ nguyên thể → afford (đủ khả năng chi trả).", "distractors": ["B. affordable là tính từ — sai sau be able to.", "A. affordability là danh từ — sai sau be able to.", "D. affording là V-ing — sai sau be able to."], "kb": "be able to + V nguyên thể: be able to afford.", "authored": false}, {"n": 40, "uid": 40, "part": "X. LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Blank (45)", "options": ["most", "muchest", "many", "more"], "keyLetter": "D", "keyText": "more", "why": "Trích dẫn: 'the ______ time they may spend travelling' — double comparative 'the more …, the …' → more (càng nhiều thời gian).", "distractors": ["A. most là so sánh nhất — sai cấu trúc so sánh kép.", "C. many đi với danh từ đếm được — time không đếm được.", "B. muchest không phải từ tiếng Anh chuẩn."], "kb": "the more + N không đếm được: the more time.", "authored": false}, {"n": 41, "uid": 41, "part": "X. LANGUAGE-IN-CONTEXT CLOZE", "hd_fix": false, "prompt": "Blank (46)", "options": ["despite", "although", "unless", "before"], "keyLetter": "D", "keyText": "before", "why": "Trích dẫn: 'expand infrastructure ______ population growth creates serious pressure' — cần 'before' (trước khi) diễn tả hành động phòng ngừa.", "distractors": ["B. although = mặc dù (nhượng bộ) — ngược logic câu.", "A. despite + cụm danh từ/V-ing, không đi với mệnh đề đầy đủ.", "C. unless = trừ khi (điều kiện) — ngược logic câu."], "kb": "before + mệnh đề = trước khi … (hành động phòng ngừa).", "authored": false}, {"n": 42, "uid": 42, "part": "XI. SENTENCE COMPLETION – GRAMMAR + MEANING", "hd_fix": false, "prompt": "This is the third time ______.", "options": ["the city has revised its housing plan", "the city revised its housing plan last year", "has the city revised its housing plan", "the city had revised its housing plan before"], "keyLetter": "A", "keyText": "the city has revised its housing plan", "why": "Cấu trúc cố định: This is the third time + S + has + V3 → the city has revised its housing plan.", "distractors": ["B. 'revised … last year' — Past Simple sai sau 'this is the third time'.", "D. 'had revised … before' — Past Perfect sai ngữ cảnh.", "C. 'has the city revised' — đảo ngữ sai (đây không phải câu hỏi)."], "kb": "This is the Nth time + S + has/have + V3.", "authored": false}, {"n": 43, "uid": 43, "part": "XI. SENTENCE COMPLETION – GRAMMAR + MEANING", "hd_fix": false, "prompt": "Housing has become more and more expensive, ______.", "options": ["which has made home ownership difficult for many young adults", "which has made young adults difficult to own homes", "that has made home ownership difficult for young adults", "which making home ownership difficult for young adults"], "keyLetter": "A", "keyText": "which has made home ownership difficult for many young adults", "why": "Sau dấu phẩy cần mệnh đề quan hệ không xác định: which + has made … nêu hệ quả của cả mệnh đề trước.", "distractors": ["C. that — không dùng 'that' sau dấu phẩy trong mệnh đề quan hệ.", "D. 'which making' — thiếu trợ động từ has, sai ngữ pháp.", "B. 'made young adults difficult' — sai nghĩa (không phải người trẻ 'khó')."], "kb": ", which + V = qua đó … (hệ quả của cả mệnh đề trước).", "authored": false}, {"n": 44, "uid": 44, "part": "XI. SENTENCE COMPLETION – GRAMMAR + MEANING", "hd_fix": false, "prompt": "The city has expanded rapidly since 2015, ______.", "options": ["put greater pressure on transport and public services", "putting greater pressure on transport and public services", "which putting greater pressure on transport and public services", "having pressure transport and public services to become greater"], "keyLetter": "B", "keyText": "putting greater pressure on transport and public services", "why": "Mệnh đề V-ing đầu câu phụ ('putting …') nêu kết quả của mệnh đề trước: qua đó gây áp lực lớn hơn.", "distractors": ["A. put — động từ nguyên thể không đứng đầu mệnh đề phụ.", "C. 'which putting' — thừa which và sai dạng động từ.", "D. 'having pressure transport …' — sai cấu trúc, vô nghĩa."], "kb": "V-ing đầu mệnh đề phụ = qua đó / bằng cách … (chỉ kết quả).", "authored": false}, {"n": 45, "uid": 45, "part": "XII. TNTHPT READING TRANSFER – THE AFFORDABILITY PARADOX", "hd_fix": false, "prompt": "What is the passage mainly about?", "options": ["Urban affordability involves housing, transport and access to opportunities.", "Growing cities become affordable by limiting the arrival of new residents.", "Public transport is the main factor determining urban affordability.", "Low-cost housing remains affordable regardless of its distance from jobs."], "keyLetter": "A", "keyText": "Urban affordability involves housing, transport and access to opportunities.", "why": "Trích dẫn: 'Urban affordability is therefore a systems problem.' — cả bài xoay quanh nhà ở + giao thông + tiếp cận cơ hội; chỉ C bao quát đủ ba yếu tố.", "distractors": ["B. bài không hề đề xuất hạn chế dân số đến thành phố.", "D. ngược ý đoạn 2–3: nhà rẻ ở xa chưa chắc đã thực sự phải chăng.", "C. transport chỉ là một trong các yếu tố, không phải 'the main factor'."], "kb": "Main idea = ý bao quát toàn bài, không phải chi tiết một đoạn.", "authored": false}, {"n": 46, "uid": 46, "part": "XII. TNTHPT READING TRANSFER – THE AFFORDABILITY PARADOX", "hd_fix": false, "prompt": "According to paragraph 1, what may happen when housing demand grows faster than supply?", "options": ["Lower-income households may earn more as property values increase.", "Employment centres may gradually move away from expensive neighbourhoods.", "Rents and property prices may rise as housing demand increases.", "Housing supply may automatically increase to meet growing demand."], "keyLetter": "C", "keyText": "Rents and property prices may rise as housing demand increases.", "why": "Trích dẫn: 'When demand for housing grows faster than supply, rents and property prices may rise.' — đáp án D diễn đạt lại đúng ý này.", "distractors": ["B. bài không nói employment centres di chuyển đi nơi khác.", "D. ngược ý bài: supply không tự tăng kịp demand.", "A. bài nói households bị đẩy ra xa, không nói thu nhập của họ tăng."], "kb": "Detail question: tìm đúng câu trong đoạn rồi đối chiếu từng option.", "authored": false}, {"n": 47, "uid": 47, "part": "XII. TNTHPT READING TRANSFER – THE AFFORDABILITY PARADOX", "hd_fix": false, "prompt": "The phrase “the same success” refers to ______.", "options": ["the households moving farther from central employment areas", "the cheaper housing available around the edge of cities", "the jobs, education and services that attract people to cities", "the rising housing prices found near employment centres"], "keyLetter": "C", "keyText": "the jobs, education and services that attract people to cities", "why": "Trích dẫn: 'Cities often attract people because they offer jobs, education and services. Yet the same success that draws people in…' — 'the same success' chính là jobs, education and services thu hút người đến.", "distractors": ["D. rising housing prices là hệ quả, không phải 'success' thu hút người.", "A. households moving farther là hệ quả, không phải 'success'.", "B. cheaper housing ở rìa thành phố là hệ quả, không phải 'success'."], "kb": "Reference question: 'the same N' = danh từ đã nêu ngay trước đó.", "authored": false}, {"n": 48, "uid": 48, "part": "XII. TNTHPT READING TRANSFER – THE AFFORDABILITY PARADOX", "hd_fix": false, "prompt": "What trade-off is described in paragraph 2?", "options": ["Moving away from employment centres may eliminate household expenses.", "Cheaper outer housing may involve higher commuting costs.", "Better public transport may make every nearby home more expensive.", "Central housing may cost more while greatly reducing all travel expenses."], "keyLetter": "B", "keyText": "Cheaper outer housing may involve higher commuting costs.", "why": "Trích dẫn: 'Moving outward may reduce housing costs, but it can create another expense: commuting.' — trade-off: nhà rẻ hơn ở xa ↔ chi phí đi lại.", "distractors": ["D. bài không nói mọi chi phí đi lại đều giảm mạnh.", "C. bài không nói transport tốt làm nhà gần đắt hơn.", "A. 'eliminate' tuyệt đối hóa — bài chỉ nói chi phí tăng thêm, không mất hẳn."], "kb": "Trade-off = đánh đổi: được cái này, mất cái kia (nhưng/may).", "authored": false}, {"n": 49, "uid": 49, "part": "XII. TNTHPT READING TRANSFER – THE AFFORDABILITY PARADOX", "hd_fix": false, "prompt": "The double comparative in paragraph 2 shows that ______.", "options": ["housing distance and transport importance change independently", "greater housing distance increases the importance of reliable transport", "greater housing distance reduces the importance of public transport", "reliable transport makes every distant neighbourhood more affordable"], "keyLetter": "B", "keyText": "greater housing distance increases the importance of reliable transport", "why": "Trích dẫn: 'The more distant affordable housing becomes, the more important reliable public transport is.' — nhà càng xa thì transport càng quan trọng.", "distractors": ["A. ngược ý: hai yếu tố liên hệ với nhau, không độc lập.", "C. ngược nghĩa: bài nói importance tăng, không giảm.", "D. 'every distant neighbourhood more affordable' — bài không khẳng định điều này."], "kb": "So sánh kép trong bài đọc: xác định đúng chiều quan hệ.", "authored": false}, {"n": 50, "uid": 50, "part": "XII. TNTHPT READING TRANSFER – THE AFFORDABILITY PARADOX", "hd_fix": false, "prompt": "What can be inferred from paragraph 3?", "options": ["Commuting time has little effect on the real cost of urban living.", "Purchase price alone provides the best measure of housing affordability.", "Essential services should move outward to reduce central housing prices.", "Low rent may not mean affordability when travel costs are high."], "keyLetter": "D", "keyText": "Low rent may not mean affordability when travel costs are high.", "why": "Trích dẫn: 'A home that appears inexpens const PASSAGES={"LANGUAGE-IN-CONTEXT CLOZE": "<p>Urban populations have grown rapidly in many parts of the world. As cities (42) ______, demand for housing, transport and public services also increases. In some places, housing has become (43) ______ expensive, making it difficult for lower-income families to remain near city centres. Many people have therefore moved to outer districts, where they may be able to (44) ______ larger homes. However, this can increase commuting distances. The farther people live from their workplaces, the (45) ______ time they may spend travelling each day. Urban planners therefore need to expand infrastructure (46) ______ population growth creates serious pressure on existing systems.</p>", "TNTHPT READING TRANSFER": "<p>Cities often attract people because they offer jobs, education and services. Yet the same success that draws people in can make urban life less affordable. When demand for housing grows faster than supply, rents and property prices may rise. This can push lower-income households farther from employment centres.\n \tMoving outward may reduce housing costs, but it can create another expense: commuting. A family that finds a cheaper home on the edge of a city may spend more time and money travelling to work or school. The more distant affordable housing becomes, the more important reliable public transport is.\n \tThis is why housing affordability cannot be measured by rent or purchase price alone. Policymakers increasingly consider the combined cost of housing and transport. A home that appears inexpensive may not be truly affordable if residents must spend a large share of their income and time reaching essential services.\n \tUrban affordability is therefore a systems problem. Increasing housing supply can help, but so can better transport, mixed-use neighbourhoods and access to jobs in different parts of a city. The aim is not simply to build more homes, but to make urban opportunities realistically accessible to a wider range of residents.</p>"};
