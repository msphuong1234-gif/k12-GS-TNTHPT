phải từ trong cụm của bài."], "kb": "lower density does not automatically remove urban pressures.", "authored": false}, {"n": 19, "uid": 19, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "a single project may address ______", "options": ["nothing", "only one part of a wider problem", "all travel", "the whole problem"], "keyLetter": "B", "keyText": "only one part of a wider problem", "why": "Trích dẫn: \"A single project may improve one part of the system while leaving another source of congestion unchanged.\" — Một dự án đơn lẻ chỉ giải quyết một phần của vấn đề rộng hơn.", "distractors": ["\"the whole problem\" trái bài (chỉ one part).", "\"nothing\" trái bài (may improve one part).", "\"all travel\" sai nghĩa, không liên quan."], "kb": "a single project may address only one part of a wider problem.", "authored": false}, {"n": 20, "uid": 20, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "urban policy should evaluate density as part of ______", "options": ["road width", "one number", "a wider system", "housing only"], "keyLetter": "C", "keyText": "a wider system", "why": "Trích dẫn: \"Urban policy should evaluate density as part of a wider system rather than as a single number.\" — Cụm đúng: as part of a wider system.", "distractors": ["\"one number\" trái chữ \"rather than as a single number\".", "\"road width\" — bài không nêu.", "\"housing only\" thu hẹp sai ý \"wider system\"."], "kb": "urban policy: evaluate density as part of a wider system.", "authored": false}]}};
const PASSAGES={"REFERENCE & LINKING": "<p>Ha Noi has expanded far beyond its former boundaries. More roads and housing have been built, and the public transport network has grown. These changes have improved access to many parts of the city. However, rapid population growth has also increased pressure on infrastructure. This has contributed to congestion and other urban challenges.</p>", "SENTENCE INSERTION – COHESION (đoạn 1)": "<p>[I] Ha Noi has expanded rapidly in both population and physical size. [II] New housing, roads and public transport have improved access to many areas. [III] Congestion and pressure on services remain serious in some districts. [IV] Planners therefore face the challenge of coordinating future growth more effectively.</p>", "SENTENCE INSERTION – COHESION (đoạn 2)": "<p>[I] Housing farther from a city centre is sometimes cheaper. [II] Employment and major services, however, may remain concentrated in central areas. [III] Reliable public transport can reduce this disadvantage. [IV] This is why housing and transport should be planned together.</p>", "TNTHPT READING 1": "<p>As major cities expand, urban growth increasingly takes place beyond traditional city centres. New residential areas may appear on former agricultural land, and transport links are extended to connect them with jobs, schools and services. This process can provide more housing, but it can also reshape travel patterns across an entire metropolitan area.</p><p>The effects depend partly on how development is organised. If homes are built far from employment centres and reliable public transport is limited, residents may become more dependent on private vehicles. This can increase congestion even when new roads are constructed. By contrast, neighbourhoods that combine housing, services and public transport can reduce the need for some long journeys.</p><p>Another issue is timing. Housing may be completed more quickly than schools, healthcare facilities or transport networks. [I] New residents then arrive before the supporting infrastructure is fully ready. [II] This gap can create pressure on existing services in nearby districts. [III] Building infrastructure in advance can be expensive, however, especially when future population growth is uncertain. [IV]</p><p>Urban expansion is therefore not simply a question of finding land for more buildings. It requires decisions about location, transport, public services and the sequence in which development occurs. The quality of these connections often determines whether expansion improves urban life or merely moves existing problems to a different place.</p>", "TNTHPT READING 2": "<p>Urban density is often discussed as if it were either entirely beneficial or entirely harmful. In reality, its effects depend on design and management. Higher density can place more people close to jobs, shops and public transport, potentially reducing the distance they need to travel. It can also make public services more efficient because infrastructure serves more users within a smaller area.</p><p>Density, however, can create pressure when housing, open space and transport do not keep pace with population. Crowded roads, limited public areas and high housing costs may reduce quality of life. These outcomes are sometimes blamed on density itself, although poor planning may be an equally important factor.</p><p>This distinction matters because reducing density does not automatically remove urban problems. If people are spread across a much larger area, governments may need to provide roads, utilities and services over greater distances. Residents may also travel farther to work or school. In such cases, lower density can exchange one set of pressures for another.</p><p>The more useful question, therefore, is not whether density is good or bad, but what conditions allow it to function well. Access to public transport, sufficient housing, usable public spaces and well-planned services can make dense neighbourhoods more liveable. Urban policy should evaluate density as part of a wider system rather than as a single number.</p>", "HOMEWORK": "<p>A city may invest heavily in transport without immediately reducing congestion. One reason is that improved roads can make driving more attractive, encouraging some people to use cars more often or to travel at busier times. Population and economic activity may also continue to grow, adding new journeys to the network.</p><p>This does not mean transport investment is useless. Rather, it suggests that planners should evaluate how different measures interact. Reliable public transport, safe walking routes, land-use planning and road management can influence travel choices together. A single project may improve one part of the system while leaving another source of congestion unchanged.</p><p>For this reason, urban transport policy is increasingly concerned with accessibility rather than movement alone. The aim is not simply to help vehicles travel faster, but to help people reach jobs, education and services efficiently. A shorter journey is useful, but reducing the need for a long journey can be equally valuable.</p>"};

const startEpoch=Date.now();
const letters=['A','B','C','D'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
