 to ______.", "options": ["the level of crowding continues to increase", "possibly", "transform", "lower density does not necessarily remove urban pressures"], "keyLetter": "A", "keyText": "the level of crowding continues to increase", "why": "\"more and more crowded\" tương đương \"the level of crowding continues to increase\": cấu trúc \"more and more + adj\" diễn tả mức độ tăng dần liên tục.", "distractors": ["\"transform\" là nghĩa của \"reshape\".", "\"possibly\" là nghĩa của \"potentially\".", "\"lower density does not necessarily remove urban pressures\" là một ý khác trong bài."], "kb": "more and more crowded = ngày càng đông đúc.", "authored": false}, {"n": 45, "uid": 45, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“cause concern among residents” is closest in meaning to ______.", "options": ["possibly", "replace one set of problems with another", "make people living in the city worried", "the effects of urban density vary according to planning and supporting systems"], "keyLetter": "C", "keyText": "make people living in the city worried", "why": "\"cause concern among residents\" tương đương \"make people living in the city worried\": cause concern = make worried; residents = people living in the city.", "distractors": ["\"possibly\" là nghĩa của \"potentially\".", "\"replace one set of problems with another\" là nghĩa của \"exchange one set of pressures for another\".", "\"the effects of urban density vary according to planning and supporting systems\" là một ý khác trong bài."], "kb": "cause concern among residents = làm cư dân lo ngại.", "authored": false}, {"n": 46, "uid": 46, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“reshape” is closest in meaning to ______.", "options": ["transform", "one project may solve only part of a broader problem", "lower density does not necessarily remove urban pressures", "replace one set of problems with another"], "keyLetter": "A", "keyText": "transform", "why": "\"reshape\" tương đương \"transform\" (định hình lại, biến đổi).", "distractors": ["\"replace one set of problems with another\" là nghĩa của \"exchange one set of pressures for another\".", "\"lower density does not necessarily remove urban pressures\" là một ý khác trong bài.", "\"one project may solve only part of a broader problem\" là một ý khác trong bài."], "kb": "reshape = transform (định hình lại).", "authored": false}, {"n": 47, "uid": 47, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“potentially” is closest in meaning to ______.", "options": ["lower density does not necessarily remove urban pressures", "enabling people to reach important destinations efficiently", "the effects of urban density vary according to planning and supporting systems", "possibly"], "keyLetter": "D", "keyText": "possibly", "why": "\"potentially\" tương đương \"possibly\" (một cách tiềm tàng, có khả năng).", "distractors": ["\"lower density does not necessarily remove urban pressures\" là một ý khác trong bài.", "\"the effects of urban density vary according to planning and supporting systems\" là một ý khác trong bài.", "\"enabling people to reach important destinations efficiently\" là nghĩa của \"accessibility\"."], "kb": "potentially = possibly (có khả năng).", "authored": false}, {"n": 48, "uid": 48, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“exchange one set of pressures for another” is closest in meaning to ______.", "options": ["replace one set of problems with another", "one project may solve only part of a broader problem", "slowly grown", "the effects of urban density vary according to planning and supporting systems"], "keyLetter": "A", "keyText": "replace one set of problems with another", "why": "\"exchange one set of pressures for another\" tương đương \"replace one set of problems with another\": exchange A for B = thay A bằng B.", "distractors": ["\"the effects of urban density vary according to planning and supporting systems\" là một ý khác trong bài.", "\"one project may solve only part of a broader problem\" là một ý khác trong bài.", "\"slowly grown\" là nghĩa của \"gradually expanded\"."], "kb": "exchange A for B = đánh đổi A lấy B.", "authored": false}, {"n": 49, "uid": 49, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“lower density does not automatically reduce urban pressures” is closest in meaning to ______.", "options": ["enabling people to reach important destinations efficiently", "the level of crowding continues to increase", "one project may solve only part of a broader problem", "lower density does not necessarily remove urban pressures"], "keyLetter": "D", "keyText": "lower density does not necessarily remove urban pressures", "why": "Hai câu tương đương: automatically ≈ necessarily trong ngữ cảnh phủ định; reduce ≈ remove — cùng phủ nhận việc giảm mật độ tự động xóa áp lực đô thị.", "distractors": ["\"one project may solve only part of a broader problem\" là một ý khác trong bài.", "\"enabling people to reach important destinations efficiently\" là nghĩa của \"accessibility\".", "\"the level of crowding continues to increase\" là nghĩa của \"more and more crowded\"."], "kb": "lower density ≠ giải pháp tự động (automatically/necessarily).", "authored": false}, {"n": 50, "uid": 50, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“urban density works differently depending on planning and supporting systems” is closest in meaning to ______.", "options": ["make people living in the city worried", "slowly grown", "the effects of urban density vary according to planning and supporting systems", "enabling people to reach important destinations efficiently"], "keyLetter": "C", "keyText": "the effects of urban density vary according to planning and supporting systems", "why": "Hai câu tương đương: works differently depending on = the effects... vary according to; planning and supporting systems giữ nguyên.", "distractors": ["\"enabling people to reach important destinations efficiently\" là nghĩa của \"accessibility\".", "\"slowly grown\" là nghĩa của \"gradually expanded\".", "\"make people living in the city worried\" là nghĩa của \"cause concern among residents\"."], "kb": "density effects depend on planning & supporting systems.", "authored": false}, {"n": 51, "uid": 51, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“a single project may address only one part of a wider problem” is closest in meaning to ______.", "options": ["slowly grown", "the level of crowding continues to increase", "one project may solve only part of a broader problem", "transform"], "keyLetter": "C", "keyText": "one project may solve only part of a broader problem", "why": "Hai câu tương đương: a single = one; address = solve; only one part of a wider = only part of a broader.", "distractors": ["\"slowly grown\" là nghĩa của \"gradually expanded\".", "\"the level of crowding continues to increase\" là nghĩa của \"more and more crowded\".", "\"transform\" là nghĩa của \"reshape\"."], "kb": "a single project ≠ whole solution (chỉ một phần).", "authored": false}, {"n": 52, "uid": 52, "part": "PART 4 – CHỌN PARAPHRASE ĐÚNG", "hd_fix": false, "prompt": "“accessibility” is closest in meaning to ______.", "options": ["enabling people to reach important destinations efficiently", "possibly", "the level of crowding continues to increase", "make people living in the city worried"], "keyLetter": "A", "keyText": "enabling people to reach important destinations efficiently", "why": "\"accessibility\" tương đương \"enabling people to reach important destinations efficiently\" (giúp người dân tới các điểm đến quan trọng một cách hiệu quả).", "distractors": ["\"the level of crowding continues to increase\" là nghĩa của \"more and more crowded\".", "\"make people living in the city worried\" là nghĩa của \"cause concern among residents\".", "\"possibly\" là nghĩa của \"potentially\"."], "kb": "accessibility = khả năng tiếp cận (tới nơi cần đến).", "authored": false}, {"n": 53, "uid": 53, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which expression means “phối hợp quy hoạch nhà ở và cơ sở hạ tầng”?", "options": ["coordinate housing and infrastructure", "modernise public transport", "raise growing concern", "depend on private vehicles"], "keyLetter": "A", "keyText": "coordinate housing and infrastructure", "why": "Cụm tiếng Anh của \"phối hợp quy hoạch nhà ở và cơ sở hạ tầng\" là \"coordinate housing and infrastructure\".", "distractors": ["\"modernise public transport\" nghĩa là \"hiện đại hóa giao thông công cộng\".", "\"depend on private vehicles\" nghĩa là \"phụ thuộc vào phương tiện cá nhân\".", "\"raise growing concern\" nghĩa là \"gây ra mối lo ngại ngày càng tăng\"."], "kb": "coordinate housing and infrastructure = phối hợp quy hoạch nhà ở và cơ sở hạ tầng.", "authored": false}, {"n": 54, "uid": 54, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which expression means “bao hàm sự không chắc chắn và những đánh đổi”?", "options": ["housing shortage", "involve uncertainty and trade-offs", "keep pace with population", "supporting infrastructure"], "keyLetter": "B", "keyText": "involve uncertainty and trade-offs", "why": "Cụm tiếng Anh của \"bao hàm sự không chắc chắn và những đánh đổi\" là \"involve uncertainty and trade-offs\".", "distractors": ["\"keep pace with population\" nghĩa là \"theo kịp dân số\".", "\"supporting infrastructure\" nghĩa là \"cơ sở hạ tầng hỗ trợ\".", "\"housing shortage\" nghĩa là \"tình trạng thiếu nhà ở\"."], "kb": "involve uncertainty and trade-offs = bao hàm sự không chắc chắn và những đánh đổi.", "authored": false}, {"n": 55, "uid": 55, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "The adjective meaning “thuộc kiến trúc” is ______.", "options": ["colonial", "architectural", "architect", "architecture"], "keyLetter": "B", "keyText": "architectural", "why": "Tính từ mang nghĩa \"thuộc kiến trúc\" là \"architectural\" (architecture → architectural).", "distractors": ["\"architecture\" là danh từ (kiến trúc), không phải tính từ.", "\"architect\" là danh từ chỉ người (kiến trúc sư).", "\"colonial\" là tính từ nhưng nghĩa là \"thuộc địa\"."], "kb": "architectural (adj) = thuộc kiến trúc.", "authored": false}, {"n": 56, "uid": 56, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "The noun meaning “sự hiện đại hóa” is ______.", "options": ["modernise", "gradually", "modernisation", "modern"], "keyLetter": "C", "keyText": "modernisation", "why": "Danh từ mang nghĩa \"sự hiện đại hóa\" là \"modernisation\" (modernise → modernisation).", "distractors": ["\"modernise\" là động từ (hiện đại hóa).", "\"modern\" là tính từ (hiện đại).", "\"gradually\" là trạng từ (dần dần)."], "kb": "modernisation (n) = sự hiện đại hóa.", "authored": false}, {"n": 57, "uid": 57, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "“reshape” is closest in meaning to ______.", "options": ["transform", "possibly", "slowly grow", "cause concern"], "keyLetter": "A", "keyText": "transform", "why": "\"reshape\" tương đương \"transform\" (định hình lại).", "distractors": ["\"possibly\" là nghĩa của \"potentially\".", "\"slowly grow\" là nghĩa của \"gradually expand\".", "\"cause concern\" nghĩa là \"gây lo ngại\", không liên quan tới reshape."], "kb": "reshape = transform.", "authored": false}, {"n": 58, "uid": 58, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "“accessibility” is closest in meaning to ______.", "options": ["replacing all private vehicles", "increasing housing pressure", "lowering urban density automatically", "enabling people to reach important destinations efficiently"], "keyLetter": "D", "keyText": "enabling people to reach important destinations efficiently", "why": "\"accessibility\" tương đương \"enabling people to reach important destinations efficiently\" (khả năng tiếp cận = tới được nơi cần đến hiệu quả).", "distractors": ["\"lowering urban density automatically\" sai nghĩa (giảm mật độ không phải là tiếp cận).", "\"replacing all private vehicles\" sai nghĩa và tuyệt đối hóa bằng \"all\".", "\"increasing housing pressure\" sai nghĩa, gần như trái nghĩa."], "kb": "accessibility = khả năng tiếp cận (tới nơi cần đến hiệu quả).", "authored": false}, {"n": 59, "uid": 59, "part": "PART 5 – CONTEXTUAL USE / COLLOCATION / MIXED RETRIEVAL", "hd_fix": false, "prompt": "Which source idea is correct?", "options": ["Lower density automatically removes all urban pressure.", "Supporting systems do not affect urban density outcomes.", "A single project may address only one part of a wider problem.", "One project always solves the whole urban problem."], "keyLetter": "C", "keyText": "A single project may address only one part of a wider problem.", "why": "Ý đúng từ bài đọc: một dự án đơn lẻ chỉ giải quyết được một phần của vấn đề rộng hơn (\"A single project may improve one part of the system while leaving another source of congestion unchanged\").", "distractors": ["\"One project always solves the whole urban problem.\" sai vì \"always\" tuyệt đối hóa, trái với bài.", "\"Lower density automatically removes all urban pressure.\" sai vì \"automatically/all\" tuyệt đối hóa, trái với bài.", "\"Supporting systems do not affect urban density outcomes.\" sai vì phủ nhận vai trò của hệ thống hỗ trợ mà bài khẳng định."], "kb": "Ý đúng: single project = one part only; tránh \"always/all\".", "authored": false}]},"p2":{"title":"PHẦN 2 — LUYỆN TẬP","desc":"58 câu: SGK vocab, content check, paraphrase, reference & linking, sentence insertion, 2 bài TNTHPT reading, homework reading","questions":[{"n": 1, "uid": 1, "part": "II. SGK CORE VOCABULARY – MEANING IN CONTEXT", "hd_fix": false, "prompt": "Local ______ have expressed concern about rising traffic congestion.", "options": ["residential", "residing", "residents", "residences"], "keyLetter": "C", "keyText": "residents", "why": "Chủ ngữ của \"have expressed\" cần danh từ số nhiều chỉ người → residents (cư dân).", "distractors": ["\"residences\" là danh từ chỉ nơi ở (tòa nhà), sai nghĩa.", "\"residential\" là tính từ, không thể làm chủ ngữ.", "\"residing\" là dạng V-ing, sai từ loại ở vị trí chủ ngữ."], "kb": "residents (n) = cư dân; N(số nhiều) + V.", "authored": false}, {"n": 2, "uid": 2, "part": "II. SGK CORE VOCABULARY – MEANING IN CONTEXT", "hd_fix": false, "prompt": "Some streets still contain buildings from the ______ period.", "options": ["colony", "colonial", "colonially", "colonise"], "keyLetter": "B", "keyText": "colonial", "why": "Bổ nghĩa cho danh từ \"period\" cần tính từ → colonial (thuộc địa).", "distractors": ["\"colony\" là danh từ, không bổ nghĩa trực tiếp cho danh từ khác.", "\"colonise\" là động từ, sai từ loại.", "\"colonially\" là trạng từ, sai vị trí."], "kb": "colonial period = thời kỳ thuộc địa (adj + N).", "authored": false}, {"n": 3, "uid": 3, "part": "II. SGK CORE VOCABULARY – MEANING IN CONTEXT", "hd_fix": false, "prompt": "The city expanded ______ rather than changing overnight.", "options": ["gradualness", "gradually", "gradual", "more gradual"], "keyLetter": "B", "keyText": "gradually", "why": "Bổ nghĩa cho động từ \"expanded\" cần trạng từ → gradually; \"rather than changing overnight\" củng cố nghĩa \"dần dần, không qua một đêm\".", "distractors": ["\"gradual\" là tính từ, không bổ nghĩa được cho động từ.", "\"gradualness\" là danh từ, sai vị trí.", "\"more gradual\" là cụm tính từ so sánh, sai từ loại."], "kb": "expand gradually = mở rộng dần dần (V + adv).", "authored": false}, {"n": 4, "uid": 4, "part": "II. SGK CORE VOCABULARY – MEANING IN CONTEXT", "hd_fix": false, "prompt": "The authority is ______ its public transport system by adding cleaner buses.", "options": ["modernity", "modernisedly", "modern", "modernising"], "keyLetter": "D", "keyText": "modernising", "why": "Cấu trúc hiện tại tiếp diễn \"is + V-ing\" → modernising (đang hiện đại hóa).", "distractors": ["\"modern\" là tính từ, sai sau \"is\" ở đây.", "\"modernity\" là danh từ, sai cấu trúc tiếp diễn.", "\"modernisedly\" không phải từ tiếng Anh."], "kb": "be + V-ing: is modernising = đang hiện đại hóa.", "authored": false}, {"n": 5, "uid": 5, "part": "II. SGK CORE VOCABULARY – MEANING IN CONTEXT", "hd_fix": false, "prompt": "Air pollution has become a growing ______ among people living in large cities.", "options": ["concerningly", "concern", "concernment", "concerned"], "keyLetter": "B", "keyText": "concern", "why": "Sau tính từ \"growing\" cần danh từ → concern (mối lo ngại); \"a growing concern among people\" (một mối lo ngại ngày càng tăng).", "distractors": ["\"concerned\" là tính từ, sai vị trí cần danh từ.", "\"concerningly\" là trạng từ, sai vị trí.", "\"concernment\" không phải từ tiếng Anh."], "kb": "a growing concern = một mối lo ngại ngày càng tăng.", "authored": false}, {"n": 6, "uid": 6, "part": "II. SGK CORE VOCABULARY – MEANING IN CONTEXT", "hd_fix": false, "prompt": "The old quarter is known for its distinctive ______ and narrow streets.", "options": ["architecturally", "architect", "architecture", "architectural"], "keyLetter": "C", "keyText": "architecture", "why": "Sau tính từ \"distinctive\" cần danh từ → architecture (kiến trúc).", "distractors": ["\"architect\" là danh từ chỉ người (kiến trúc sư), sai nghĩa.", "\"architectural\" là tính từ, không đứng sau một tính từ khác.", "\"architecturally\" là trạng từ, sai vị trí."], "kb": "distinctive architecture = kiến trúc đặc sắc (adj + N).", "authored": false}, {"n": 7, "uid": 7, "part": "II. SGK CORE VOCABULARY – MEANING IN CONTEXT", "hd_fix": false, "prompt": "Urban development can improve living standards, but it may also create new ______.", "options": ["challenged", "challenging", "challenges", "challengeable"], "keyLetter": "C", "keyText": "challenges", "why": "Sau \"new\" và động từ \"create\" cần danh từ số nhiều → challenges (những thách thức).", "distractors": ["\"challenging\" là tính từ/dạng V-ing, sai từ loại.", "\"challengeable\" sai từ loại và sai nghĩa.", "\"challenged\" là dạng quá khứ/phân từ, sai từ loại."], "kb": "create new challenges = tạo ra những thách thức mới.", "authored": false}, {"n": 8, "uid": 8, "part": "II. SGK CORE VOCABULARY – MEANING IN CONTEXT", "hd_fix": false, "prompt": "The city needs to improve its transport ______ as the population grows.", "options": ["construction only", "infrastructure", "structure of transportations", "architect"], "keyLetter": "B", "keyText": "infrastructure", "why": "Cụm cố định \"transport infrastructure\" (cơ sở hạ tầng giao thông).", "distractors": ["\"structure of transportations\" sai diễn đạt (transportation không đếm được, không thêm s).", "\"construction only\" (chỉ xây dựng) sai nghĩa trong ngữ cảnh.", "\"architect\" (kiến trúc sư) sai nghĩa trong ngữ cảnh."], "kb": "transport infrastructure = cơ sở hạ tầng giao thông.", "authored": false}, {"n": 9, "uid": 9, "part": "IV. SGK-CONTENT CHECK – EVIDENCE FIRST", "hd_fix": false, "prompt": "In 1954, Ha Noi had a population of approximately ______.", "options": ["3 million", "530,000", "8 million", "152 million"], "keyLetter": "B", "keyText": "530,000", "why": "Theo bài đọc SGK về Hà Nội, năm 1954 thành phố có khoảng 530.000 dân.", "distractors": ["\"3 million\" nhầm với con số 3.000 km² (diện tích), sai đơn vị.", "\"8 million\" là dân số hiện nay, không phải năm 1954.", "\"152 million\" sai hoàn toàn — 152 là km² (diện tích thành phố cũ)."], "kb": "1954: ~530,000 people (SGK).", "authored": false}, {"n": 10, "uid": 10, "part": "IV. SGK-CONTENT CHECK – EVIDENCE FIRST", "hd_fix": false, "prompt": "The old city covered an area of about ______.", "options": ["530 square kilometres", "8,000 square kilometres", "152 square kilometres", "3,000 square kilometres"], "keyLetter": "C", "keyText": "152 square kilometres", "why": "Theo bài đọc SGK, thành phố cũ rộng khoảng 152 km².", "distractors": ["\"3,000 square kilometres\" là diện tích đô thị hiện nay.", "\"530 square kilometres\" nhầm với 530.000 dân (dân số 1954).", "\"8,000 square kilometres\" nhầm với 8 triệu dân (dân số hiện nay)."], "kb": "Old city: ~152 km² (SGK).", "authored": false}, {"n": 11, "uid": 11, "part": "IV. SGK-CONTENT CHECK – EVIDENCE FIRST", "hd_fix": false, "prompt": "In the past, most residents travelled mainly ______.", "options": ["on foot or by bicycle", "by underground train", "by electric bus", "by private car"], "keyLetter": "A", "keyText": "on foot or by bicycle", "why": "Theo bài đọc SGK, xưa kia người dân chủ yếu đi bộ hoặc đi xe đạp.", "distractors": ["\"by private car\" là phương tiện phổ biến hiện nay, không phải xưa kia.", "\"by electric bus\" không được nêu trong bài.", "\"by underground train\" không được nêu trong bài."], "kb": "Past transport: on foot or by bicycle (SGK).", "authored": false}, {"n": 12, "uid": 12, "part": "IV. SGK-CONTENT CHECK – EVIDENCE FIRST", "hd_fix": false, "prompt": "The old city had mainly ______ buildings.", "options": ["low-rise", "industrial", "temporary", "high-rise"], "keyLetter": "A", "keyText": "low-rise", "why": "Theo bài đọc SGK, thành phố cũ chủ yếu gồm nhà thấp tầng.", "distractors": ["\"high-rise\" là đặc điểm của đô thị hiện nay, không phải xưa kia.", "\"industrial\" không được nêu trong bài.", "\"temporary\" không được nêu trong bài."], "kb": "Old city: mainly low-rise buildings (SGK).", "authored": false}, {"n": 13, "uid": 13, "part": "IV. SGK-CONTENT CHECK – EVIDENCE FIRST", "hd_fix": false, "prompt": "Today, Ha Noi has a population of ______.", "options": ["over 8 million", "about 530,000", "exactly 3 million", "under 1 million"], "keyLetter": "A", "keyText": "over 8 million", "why": "Theo bài đọc SGK, hiện nay Hà Nội có hơn 8 triệu dân.", "distractors": ["\"about 530,000\" là dân số năm 1954.", "\"under 1 million\" sai số liệu.", "\"exactly 3 million\" sai số liệu và tuyệt đối hóa bằng \"exactly\"."], "kb": "Today: over 8 million people (SGK).", "authored": false}, {"n": 14, "uid": 14, "part": "IV. SGK-CONTENT CHECK – EVIDENCE FIRST", "hd_fix": false, "prompt": "The urban area has expanded to ______.", "options": ["under 500 square kilometres", "over 3,000 square kilometres", "exactly 8 square kilometres", "about 152 square kilometres"], "keyLetter": "B", "keyText": "over 3,000 square kilometres", "why": "Theo bài đọc SGK, khu đô thị đã mở rộng tới hơn 3.000 km².", "distractors": ["\"about 152 square kilometres\" là diện tích thành phố cũ.", "\"under 500 square kilometres\" sai số liệu.", "\"exactly 8 square kilometres\" sai số liệu."], "kb": "Urban area: over 3,000 km² (SGK).", "authored": false}, {"n": 15, "uid": 15, "part": "IV. SGK-CONTENT CHECK – EVIDENCE FIRST", "hd_fix": false, "prompt": "Which current development is mentioned in the article?", "options": ["All low-rise buildings have disappeared.", "Bus services are being modernised with more electric ones.", "Traffic has become lighter.", "The old tram has become the main transport system again."], "keyLetter": "B", "keyText": "Bus services are being modernised with more electric ones.", "why": "Theo bài đọc SGK, xe buýt đang được hiện đại hóa với nhiều xe điện hơn.", "distractors": ["\"The old tram has become the main transport system again\" sai — tàu điện cũ không còn là phương tiện chính.", "\"All low-rise buildings have disappeared\" tuyệt đối hóa bằng \"All\", sai.", "\"Traffic has become lighter\" trái với thực tế tắc đường trong bài."], "kb": "Buses modernised with more electric ones (SGK).", "authored": false}, {"n": 16, "uid": 16, "part": "IV. SGK-CONTENT CHECK – EVIDENCE FIRST", "hd_fix": false, "prompt": "Which is identified as a present-day problem?", "options": ["lack of any roads", "absence of public transport", "declining population", "housing shortage"], "keyLetter": "D", "keyText": "housing shortage", "why": "Theo bài đọc SGK, thiếu nhà ở được nêu là vấn đề hiện nay.", "distractors": ["\"lack of any roads\" sai — đường sá đã được mở rộng.", "\"absence of public transport\" sai — giao thông công cộng đang được phát triển.", "\"declining population\" trái với bài — dân số đang tăng."], "kb": "Present-day problem: housing shortage (SGK).", "authored": false}, {"n": 17, "uid": 17, "part": "V. PAST → PRESENT PARAPHRASE CONTROL", "hd_fix": false, "prompt": "“The urban area has gradually expanded to over 3,000 sq km.” Best paraphrase:", "options": ["The urban area remained close to 3,000 square kilometres throughout.", "The urban area has slowly grown to more than 3,000 square kilometres.", "The urban area has gradually fallen below 3,000 square kilometres.", "The urban area suddenly reached exactly 3,000 square kilometres."], "keyLetter": "B", "keyText": "The urban area has slowly grown to more than 3,000 square kilometres.", "why": "Đáp án giữ nguyên nghĩa và phạm vi: gradually = slowly; expanded = grown; over = more than.", "distractors": ["\"suddenly reached exactly\" đổi \"gradually/over\" thành \"suddenly/exactly\", sai nghĩa.", "\"fallen below\" đảo ngược nghĩa (giảm xuống dưới thay vì tăng lên trên).", "\"remained close to... throughout\" đổi thành \"giữ nguyên\", sai nghĩa."], "kb": "Paraphrase giữ nguyên nghĩa + phạm vi (gradually→slowly, over→more than).", "authored": false}, {"n": 18, "uid": 18, "part": "V. PAST → PRESENT PARAPHRASE CONTROL", "hd_fix": false, "prompt": "“The city is getting more and more crowded.” This means ______.", "options": ["The level of crowding in the city has remained largely unchanged.", "The city became crowded at one particular time in the past.", "The city is gradually becoming less crowded than it was before.", "The level of crowding in the city is continuing to increase."], "keyLetter": "D", "keyText": "The level of crowding in the city is continuing to increase.", "why": "\"more and more + adj\" diễn tả mức độ tăng dần liên tục → \"the level of crowding... is continuing to increase\".", "distractors": ["\"became crowded at one particular time\" đổi thành một thời điểm quá khứ, sai thì và sai nghĩa tiếp diễn.", "\"has remained largely unchanged\" đảo nghĩa (không đổi thay vì tăng).", "\"becoming less crowded\" đảo nghĩa (giảm thay vì tăng)."], "kb": "more and more + adj = ngày càng (tiếp diễn tăng).", "authored": false}, {"n": 19, "uid": 19, "part": "V. PAST → PRESENT PARAPHRASE CONTROL", "hd_fix": false, "prompt": "“Air pollution is also causing concern among city residents.” Best paraphrase:", "options": ["City residents have already solved the problem of air pollution.", "City residents consider air pollution the only serious urban problem.", "City residents are becoming less concerned about air pollution.", "People living in the city are worried about air pollution."], "keyLetter": "D", "keyText": "People living in the city are worried about air pollution.", "why": "Paraphrase đúng: cause concern among = are worried about; city residents = people living in the city.", "distractors": ["\"have already solved\" đảo nghĩa (đã giải quyết thay vì đang lo ngại).", "\"the only serious urban problem\" thêm \"only\", tuyệt đối hóa sai.", "\"are becoming less concerned\" đảo nghĩa (bớt lo thay vì lo ngại)."], "kb": "cause concern among = are worried about.", "authored": false}, {"n": 20, "uid": 20, "part": "V. PAST → PRESENT PARAPHRASE CONTROL", "hd_fix": false, "prompt": "Which option DISTORTS the SGK statement that public transport is being expanded?", "options": ["Public transport services are being developed in more urban areas.", "The public transport network is becoming larger across the city.", "Public transport has completely replaced private vehicles in the city.", "The city is increasing the provision of public transport services."], "keyLetter": "C", "keyText": "Public transport has completely replaced private vehicles in the city.", "why": "Câu hỏi tìm đáp án BÓP MÉO: \"expanded\" (mở rộng) bị đổi thành \"completely replaced\" (thay thế hoàn toàn) — sai phạm vi.", "distractors": ["\"is becoming larger\" giữ đúng nghĩa của expanded.", "\"are being developed in more urban areas\" giữ đúng nghĩa của expanded.", "\"is increasing the provision of\" giữ đúng nghĩa của expanded."], "kb": "Distort = bóp méo phạm vi (expanded ≠ completely replaced).", "authored": false}, {"n": 21, "uid": 21, "part": "VI. REFERENCE & LINKING", "hd_fix": false, "prompt": "The phrase “These changes” refers to ______.", "options": ["the expansion of roads, housing and public transport", "the new urban challenges", "the city’s former boundaries", "the growth in population"], "keyLetter": "A", "keyText": "the expansion of roads, housing and public transport", "why": "Trích dẫn: \"More roads and housing have been built, and the public transport network has grown. These changes have improved access to many parts of the city.\" — \"These changes\" thay thế cho cả cụm hành động mở rộng ở câu trước: xây thêm đường và nhà ở, mạng lưới giao thông công cộng phát triển.", "distractors": ["\"the city's former boundaries\" là cụm ở câu đầu, không phải nội dung của \"changes\".", "\"the growth in population\" xuất hiện ở câu sau \"However\", không phải vật được thay thế.", "\"the new urban challenges\" là hệ quả ở cuối đoạn, không phải \"changes\"."], "kb": "These + N(số nhiều) thường thay thế cụm hành động ở câu trước.", "authored": false}, {"n": 22, "uid": 22, "part": "VI. REFERENCE & LINKING", "hd_fix": false, "prompt": "The word “This” refers to ______.", "options": ["increased pressure on infrastructure", "the growth of public transport", "the city’s former boundaries", "improved access across the city"], "keyLetter": "A", "keyText": "increased pressure on infrastructure", "why": "Trích dẫn: \"However, rapid population growth has also increased pressure on infrastructure. This has contributed to congestion and other urban challenges.\" — \"This\" thay thế cho mệnh đề ngay trước: áp lực gia tăng lên cơ sở hạ tầng (chính áp lực này góp phần gây tắc đường).", "distractors": ["\"improved access across the city\" là ý tích cực trước \"However\", không phải đối tượng của \"This\".", "\"the growth of public transport\" xuất hiện ở đầu đoạn, quá xa.", "\"the city's former boundaries\" ở câu đầu tiên, quá xa."], "kb": "This + V thường thay thế mệnh đề ngay trước nó.", "authored": false}, {"n": 23, "uid": 23, "part": "VI. REFERENCE & LINKING", "hd_fix": false, "prompt": "The connector “However” signals ______.", "options": ["a sequence of changes over time", "a contrast between benefits and pressures", "a definition of an urban challenge", "an example supporting the previous idea"], "keyLetter": "B", "keyText": "a contrast between benefits and pressures", "why": "Trích dẫn: \"These changes have improved access to many parts of the city. However, rapid population growth has also increased pressure on infrastructure.\" — \"However\" nối ý tích cực (cải thiện tiếp cận) với ý tiêu cực (áp lực lên hạ tầng): tương phản giữa lợi ích và áp lực.", "distractors": ["\"an example supporting the previous idea\" — However không nêu ví dụ mà đảo hướng lập luận.", "\"a sequence of changes over time\" — không phải trình tự thời gian.", "\"a definition of an urban challenge\" — câu không định nghĩa gì."], "kb": "However = tương phản (benefit ↔ pressure).", "authored": false}, {"n": 24, "uid": 24, "part": "VIII. SENTENCE INSERTION – COHESION (đoạn 1)", "hd_fix": false, "prompt": "Where does the sentence best fit?<br>“This growth, however, has not been matched equally by every part of the urban system.”", "options": ["[I]", "[II]", "[III]", "[IV]"], "keyLetter": "C", "keyText": "[III]", "why": "Trích dẫn: \"[II] New housing, roads and public transport have improved access to many areas.\" — Chèn ở [III]: \"This growth\" cần vật thay thế ở ngay trước (sự mở rộng ở [I]); \"however... not been matched equally\" tạo cầu nối tự nhiên sang [III] \"Congestion and pressure on services remain serious in some districts\" (minh họa sự không đồng đều).", "distractors": ["\"[I]\" đứng đầu đoạn — \"This growth\" chưa có vật thay thế.", "\"[II]\" đặt câu trước khi [II] nêu cải thiện tiếp cận, làm đứt mạch \"cải thiện → tuy nhiên không đồng đều\".", "\"[IV]\" đặt câu sau kết luận của planners — \"this growth\" bị treo quá xa."], "kb": "Câu chèn có \"This/These\" phải đứng ngay sau vật được thay thế.", "authored": false}, {"n": 25, "uid": 25, "part": "VIII. SENTENCE INSERTION – COHESION (đoạn 2)", "hd_fix": false, "prompt": "Where does the sentence best fit?<br>“As a result, some residents may spend less on housing but more time and money travelling.”", "options": ["[I]", "[II]", "[III]", "[IV]"], "keyLetter": "B", "keyText": "[II]", "why": "Trích dẫn: \"[I] Housing farther from a city centre is sometimes cheaper.\" — Chèn ở [II]: \"As a result\" cần nguyên nhân ở ngay trước — nhà xa trung tâm rẻ hơn [I] → hệ quả: tốn ít tiền nhà hơn nhưng tốn thời gian/tiền đi lại hơn; sau đó [II] \"however\" tiếp tục tương phản (việc làm vẫn tập trung ở trung tâm).", "distractors": ["\"[I]\" đứng đầu đoạn — \"As a result\" chưa có nguyên nhân.", "\"[III]\" đặt câu sau [II], \"as a result\" bị tách khỏi nguyên nhân \"cheaper\" ở [I].", "\"[IV]\" đặt câu trước kết luận — quan hệ nhân quả với [I] bị đứt."], "kb": "\"As a result\" phải đứng ngay sau nguyên nhân của nó.", "authored": false}, {"n": 26, "uid": 26, "part": "VIII. SENTENCE INSERTION – COHESION", "hd_fix": false, "prompt": "Choose the best sentence.", "options": ["These developments are most effective when authorities avoid future planning.", "By contrast, transport improvements have little connection with urban growth.", "At the same time, these improvements may attract even more residents and activity.", "For this reason, better roads normally cause a city’s population to decline."], "keyLetter": "C", "keyText": "At the same time, these improvements may attract even more residents and activity.", "why": "Câu đúng dùng \"may\" dè dặt và logic nhân quả hợp lý: cải thiện hạ tầng có thể thu hút thêm dân cư và hoạt động.", "distractors": ["\"better roads normally cause a city's population to decline\" ngược logic — hạ tầng tốt thu hút chứ không đẩy dân đi.", "\"transport improvements have little connection with urban growth\" phủ nhận mối liên hệ hiển nhiên.", "\"most effective when authorities avoid future planning\" vô lý — tránh quy hoạch thì không thể hiệu quả."], "kb": "Đáp án đúng thường có từ ngữ dè dặt (may) và logic nhân quả hợp lý.", "authored": false}, {"n": 27, "uid": 27, "part": "VIII. SENTENCE INSERTION – COHESION", "hd_fix": false, "prompt": "Choose the best sentence.", "options": ["Such pressures may reduce some of the quality-of-life gains created by development.", "These difficulties show that cities should return to their former physical size.", "Housing shortages usually disappear when urban populations continue to increase.", "Modern infrastructure removes every problem associated with rapid urban growth."], "keyLetter": "A", "keyText": "Such pressures may reduce some of the quality-of-life gains created by development.", "why": "Câu đúng dùng \"may\" + \"some\" dè dặt, logic hợp lý: áp lực đô thị có thể làm giảm một phần lợi ích từ phát triển.", "distractors": ["\"Housing shortages usually disappear when urban populations continue to increase\" ngược logic — dân tăng thì thiếu nhà trầm trọng hơn.", "\"cities should return to their former physical size\" cực đoan, không thực tế.", "\"Modern infrastructure removes every problem\" tuyệt đối hóa bằng \"every\"."], "kb": "Loại đáp án tuyệt đối hóa (every, always) và ngược logic.", "authored": false}, {"n": 28, "uid": 28, "part": "X. TNTHPT READING 1 – GROWTH BEYOND THE CITY CENTRE", "hd_fix": false, "prompt": "What is the main idea of paragraph 1?", "options": ["Agricultural land should remain unchanged as cities continue to expand.", "Most residents of newly developed areas continue working in city centres.", "Expansion beyond city centres can add housing while changing travel patterns.", "New transport links reduce the need to provide additional urban housing."], "keyLetter": "C", "keyText": "Expansion beyond city centres can add housing while changing travel patterns.", "why": "Trích dẫn: \"This process can provide more housing, but it can also reshape travel patterns across an entire metropolitan area.\" — Ý chính đoạn 1: mở rộng ra ngoài trung tâm vừa thêm nhà ở vừa thay đổi cách đi lại.", "distractors": ["\"Agricultural land should remain unchanged\" — bài chỉ nêu đất nông nghiệp cũ được dùng, không đưa ra khuyến nghị giữ nguyên.", "\"New transport links reduce the need to provide additional urban housing\" ngược ý bài.", "\"Most residents of newly developed areas continue working in city centres\" — bài không nêu."], "kb": "Main idea = ý bao trùm cả đoạn (housing + travel patterns).", "authored": false}, {"n": 29, "uid": 29, "part": "X. TNTHPT READING 1 – GROWTH BEYOND THE CITY CENTRE", "hd_fix": false, "prompt": "The word “reshape” in paragraph 1 is closest in meaning to ______.", "options": ["transform", "measure", "copy", "prevent"], "keyLetter": "A", "keyText": "transform", "why": "Trích dẫn: \"it can also reshape travel patterns across an entire metropolitan area.\" — \"reshape\" (định hình lại) trong ngữ cảnh thay đổi cách đi lại = transform.", "distractors": ["\"measure\" (đo lường) sai nghĩa.", "\"prevent\" (ngăn chặn) ngược nghĩa.", "\"copy\" (sao chép) sai nghĩa."], "kb": "reshape = transform (định hình lại).", "authored": false}, {"n": 30, "uid": 30, "part": "X. TNTHPT READING 1 – GROWTH BEYOND THE CITY CENTRE", "hd_fix": false, "prompt": "According to paragraph 2, dependence on private vehicles may increase when ______.", "options": ["homes are far from jobs and public transport is limited", "new roads connect neighbourhoods with employment centres", "neighbourhoods combine housing with services and transport", "residents live close to jobs and reliable public transport"], "keyLetter": "A", "keyText": "homes are far from jobs and public transport is limited", "why": "Trích dẫn: \"If homes are built far from employment centres and reliable public transport is limited, residents may become more dependent on private vehicles.\" — Điều kiện nêu rõ: nhà xa nơi làm việc + giao thông công cộng hạn chế.", "distractors": ["\"new roads connect neighbourhoods with employment centres\" — bài không nêu đây là nguyên nhân.", "\"neighbourhoods combine housing with services and transport\" là trường hợp giảm nhu cầu đi lại, ngược lại.", "\"residents live close to jobs and reliable public transport\" là điều kiện ngược với bài."], "kb": "far from jobs + limited public transport → depend on private vehicles.", "authored": false}, {"n": 31, "uid": 31, "part": "X. TNTHPT READING 1 – GROWTH BEYOND THE CITY CENTRE", "hd_fix": false, "prompt": "Which statement is TRUE according to paragraph 2?", "options": ["Constructing new roads will usually eliminate urban congestion.", "Housing location has little influence on residents’ travel patterns.", "Well-connected mixed-use areas may reduce some long journeys.", "Greater use of private vehicles generally reduces road congestion."], "keyLetter": "C", "keyText": "Well-connected mixed-use areas may reduce some long journeys.", "why": "Trích dẫn: \"By contrast, neighbourhoods that combine housing, services and public transport can reduce the need for some long journeys.\" — Đáp án diễn đạt lại đúng câu trong bài.", "distractors": ["\"Constructing new roads will usually eliminate urban congestion\" trái bài (\"This can increase congestion even when new roads are constructed\").", "\"Greater use of private vehicles generally reduces road congestion\" trái bài.", "\"Housing location has little influence on residents' travel patterns\" trái bài (\"The effects depend partly on how development is organised\")."], "kb": "TRUE question: đối chiếu từng option với câu chữ trong bài.", "authored": false}, {"n": 32, "uid": 32, "part": "X. TNTHPT READING 1 – GROWTH BEYOND THE CITY CENTRE", "hd_fix": false, "prompt": "The word “This” in paragraph 3 refers to ______.", "options": ["uncertainty about future population growth", "pressure on nearby public services", "residents arriving before infrastructure is ready", "the cost of providing new infrastructure"], "keyLetter": "C", "keyText": "residents arriving before infrastructure is ready", "why": "Trích dẫn: \"New residents then arrive before the supporting infrastructure is fully ready. [II] This gap can create pressure on existing services in nearby districts.\" — \"This gap\" chỉ khoảng trống giữa nhà ở hoàn thành và hạ tầng chưa sẵn sàng, tức cư dân đến trước khi hạ tầng sẵn sàng.", "distractors": ["\"uncertainty about future population growth\" xuất hiện ở câu sau, không phải vật được thay thế.", "\"the cost of providing new infrastructure\" không được nhắc như vật thay thế.", "\"pressure on nearby public services\" là HỆ QUẢ của \"this gap\", không phải bản thân nó."], "kb": "This + N trừu tượng (gap) thay thế tình huống ở câu trước.", "authored": false}, {"n": 33, "uid": 33, "part": "X. TNTHPT READING 1 – GROWTH BEYOND THE CITY CENTRE", "hd_fix": false, "prompt": "Where would the sentence “For planners, neither delay nor overbuilding offers an easy solution.” best fit?", "options": ["[IV]", "[II]", "[I]", "[III]"], "keyLetter": "A", "keyText": "[IV]", "why": "Trích dẫn: \"Building infrastructure in advance can be expensive, however, especially when future population growth is uncertain. [IV]\" — Chèn ở [IV]: \"delay\" ứng với để dân đến trước ([II]), \"overbuilding\" ứng với xây hạ tầng trước ([III]) — câu chèn chỉ hợp lý sau khi cả hai vế đã được nêu.", "distractors": ["\"[I]\" — \"neither... nor\" treo lơ lửng vì cả hai vế delay/overbuilding chưa được nêu.", "\"[II]\" — mới chỉ nêu vế \"delay\", chưa có \"overbuilding\".", "\"[III]\" — mới chỉ nêu vế \"overbuilding\", chưa đủ hai vế."], "kb": "neither... nor... cần cả hai vế đã xuất hiện ở câu trước.", "authored": false}, {"n": 34, "uid": 34, "part": "X. TNTHPT READING 1 – GROWTH BEYOND THE CITY CENTRE", "hd_fix": false, "prompt": "What can be inferred from paragraph 3?", "options": ["Infrastructure should normally be completed only after residents arrive.", "Future population growth can usually be predicted with high accuracy.", "Coordinating housing and infrastructure involves uncertainty and trade-offs.", "Schools and transport networks are generally completed before new housing."], "keyLetter": "C", "keyText": "Coordinating housing and infrastructure involves uncertainty and trade-offs.", "why": "Trích dẫn: \"Building infrastructure in advance can be expensive, however, especially when future population growth is uncertain.\" — Suy ra: xây trước thì tốn kém, xây sau thì dân đến trước gây áp lực — đó chính là sự không chắc chắn và đánh đổi.", "distractors": ["\"Infrastructure should normally be completed only after residents arrive\" trái bài (gây áp lực lên dịch vụ).", "\"Future population growth can usually be predicted with high accuracy\" trái chữ \"uncertain\".", "\"Schools and transport networks are generally completed before new housing\" trái bài (\"Housing may be completed more quickly than...\")."], "kb": "Inference: nối các dữ kiện (expensive in advance ↔ pressure if late) thành kết luận.", "authored": false}, {"n": 35, "uid": 35, "part": "X. TNTHPT READING 1 – GROWTH BEYOND THE CITY CENTRE", "hd_fix": false, "prompt": "Which of the following is NOT mentioned as part of effective urban expansion?", "options": ["providing public services", "increasing private-car use", "choosing suitable locations", "planning public transport"], "keyLetter": "B", "keyText": "increasing private-car use", "why": "Trích dẫn: \"It requires decisions about location, transport, public services and the sequence in which development occurs.\" — Bài liệt kê location, transport, public services, sequence; không hề nêu tăng dùng xe cá nhân.", "distractors": ["\"planning public transport\" có trong \"transport\" của bài.", "\"providing public services\" có trong \"public services\" của bài.", "\"choosing suitable locations\" có trong \"location\" của bài."], "kb": "NOT-mentioned: đối chiếu từng option với liệt kê trong bài.", "authored": false}, {"n": 36, "uid": 36, "part": "X. TNTHPT READING 1 – GROWTH BEYOND THE CITY CENTRE", "hd_fix": false, "prompt": "The final paragraph suggests that urban expansion succeeds when ______.", "options": ["additional buildings are constructed as quickly as possible", "its different elements are effectively planned and connected", "cities concentrate all new development around existing centres", "former agricultural land is completely replaced by development"], "keyLetter": "B", "keyText": "its different elements are effectively planned and connected", "why": "Trích dẫn: \"The quality of these connections often determines whether expansion improves urban life or merely moves existing problems to a different place.\" — \"these connections\" = các yếu tố (location, transport, services, sequence) được quy hoạch và kết nối tốt.", "distractors": ["\"cities concentrate all new development around existing centres\" trái ý \"beyond traditional city centres\".", "\"additional buildings are constructed as quickly as possible\" trái ý bài (timing/sequence quan trọng).", "\"former agricultural land is completely replaced\" tuyệt đối hóa — bài không nêu."], "kb": "Succeeds when = các yếu tố được quy hoạch và kết nối tốt.", "authored": false}, {"n": 37, "uid": 37, "part": "X. TNTHPT READING 1 – GROWTH BEYOND THE CITY CENTRE", "hd_fix": false, "prompt": "Which title best fits the passage?", "options": ["Why Transport Alone Determines the Success of New Areas", "New Housing as the Key to Successful Urban Expansion", "Why Urban Growth Should Remain in City Centres", "Urban Expansion: More Than Just Building More Homes"], "keyLetter": "D", "keyText": "Urban Expansion: More Than Just Building More Homes", "why": "Trích dẫn: \"Urban expansion is therefore not simply a question of finding land for more buildings.\" — Nhan đề diễn đạt lại đúng luận điểm trung tâm của đoạn cuối.", "distractors": ["\"Why Urban Growth Should Remain in City Centres\" trái bài (bài nói về mở rộng ra ngoài trung tâm).", "\"New Housing as the Key to Successful Urban Expansion\" thu hẹp — bài nhấn mạnh không chỉ nhà ở.", "\"Why Transport Alone Determines the Success of New Areas\" sai vì \"alone\" tuyệt đối hóa."], "kb": "Title = diễn đạt lại luận điểm trung tâm, không tuyệt đối hóa.", "authored": false}, {"n": 38, "uid": 38, "part": "XI. TNTHPT READING 2 – THE VALUE OF URBAN DENSITY", "hd_fix": false, "prompt": "What is the passage mainly about?", "options": ["Lower density provides a reliable solution to most urban pressures.", "Urban density works differently depending on planning and supporting systems.", "High urban density generally creates more problems than benefits.", "Urban density is mainly determined by the number of city roads."], "keyLetter": "B", "keyText": "Urban density works differently depending on planning and supporting systems.", "why": "Trích dẫn: \"In reality, its effects depend on design and management.\" — Đây là luận điểm bao trùm cả bài: tác động của mật độ phụ thuộc vào thiết kế và quản lý.", "distractors": ["\"High urban density generally creates more problems than benefits\" trái bài (không hoàn toàn có hại).", "\"Lower density provides a reliable solution to most urban pressures\" trái đoạn 3.", "\"Urban density is mainly determined by the number of city roads\" — bài không nêu."], "kb": "Mainly about = luận điểm lặp lại xuyên suốt (depend on design/management).", "authored": false}, {"n": 39, "uid": 39, "part": "XI. TNTHPT READING 2 – THE VALUE OF URBAN DENSITY", "hd_fix": false, "prompt": "The word “potentially” in paragraph 1 is closest in meaning to ______.", "options": ["possibly", "rarely", "certainly", "previously"], "keyLetter": "A", "keyText": "possibly", "why": "Trích dẫn: \"potentially reducing the distance they need to travel.\" — \"potentially\" (một cách tiềm tàng) = possibly (có khả năng).", "distractors": ["\"previously\" (trước đây) sai nghĩa.", "\"certainly\" (chắc chắn) ngược nghĩa.", "\"rarely\" (hiếm khi) sai nghĩa."], "kb": "potentially = possibly (có khả năng).", "authored": false}, {"n": 40, "uid": 40, "part": "XI. TNTHPT READING 2 – THE VALUE OF URBAN DENSITY", "hd_fix": false, "prompt": "What benefit of higher density is mentioned?", "options": ["Public open spaces automatically become larger and more accessible.", "Infrastructure can serve more people within a smaller area.", "Roads become less crowded as population density increases.", "Housing costs become lower as more residents share an area."], "keyLetter": "B", "keyText": "Infrastructure can serve more people within a smaller area.", "why": "Trích dẫn: \"It can also make public services more efficient because infrastructure serves more users within a smaller area.\" — Đáp án diễn đạt lại đúng câu trong bài.", "distractors": ["\"Housing costs become lower\" — bài không nêu (đoạn 2 còn nói chi phí nhà ở cao).", "\"Roads become less crowded as density increases\" trái đoạn 2 (\"Crowded roads\").", "\"Public open spaces automatically become larger\" trái đoạn 2 (\"limited public areas\")."], "kb": "Benefit question: bám sát câu chữ đoạn 1.", "authored": false}, {"n": 41, "uid": 41, "part": "XI. TNTHPT READING 2 – THE VALUE OF URBAN DENSITY", "hd_fix": false, "prompt": "The phrase “These outcomes” in paragraph 2 refers to ______.", "options": ["jobs and transport located near residents", "efficient services provided in dense areas", "the general increase in population density", "crowded roads, limited space and high housing costs"], "keyLetter": "D", "keyText": "crowded roads, limited space and high housing costs", "why": "Trích dẫn: \"Crowded roads, limited public areas and high housing costs may reduce quality of life. These outcomes are sometimes blamed on density itself...\" — \"These outcomes\" thay thế cho liệt kê ngay trước.", "distractors": ["\"efficient services provided in dense areas\" là ý tích cực đoạn 1, không phải \"outcomes\" bị đổ lỗi.", "\"jobs and transport located near residents\" là lợi ích đoạn 1.", "\"the general increase in population density\" là nguyên nhân chung, không phải liệt kê cụ thể."], "kb": "These + N thay thế liệt kê ở câu ngay trước.", "authored": false}, {"n": 42, "uid": 42, "part": "XI. TNTHPT READING 2 – THE VALUE OF URBAN DENSITY", "hd_fix": false, "prompt": "Which statement would the writer most likely agree with?", "options": ["Some problems linked to density may result from poor planning.", "Lower density always reduces the amount of infrastructure required.", "Density alone can explain most serious problems in urban areas.", "Urban policy should assess density mainly through a single measure."], "keyLetter": "A", "keyText": "Some problems linked to density may result from poor planning.", "why": "Trích dẫn: \"These outcomes are sometimes blamed on density itself, although poor planning may be an equally important factor.\" — \"poor planning may be an equally important factor\" = quy hoạch kém cũng là nguyên nhân quan trọng.", "distractors": ["\"Density alone can explain most serious problems\" trái chữ \"although\".", "\"Lower density always reduces the amount of infrastructure required\" trái đoạn 3.", "\"Urban policy should assess density mainly through a single measure\" trái đoạn cuối (\"rather than as a single number\")."], "kb": "Agree-question: tìm câu tác giả trực tiếp nêu; tránh \"alone/always\".", "authored": false}, {"n": 43, "uid": 43, "part": "XI. TNTHPT READING 2 – THE VALUE OF URBAN DENSITY", "hd_fix": false, "prompt": "What is the purpose of paragraph 3?", "options": ["To explain how utilities developed across low-density areas.", "To demonstrate why dense areas require less infrastructure than other areas.", "To argue that residents should reduce their need to travel.", "To challenge the idea that lower density automatically reduces urban pressures."], "keyLetter": "D", "keyText": "To challenge the idea that lower density automatically reduces urban pressures.", "why": "Trích dẫn: \"This distinction matters because reducing density does not automatically remove urban problems.\" — Cả đoạn 3 lập luận giảm mật độ không tự động xóa vấn đề đô thị.", "distractors": ["\"To explain how utilities developed across low-density areas\" — đoạn chỉ nhắc utilities như ví dụ chi phí, không phải mục đích.", "\"To argue that residents should reduce their need to travel\" — bài không kêu gọi điều này.", "\"To demonstrate why dense areas require less infrastructure\" ngược ý đoạn."], "kb": "Purpose = luận điểm mở đầu đoạn (topic sentence).", "authored": false}, {"n": 44, "uid": 44, "part": "XI. TNTHPT READING 2 – THE VALUE OF URBAN DENSITY", "hd_fix": false, "prompt": "The word “exchange” in paragraph 3 most nearly means ______.", "options": ["hide one problem temporarily", "remove one problem completely", "measure two sets accurately", "replace one set with another"], "keyLetter": "D", "keyText": "replace one set with another", "why": "Trích dẫn: \"lower density can exchange one set of pressures for another.\" — \"exchange A for B\" (đánh đổi A lấy B) = thay một nhóm áp lực bằng nhóm khác.", "distractors": ["\"remove one problem completely\" (xóa hẳn) sai — bài nói chỉ \"đổi\" áp lực.", "\"measure two sets accurately\" (đo lường) sai nghĩa.", "\"hide one problem temporarily\" (che giấu) sai nghĩa."], "kb": "exchange A for B = thay A bằng B.", "authored": false}, {"n": 45, "uid": 45, "part": "XI. TNTHPT READING 2 – THE VALUE OF URBAN DENSITY", "hd_fix": false, "prompt": "What can be inferred about the writer’s view of urban policy?", "options": ["It should consider interacting conditions rather than one isolated measure.", "It should maximise density whenever sufficient housing is available.", "It should give priority to transport rather than other urban services.", "It should minimise density to reduce pressure on public infrastructure."], "keyLetter": "A", "keyText": "It should consider interacting conditions rather than one isolated measure.", "why": "Trích dẫn: \"Urban policy should evaluate density as part of a wider system rather than as a single number.\" — Suy ra: xem xét các điều kiện tương tác thay vì một chỉ số đơn lẻ.", "distractors": ["\"It should maximise density whenever sufficient housing is available\" — bài không kêu gọi tối đa hóa.", "\"It should minimise density to reduce pressure\" trái đoạn 3.", "\"It should give priority to transport rather than other urban services\" — bài không xếp hạng ưu tiên."], "kb": "Inference bám sát câu kết luận của tác giả.", "authored": false}, {"n": 46, "uid": 46, "part": "XI. TNTHPT READING 2 – THE VALUE OF URBAN DENSITY", "hd_fix": false, "prompt": "Which is NOT listed as a condition supporting liveable dense neighbourhoods?", "options": ["sufficient housing", "increased private-car use", "access to public transport", "usable public spaces"], "keyLetter": "B", "keyText": "increased private-car use", "why": "Trích dẫn: \"Access to public transport, sufficient housing, usable public spaces and well-planned services can make dense neighbourhoods more liveable.\" — Bài liệt kê 4 điều kiện, không có tăng dùng xe cá nhân.", "distractors": ["\"sufficient housing\" có trong liệt kê của bài.", "\"usable public spaces\" có trong liệt kê của bài.", "\"access to public transport\" có trong liệt kê của bài."], "kb": "NOT-listed: đối chiếu từng option với liệt kê trong bài.", "authored": false}, {"n": 47, "uid": 47, "part": "XI. TNTHPT READING 2 – THE VALUE OF URBAN DENSITY", "hd_fix": false, "prompt": "Which title best fits the passage?", "options": ["One Number That Explains Urban Life", "Why Dense Cities Should Be Avoided", "Urban Density: Why the Wider System Matters", "Why Public Transport Creates Density"], "keyLetter": "C", "keyText": "Urban Density: Why the Wider System Matters", "why": "Trích dẫn: \"Urban policy should evaluate density as part of a wider system rather than as a single number.\" — Nhan đề bắt đúng thông điệp \"wider system\" của đoạn kết.", "distractors": ["\"Why Dense Cities Should Be Avoided\" trái toàn bài.", "\"One Number That Explains Urban Life\" trái chữ \"rather than as a single number\".", "\"Why Public Transport Creates Density\" — bài không nêu quan hệ nhân quả này."], "kb": "Title bám thông điệp đoạn kết.", "authored": false}, {"n": 48, "uid": 48, "part": "XII. READING-TO-LANGUAGE BRIDGE", "hd_fix": false, "prompt": "Ha Noi ______ considerably since the mid-20th century.", "options": ["has changed", "changed since", "has change", "is changed since"], "keyLetter": "A", "keyText": "has changed", "why": "\"since + mốc thời gian\" (since the mid-20th century) → hiện tại hoàn thành: has changed.", "distractors": ["\"changed since\" thiếu trợ động từ \"has\".", "\"has change\" sai dạng quá khứ phân từ (phải là changed).", "\"is changed since\" sai thì và dạng bị động vô nghĩa."], "kb": "since + mốc thời gian → present perfect (has + V3).", "authored": false}, {"n": 49, "uid": 49, "part": "XII. READING-TO-LANGUAGE BRIDGE", "hd_fix": false, "prompt": "The city has become ______ crowded as its population has grown.", "options": ["most and most", "more and more", "the more", "more crowded and"], "keyLetter": "B", "keyText": "more and more", "why": "\"more and more + adj\" (ngày càng) đi với \"become\": has become more and more crowded.", "distractors": ["\"the more\" cần cấu trúc so sánh kép \"the more..., the more...\", không đứng một mình.", "\"most and most\" không phải cấu trúc tiếng Anh.", "\"more crowded and\" thừa \"and\", sai cấu trúc."], "kb": "become + more and more + adj = ngày càng...", "authored": false}, {"n": 50, "uid": 50, "part": "XII. READING-TO-LANGUAGE BRIDGE", "hd_fix": false, "prompt": "The ______ the population becomes, the ______ pressure there may be on housing.", "options": ["larger / greater", "large / great", "largest / greatest", "more large / more great"], "keyLetter": "A", "keyText": "larger / greater", "why": "Cấu trúc so sánh kép \"The + so sánh hơn..., the + so sánh hơn...\": larger / greater.", "distractors": ["\"large / great\" là dạng nguyên thể, sai cấu trúc so sánh kép.", "\"largest / greatest\" là so sánh nhất, sai cấu trúc.", "\"more large / more great\" — tính từ ngắn không dùng \"more\"."], "kb": "The + comparative..., the + comparative...", "authored": false}, {"n": 51, "uid": 51, "part": "XII. READING-TO-LANGUAGE BRIDGE", "hd_fix": false, "prompt": "This is one of the most significant urban transformations the city ______.", "options": ["is experiencing yesterday", "has experience", "has experienced", "experienced in 1954"], "keyLetter": "C", "keyText": "has experienced", "why": "\"one of the most + N\" thường đi với hiện tại hoàn thành → has experienced.", "distractors": ["\"experienced in 1954\" gán sự kiện vào năm 1954, sai phạm vi (biến đổi kéo dài tới nay).", "\"has experience\" sai dạng quá khứ phân từ (phải là experienced).", "\"is experiencing yesterday\" — \"yesterday\" không đi với hiện tại tiếp diễn."], "kb": "one of the most + N + hiện tại hoàn thành.", "authored": false}, {"n": 52, "uid": 52, "part": "XII. READING-TO-LANGUAGE BRIDGE", "hd_fix": false, "prompt": "Public transport has expanded, ______ many residents still face congestion during rush hour.", "options": ["but", "unless", "so that", "because"], "keyLetter": "A", "keyText": "but", "why": "Hai vế tương phản (giao thông công cộng mở rộng NHƯNG vẫn tắc đường) → but.", "distractors": ["\"because\" chỉ nguyên nhân, sai quan hệ giữa hai vế.", "\"so that\" chỉ mục đích, sai quan hệ giữa hai vế.", "\"unless\" chỉ điều kiện, sai quan hệ giữa hai vế."], "kb": "Tương phản giữa hai vế → but.", "authored": false}, {"n": 53, "uid": 53, "part": "XIII. HOMEWORK – EXAM READING CHECK", "hd_fix": false, "prompt": "What is the main idea of the passage?", "options": ["Faster vehicle movement should remain the main aim of transport policy.", "Transport problems require considering how different measures interact.", "Road investment is usually ineffective in rapidly growing cities.", "Population growth has relatively little influence on urban congestion."], "keyLetter": "B", "keyText": "Transport problems require considering how different measures interact.", "why": "Trích dẫn: \"Rather, it suggests that planners should evaluate how different measures interact.\" — Ý chính: các vấn đề giao thông đòi hỏi xem xét cách các biện pháp tương tác với nhau.", "distractors": ["\"Road investment is usually ineffective in rapidly growing cities\" trái câu \"This does not mean transport investment is useless\".", "\"Faster vehicle movement should remain the main aim\" trái đoạn cuối (\"rather than movement alone\").", "\"Population growth has relatively little influence\" trái đoạn 1 (\"adding new journeys to the network\")."], "kb": "Main idea = ý được nhắc lại ở đoạn 2 và 3 (interact / accessibility).", "authored": false}, {"n": 54, "uid": 54, "part": "XIII. HOMEWORK – EXAM READING CHECK", "hd_fix": false, "prompt": "Why might improved roads fail to reduce congestion immediately?", "options": ["They may replace public transport with other forms of private travel.", "They may encourage more driving while travel demand continues to grow.", "They may prevent commuters from travelling during the busiest periods.", "They may reduce economic activity and discourage people from travelling."], "keyLetter": "B", "keyText": "They may encourage more driving while travel demand continues to grow.", "why": "Trích dẫn: \"improved roads can make driving more attractive, encouraging some people to use cars more often or to travel at busier times. Population and economic activity may also continue to grow, adding new journeys to the network.\" — Hai nguyên nhân: đường tốt khuyến khích lái xe nhiều hơn + nhu cầu đi lại tiếp tục tăng.", "distractors": ["\"They may reduce economic activity\" ngược bài (kinh tế tiếp tục tăng).", "\"They may replace public transport\" — bài không nêu.", "\"They may prevent commuters from travelling during the busiest periods\" ngược bài (\"travel at busier times\")."], "kb": "Detail question: gom đủ các nguyên nhân bài nêu.", "authored": false}, {"n": 55, "uid": 55, "part": "XIII. HOMEWORK – EXAM READING CHECK", "hd_fix": false, "prompt": "The word “Rather” signals ______.", "options": ["an additional example with the same meaning", "a direct cause of congestion", "a chronological development", "a qualification of the previous interpretation"], "keyLetter": "D", "keyText": "a qualification of the previous interpretation", "why": "Trích dẫn: \"This does not mean transport investment is useless. Rather, it suggests that planners should evaluate how different measures interact.\" — \"Rather\" điều chỉnh cách hiểu câu trước (đầu tư không vô ích, mà cần đánh giá sự tương tác).", "distractors": ["\"a chronological development\" — không phải trình tự thời gian.", "\"a direct cause of congestion\" — không chỉ nguyên nhân.", "\"an additional example with the same meaning\" — không phải ví dụ bổ sung."], "kb": "Rather = điều chỉnh/đính chính cách hiểu câu trước.", "authored": false}, {"n": 56, "uid": 56, "part": "XIII. HOMEWORK – EXAM READING CHECK", "hd_fix": false, "prompt": "What can be inferred about a single transport project?", "options": ["It is unlikely to improve any part of an urban transport system.", "It normally changes travel behaviour throughout the whole system.", "It may address only one part of a wider transport problem.", "It removes the need to coordinate different planning measures."], "keyLetter": "C", "keyText": "It may address only one part of a wider transport problem.", "why": "Trích dẫn: \"A single project may improve one part of the system while leaving another source of congestion unchanged.\" — Suy ra trực tiếp: một dự án đơn lẻ chỉ giải quyết một phần của vấn đề rộng hơn.", "distractors": ["\"It normally changes travel behaviour throughout the whole system\" trái chữ \"one part\".", "\"It removes the need to coordinate different planning measures\" trái ý bài (cần phối hợp).", "\"It is unlikely to improve any part\" trái chữ \"may improve one part\"."], "kb": "Inference từ câu có \"may\" → đáp án cũng dè dặt (may).", "authored": false}, {"n": 57, "uid": 57, "part": "XIII. HOMEWORK – EXAM READING CHECK", "hd_fix": false, "prompt": "In the final paragraph, “accessibility” focuses mainly on ______.", "options": ["increasing the maximum speed of vehicles", "enabling people to reach important destinations efficiently", "constructing wider roads across urban areas", "reducing the amount of walking within cities"], "keyLetter": "B", "keyText": "enabling people to reach important destinations efficiently", "why": "Trích dẫn: \"The aim is not simply to help vehicles travel faster, but to help people reach jobs, education and services efficiently.\" — Bài định nghĩa accessibility = giúp người dân tới nơi làm việc/học tập/dịch vụ hiệu quả.", "distractors": ["\"increasing the maximum speed of vehicles\" là \"movement\" — thứ bài đặt xuống thứ yếu.", "\"constructing wider roads across urban areas\" — bài không nhấn mạnh.", "\"reducing the amount of walking within cities\" — bài không nêu."], "kb": "accessibility = reach destinations efficiently (≠ faster vehicles).", "authored": false}, {"n": 58, "uid": 58, "part": "XIII. HOMEWORK – EXAM READING CHECK", "hd_fix": false, "prompt": "Which title best fits the passage?", "options": ["Why Growing Cities Should Reduce Public Transport", "Building Wider Roads to Increase Urban Accessibility", "Beyond Faster Roads: Rethinking Urban Transport", "Why Every New Road Creates More Congestion"], "keyLetter": "C", "keyText": "Beyond Faster Roads: Rethinking Urban Transport", "why": "Trích dẫn: \"urban transport policy is increasingly concerned with accessibility rather than movement alone.\" — Nhan đề bắt đúng sự chuyển hướng: vượt khỏi tư duy \"đường nhanh hơn\".", "distractors": ["\"Why Every New Road Creates More Congestion\" tuyệt đối hóa bằng \"Every\", trái giọng dè dặt của bài.", "\"Building Wider Roads to Increase Urban Accessibility\" trái đoạn cuối.", "\"Why Growing Cities Should Reduce Public Transport\" trái bài (bài ủng hộ giao thông công cộng đáng tin cậy)."], "kb": "Title = sự chuyển hướng tư duy của bài.", "authored": false}]} ,"p3":{"title":"PHẦN 3 — CỦNG CỐ","desc":"20 câu: CORE CONSOLIDATION (20)","questions":[{"n": 1, "uid": 1, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "local residents : ______", "options": ["kiến trúc thuộc địa", "cư dân địa phương", "áp lực dịch vụ", "hạ tầng hỗ trợ"], "keyLetter": "B", "keyText": "cư dân địa phương", "why": "\"local residents\" nghĩa là \"cư dân địa phương\" — residents là danh từ chỉ người dân.", "distractors": ["\"kiến trúc thuộc địa\" là nghĩa của \"colonial architecture\".", "\"hạ tầng hỗ trợ\" là nghĩa của \"supporting infrastructure\".", "\"áp lực dịch vụ\" là nghĩa của \"pressure on services\"."], "kb": "local residents = cư dân địa phương.", "authored": false}, {"n": 2, "uid": 2, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "colonial architecture : ______", "options": ["hạ tầng đô thị", "kiến trúc thuộc địa", "khu dân cư", "quy hoạch đất"], "keyLetter": "B", "keyText": "kiến trúc thuộc địa", "why": "\"colonial architecture\" nghĩa là \"kiến trúc thuộc địa\".", "distractors": ["\"hạ tầng đô thị\" không phải cụm trong bài.", "\"khu dân cư\" là nghĩa của \"residential area\".", "\"quy hoạch đất\" là nghĩa của \"land-use planning\"."], "kb": "colonial architecture = kiến trúc thuộc địa.", "authored": false}, {"n": 3, "uid": 3, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "expand ______", "options": ["resident", "concern", "modern", "gradually"], "keyLetter": "D", "keyText": "gradually", "why": "Động từ \"expand\" cần trạng từ bổ nghĩa → gradually.", "distractors": ["\"modern\" là tính từ, sai từ loại.", "\"concern\" là danh từ/động từ, sai nghĩa và sai từ loại.", "\"resident\" là danh từ chỉ người, sai từ loại."], "kb": "expand gradually = mở rộng dần dần.", "authored": false}, {"n": 4, "uid": 4, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "______ public transport", "options": ["concern", "colonial", "modernise", "reside"], "keyLetter": "C", "keyText": "modernise", "why": "Vị trí cần động từ → modernise (hiện đại hóa) giao thông công cộng.", "distractors": ["\"concern\" (lo ngại) sai nghĩa trong ngữ cảnh.", "\"reside\" (cư trú) sai nghĩa trong ngữ cảnh.", "\"colonial\" là tính từ, sai từ loại."], "kb": "modernise public transport = hiện đại hóa giao thông công cộng.", "authored": false}, {"n": 5, "uid": 5, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "housing ______", "options": ["shortage", "access", "trade-off", "density"], "keyLetter": "A", "keyText": "shortage", "why": "Cụm cố định \"housing shortage\" (tình trạng thiếu nhà ở).", "distractors": ["\"density\" (mật độ) không tạo thành cụm đúng với housing.", "\"access\" (tiếp cận) không tạo thành cụm đúng với housing.", "\"trade-off\" (sự đánh đổi) không tạo thành cụm đúng với housing."], "kb": "housing shortage = tình trạng thiếu nhà ở.", "authored": false}, {"n": 6, "uid": 6, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "pressure ______ services", "options": ["on", "to", "for", "with"], "keyLetter": "A", "keyText": "on", "why": "\"pressure\" đi với \"on\" → pressure on services.", "distractors": ["\"to\" không đi với pressure trong nghĩa này.", "\"for\" không đi với pressure trong nghĩa này.", "\"with\" không đi với pressure trong nghĩa này."], "kb": "pressure on = áp lực lên.", "authored": false}, {"n": 7, "uid": 7, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "depend ______ private vehicles", "options": ["to", "with", "on", "for"], "keyLetter": "C", "keyText": "on", "why": "\"depend\" luôn đi với \"on\" → depend on private vehicles.", "distractors": ["\"to\" không phải giới từ đi kèm của depend.", "\"for\" không phải giới từ đi kèm của depend.", "\"with\" không phải giới từ đi kèm của depend."], "kb": "depend on = phụ thuộc vào.", "authored": false}, {"n": 8, "uid": 8, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "keep pace ______ population", "options": ["with", "on", "to", "for"], "keyLetter": "A", "keyText": "with", "why": "Cụm cố định \"keep pace with\" (theo kịp) → with.", "distractors": ["\"to\" không đi với keep pace.", "\"for\" không đi với keep pace.", "\"on\" không đi với keep pace."], "kb": "keep pace with = theo kịp.", "authored": false}, {"n": 9, "uid": 9, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "supporting ______", "options": ["concern", "infrastructure", "resident", "architecture"], "keyLetter": "B", "keyText": "infrastructure", "why": "Cụm cố định \"supporting infrastructure\" (cơ sở hạ tầng hỗ trợ).", "distractors": ["\"architecture\" (kiến trúc) sai nghĩa.", "\"concern\" (mối lo ngại) sai nghĩa.", "\"resident\" (cư dân) sai nghĩa."], "kb": "supporting infrastructure = cơ sở hạ tầng hỗ trợ.", "authored": false}, {"n": 10, "uid": 10, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "coordinate housing ______ infrastructure", "options": ["on", "for", "and", "to"], "keyLetter": "C", "keyText": "and", "why": "Hai danh từ song song \"housing\" và \"infrastructure\" nối bằng \"and\".", "distractors": ["\"to\" phá vỡ cấu trúc song song.", "\"for\" phá vỡ cấu trúc song song.", "\"on\" phá vỡ cấu trúc song song."], "kb": "coordinate A and B = phối hợp A và B.", "authored": false}, {"n": 11, "uid": 11, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "involve uncertainty and ______", "options": ["density", "trade-offs", "residents", "access"], "keyLetter": "B", "keyText": "trade-offs", "why": "Cụm cố định \"involve uncertainty and trade-offs\".", "distractors": ["\"access\" (tiếp cận) sai nghĩa trong cụm.", "\"density\" (mật độ) sai nghĩa trong cụm.", "\"residents\" (cư dân) sai nghĩa trong cụm."], "kb": "involve uncertainty and trade-offs = bao hàm sự không chắc chắn và những đánh đổi.", "authored": false}, {"n": 12, "uid": 12, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "land-use planning / road ______", "options": ["density", "access", "shortage", "management"], "keyLetter": "D", "keyText": "management", "why": "Cụm cố định \"road management\" (quản lý đường bộ).", "distractors": ["\"access\" không tạo thành cụm đúng với road.", "\"density\" không tạo thành cụm đúng với road.", "\"shortage\" không tạo thành cụm đúng với road."], "kb": "land-use planning / road management = quy hoạch sử dụng đất / quản lý đường bộ.", "authored": false}, {"n": 13, "uid": 13, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "reshape = ______", "options": ["measure", "prevent", "transform", "copy"], "keyLetter": "C", "keyText": "transform", "why": "\"reshape\" tương đương \"transform\" (định hình lại).", "distractors": ["\"measure\" (đo lường) sai nghĩa.", "\"prevent\" (ngăn chặn) ngược nghĩa.", "\"copy\" (sao chép) sai nghĩa."], "kb": "reshape = transform.", "authored": false}, {"n": 14, "uid": 14, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "potentially = ______", "options": ["certainly", "previously", "rarely", "possibly"], "keyLetter": "D", "keyText": "possibly", "why": "\"potentially\" tương đương \"possibly\" (có khả năng).", "distractors": ["\"certainly\" (chắc chắn) ngược nghĩa.", "\"rarely\" (hiếm khi) sai nghĩa.", "\"previously\" (trước đây) sai nghĩa."], "kb": "potentially = possibly.", "authored": false}, {"n": 15, "uid": 15, "part": "CORE CONSOLIDATION", "hd_fix": false, "prompt": "accessibility : ______", "options": ["tắc đường", "khả năng tiếp cận", "mật độ", "thuộc địa"], "keyLetter": "B", "keyText": "khả năng tiếp cận", "why": "\"accessibility\" nghĩa là \"khả năng tiếp cận\".", "distractors": ["\"mật độ\"
