<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}

.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}

.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}

.footer-note{color:var(--muted);font-size:14px}

.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}

ion (n).", "authored": false}, {"n": 2, "uid": 2, "part": "SECTION II – WORD FAMILY & COLLOCATION CONTROL", "hd_fix": false, "prompt": "The activist was widely ______ for her courage and persistence.", "options": ["admired", "admiration", "admiring", "admirable"], "keyLetter": "A", "keyText": "admired", "why": "“was widely ___ for” cần dạng bị động (V3) tạo “be admired for”.", "distractors": ["“admiration” là danh từ", "“admirable” nghĩa “đáng ngưỡng mộ”, không phải bị động", "“admiring” nghĩa “đang ngưỡng mộ”, sai chiều"], "kb": "be admired for.", "authored": false}, {"n": 3, "uid": 3, "part": "SECTION II – WORD FAMILY & COLLOCATION CONTROL", "hd_fix": false, "prompt": "His work made a significant contribution ______ public health.", "options": ["for", "to", "with", "at"], "keyLetter": "B", "keyText": "to", "why": "“make a contribution” đi với giới từ “to”.", "distractors": ["“for” không tạo collocation đúng", "“with” không tạo collocation đúng", "“at” không tạo collocation đúng"], "kb": "make a contribution to.", "authored": false}, {"n": 4, "uid": 4, "part": "SECTION II – WORD FAMILY & COLLOCATION CONTROL", "hd_fix": false, "prompt": "The discovery had a profound ______ on later research.", "options": ["impacting", "impacted", "impactful", "impact"], "keyLetter": "D", "keyText": "impact", "why": "“a profound ___ on” cần danh từ đi với “on”.", "distractors": ["“impactful” là tính từ", "“impacted” là V3", "“impacting” là V-ing"], "kb": "have a profound impact on.", "authored": false}, {"n": 5, "uid": 5, "part": "SECTION II – WORD FAMILY & COLLOCATION CONTROL", "hd_fix": false, "prompt": "She remained ______ to improving opportunities for young people.", "options": ["committed", "commitment", "commit", "committing"], "keyLetter": "A", "keyText": "committed", "why": "“remain” + tính từ; “committed to + V-ing” đúng cả slot và cấu trúc.", "distractors": ["“commitment” là danh từ", "“commit” là động từ", "“committing” là V-ing"], "kb": "remain committed to + N/V-ing.", "authored": false}, {"n": 6, "uid": 6, "part": "SECTION II – WORD FAMILY & COLLOCATION CONTROL", "hd_fix": false, "prompt": "Her story continues to inspire students ______ their goals.", "options": ["pursuing", "pursued", "pursue", "to pursue"], "keyLetter": "D", "keyText": "to pursue", "why": "Cấu trúc “inspire + O + to V” đòi “to pursue”.", "distractors": ["“pursuing” thiếu “to”", "“pursue” thiếu “to”", "“pursued” sai dạng sau “inspire”"], "kb": "inspire sb to do sth.", "authored": false}, {"n": 7, "uid": 7, "part": "SECTION II – WORD FAMILY & COLLOCATION CONTROL", "hd_fix": false, "prompt": "The scientist eventually ______ international recognition.", "options": ["made", "raised", "did", "gained"], "keyLetter": "D", "keyText": "gained", "why": "“gain recognition” là collocation cố định.", "distractors": ["“made recognition” sai partner", "“did recognition” sai partner", "“raised recognition” sai partner"], "kb": "gain recognition.", "authored": false}, {"n": 8, "uid": 8, "part": "SECTION II – WORD FAMILY & COLLOCATION CONTROL", "hd_fix": false, "prompt": "His achievements left a ______ legacy.", "options": ["lasted", "lastingly", "last", "lasting"], "keyLetter": "D", "keyText": "lasting", "why": "“a ___ legacy” cần tính từ; chunk cố định “lasting legacy”.", "distractors": ["“last” nghĩa “cuối cùng/vừa qua”, sai nghĩa", "“lasted” là V3", "“lastingly” là trạng từ"], "kb": "leave a lasting legacy.", "authored": false}, {"n": 9, "uid": 9, "part": "SECTION III – CULTURE/CLIL READING", "hd_fix": false, "prompt": "According to paragraph 1, admired figures are often remembered mainly because ______.", "options": ["their actions had a positive impact on others", "they managed to avoid major difficulties in life", "their achievements gained immediate public recognition", "they achieved fame relatively early in life"], "keyLetter": "A", "keyText": "their actions had a positive impact on others", "why": "Trích dẫn: “their actions affected other people”; “public admiration is ", "hd_fix": false, "prompt": "Which statement is presented as a FACT rather than an evaluation?", "options": ["She founded a school in the year 1950.", "Her work was regarded as absolutely extraordinary.", "She was the most inspiring leader of her time.", "It was considered her greatest achievement in life."], "keyLetter": "A", "keyText": "She founded a school in the year 1950.", "why": "Trích dẫn: “‘she founded a school in 1950’ reports an event” — sự kiện có thể kiểm chứng.", "distractors": ["D. chứa “greatest” = đánh giá", "C. chứa “most inspiring” = đánh giá", "B. chứa “absolutely extraordinary” = đánh giá"], "kb": "fact = checkable event.", "authored": false}, {"n": 13, "uid": 13, "part": "SECTION III – CULTURE/CLIL READING", "hd_fix": false, "prompt": "Why does the writer contrast fact and evaluation?", "options": ["To argue that biographies should avoid personal opinions", "To demonstrate that cultural values remain unchanged", "To suggest that dates provide little useful information", "To help readers evaluate biographies more critically"], "keyLetter": "D", "keyText": "To help readers evaluate biographies more critically", "why": "Trích dẫn: “Understanding this difference helps readers evaluate biographies more carefully”.", "distractors": ["C. “dates useless” — bài không nói", "A. “avoid opinions” — bài không yêu cầu bỏ opinion", "B. không phải mục đích của đoạn"], "kb": "fact vs evaluation → critical reading.", "authored": false}, {"n": 14, "uid": 14, "part": "SECTION III – CULTURE/CLIL READING", "hd_fix": false, "prompt": "Which best summarises the text?", "options": ["Admiration reflects contribution, while biographies require critical reading.", "Admired figures share the same qualities across different cultures.", "Admired figures are mainly scientists and social reformers.", "Good biographies should focus mainly on factual information."], "keyLetter": "A", "keyText": "Admiration reflects contribution, while biographies require critical reading.", "why": "Trích dẫn: đ1 “admiration is connected to contribution rather than popularity alone”; đ2 “distinguish factual information from evaluation”.", "distractors": ["C. quá hẹp — chỉ hai ví dụ", "B. trái “interpreted differently across cultures”", "D. “mainly factual” — bài không phủ nhận evaluation"], "kb": "contribution + critical reading.", "authored": false}, {"n": 15, "uid": 15, "part": "SECTION IV – PARAPHRASE LAB", "hd_fix": false, "prompt": "Which paraphrase best preserves “She dedicated much of her life to improving education”?", "options": ["She spent her whole life teaching at one school.", "She became famous because education was easy to improve.", "She devoted a large part of her life to making education better.", "She studied education for a short period."], "keyLetter": "C", "keyText": "She devoted a large part of her life to making education better.", "why": "“dedicated much of life” ↔ “devoted a large part of life”; “improving” ↔ “making better” — giữ nguyên scope và nghĩa.", "distractors": ["D. “short period” — sai scope", "B. thêm “famous/easy” không có trong nguồn", "A. “whole life/one school” — sai scope"], "kb": "paraphrase = same scope, same meaning.", "authored": false}, {"n": 16, "uid": 16, "part": "SECTION IV – PARAPHRASE LAB", "hd_fix": false, "prompt": "Which option DISTORTS “His work influenced later generations”?", "options": ["His work guaranteed that all later generations succeeded.", "Later generations were affected by his work.", "His influence continued beyond his own generation.", "His work affected people who came after him."], "keyLetter": "A", "keyText": "His work guaranteed that all later generations succeeded.", "why": "A thêm “guaranteed” + “all” + “succeeded” — mạnh hơn hẳn và khác nghĩa nguồn.", "distractors": ["D. giữ đúng quan hệ affect", "C. giữ đúng quan hệ continue", "B. giữ đúng quan hệ affect"], "kb": "distort = added absolutes.", "authored": false}, {"n": 17, "uid": 17, "part": "SECTION V – SHORT CLOZE", "hd_fix": false, "prompt": "Blank (1)", "options": ["determined", "determination", "determinedly", "determine"], "keyLetter": "A", "keyText": "determined", "why": "“remains (1) ___ despite repeated setbacks” — sau linking verb “remains” cần tính từ.", "distractors": ["“determination” là danh từ", "“determine” là động từ", "“determinedly” là trạng từ"], "kb": "remain + adj.", "authored": false}, {"n": 18, "uid": 18, "part": "SECTION V – SHORT CLOZE", "hd_fix": false, "prompt": "Blank (2)", "options": ["unless", "after", "despite", "although"], "keyLetter": "B", "keyText": "after", "why": "“recognition comes only (2) ___ years of effort” — cần quan hệ thời gian “sau nhiều năm”.", "distractors": ["“although” đòi mệnh đề", "“unless” đòi mệnh đề", "“despite” + N đúng ngữ pháp nhưng diễn tả nhượng bộ, sai nghĩa thời gian"], "kb": "after years of effort.", "authored": false}, {"n": 19, "uid": 19, "part": "SECTION V – SHORT CLOZE", "hd_fix": false, "prompt": "Blank (3)", "options": ["to", "at", "with", "for"], "keyLetter": "A", "keyText": "to", "why": "“make a significant contribution (3) ___ society” — chunk cố định “contribution to”.", "distractors": ["“at” sai collocation", "“for” sai collocation", "“with” sai collocation"], "kb": "contribution to.", "authored": false}, {"n": 20, "uid": 20, "part": "SECTION V – SHORT CLOZE", "hd_fix": false, "prompt": "Blank (4)", "options": ["as soon as", "rather than", "even though", "because of"], "keyLetter": "B", "keyText": "rather than", "why": "“learn vocabulary in complete chunks (4) ___ as isolated words” — cần quan hệ đối lập “thay vì”.", "distractors": ["“because of” chỉ nguyên nhân, không đối lập", "“even though” đòi mệnh đề và sai quan hệ", "“as soon as” đòi mệnh đề và sai quan hệ"], "kb": "rather than = thay vì.", "authored": false}, {"n": 21, "uid": 21, "part": "SECTION VI – PASSAGE COMPLETION", "hd_fix": false, "prompt": "Passage-completion blank (1)", "options": ["At this stage, you should focus mainly on the writer’s opinion of the person.", "This helps you understand the order and relationship of the major events described.", "A timeline is useful only when all the important dates are provided in the biography.", "The most important event should be placed first, even if it happened much later."], "keyLetter": "B", "keyText": "This helps you understand the order and relationship of the major events described.", "why": "“first identify the factual timeline. (1) ___” — “This” trong B quy chiếu đúng “identify the factual timeline” và nêu lợi ích.", "distractors": ["D. phá chronology", "“opinion” lạc sang đánh giá", "C. giới hạn timeline chỉ khi đủ dates"], "kb": "“This” needs a clear antecedent.", "authored": false}, {"n": 22, "uid": 22, "part": "SECTION VI – PASSAGE COMPLETION", "hd_fix": false, "prompt": "Passage-completion blank (2)", "options": ["Focus mainly on personal details such as the person’s birthplace and family background.", "Select mainly the details that seem surprising or unusual in the person’s life story.", "Give equal attention to all the details so that important information is not overlooked.", "Focus particularly on details that explain the person’s contribution, change or influence."], "keyLetter": "D", "keyText": "Focus particularly on details that explain the person’s contribution, change or influence.", "why": "“not all of them are equally important. (2) ___” — C đưa đúng tiêu chí chọn: contribution/change/influence.", "distractors": ["C. “equal attention” trái câu trước", "A. chỉ birthplace/family — quá hẹp", "B. “surprising/unusual” — sai tiêu chí"], "kb": "select by significance.", "authored": false}, {"n": 23, "uid": 23, "part": "SECTION VI – PASSAGE COMPLETION", "hd_fix": false, "prompt": "Passage-completion blank (3)", "options": ["Treat strongly positive descriptions as factual unless the writer clearly indicates otherwise.", "Prefer the writer’s personal evaluation whenever there is only limited factual evidence available.", "Ask what factual evidence supports const PASSAGES={"CULTURE/CLIL READING": "<p><b>Paragraph 1.</b> Many admired figures are remembered not simply because they became famous, but because their actions affected other people. A social reformer, for example, may gain recognition after spending years improving access to education. A scientist may be celebrated for a discovery whose importance becomes clear only later. In both cases, public admiration is connected to contribution rather than popularity alone.</p><p><b>Paragraph 2.</b> Life stories can also be interpreted differently across cultures and generations. One community may emphasise personal courage, while another may focus on service, innovation or sacrifice. For this reason, readers should distinguish factual information from evaluation. A statement such as “she founded a school in 1950” reports an event; saying that this was “her greatest achievement” adds a judgement. Understanding this difference helps readers evaluate biographies more carefully and avoid treating every positive description as an objective fact.</p>", "SHORT CLOZE": "<p>People are often admired not only for what they achieve but also for the qualities they show while facing difficulty. A person who remains <b>(1)</b> _______ despite repeated setbacks may inspire others to continue working toward their own goals. In many life stories, recognition comes only <b>(2)</b> _______ years of effort. The person’s achievements may then make a significant contribution <b>(3)</b> _______ society and leave a lasting legacy. For this reason, it is useful to learn life-story vocabulary in complete chunks <b>(4)</b> _______ as isolated words.</p>", "PASSAGE COMPLETION": "<p>When reading about an admired person, first identify the factual timeline. <b>(1)</b> _______. Next, ask which achievements had the greatest significance. A biography may contain many details, but not all of them are equally important. <b>(2)</b> _______. Finally, separate evidence from the writer’s evaluation. <b>(3)</b> _______.</p>"};

const startEpoch=Date.now();
const letters=['A','B','C','D'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
