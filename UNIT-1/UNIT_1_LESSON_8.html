<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}

.prompt{font-weight:700}

.result{display:none}

.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}

.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}

SECTION I – VOCABULARY & COLLOCATION CHECK", "hd_fix": false, "prompt": "Her work left a lasting ______ that influenced later generations.", "options": ["legacy", "youth", "account", "difficulty"], "keyLetter": "A", "keyText": "legacy", "why": "Chunk cố định “leave a lasting legacy”; ngữ cảnh “influenced later generations”.", "distractors": ["“youth” không hợp ngữ cảnh", "“account” không hợp ngữ cảnh", "“difficulty” không hợp ngữ cảnh"], "kb": "leave a lasting legacy.", "authored": false}, {"n": 8, "uid": 8, "part": "SECTION I – VOCABULARY & COLLOCATION CHECK", "hd_fix": false, "prompt": "The reformer remained ______ to improving access to education.", "options": ["commitment", "commit", "committing", "committed"], "keyLetter": "D", "keyText": "committed", "why": "“remain” + tính từ; “committed to + V-ing”.", "distractors": ["“commitment” là danh từ", "“commit” là động từ", "“committing” là V-ing"], "kb": "remain committed to.", "authored": false}, {"n": 9, "uid": 9, "part": "SECTION I – VOCABULARY & COLLOCATION CHECK", "hd_fix": false, "prompt": "Her achievements continue to inspire young people ______ careers in science.", "options": ["pursue", "to pursue", "pursuing", "pursued"], "keyLetter": "B", "keyText": "to pursue", "why": "“inspire + O + to V”.", "distractors": ["“pursuing” thiếu “to”", "“pursue” thiếu “to”", "“pursued” sai dạng"], "kb": "inspire sb to + V.", "authored": false}, {"n": 10, "uid": 10, "part": "SECTION I – VOCABULARY & COLLOCATION CHECK", "hd_fix": false, "prompt": "He is widely regarded ______ one of the most influential figures in the field.", "options": ["with", "as", "to", "for"], "keyLetter": "B", "keyText": "as", "why": "“be widely regarded as” là cấu trúc cố định.", "distractors": ["“for” sai", "“to” sai", "“with” sai"], "kb": "be regarded as.", "authored": false}, {"n": 11, "uid": 11, "part": "SECTION II – WORD FAMILY CONTROL", "hd_fix": false, "prompt": "The scientist’s ______ to continue after repeated failure impressed her colleagues.", "options": ["determination", "determine", "determined", "determining"], "keyLetter": "A", "keyText": "determination", "why": "Sau sở hữu cách “scientist’s” cần danh từ.", "distractors": ["“determine” là động từ", "“determined” là tính từ", "“determining” là V-ing"], "kb": "determination (n).", "authored": false}, {"n": 12, "uid": 12, "part": "SECTION II – WORD FAMILY CONTROL", "hd_fix": false, "prompt": "The biography gives an ______ account of a life devoted to public service.", "options": ["inspiration", "inspiredly", "inspire", "inspiring"], "keyLetter": "D", "keyText": "inspiring", "why": "“an ___ account” cần tính từ; “inspiring” = truyền cảm hứng (tính chất của cuốn tiểu sử).", "distractors": ["“inspiration” là danh từ", "“inspire” là động từ", "“inspiredly” là trạng từ, không bổ nghĩa danh từ"], "kb": "inspiring (adj).", "authored": false}, {"n": 13, "uid": 13, "part": "SECTION II – WORD FAMILY CONTROL", "hd_fix": false, "prompt": "The organisation’s most important ______ was expanding access to education.", "options": ["contribution", "contributing", "contribute", "contributed"], "keyLetter": "A", "keyText": "contribution", "why": "“most important ___” cần danh từ.", "distractors": ["“contribute” là động từ", "“contributed” là V2/V3", "“contributing” là V-ing"], "kb": "contribution (n).", "authored": false}, {"n": 14, "uid": 14, "part": "SECTION II – WORD FAMILY CONTROL", "hd_fix": false, "prompt": "The researcher received international ______ only later in her career.", "options": ["recognised", "recognising", "recognise", "recognition"], "keyLetter": "D", "keyText": "recognition", "why": "“received international ___” cần danh từ.", "distractors": ["“recognise” là động từ", "“recognised” là V3/tính từ", "“recognising” là V-ing"], "kb": "recognition (n).", "authored": false}, {"n": 15, "uid": 15, "part": "SECTION III – GRAMMAR RECALL – PAST SIMPLE vs PAST CONTINUOUS", "hd_fix": false, "prompt": "At 8 p.m. one evening, while she ______ at a field hospital, an emergency call suddenly came in.", "options": ["was working", "works", "has worked", "worked"], "keyLetter": "A", "keyText": "was working", "why": "“while” + hành động nền đang diễn ra; “suddenly came in” là sự kiện xen vào → Past Continuous.", "distractors": ["“worked” không nhấn đang diễn ra", "“has worked” sai thời (quá khứ cụ thể)", "“works” sai thời"], "kb": "while + was/were + V-ing.", "authored": false}, {"n": 16, "uid": 16, "part": "SECTION III – GRAMMAR RECALL – PAST SIMPLE vs PAST CONTINUOUS", "hd_fix": false, "prompt": "The researcher suddenly ______ an unexpected result while she was testing the new method.", "options": ["has noticed", "notices", "was noticing", "noticed"], "keyLetter": "D", "keyText": "noticed", "why": "“noticed” là sự kiện ngắn xảy ra trong nền “was testing” → Past Simple.", "distractors": ["“was noticing” — notice là động từ nhận thức, không dùng tiếp diễn", "“has noticed” sai thời", "“notices” sai thời"], "kb": "event = Past Simple; background = Past Continuous.", "authored": false}, {"n": 17, "uid": 17, "part": "SECTION III – GRAMMAR RECALL – PAST SIMPLE vs PAST CONTINUOUS", "hd_fix": false, "prompt": "In 1998, he ______ the organisation that later became internationally known.", "options": ["was founding", "founded", "founding", "has founded"], "keyLetter": "B", "keyText": "founded", "why": "“In 1998” là mốc quá khứ hoàn tất → Past Simple.", "distractors": ["“was founding” nhấn quá trình, không cần", "“has founded” không đi với mốc 1998", "“founding” thiếu động từ chính"], "kb": "finished time → Past Simple.", "authored": false}, {"n": 18, "uid": 18, "part": "SECTION III – GRAMMAR RECALL – PAST SIMPLE vs PAST CONTINUOUS", "hd_fix": false, "prompt": "When the news suddenly arrived, the team ______ on another experiment at that moment.", "options": ["works", "has worked", "was working", "worked"], "keyLetter": "C", "keyText": "was working", "why": "“arrived” là sự kiện xen vào; hành động đang diễn ra → was working.", "distractors": ["“worked” không nhấn ongoing", "“has worked” sai thời", "“works” sai thời"], "kb": "when + Past Simple, Past Continuous.", "authored": false}, {"n": 19, "uid": 19, "part": "SECTION III – GRAMMAR RECALL – PAST SIMPLE vs PAST CONTINUOUS", "hd_fix": false, "prompt": "She ______ medicine and later began working in a rural community.", "options": ["studied", "has studied", "was studying", "studies"], "keyLetter": "A", "keyText": "studied", "why": "“later began” — chuỗi sự kiện hoàn tất nối tiếp → Past Simple.", "distractors": ["“was studying” là background nhưng không có event xen vào", "“has studied” sai thời", "“studies” sai thời"], "kb": "sequence of completed events → Past Simple.", "authored": false}, {"n": 20, "uid": 20, "part": "SECTION III – GRAMMAR RECALL – PAST SIMPLE vs PAST CONTINUOUS", "hd_fix": false, "prompt": "Which sentence best shows background + interrupting event?", "options": ["While he was travelling abroad, he received the award announcement.", "He received the award announcement after he completed his journey abroad.", "He travelled abroad and later received the award announcement.", "He was travelling abroad because he had already received the award announcement."], "keyLetter": "A", "keyText": "While he was travelling abroad, he received the award announcement.", "why": "“While he was travelling” = background; “he received” = interrupting event.", "distractors": ["B. chỉ sequence, không có background", "C. chỉ sequence hai sự kiện", "D. đảo nhân quả, không phải interrupt"], "kb": "While + Past Continuous, Past Simple.", "authored": false}, {"n": 21, "uid": 21, "part": "SECTION IV – BIOGRAPHY INFORMATION FLOW", "hd_fix": false, "prompt": "Put the sentences in the best order.<br>a. Her work later influenced national policy on public health.<br>b. After completing her studies, she began working in underserved communities.<br>c. Dr Lan was born into a family that valued education.<br>d. During this period, she developed a low-cost healthcare programme.<br>e. For this contribution, she eventually gained national recognition.", "options": ["b – c – a – d – e", "c – b – d – a – e", "c – d – b – e – a", "d – b – c – a – e"], "keyLetter": "B", "keyText": "c – b – d – a – e", "why": "c mở đầu (birth/background) → b sau khi học xong (after completing studies) → d “During this period” triển khai programme → a ảnh hưởng policy → e được công nhận.", "distractors": ["A. b mở đầu trước birth", "C. d trước b — “this period” chưa có antecedent", "D. d mở đầu thiếu context"], "kb": "time markers: birth → after studies → during this period → later → eventually.", "authored": false}, {"n": 22, "uid": 22, "part": "SECTION IV – BIOGRAPHY INFORMATION FLOW", "hd_fix": false, "prompt": "Put the sentences in the best order.<br>a. As a result, the invention became widely used in remote areas.<br>b. At first, however, many experts doubted whether the idea would work.<br>c. The engineer developed a simple device to solve a common problem.<br>d. Later tests provided strong evidence of its effectiveness.<br>e. The project eventually received international recognition.", "options": ["c – b – d – a – e", "d – c – b – e – a", "b – c – d – e – a", "c – d – b – a – e"], "keyLetter": "A", "keyText": "c – b – d – a – e", "why": "c giới thiệu device → b “At first, however” nghi ngờ → d “Later tests” chứng minh → a “As a result” được dùng rộng → e được công nhận.", "distractors": ["C. b mở đầu trước khi có idea", "D. d trước b — tests trước doubt", "B. d mở đầu thiếu context"], "kb": "idea → doubt → evidence → result → recognition.", "authored": false}, {"n": 23, "uid": 23, "part": "SECTION V – SHORT CLOZE – UNIT 1 MIXED LANGUAGE", "hd_fix": false, "prompt": "Blank (1)", "options": ["developed", "to developed", "develop", "developing"], "keyLetter": "D", "keyText": "developing", "why": "“spent years (1) ___ a treatment” — spend + time + V-ing.", "distractors": ["“develop” là V nguyên thể", "“developed” là V2/V3", "“to developed” sai dạng"], "kb": "spend time + V-ing.", "authored": false}, {"n": 24, "uid": 24, "part": "SECTION V – SHORT CLOZE – UNIT 1 MIXED LANGUAGE", "hd_fix": false, "prompt": "Blank (2)", "options": ["conducts", "was conducting", "conducted", "has conducted"], "keyLetter": "B", "keyText": "was conducting", "why": "“while she (2) ___ an early experiment, a sudden power cut interrupted” — hành động nền đang diễn ra → was conducting.", "distractors": ["“conducted” không nhấn ongoing", "“has conducted” sai thời", "“conducts” sai thời"], "kb": "while + Past Continuous.", "authored": false}, {"n": 25, "uid": 25, "part": "SECTION V – SHORT CLOZE – UNIT 1 MIXED LANGUAGE", "hd_fix": false, "prompt": "Blank (3)", "options": ["to", "at", "for", "with"], "keyLetter": "A", "keyText": "to", "why": "“make a significant contribution (3) ___ public health” — chunk “contribution to”.", "distractors": ["“for” sai collocation", "“at” sai collocation", "“with” sai collocation"], "kb": "contribution to.", "authored": false}, {"n": 26, "uid": 26, "part": "SECTION V – SHORT CLOZE – UNIT 1 MIXED LANGUAGE", "hd_fix": false, "prompt": "Blank (4)", "options": ["recognise", "recognised", "recognising", "recognition"], "keyLetter": "D", "keyText": "recognition", "why": "“gained international (4) ___ for her work” — sau “international” cần danh từ.", "distractors": ["“recognise” là động từ", "“recognised” là V3", "“recognising” là V-ing"], "kb": "gain recognition for.", "authored": false}, {"n": 27, "uid": 27, "part": "SECTION V – SHORT CLOZE – UNIT 1 MIXED LANGUAGE", "hd_fix": false, "prompt": "Blank (5)", "options": ["to pursue", "pursued", "pursue", "pursuing"], "keyLetter": "A", "keyText": "to pursue", "why": "“inspire young scientists (5) ___ difficult goals” — inspire + O + to V.", "distractors": ["“pursuing” thiếu “to”", "“pursue” thiếu “to”", "“pursued” sai dạng"], "kb": "inspire sb to + V.", "authored": false}, {"n": 28, "uid": 28, "part": "SECTION VI – PASSAGE COMPLETION – STRUCTURE → REFERENCE → RELATION", "hd_fix": false, "prompt": "Passage-completion blank (1)", "options": ["A biography is clearer when dates are omitted and events are grouped by topic.", "A useful first step is to establish a clear chronological framework.", "The opening should focus on the most recent event before returning to earlier stages.", "The writer should begin by evaluating which achievement was the most impressive."], "keyLetter": "B", "keyText": "A useful first step is to establish a clear chronological framework.", "why": "“(1) ___. This makes the person’s development easier to follow.” — “This” quy chiếu “establish a clear chronological framework”.", "distractors": ["D. đánh giá ngay từ đầu — sai trình tự", "C. mở bằng recent event — phá chronology", "A. bỏ dates — trái “chronological”"], "kb": "reference needs a clear antecedent.", "authored": false}, {"n": 29, "uid": 29, "part": "SECTION VI – PASSAGE COMPLETION – STRUCTURE → REFERENCE → RELATION", "hd_fix": false, "prompt": "Passage-completion blank (2)", "options": ["Similarly, personal background should replace discussion of contribution.", "Therefore, the writer should include information mainly because it is unusual.", "In other words, selection should serve the main idea of the life story.", "In contrast, minor details should receive the same attention as major achievements."], "keyLetter": "C", "keyText": "In other words, selection should serve the main idea of the life story.", "why": "“select achievements that reveal contribution or change rather than include every detail. (2) ___” — A diễn đạt lại đúng chức năng của selection.", "distractors": ["D. “same attention” trái câu trước", "B. “because it is unusual” — sai tiêu chí", "A. “replace discussion of contribution” — ngược"], "kb": "In other words = restatement.", "authored": false}, {"n": 30, "uid": 30, "part": "SECTION VI – PASSAGE COMPLETION – STRUCTURE → REFERENCE → RELATION", "hd_fix": false, "prompt": "Passage-completion blank (3)", "options": ["The final section should introduce a new achievement that has not been discussed earlier.", "This usually means avoiding any reference to the effects of the person’s work.", "The conclusion should repeat the person’s birth details to complete the timeline.", "This may involve describing a lasting legacy or influence on later generations."], "keyLetter": "D", "keyText": "This may involve describing a lasting legacy or influence on later generations.", "why": "“the ending should explain the person’s continuing importance. (3) ___” — legacy/influence = continuing importance.", "distractors": ["C. lặp birth details — không phải continuing importance", "A. new achievement ở kết — sai cấu trúc", "B. avoiding reference — ngược"], "kb": "conclusion = continuing importance.", "authored": false}, {"n": 31, "uid": 31, "part": "SECTION VII – READING TRANSFER – NEW CONTEXT", "hd_fix": false, "prompt": "What is the main idea of paragraph 1?", "options": ["Public attention is necessary for good research.", "All important ideas are immediately rejected.", "Later recognition can hide earlier uncertainty.", "Biographies should avoid discussing success."], "keyLetter": "C", "keyText": "Later recognition can hide earlier uncertainty.", "why": "Trích dẫn: “Later success, however, can create another problem: biographies may present the final outcome as if it had always been obvious”.", "distractors": ["B. “immediately rejected” — quá tuyệt đối", "A. “necessary” — bài không nói", "D. “avoid discussing success” — không phải ý bài"], "kb": "hindsight hides uncertainty.", "authored": false}, {"n": 32, "uid": 32, "part": "SECTION VII – READING TRANSFER – NEW CONTEXT", "hd_fix": false, "prompt": "The word “established” is closest in meaning to ______.", "options": ["financially successful", "recently invented", "personally admired", "already accepted or developed"], "keyLetter": "D", "keyText": "already accepted or developed", "why": "Trích dẫn: “challenges established practice” — cách làm đã được chấp nhận/phá const PASSAGES={"SHORT CLOZE": "<p>Many admired people are remembered because they remain committed to a goal even when success is uncertain. One researcher, for example, spent years <b>(1)</b> ______ a treatment that few people initially believed would work. One evening, while she <b>(2)</b> ______ an early experiment, a sudden power cut interrupted her work. She also faced financial pressure and professional doubt. However, her determination eventually led to a breakthrough. The treatment later made a significant contribution <b>(3)</b> ______ public health, and she gained international <b>(4)</b> ______ for her work. Her story is now often used to inspire young scientists <b>(5)</b> ______ difficult but meaningful goals.</p>", "PASSAGE COMPLETION": "<p>A strong biography does more than list dates. It shows how events are connected and why they matter. <b>(1)</b> _______. This makes the person’s development easier to follow. The writer should then select achievements that reveal contribution or change rather than include every available detail. <b>(2)</b> _______. Finally, the ending should explain the person’s continuing importance. <b>(3)</b> _______.</p>", "READING TRANSFER": "<p><b>Paragraph 1.</b> Recognition is not always immediate. Some people whose work later becomes highly influential spend years receiving little public attention. This can happen because a new idea is difficult to understand, challenges established practice, or requires more evidence before others accept it. Later success, however, can create another problem: biographies may present the final outcome as if it had always been obvious.</p><p><b>Paragraph 2.</b> Careful readers therefore need to distinguish persistence from certainty. Continuing to work despite doubt can be admirable, but persistence alone does not prove that an idea is correct. Evidence still matters. A balanced life story can recognise both the determination of an individual and the reasonable uncertainty that surrounded the work at the time. This approach gives readers a more accurate picture of achievement than a simple story in which a hero was right and everyone else was wrong.</p>"};

 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
